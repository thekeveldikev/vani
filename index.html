/* ----- Sicherung ----- */
function blobZuDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function dataURLZuBlob(durl) {
  const [kopf, daten] = durl.split(',');
  const mime = (kopf.match(/data:(.*?);/) || [])[1] || 'application/octet-stream';
  const bin = atob(daten);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function sichereAlles() {
  toast('Packe alles ein …');
  const media = {};
  const ids = new Set();
  for (const d of D.docs.values()) { if (d.bild) ids.add(d.bild); if (d.skizze) ids.add(d.skizze); }
  for (const id of ids) {
    const blob = await dbGet('media', id);
    if (blob) media[id] = await blobZuDataURL(blob);
  }
  const paket = {
    vani: 1, wann: Date.now(),
    docs: [...D.docs.values()],
    einst: D.einst,
    stats: D.stats,
    media
  };
  const name = 'vani-sicherung-' + tagKey() + '.vani';
  const ok = await teileDatei(name, JSON.stringify(paket), 'application/json');
  if (ok) {
    D.stats.letzteSicherung = Date.now();
    speichereStats();
  }
}

function leseSicherung() {
  const inp = el('input', { type: 'file', accept: '.vani,.json,application/json,text/plain', style: 'display:none' });
  document.body.append(inp);
  inp.addEventListener('change', async () => {
    const datei = inp.files && inp.files[0];
    inp.remove();
    if (!datei) return;
    let paket;
    try { paket = JSON.parse(await datei.text()); } catch (e) { toast('Das ist keine VANI-Sicherung.'); return; }
    if (!pruefeSicherung(paket)) { toast('Das ist keine VANI-Sicherung.'); return; }
    const modus = await menue([
      { text: 'Dazulegen (nichts geht verloren)', icon: 'plus', wert: 'dazu' },
      { text: 'Alles ersetzen', icon: 'wandel', wert: 'ersetzen', rot: true }
    ], paket.docs.length + ' Dinge vom ' + fmtDatum(paket.wann));
    if (!modus) return;
    if (modus === 'ersetzen') {
      if (!await frage('Wirklich alles Jetzige durch die Sicherung ersetzen?', { ja: 'Ersetzen', gefahr: true })) return;
      await dbTu('docs', 'readwrite', (s) => s.clear());
      await dbTu('media', 'readwrite', (s) => s.clear());
      D.docs.clear();
    }
    for (const d of paket.docs) {
      if (modus === 'dazu' && D.docs.has(d.id)) continue;
      D.docs.set(d.id, d);
      await dbPut('docs', d);
    }
    for (const [id, durl] of Object.entries(paket.media || {})) {
      try { await dbPut('media', dataURLZuBlob(durl), id); } catch (e) {}
    }
    if (modus === 'ersetzen') {
      if (paket.einst) { Object.assign(D.einst, paket.einst); speichereEinst(); setzeThema(D.einst.thema); }
      if (paket.stats) { D.stats = Object.assign({ tage: {}, letzte: {}, letzteSicherung: 0 }, paket.stats); speichereStats(); }
    }
    toast('Alles wieder da.');
    zeichne();
  });
  inp.click();
}

function alleTexteAlsText() {
  const teile = [];
  for (const p of vomTyp('projekt')) {
    teile.push('══ PROJEKT: ' + p.titel + ' ══');
    for (const k of kinder(p.id, 'kapitel')) {
      teile.push('\n— ' + k.titel + ' —');
      for (const s of kinder(k.id, 'szene')) {
        if (s.titel) teile.push('· ' + s.titel);
        if ((s.text || '').trim()) teile.push(s.text.trim());
      }
    }
    teile.push('');
  }
  for (const h of vomTyp('heft')) {
    teile.push('══ HEFT: ' + h.titel + ' ══');
    for (const s of kinder(h.id, 'seite')) {
      if (s.titel) teile.push('· ' + s.titel);
      if ((s.text || '').trim()) teile.push(s.text.trim());
      for (const z of kinder(s.id, 'zettel')) if ((z.text || '').trim()) teile.push('[Zettel] ' + z.text.trim());
    }
    teile.push('');
  }
  const schnipsel = vomTyp('schnipsel').sort((a, b) => a.angelegt - b.angelegt);
  if (schnipsel.length) {
    teile.push('══ SCHNIPSEL ══');
    for (const s of schnipsel) if ((s.text || '').trim()) teile.push(fmtDatum(s.angelegt) + ': ' + s.text.trim());
  }
  return teile.join('\n');
}

/* Datei hinausgeben: Teilen-Menü → Download → Zwischenablage */
async function teileDatei(name, inhalt, typ = 'text/plain') {
  const blob = new Blob([inhalt], { type: typ + ';charset=utf-8' });
  const datei = new File([blob], name, { type: typ });
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei] }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name, style: 'display:none' });
    document.body.append(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
    toast('Gespeichert — schau in „Dateien" nach.');
    return true;
  } catch (e) {}
  try {
    await navigator.clipboard.writeText(inhalt);
    toast('Ging nicht als Datei — liegt jetzt in der Zwischenablage.');
    return true;
  } catch (e) {
    toast('Das hat leider nicht geklappt.');
    return false;
  }
}
/* ================================================================
   VANI — Klangwelten: alles aus dem Nichts gerechnet, keine Dateien.
   Rezepte nach Andy Farnell („Designing Sound") und eigenen Ohren.
   ================================================================ */

let _audio = null;

function holeAudio() {
  if (!_audio) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.value = (D.einst.lautstaerke ?? .5) * .7;
    const drossel = ctx.createDynamicsCompressor();
    drossel.threshold.value = -18; drossel.ratio.value = 4;
    master.connect(drossel); drossel.connect(ctx.destination);
    _audio = { ctx, master, puffer: {}, hallen: {}, ebenen: new Map() };
  }
  if (_audio.ctx.state === 'suspended') _audio.ctx.resume();
  return _audio;
}

function setzeLautstaerke(wert) {
  D.einst.lautstaerke = wert;
  speichereEinst();
  if (_audio) _audio.master.gain.setTargetAtTime(wert * .7, _audio.ctx.currentTime, .1);
}

/* ----- Rauschfarben (einmal gerechnet, dann geloopt) ----- */
function _rauschpuffer(a, farbe) {
  if (a.puffer[farbe]) return a.puffer[farbe];
  const sek = 3, n = a.ctx.sampleRate * sek;
  const p = a.ctx.createBuffer(2, n, a.ctx.sampleRate);
  for (let k = 0; k < 2; k++) {
    const d = p.getChannelData(k);
    if (farbe === 'weiss') {
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } else if (farbe === 'rosa') {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759;
        b2 = .96900 * b2 + w * .1538520; b3 = .86650 * b3 + w * .3104856;
        b4 = .55000 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .11;
        b6 = w * .115926;
      }
    } else {
      let letzt = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        letzt = (letzt + .02 * w) / 1.02;
        d[i] = letzt * 3.5;
      }
    }
  }
  a.puffer[farbe] = p;
  return p;
}

function _hallIR(a, sek, tiefpass) {
  const key = sek + ':' + tiefpass;
  if (a.hallen[key]) return a.hallen[key];
  const n = Math.floor(a.ctx.sampleRate * sek);
  const p = a.ctx.createBuffer(2, n, a.ctx.sampleRate);
  for (let k = 0; k < 2; k++) {
    const d = p.getChannelData(k);
    let glatt = 0;
    const alpha = Math.min(1, tiefpass / (a.ctx.sampleRate / 2));
    for (let i = 0; i < n; i++) {
      const w = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
      glatt += alpha * (w - glatt);
      d[i] = glatt;
    }
  }
  a.hallen[key] = p;
  return p;
}

/* ----- Werkbank: baut & räumt hinter jeder Ebene auf ----- */
function neueWerkbank(a, out) {
  const quellen = [], timer = [], intervalle = [];
  const w = {
    a, out,
    rauschen(farbe) {
      const q = a.ctx.createBufferSource();
      q.buffer = _rauschpuffer(a, farbe); q.loop = true; q.start();
      quellen.push(q); return q;
    },
    ton(typ, freq) {
      const o = a.ctx.createOscillator();
      o.type = typ; o.frequency.value = freq; o.start();
      quellen.push(o); return o;
    },
    filter(typ, freq, q) {
      const f = a.ctx.createBiquadFilter();
      f.type = typ; f.frequency.value = freq; if (q) f.Q.value = q;
      return f;
    },
    pegel(v) { const g = a.ctx.createGain(); g.gain.value = v; return g; },
    lfo(rate, hub, ziel) {
      const o = a.ctx.createOscillator(); o.frequency.value = rate;
      const g = a.ctx.createGain(); g.gain.value = hub;
      o.connect(g); g.connect(ziel); o.start();
      quellen.push(o); return o;
    },
    wandel(param, min, max, msMin, msMax, glaette) {
      const tu = () => {
        param.setTargetAtTime(min + Math.random() * (max - min), a.ctx.currentTime, glaette ?? .6);
        timer.push(setTimeout(tu, msMin + Math.random() * (msMax - msMin)));
      };
      tu();
    },
    takt(msMittel, fn) {
      const tu = () => {
        fn(a.ctx.currentTime);
        timer.push(setTimeout(tu, Math.max(30, -Math.log(Math.random()) * msMittel)));
      };
      timer.push(setTimeout(tu, Math.random() * msMittel));
    },
    immer(ms, fn) { intervalle.push(setInterval(fn, ms)); },
    hall(sek, tiefpass, anteil) {
      const c = a.ctx.createConvolver();
      c.buffer = _hallIR(a, sek, tiefpass);
      const g = a.ctx.createGain(); g.gain.value = anteil;
      c.connect(g); g.connect(out);
      return c;
    },
    huelle(ziel, t, spitze, decaySek) {
      ziel.setValueAtTime(Math.max(.0001, spitze), t);
      ziel.exponentialRampToValueAtTime(.0001, t + decaySek);
    },
    stop() {
      timer.forEach(clearTimeout);
      intervalle.forEach(clearInterval);
      quellen.forEach((q) => { try { q.stop(); } catch (e) {} });
    }
  };
  return w;
}

/* kurzer tonaler Ping (Tropfen, Blasen, Vogel-Silben) */
function _ping(w, ziel, { f0, f1, dauer, staerke, typ }) {
  const t = w.a.ctx.currentTime;
  const o = w.a.ctx.createOscillator();
  o.type = typ || 'sine';
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dauer);
  const g = w.pegel(0);
  w.huelle(g.gain, t, staerke, dauer);
  o.connect(g); g.connect(ziel);
  o.start(t); o.stop(t + dauer + .05);
}
function _knack(w, ziel, { freq, q, dauer, staerke }) {
  const t = w.a.ctx.currentTime;
  const b = w.a.ctx.createBufferSource();
  b.buffer = _rauschpuffer(w.a, 'weiss');
  b.loop = true;
  const f = w.filter('bandpass', freq, q || 2);
  const g = w.pegel(0);
  w.huelle(g.gain, t, staerke, dauer);
  b.connect(f); f.connect(g); g.connect(ziel);
  b.start(t); b.stop(t + dauer + .05);
}

/* ----- Steuerung ----- */
function ebeneAn(id, staerke) {
  const a = holeAudio();
  let e = a.ebenen.get(id);
  if (!e) {
    const def = KLANG_EBENEN.find((x) => x.id === id);
    if (!def) return;
    const g = a.ctx.createGain();
    g.gain.value = 0;
    g.connect(a.master);
    const werk = def.bau(a, g);
    e = { gain: g, werk };
    a.ebenen.set(id, e);
  }
  e.gain.gain.setTargetAtTime(staerke, a.ctx.currentTime, .4);
}
function ebeneAus(id) {
  if (!_audio) return;
  const e = _audio.ebenen.get(id);
  if (!e) return;
  e.gain.gain.setTargetAtTime(.0001, _audio.ctx.currentTime, .3);
  setTimeout(() => { e.werk.stop(); try { e.gain.disconnect(); } catch (x) {} }, 1200);
  _audio.ebenen.delete(id);
}
function mischungAnwenden(pegel) {
  D.einst.mischung = pegel || {};
  speichereEinst();
  const gewollt = new Set(Object.keys(D.einst.mischung).filter((k) => D.einst.mischung[k] > 0));
  if (_audio) for (const id of [..._audio.ebenen.keys()]) { if (!gewollt.has(id)) ebeneAus(id); }
  for (const id of gewollt) ebeneAn(id, D.einst.mischung[id]);
}
function alleKlaengeAus() { mischungAnwenden({}); }
function klangAktiv() { return Object.values(D.einst.mischung || {}).some((v) => v > 0); }

/* ----- Einzelklänge ----- */
function glocke() {
  try {
    const a = holeAudio();
    const t = a.ctx.currentTime;
    for (const [freq, staerke] of [[660, .1], [1320, .04], [1980, .015]]) {
      const o = a.ctx.createOscillator();
      o.frequency.value = freq;
      const g = a.ctx.createGain();
      g.gain.setValueAtTime(staerke, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
      o.connect(g); g.connect(a.master);
      o.start(t); o.stop(t + 2);
    }
  } catch (e) {}
}
function tippKlick() {
  try {
    const a = holeAudio();
    const b = a.ctx.createBufferSource();
    b.buffer = _rauschpuffer(a, 'weiss'); b.loop = true;
    const f = a.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2600;
    const g = a.ctx.createGain();
    g.gain.setValueAtTime(.04, a.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.ctx.currentTime + .02);
    b.connect(f); f.connect(g); g.connect(a.master);
    b.start(); b.stop(a.ctx.currentTime + .03);
  } catch (e) {}
}
/* ================================================================
   VANI — Klang: der Atmosphären-Fundus
   ================================================================ */

function baueMischpult(kompakt) {
  const wurzel = el('div', { class: 'mischpult' + (kompakt ? ' kompakt' : '') });

  /* Szenen */
  const szenen = el('div', { class: 'szenenchips' });
  const eigene = vomTyp('mischung');
  const alleSzenen = [...KLANG_SZENEN.map((s) => ({ name: s.name, pegel: s.pegel })),
                      ...eigene.map((m) => ({ name: m.titel, pegel: m.pegel, doc: m }))];
  for (const s of alleSzenen) {
    const chip = el('button', { class: 'szenenchip', onclick: () => { mischungAnwenden(Object.assign({}, s.pegel)); baueRegler(); } }, s.name);
    if (s.doc) langdruck(chip, async () => {
      if (await frage('„' + s.name + '" aus den eigenen Szenen nehmen?', { ja: 'Entfernen', gefahr: true })) {
        await loesche(s.doc.id, true); zeichne();
      }
    });
    szenen.append(chip);
  }
  szenen.append(el('button', { class: 'szenenchip leiser', onclick: () => { alleKlaengeAus(); baueRegler(); } }, 'Stille'));

  wurzel.append(el('div', { class: 'kartenkopf' }, el('span', { html: ik('woerter') }), 'SZENEN'), szenen);

  /* Regler nach Kategorien */
  const reglerhalter = el('div');
  wurzel.append(reglerhalter);

  function baueRegler() {
    reglerhalter.innerHTML = '';
    const misch = D.einst.mischung || {};
    for (const kat of KLANG_KATEGORIEN) {
      const block = el('div', { class: 'klangblock' });
      block.append(el('div', { class: 'kartenkopf', style: 'margin-top:14px' }, kat.toUpperCase()));
      for (const ebene of KLANG_EBENEN.filter((e) => e.kat === kat)) {
        const wert = misch[ebene.id] || 0;
        const schieber = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round(wert * 100)) });
        const zeile = el('div', { class: 'klangzeile' + (wert > 0 ? ' an' : '') },
          el('button', {
            class: 'klangname', onclick: () => {
              const m = D.einst.mischung || {};
              if ((m[ebene.id] || 0) > 0) { delete m[ebene.id]; }
              else { m[ebene.id] = .5; schieber.value = '50'; }
              mischungAnwenden(m);
              zeile.classList.toggle('an', !!m[ebene.id]);
            }
          }, ebene.name),
          schieber
        );
        schieber.addEventListener('input', () => {
          const m = D.einst.mischung || {};
          const v = parseInt(schieber.value, 10) / 100;
          if (v > 0) { m[ebene.id] = v; } else { delete m[ebene.id]; }
          mischungAnwenden(m);
          zeile.classList.toggle('an', v > 0);
        });
        block.append(zeile);
      }
      reglerhalter.append(block);
    }

    /* Lautstärke + Speichern */
    const laut = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round((D.einst.lautstaerke ?? .5) * 100)) });
    laut.addEventListener('input', () => setzeLautstaerke(parseInt(laut.value, 10) / 100));
    reglerhalter.append(el('div', { class: 'klangfuss' },
      el('div', { class: 'klangzeile an', style: 'box-shadow:none' }, el('span', { class: 'klangname', style: 'font-weight:600' }, 'Gesamt'), laut),
      el('button', {
        class: 'knopf', onclick: async () => {
          const m = D.einst.mischung || {};
          if (!Object.keys(m).length) { toast('Erst etwas mischen.'); return; }
          const name = await eingabe({ titel: 'Diese Mischung heißt …', platzhalter: 'z. B. Regen überm Schreibtisch' });
          if (!name) return;
          neuDoc('mischung', { titel: name, pegel: Object.assign({}, m) });
          toast('Gemerkt als Szene.');
          zeichne();
        }
      }, 'Mischung merken')
    ));
  }
  baueRegler();
  return wurzel;
}

RENDER.klang = function (haupt) {
  haupt.append(raumkopf('Klang', 'alles errechnet, nichts geladen — mischen erlaubt'));
  const inhalt = el('div', { class: 'inhalt' });
  inhalt.append(baueMischpult(false));
  haupt.append(inhalt);
};

/* Kompakte Fassung als Überlagerung (aus dem Schreibraum) */
function oeffneMischpult() {
  const kasten = el('div', { class: 'modal', style: 'width:min(560px,calc(100vw - 40px))' },
    el('h2', {}, 'Klang'),
    baueMischpult(true),
    el('div', { class: 'reihe' }, el('button', { class: 'knopf voll', onclick: () => zu() }, 'Fertig'))
  );
  const zu = zeigeDeck(kasten);
}
/* ================================================================
   VANI — Aufwachen
   ================================================================ */

(async function start() {
  const startzeit = Date.now();
  try {
    await ladeAlles();
  } catch (e) {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:Georgia,serif">Der Speicher wollte nicht aufwachen. Einmal neu öffnen hilft fast immer.</div>';
    return;
  }

  /* Umzüge von früheren Fassungen */
  if (typeof D.einst.klang === 'string' && D.einst.klang !== 'aus' && !Object.keys(D.einst.mischung || {}).length) {
    const alt = { regen: 'regenfenster', kamin: 'kamin', wind: 'wind', grillen: 'grillen' }[D.einst.klang];
    if (alt) D.einst.mischung = { [alt]: .5 };
  }
  delete D.einst.klang;

  /* Erste Saat */
  if (!(await dbGet('kv', 'gesaet'))) {
    if (![...D.docs.values()].some((d) => d.typ === 'wort')) {
      for (const w of SAATWORTE) neuDoc('wort', { text: w });
    }
    await dbPut('kv', 1, 'gesaet');
  }

  /* Faden von allein zeigen, sobald es einen gibt */
  raumConfig();
  if ([...D.docs.values()].some((d) => d.typ === 'faden')) {
    const f = D.einst.raeume.find((x) => x.id === 'faden');
    if (f && !f.an && !D.einst.fadenAbgewaehlt) f.an = true;
  }

  setzeThema(D.einst.thema);
  baueLeiste();
  zeichne();

  /* Speicher festhalten */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* Nichts verlieren, auch wenn iOS die App wegwirft */
  const notSicherung = () => { try { spueleAlles(); } catch (e) {} };
  window.addEventListener('pagehide', notSicherung);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') notSicherung(); });

  /* Tastatur-Höhe (iPad) */
  if (window.visualViewport) {
    const anpassen = () => {
      document.documentElement.style.setProperty('--vvh', window.visualViewport.height + 'px');
    };
    window.visualViewport.addEventListener('resize', anpassen);
    anpassen();
    window.addEventListener('focusout', () => setTimeout(anpassen, 250));
  }

  /* Klang wieder aufnehmen? Erst nach der ersten Berührung erlaubt. */
  if (Object.values(D.einst.mischung || {}).some((v) => v > 0)) {
    const einmal = () => {
      try { mischungAnwenden(D.einst.mischung); } catch (e) {}
    };
    document.addEventListener('pointerdown', einmal, { once: true });
  }

  /* Papierkorb: sehr Altes still wegräumen */
  setTimeout(() => { papierkorbLeeren(30).catch(() => {}); }, 4000);

  /* Service Worker — nur wo es ihn gibt */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !location.search.includes('kein-sw')) {
    try {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.addEventListener('updatefound', () => {
          const neu = reg.installing;
          if (!neu) return;
          neu.addEventListener('statechange', () => {
            if (neu.state === 'installed' && navigator.serviceWorker.controller) {
              toastMitAktion('Eine neue Fassung liegt bereit.', 'Neu laden', () => location.reload(), 8000);
            }
          });
        });
      }).catch(() => {});
    } catch (e) {}
  }

  /* Vorhang auf */
  const vorhang = $('#vorhang');
  if (vorhang) {
    const warte = Math.max(0, 650 - (Date.now() - startzeit));
    setTimeout(() => {
      vorhang.classList.add('auf');
      setTimeout(() => vorhang.remove(), 700);
    }, warte);
  }
})();
</script>
