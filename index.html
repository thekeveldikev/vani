  const str = straehne();
  const feuerKarte = el('div', { class: 'karte feuerkarte' },
    el('div', { class: 'kartenkopf' }, el('span', { html: ik('feuer') }), 'SCHREIBFEUER'),
    el('div', { class: 'feuer-zeile' },
      el('div', { class: 'feuer-flamme', html: flammeHTML() }),
      el('div', { class: 'feuer-zahlen' },
        el('div', { class: 'gross' }, heutigeWorte.toLocaleString('de-DE')),
        el('div', { class: 'einheit' }, heutigeWorte === 1 ? 'Wort heute' : 'Wörter heute'),
        el('div', { class: 'klein' },
          str >= 2 ? str + ' Tage in Folge am Feuer' :
          heutigeWorte > 0 ? 'Das Feuer brennt.' :
          feuerstufe() === 'glut' ? 'Noch Glut von neulich. Ein Satz genügt.' :
          'Kalt hier. Ein Satz macht Feuer.')
      ),
      (() => {
        const b = el('div', { class: 'wochenbalken' });
        const max = Math.max(1, ...[...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return D.stats.tage[tagKey(d)] || 0; }));
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const w = D.stats.tage[tagKey(d)] || 0;
          b.append(el('i', { class: (i === 0 ? 'heute ' : '') + (w ? '' : 'null'), style: 'height:' + Math.max(8, Math.round(w / max * 100)) + '%' }));
        }
        return b;
      })()
    ),
    D.einst.tagesziel > 0 ? el('div', { style: 'margin-top:12px' },
      el('div', { class: 'zielbalken' }, el('i', { class: heutigeWorte >= D.einst.tagesziel ? 'geschafft' : '', style: 'width:' + Math.min(100, Math.round(heutigeWorte / D.einst.tagesziel * 100)) + '%' })),
      el('div', { style: 'font-size:12px;color:var(--blass);margin-top:5px' },
        heutigeWorte >= D.einst.tagesziel ? 'Tagesziel erreicht. Der Rest ist Geschenk.' : 'noch ' + (D.einst.tagesziel - heutigeWorte).toLocaleString('de-DE') + ' bis zum Tagesziel')
    ) : null
  );
  gitter.append(feuerKarte);

  /* Funke des Tages */
  let funkeAktuell = funkeDesTages();
  const funkeText = el('div', { class: 'funke-text' }, funkeAktuell);
  gitter.append(el('div', { class: 'karte' },
    el('div', { class: 'kartenkopf' }, el('span', { html: ik('woerter') }), 'FUNKE'),
    funkeText,
    el('div', { class: 'fussreihe' },
      el('button', { class: 'knopf zart', onclick: () => { funkeAktuell = neuerFunke(Math.random() < .4); funkeText.textContent = funkeAktuell; } }, 'Anderer'),
      el('button', {
        class: 'knopf', onclick: () => {
          const blatt = blattAusText('', funkeAktuell + '\n\n');
          oeffneSchreibraum(blatt.id);
        }
      }, 'Dem nachgehen')
    )
  ));

  /* Weiterschreiben */
  const zuletzt = [...D.docs.values()]
    .filter((d) => (d.typ === 'szene' || d.typ === 'seite' || d.typ === 'blatt') && (d.text || '').trim())
    .sort((a, b) => b.geaendert - a.geaendert).slice(0, 3);
  if (zuletzt.length) {
    gitter.append(el('div', { class: 'karte' },
      el('div', { class: 'kartenkopf' }, el('span', { html: ik('stift') }), 'WEITERSCHREIBEN'),
      zuletzt.map((d) => {
        let wo = '';
        if (d.typ === 'szene') {
          const p = D.docs.get(d.projekt), k = D.docs.get(d.parent);
          wo = [p && p.titel, k && k.titel].filter(Boolean).join(' › ');
        } else if (d.typ === 'blatt') {
          wo = 'Blätter';
        } else {
          const h = D.docs.get(d.parent);
          wo = h ? h.titel : '';
        }
        const letzterSatz = (d.text || '').trim().split('\n').filter(Boolean).pop() || '';
        return el('button', { class: 'weiter-eintrag', onclick: () => ((d.typ === 'szene' || d.typ === 'blatt') ? oeffneSchreibraum(d.id) : oeffneDoc(d)) },
          el('span', { class: 'wtitel' }, d.titel || 'Ohne Titel'),
          wo ? el('span', { class: 'wo' }, wo + ' · ' + vorZeit(d.geaendert)) : el('span', { class: 'wo' }, vorZeit(d.geaendert)),
          el('span', { class: 'probe' }, '… ' + letzterSatz.slice(-90))
        );
      })
    ));
  }

  /* Wieder aufgetaucht — kuratierte Funkeln zählen dreifach */
  const funkeln = [...D.docs.values()].filter((d) => d.typ === 'funkeln' && (d.text || '').trim());
  const alteFunde = [...D.docs.values()].filter((d) =>
    ['schnipsel', 'szene', 'seite', 'blatt', 'blase'].includes(d.typ) &&
    (d.text || '').trim().length > 40 &&
    Date.now() - d.angelegt > 3 * 86400000)
    .concat(funkeln, funkeln, funkeln);
  if (alteFunde.length) {
    let fund = zufall(alteFunde);
    const fundText = el('div', { class: 'fund-text' }, fund.text.trim());
    const fundWann = el('div', { class: 'fund-wann' }, '');
    const aktualisiere = () => { fundWann.textContent = vorZeit(fund.angelegt) + ' geschrieben · Tippen zum Hingehen'; };
    aktualisiere();
    const karte = el('div', { class: 'karte' + (zuletzt.length ? '' : ' breit') },
      el('div', { class: 'kartenkopf' }, el('span', { html: ik('fund') }), 'WIEDER AUFGETAUCHT',
        el('span', { class: 'rest' }),
        el('button', {
          class: 'rundknopf zart', style: 'width:30px;height:30px', html: ik('wandel'), onclick: (e) => {
            e.stopPropagation();
            fund = zufall(alteFunde);
            fundText.textContent = fund.text.trim();
            aktualisiere();
          }
        })),
      fundText, fundWann
    );
    karte.addEventListener('click', (e) => { if (!e.target.closest('button')) oeffneDoc(fund); });
    gitter.append(karte);
  }

  /* Sicherungs-Erinnerung, ganz leise */
  const tageOhneSicherung = D.stats.letzteSicherung ? Math.floor((Date.now() - D.stats.letzteSicherung) / 86400000) : null;
  if (D.docs.size > 12 && (tageOhneSicherung === null || tageOhneSicherung > 14)) {
    inhalt.append(el('div', { class: 'sicherungs-mahnung' },
      tageOhneSicherung === null ? 'Noch nie gesichert. ' : 'Letzte Sicherung: vor ' + tageOhneSicherung + ' Tagen. ',
      el('button', { onclick: () => { location.hash = '#/feinheiten'; } }, 'Sicher ist sicher →')
    ));
  }

  haupt.append(inhalt);
};

/* ================================================================
   VANI — Schnipsel: der Chat mit mir selbst
   ================================================================ */

RENDER.schnipsel = function (haupt) {
  const raum = el('div', { class: 'schnipsel-raum' });

  raum.append(el('div', { class: 'kopf', style: 'position:static;background:none' },
    el('h1', {}, 'Schnipsel', el('div', { class: 'unter' }, 'an mich, für später'))
  ));

  const pinnzeile = el('div', { class: 'pinnzeile' });
  const lauf = el('div', { class: 'schnipsel-lauf' });
  const innen = el('div', { class: 'innen' });
  lauf.append(innen);

  const feld = el('textarea', { placeholder: 'An mich …', rows: 1 });
  autogrow(feld);
  const zeile = el('div', { class: 'schreibzeile' },
    el('button', {
      class: 'rundknopf zart', html: ik('kamera'), onclick: async () => {
        const bild = await waehleBild();
        if (!bild) return;
        neuDoc('schnipsel', { text: feld.value.trim(), bild: bild.id });
        feld.value = ''; feld.style.height = 'auto';
        baueLauf(); runter();
      }
    }),
    feld,
    el('button', {
      class: 'rundknopf voll', html: ik('senden'), onclick: () => {
        const t = feld.value.trim();
        if (!t) return;
        neuDoc('schnipsel', { text: t });
        feld.value = ''; feld.style.height = 'auto';
        baueLauf(); runter();
        feld.focus();
      }
    })
  );

  raum.append(pinnzeile, lauf, zeile);
  haupt.append(raum);

  function runter() { requestAnimationFrame(() => { lauf.scrollTop = lauf.scrollHeight; }); }

  function baueLauf() {
    innen.innerHTML = '';
    pinnzeile.innerHTML = '';
    const alle = vomTyp('schnipsel').sort((a, b) => a.angelegt - b.angelegt);

    for (const s of alle.filter((x) => x.gepinnt)) {
      pinnzeile.append(el('button', {
        class: 'pinnchip', onclick: () => {
          const ziel = innen.querySelector('[data-id="' + s.id + '"]');
          if (ziel) { ziel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
      }, s.text || '[Bild]'));
    }

    if (!alle.length) {
      innen.append(el('div', { class: 'leer' }, 'Noch still hier.',
        el('div', { class: 'klein' }, 'Der erste Gedanke findet von allein den Weg.')));
      return;
    }

    let letzterTag = '';
    for (const s of alle) {
      const tag = tagKey(s.angelegt);
      if (tag !== letzterTag) {
        letzterTag = tag;
        const heute = tagKey();
        const gestern = tagKey(Date.now() - 86400000);
        innen.append(el('div', { class: 'datumstrenner' },
          tag === heute ? 'Heute' : tag === gestern ? 'Gestern' : fmtDatum(s.angelegt)));
      }
      const blase = el('div', { class: 'blase' + (s.gepinnt ? ' gepinnt' : ''), 'data-id': s.id });
      if (s.bild) {
        const img = el('img', { alt: '' });
        setzeBild(img, s.bild);
        blase.append(img);
      }
      if (s.text) blase.append(el('div', { class: 'btext', html: schmuecke(s.text) }));
      blase.append(el('div', { class: 'bzeit' },
        s.gepinnt ? el('span', { html: ik('pin'), style: 'display:flex;width:11px;color:var(--gold)' }) : null,
        fmtZeit(s.angelegt)));
      blase.addEventListener('click', (e) => {
        if (e.target.closest('.verweis') || e.target.closest('textarea')) return;
        schnipselMenue(s, blase, baueLauf);
      });
      innen.append(blase);
    }
  }

  baueLauf();
  runter();
};

async function schnipselMenue(s, blase, neuZeichnen) {
  const wahl = await menue([
    { text: s.gepinnt ? 'Losmachen' : 'Anpinnen', icon: 'pin', wert: 'pin' },
    s.text ? { text: 'Bearbeiten', icon: 'stift', wert: 'edit' } : null,
    { text: 'Verwandeln …', icon: 'wandel', wert: 'wandel' },
    { text: 'Löschen', icon: 'muell', wert: 'weg', rot: true }
  ]);
  if (wahl === 'pin') { s.gepinnt = !s.gepinnt; speichereStill(s); neuZeichnen(); }
  else if (wahl === 'edit') {
    const neu = await eingabe({ titel: 'Schnipsel', wert: s.text, mehrzeilig: true });
    if (neu !== null) { s.text = neu; speichere(s); neuZeichnen(); }
  }
  else if (wahl === 'weg') {
    if (await frage('Diesen Schnipsel wegwerfen?', { ja: 'Wegwerfen', gefahr: true })) { await loesche(s.id); neuZeichnen(); }
  }
  else if (wahl === 'wandel') verwandleSchnipsel(s, neuZeichnen);
}

async function verwandleSchnipsel(s, neuZeichnen) {
  const ziel = await menue([
    { text: 'Als Blatt in den Stapel', icon: 'blatt', wert: 'blatt' },
    { text: 'Auf eine Heftseite kleben', icon: 'hefte', wert: 'seite' },
    { text: 'Als Szene in ein Projekt', icon: 'projekte', wert: 'szene' },
    { text: 'Als Blase auf ein Brett', icon: 'cluster', wert: 'blase' },
    { text: 'Als Wort in die Kiste', icon: 'woerter', wert: 'wort' }
  ], 'Woraus soll das werden?');
  if (!ziel) return;

  if (ziel === 'blatt') {
    blattAusText('', s.text || '');
    await loesche(s.id, true);
    toast('Liegt jetzt bei den Blättern.');
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'wort') {
    neuDoc('wort', { text: (s.text || '').slice(0, 60) });
    toast('Liegt in der Wortschatzkiste.');
    return;
  }
  if (ziel === 'seite') {
    const heft = await waehleHeft();
    if (!heft) return;
    const geschwister = kinder(heft.id, 'seite');
    const seite = neuDoc('seite', { parent: heft.id, ord: geschwister.length, titel: '', text: s.text || '' });
    if (s.bild) {
      neuDoc('foto', { parent: seite.id, bild: s.bild, pos: { x: 55, y: 8, rot: -2 + Math.random() * 4, w: 38 } });
      delete s.bild;
    }
    await loesche(s.id);
    toast('Eingeklebt: ' + heft.titel);
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'szene') {
    const wo = await waehleProjektKapitel();
    if (!wo) return;
    const geschwister = kinder(wo.kapitel.id, 'szene');
    neuDoc('szene', {
      parent: wo.kapitel.id, projekt: wo.projekt.id, ord: geschwister.length,
      titel: (s.text || '').split('\n')[0].slice(0, 40), text: s.text || '', status: 'funke', farbe: ''
    });
    await loesche(s.id);
    toast('Jetzt eine Szene in „' + wo.projekt.titel + '".');
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'blase') {
    const brett = await waehleBrett();
    if (!brett) return;
    neuDoc('blase', { parent: brett.id, text: s.text || '', farbe: '', pos: { x: 80 + Math.random() * 300, y: 80 + Math.random() * 300 } });
    await loesche(s.id);
    toast('Schwebt jetzt auf „' + brett.titel + '".');
    if (neuZeichnen) neuZeichnen();
  }
}

/* Auswahl-Helfer */
async function waehleHeft() {
  const hefte = vomTyp('heft').filter((h) => !h.archiv);
  const wahl = await menue([
    ...hefte.map((h) => ({ text: h.titel, icon: 'hefte', wert: h.id })),
    { text: 'Neues Heft', icon: 'plus', wert: '_neu' }
  ], 'In welches Heft?');
  if (!wahl) return null;
  if (wahl === '_neu') {
    const name = await eingabe({ titel: 'Ein neues Heft', platzhalter: 'Wie soll es heißen?' });
    if (!name) return null;
    return neuDoc('heft', { titel: name, farbe: zufall(HEFTFARBEN), papier: 'liniert' });
  }
  return D.docs.get(wahl);
}
async function waehleProjektKapitel() {
  const projekte = vomTyp('projekt');
  if (!projekte.length) { toast('Noch kein Projekt. Leg erst eins an.'); return null; }
  const pWahl = await menue(projekte.map((p) => ({ text: p.titel, icon: 'projekte', wert: p.id })), 'Welches Projekt?');
  if (!pWahl) return null;
  const projekt = D.docs.get(pWahl);
  const kapitel = kinder(projekt.id, 'kapitel');
  if (!kapitel.length) {
    const k = neuDoc('kapitel', { parent: projekt.id, titel: 'Kapitel 1', ord: 0 });
    return { projekt, kapitel: k };
  }
  if (kapitel.length === 1) return { projekt, kapitel: kapitel[0] };
  const kWahl = await menue(kapitel.map((k) => ({ text: k.titel, wert: k.id })), 'Wohin genau?');
  if (!kWahl) return null;
  return { projekt, kapitel: D.docs.get(kWahl) };
}
async function waehleBrett() {
  const bretter = vomTyp('board');
  const wahl = await menue([
    ...bretter.map((b) => ({ text: b.titel, icon: 'cluster', wert: b.id })),
    { text: 'Neues Brett', icon: 'plus', wert: '_neu' }
  ], 'Auf welches Brett?');
  if (!wahl) return null;
  if (wahl === '_neu') {
    const name = await eingabe({ titel: 'Ein neues Brett', platzhalter: 'Wofür ist es?' });
    if (!name) return null;
    return neuDoc('board', { titel: name });
  }
  return D.docs.get(wahl);
}
/* ================================================================
   VANI — Blätter: nur Texte, nichts sonst.
   ================================================================ */

function blattAusText(titel, text) {
  return neuDoc('blatt', { titel: titel || '', text: text || '', ord: Date.now() });
}

RENDER.blaetter = function (haupt) {
  haupt.append(raumkopf('Blätter', 'ein Stapel Texte, mehr nicht',
    el('button', {
      class: 'rundknopf voll', html: ik('plus'), onclick: () => {
        const b = blattAusText('', '');
        oeffneSchreibraum(b.id);
      }
    })
  ));
  const inhalt = el('div', { class: 'inhalt' });

  const sortierung = D.einst.blattSortierung || 'zuletzt';
  const alle = vomTyp('blatt');
  if (sortierung === 'az') alle.sort((a, b) => (a.titel || a.text || '').localeCompare(b.titel || b.text || '', 'de'));
  else if (sortierung === 'aeltest') alle.sort((a, b) => a.angelegt - b.angelegt);

  if (alle.length > 1) {
    const wahl = el('div', { class: 'wahlgruppe', style: 'margin-bottom:12px' });
    for (const [id, name] of [['zuletzt', 'Zuletzt'], ['aeltest', 'Älteste zuerst'], ['az', 'A–Z']]) {
      wahl.append(el('button', {
        class: sortierung === id ? 'an' : '', onclick: () => { D.einst.blattSortierung = id; speichereEinst(); zeichne(); }
      }, name));
    }
    inhalt.append(wahl);
  }

  if (!alle.length) {
    inhalt.append(el('div', { class: 'leer' }, 'Ein leerer Stapel.',
      el('div', { class: 'klein' }, 'Für alles, was einfach nur geschrieben werden will.')));
  }

  const liste = el('div', { class: 'blattliste' });
  for (const b of alle) {
    const worteZahl = worte(b.text);
    const erste = (b.text || '').trim().split('\n')[0] || '';
    const karte = el('button', { class: 'karte blattkarte', onclick: () => oeffneSchreibraum(b.id) },
      el('div', { class: 'btitel serif' }, b.titel || erste.slice(0, 60) || 'Ohne Titel'),
      el('div', { class: 'bprobe' }, (b.text || '').trim().replace(/\s+/g, ' ').slice(0, 140) || 'Noch leer.'),
      el('div', { class: 'bfuss' }, (worteZahl ? worteZahl + ' Wörter · ' : '') + vorZeit(b.geaendert))
    );
    langdruck(karte, async () => {
      const wahl = await menue([
        { text: 'Umbenennen', icon: 'stift', wert: 'name' },
        { text: 'Teilen', icon: 'teilen', wert: 'teilen' },
        { text: 'Duplizieren', icon: 'wandel', wert: 'doppel' },
        { text: 'Löschen', icon: 'muell', wert: 'weg', rot: true }
      ], b.titel || 'Blatt');
      if (wahl === 'name') {
        const neu = await eingabe({ titel: 'Das Blatt heißt jetzt …', wert: b.titel });
        if (neu !== null) { b.titel = neu; speichereStill(b); zeichne(); }
      } else if (wahl === 'teilen') {
        teileText((b.titel ? b.titel + '\n\n' : '') + (b.text || ''));
      } else if (wahl === 'doppel') {
        neuDoc('blatt', { titel: (b.titel || 'Blatt') + ' (Abschrift)', text: b.text, ord: Date.now() });
        zeichne();
      } else if (wahl === 'weg') {
        await loesche(b.id); zeichne();
      }
    });
    liste.append(karte);
  }
  inhalt.append(liste);
  haupt.append(inhalt);
};
/* ================================================================
   VANI — Der Faden: der lange Chat, weitergesponnen.
   ================================================================ */

RENDER.faden = function (haupt) {
  const raum = el('div', { class: 'schnipsel-raum' });
  raum.append(el('div', { class: 'kopf', style: 'position:static;background:none' },
    el('h1', {}, 'Faden', el('div', { class: 'unter' }, 'alles, was je an Vani ging'))
  ));

  const lauf = el('div', { class: 'schnipsel-lauf' });
  const innen = el('div', { class: 'innen' });
  lauf.append(innen);

  const feld = el('textarea', { placeholder: 'Weiter im Faden …', rows: 1 });
  autogrow(feld);
  const zeile = el('div', { class: 'schreibzeile' },
    feld,
    el('button', {
      class: 'rundknopf voll', html: ik('senden'), onclick: () => {
        const t = feld.value.trim();
        if (!t) return;
        neuDoc('faden', { text: t });
        feld.value = ''; feld.style.height = 'auto';
        baueLauf(true);
        feld.focus();
      }
    })
  );
  raum.append(lauf, zeile);
  haupt.append(raum);

  const alle = () => vomTyp('faden').sort((a, b) => a.angelegt - b.angelegt);
  let zeigeAb = Math.max(0, alle().length - 150);

  function baueBlase(s) {
    const blase = el('div', { class: 'blase fadenblase', 'data-id': s.id },
      el('div', { class: 'btext', html: schmuecke(s.text) }),
      el('div', { class: 'bzeit' }, fmtZeit(s.angelegt))
    );
    blase.addEventListener('click', async (e) => {
      if (e.target.closest('.verweis')) return;
      const wahl = await menue([
        { text: 'Kopieren', icon: 'teilen', wert: 'kopie' },
        { text: 'Als Blatt herauslösen', icon: 'blatt', wert: 'blatt' },
        { text: 'Löschen', icon: 'muell', wert: 'weg', rot: true }
      ]);
      if (wahl === 'kopie') { try { await navigator.clipboard.writeText(s.text); toast('Kopiert.'); } catch (x) { teileText(s.text); } }
      else if (wahl === 'blatt') { blattAusText('', s.text); toast('Liegt jetzt bei den Blättern.'); }
      else if (wahl === 'weg') { await loesche(s.id); baueLauf(); }
    });
    return blase;
  }

  function baueLauf(ansEnde) {
    innen.innerHTML = '';
    const liste = alle();
    if (!liste.length) {
      innen.append(el('div', { class: 'leer' }, 'Der Faden liegt noch woanders.',
        el('div', { class: 'klein' }, 'Er kommt als private Datei zu dir — Feinheiten → „Sicher ist sicher" → einlesen. Danach läuft er hier weiter.')));
      return;
    }
    if (zeigeAb > 0) {
      innen.append(el('button', {
        class: 'knopf zart', style: 'align-self:center;margin:10px 0', onclick: () => {
          const alteHoehe = lauf.scrollHeight;
          zeigeAb = Math.max(0, zeigeAb - 300);
          baueLauf();
          lauf.scrollTop = lauf.scrollHeight - alteHoehe;
        }
      }, '… frühere zeigen (' + zeigeAb + ')'));
    }
    let letzterTag = '';
    for (const s of liste.slice(zeigeAb)) {
      const tag = tagKey(s.angelegt);
      if (tag !== letzterTag) {
        letzterTag = tag;
        const d = new Date(s.angelegt);
        innen.append(el('div', { class: 'datumstrenner' }, fmtDatum(s.angelegt) + ' ' + d.getFullYear()));
      }
      innen.append(baueBlase(s));
    }
    if (ansEnde !== false) requestAnimationFrame(() => { lauf.scrollTop = lauf.scrollHeight; });
  }

  baueLauf();
};

RENDER.hefte = function (haupt) {
  haupt.append(raumkopf('Hefte', null,
    el('button', {
      class: 'rundknopf voll', html: ik('plus'), onclick: async () => {
        const name = await eingabe({ titel: 'Ein neues Heft', platzhalter: 'Wie soll es heißen?' });
        if (!name) return;
        const h = neuDoc('heft', { titel: name, farbe: zufall(HEFTFARBEN), papier: 'liniert' });
        location.hash = '#/heft/' + h.id;
      }
    })
  ));

    },

    );

async function heftMenue(h, danach) {
  const wahl = await menue([
    { text: 'Umbenennen', icon: 'stift', wert: 'name' },
    { text: 'Papier: ' + ({ liniert: 'liniert', kariert: 'kariert', blank: 'blanko' }[h.papier] || 'liniert'), icon: 'hefte', wert: 'papier' },
    { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' },
    h.archiv ? { text: 'Zurück auf den Tisch', icon: 'archiv', wert: 'zurueck' } : { text: 'Ins Regal stellen', icon: 'archiv', wert: 'archiv' },
    { text: 'Heft verbrennen', icon: 'muell', wert: 'weg', rot: true }
  ], h.titel);
  if (wahl === 'name') {
    const neu = await eingabe({ titel: 'Das Heft heißt jetzt …', wert: h.titel });
    if (neu) { h.titel = neu; speichere(h); }
  } else if (wahl === 'papier') {
    h.papier = { liniert: 'kariert', kariert: 'blank', blank: 'liniert' }[h.papier] || 'kariert';
    speichereStill(h);
  } else if (wahl === 'farbe') {
    const i = (HEFTFARBEN.indexOf(h.farbe) + 1) % HEFTFARBEN.length;
    h.farbe = HEFTFARBEN[i]; speichereStill(h);
  } else if (wahl === 'archiv') {
    h.archiv = Date.now(); speichereStill(h);
    toast('Feierlich ins Regal gestellt.');
  } else if (wahl === 'zurueck') {
    delete h.archiv; speichereStill(h);
  } else if (wahl === 'weg') {
    const seiten = kinder(h.id, 'seite').length;
    if (await frage('„' + h.titel + '" mit ' + (seiten === 1 ? 'einer Seite' : seiten + ' Seiten') + ' in den Papierkorb legen?', { ja: 'In den Papierkorb', gefahr: true })) {
      await loesche(h.id);
      if (location.hash.includes(h.id)) location.hash = '#/hefte';
    }
  }
  if (danach) danach();
}

/* ----- Ein Heft, eine Seite ----- */
RENDER.heft = function (haupt, heftId) {
  const heft = D.docs.get(heftId);
  if (!heft) { location.hash = '#/hefte'; return; }

  let seiten = kinder(heft.id, 'seite');
  if (!seiten.length) {
    neuDoc('seite', { parent: heft.id, ord: 0, titel: '', text: '' });
    seiten = kinder(heft.id, 'seite');
  }

  let idx = Math.min(seiten.length - 1, parseInt(sessionStorage.getItem('heftSeite:' + heftId) || '0', 10) || 0);
  const ziel = sessionStorage.getItem('zielSeite');
  if (ziel) {
    sessionStorage.removeItem('zielSeite');
    const zi = seiten.findIndex((s) => s.id === ziel);
    if (zi >= 0) idx = zi;
  }

  haupt.append(el('div', { class: 'kopf' },
    zurueckknopf('#/hefte'),
    el('h1', {}, heft.titel),
    el('button', { class: 'rundknopf zart', html: ik('mehr'), onclick: () => heftMenue(heft, () => zeichne()) })
  ));

  const inhalt = el('div', { class: 'inhalt' });
  const halter = el('div', { class: 'seitenhalter' });
  const fuss = el('div', { class: 'seitenfuss' });
  inhalt.append(halter, fuss);
  haupt.append(inhalt);

  function zeigeSeite() {
    seiten = kinder(heft.id, 'seite');
    idx = Math.max(0, Math.min(idx, seiten.length - 1));
    sessionStorage.setItem('heftSeite:' + heftId, String(idx));
    const seite = seiten[idx];
    halter.innerHTML = '';
    fuss.innerHTML = '';
    halter.append(baueSeite(seite, heft, zeigeSeite));

    fuss.append(
      el('button', { class: 'rundknopf zart', html: ik('zurueck'), style: idx === 0 ? 'opacity:.25;pointer-events:none' : '', onclick: () => { idx--; zeigeSeite(); } }),
      el('div', { class: 'snummer' }, 'Seite ' + (idx + 1) + ' von ' + seiten.length),
      el('button', { class: 'rundknopf zart', html: ik('rechts'), style: idx === seiten.length - 1 ? 'opacity:.25;pointer-events:none' : '', onclick: () => { idx++; zeigeSeite(); } }),
      el('button', {
        class: 'rundknopf', html: ik('plus'), title: 'Neue Seite', onclick: () => {
          neuDoc('seite', { parent: heft.id, ord: seiten.length, titel: '', text: '' });
          heft.geaendert = Date.now(); speichereStill(heft);
          idx = seiten.length; zeigeSeite();
        }
      })
    );
  }
  zeigeSeite();
};

function baueSeite(seite, heft, neuZeichnen) {
  const blatt = el('div', { class: 'papierseite ' + (heft.papier || 'liniert') });

  /* Werkzeuge oben rechts */
  const werkzeuge = el('div', { class: 'seitenwerkzeuge' },
    el('button', {
      class: 'rundknopf', title: 'Zettel ankleben', html: ik('pin'), onclick: () => {
        neuDoc('zettel', { parent: seite.id, text: '', farbe: zufall(['gelb', 'rosa', 'blau', 'gruen']), pos: { x: 8 + Math.random() * 40, y: 6 + Math.random() * 20, rot: -4 + Math.random() * 8, w: 30 } });
        baueAnlagen();
      }
    }),
    el('button', {
      class: 'rundknopf', title: 'Foto einkleben', html: ik('kamera'), onclick: async () => {
        const bild = await waehleBild();
        if (!bild) return;
        neuDoc('foto', { parent: seite.id, bild: bild.id, pos: { x: 12 + Math.random() * 35, y: 8 + Math.random() * 20, rot: -3 + Math.random() * 6, w: 42 } });

      }
    }),
    el('button', { class: 'rundknopf', title: 'Kritzeln', html: ik('stift'), onclick: () => starteKritzeln(blatt, seite) }),
    el('button', {
      class: 'rundknopf', title: 'Mehr', html: ik('mehr'), onclick: async () => {
        const wahl = await menue([
          { text: 'Im Schreibraum öffnen', icon: 'stift', wert: 'sr' },
          { text: 'Seite herausreißen', icon: 'muell', wert: 'weg', rot: true }
        ]);
        if (wahl === 'sr') oeffneSchreibraum(seite.id);
        else if (wahl === 'weg' && await frage('Diese Seite herausreißen? Alles darauf geht mit.', { ja: 'Herausreißen', gefahr: true })) {
          await loesche(seite.id);
          kinder(heft.id, 'seite').forEach((s, i) => { s.ord = i; speichereStill(s); });
          neuZeichnen();
        }
      }
    })
  );

  /* Titel + Text */
  const titel = el('input', { class: 'stitel serif', type: 'text', value: seite.titel || '', placeholder: 'Überschrift, wenn du magst' });
  titel.addEventListener('input', entprellt(() => { seite.titel = titel.value; speichere(seite); }, 400));

  const text = el('textarea', { class: 'schreibflaeche text', placeholder: 'Hier darf alles stehen.' });
  text.value = seite.text || '';
  autogrow(text);
  text.addEventListener('input', entprellt(() => {
    seite.text = text.value;
    speichere(seite);
    zaehleWorte(seite.id, seite.text);
  }, 400));

  const skizzenbild = el('div', { class: 'skizzenbild' });
  if (seite.skizze) {
    const img = el('img', { alt: '' });
    setzeBild(img, seite.skizze);
    skizzenbild.append(img);
  }

  blatt.append(skizzenbild, titel, text, werkzeuge);

  /* Angeklebtes */
  function baueAnlagen() {
    $$('.anlage', blatt).forEach((a) => a.remove());
    for (const a of kinder(seite.id)) {
      if (a.typ === 'zettel') blatt.append(baueZettel(a, blatt, baueAnlagen));
      else if (a.typ === 'foto') blatt.append(baueFoto(a, blatt, baueAnlagen));
    }
  }
  baueAnlagen();

  blatt.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.anlage')) $$('.anlage.aktiv', blatt).forEach((a) => a.classList.remove('aktiv'));
  });

  return blatt;
}

function positioniere(elem, a) {
  const p = a.pos || { x: 10, y: 10, rot: 0, w: 30 };
  elem.style.left = p.x + '%';
  elem.style.top = p.y + '%';
  elem.style.width = p.w + '%';
  elem.style.transform = 'rotate(' + (p.rot || 0) + 'deg)';
}

function anlageGesten(elem, a, blatt, neuBauen) {
  let zieht = null;
  elem.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'TEXTAREA' && elem.classList.contains('aktiv')) return;
    $$('.anlage.aktiv', blatt).forEach((x) => { if (x !== elem) x.classList.remove('aktiv'); });
    const r = blatt.getBoundingClientRect();
    zieht = { sx: e.clientX, sy: e.clientY, px: a.pos.x, py: a.pos.y, r, bewegt: false };
    elem.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  elem.addEventListener('pointermove', (e) => {
    if (!zieht) return;
    const dx = e.clientX - zieht.sx, dy = e.clientY - zieht.sy;
    if (!zieht.bewegt && Math.hypot(dx, dy) < 6) return;
    zieht.bewegt = true;
    elem._zieht = true;
    a.pos.x = Math.max(-10, Math.min(96, zieht.px + dx / zieht.r.width * 100));
    a.pos.y = Math.max(-2, Math.min(102, zieht.py + dy / zieht.r.height * 100));
    elem.style.left = a.pos.x + '%';
    elem.style.top = a.pos.y + '%';
  });
  const ende = (e) => {
    if (!zieht) return;
    if (zieht.bewegt) speichereStill(a);
    else elem.classList.add('aktiv');
    zieht = null;
    setTimeout(() => { elem._zieht = false; }, 0);
  };
  elem.addEventListener('pointerup', ende);
  elem.addEventListener('pointercancel', ende);

  /* Griff: Größe ziehen */
  const griff = el('div', { class: 'griff', html: ik('rechts') });
  griff.style.transform = 'rotate(45deg)';
  let groesse = null;
  griff.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const r = blatt.getBoundingClientRect();
    groesse = { sx: e.clientX, w: a.pos.w, r };
    griff.setPointerCapture(e.pointerId);
  });
  griff.addEventListener('pointermove', (e) => {
    if (!groesse) return;
    a.pos.w = Math.max(12, Math.min(92, groesse.w + (e.clientX - groesse.sx) / groesse.r.width * 100));
    elem.style.width = a.pos.w + '%';
  });
  griff.addEventListener('pointerup', () => { if (groesse) speichereStill(a); groesse = null; });
  elem.append(griff);

  langdruck(elem, async () => {
    const wahl = await menue([
      a.typ === 'zettel' ? { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' } : null,
      { text: 'Etwas drehen', icon: 'drehen', wert: 'drehen' },
      { text: 'Abmachen', icon: 'muell', wert: 'weg', rot: true }
    ]);
    if (wahl === 'farbe') {
      const folge = ['gelb', 'rosa', 'blau', 'gruen'];
      a.farbe = folge[(folge.indexOf(a.farbe) + 1) % folge.length];
      speichereStill(a); neuBauen();
    } else if (wahl === 'drehen') {
      a.pos.rot = ((a.pos.rot || 0) + 4.5);
      if (a.pos.rot > 10) a.pos.rot = -9;
      speichereStill(a);
      elem.style.transform = 'rotate(' + a.pos.rot + 'deg)';
    } else if (wahl === 'weg') {
      if (await frage(a.typ === 'zettel' ? 'Zettel abmachen und wegwerfen?' : 'Foto abmachen?', { ja: 'Abmachen', gefahr: true })) {
        await loesche(a.id); neuBauen();
      }
    }
  });
}

function baueZettel(a, blatt, neuBauen) {
  const halter = el('div', { class: 'anlage' });
  positioniere(halter, a);
  const z = el('div', { class: 'zettel ' + (a.farbe || 'gelb') });
  const ta = el('textarea', { placeholder: '…', rows: 1 });
  ta.value = a.text || '';
  autogrow(ta);
  ta.addEventListener('input', entprellt(() => { a.text = ta.value; speichereStill(a); }, 400));
  z.append(ta);
  halter.append(z);
  anlageGesten(halter, a, blatt, neuBauen);
  return halter;
}

function baueFoto(a, blatt, neuBauen) {
  const halter = el('div', { class: 'anlage' });
  positioniere(halter, a);
  const rahmen = el('div', { class: 'foto-anlage' });
  const img = el('img', { alt: '' });
  setzeBild(img, a.bild);
  rahmen.append(img);
  halter.append(rahmen);
  anlageGesten(halter, a, blatt, neuBauen);
  return halter;
}

/* ----- Kritzeln ----- */
const STIFTFARBEN = ['#2c251c', '#b0552f', '#41597a', '#5f7752'];
async function starteKritzeln(blatt, seite) {
  if ($('.kritzelflaeche', blatt)) return;
  const r = blatt.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const canvas = el('canvas', { class: 'kritzelflaeche' });
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (seite.skizze) {
    const url = await bildURL(seite.skizze);
    if (url) {
      const alt = new Image();
      await new Promise((res) => { alt.onload = res; alt.onerror = res; alt.src = url; });
      try { ctx.drawImage(alt, 0, 0, r.width, alt.height / alt.width * r.width); } catch (e) {}
    }
  }
  const altesBild = $('.skizzenbild', blatt);
  if (altesBild) altesBild.style.display = 'none';

  let farbe = D.einst.thema === 'tinte' || D.einst.thema === 'kerze' ? '#eae0cd' : STIFTFARBEN[0];
  let radierer = false;
  let strich = null;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    strich = { x: e.offsetX, y: e.offsetY };
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!strich) return;
    const punkte = (e.getCoalescedEvents && e.getCoalescedEvents().length ? e.getCoalescedEvents() : [e]);
    for (const p of punkte) {
      const cr = canvas.getBoundingClientRect();
      const x = p.clientX - cr.left, y = p.clientY - cr.top;
      const druck = p.pressure && p.pressure > 0 ? p.pressure : .5;
      ctx.globalCompositeOperation = radierer ? 'destination-out' : 'source-over';
      ctx.strokeStyle = farbe;
      ctx.lineWidth = radierer ? 26 : (1 + druck * 3.4);
      ctx.beginPath();
      ctx.moveTo(strich.x, strich.y);
      ctx.lineTo(x, y);
      ctx.stroke();
      strich = { x, y };
    }
  });
  const strichEnde = () => { strich = null; };
  canvas.addEventListener('pointerup', strichEnde);
  canvas.addEventListener('pointercancel', strichEnde);

  const leiste = el('div', { class: 'kritzelleiste' },
    STIFTFARBEN.map((f) =>
      el('button', {
        class: 'stiftfarbe' + (f === farbe ? ' an' : ''), style: 'background:' + f, onclick: (e) => {
          farbe = f; radierer = false;
          $$('.stiftfarbe', leiste).forEach((k) => k.classList.toggle('an', k === e.currentTarget));
          radierKnopf.classList.remove('an');
        }
      })
    ),
    (() => {
      const k = el('button', {
        class: 'rundknopf', style: 'width:34px;height:34px', html: ik('kreuz'), title: 'Radierer', onclick: () => {
          radierer = !radierer;
          k.classList.toggle('an', radierer);
          if (radierer) $$('.stiftfarbe', leiste).forEach((x) => x.classList.remove('an'));
          k.style.background = radierer ? 'var(--akzent)' : '';
          k.style.color = radierer ? 'var(--papier)' : '';
        }
      });
      return k;
    })(),
    el('button', {
      class: 'knopf voll', style: 'padding:7px 14px', onclick: async () => {
        seite.skizze = await speichereKritzelei(canvas, seite.skizze);
        speichere(seite);
        leiste.remove();
        canvas.remove();
        if (altesBild) {
          altesBild.style.display = '';
          altesBild.innerHTML = '';
          const img = el('img', { alt: '' });
          setzeBild(img, seite.skizze);
          altesBild.append(img);
        }
      }
    }, 'Fertig')
  );
  const radierKnopf = leiste.children[STIFTFARBEN.length];

  blatt.closest('.inhalt').prepend(leiste);
  blatt.append(canvas);
}
/* ================================================================
   VANI — Projekte: Kapitel, Szenen, Pinnwand, Leseansicht
   ================================================================ */

function projektWorte(p) {
  let n = 0;
  for (const d of D.docs.values()) if (d.typ === 'szene' && d.projekt === p.id) n += worte(d.text);
  return n;
}

RENDER.projekte = function (haupt) {
  haupt.append(raumkopf('Projekte', null,
    el('button', { class: 'rundknopf voll', html: ik('plus'), onclick: () => neuesProjekt() })
  ));
  const inhalt = el('div', { class: 'inhalt' });
  const alle = vomTyp('projekt');

  if (!alle.length) {
    inhalt.append(el('div', { class: 'leer' }, 'Hier entsteht Größeres.',
      el('div', { class: 'klein' }, 'Ein Roman, eine Sammlung, eine Welt — alles fängt mit einem Namen an.')));
  }

  const liste = el('div', { class: 'projektliste' });
  for (const p of alle) {
    const w = projektWorte(p);

    const karte = el('button', { class: 'karte projektkarte', onclick: () => { location.hash = '#/projekt/' + p.id; } },

        el('span', { class: 'artmarke' }, p.art || 'Projekt')
      ),
      el('div', { class: 'pzahlen' },
        w.toLocaleString('de-DE') + ' Wörter · ' + (szenen === 1 ? 'eine Szene' : szenen + ' Szenen') + ' · ' + vorZeit(p.geaendert)),
      p.ziel ? el('div', { class: 'zielbalken' }, el('i', { style: 'width:' + Math.min(100, Math.round(w / p.ziel * 100)) + '%' })) : null
    );
    langdruck(karte, () => projektMenue(p, () => zeichne()));
    liste.append(karte);
  }
  inhalt.append(liste);
  haupt.append(inhalt);
};

function neuesProjekt() {
  let art = 'Roman';
  const name = el('input', { type: 'text', placeholder: 'Der Arbeitstitel' });
  const ziel = el('input', { type: 'text', inputmode: 'numeric', placeholder: 'Wortziel — leer lassen ist auch gut' });
  const artWahl = el('div', { class: 'wahlgruppe', style: 'flex-wrap:wrap' },
    PROJEKT_ARTEN.map((a) => el('button', {
      class: a === art ? 'an' : '', onclick: (e) => {
        art = a;
        $$('button', artWahl).forEach((b) => b.classList.toggle('an', b === e.currentTarget));
      }
    }, a))
  );
  const kasten = el('div', { class: 'modal' },
    el('h2', {}, 'Etwas Neues, Größeres'),
    name,
    el('div', { style: 'margin-top:12px' }, artWahl),
    el('div', { style: 'margin-top:12px' }, ziel),
    el('div', { class: 'reihe' },
      el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'),
      el('button', {
        class: 'knopf voll', onclick: () => {
          const t = name.value.trim();
          if (!t) return;
          const p = neuDoc('projekt', { titel: t, art, ziel: parseInt(ziel.value, 10) || 0 });
          neuDoc('kapitel', { parent: p.id, titel: 'Kapitel 1', ord: 0 });
          zu();
          location.hash = '#/projekt/' + p.id;
        }
      }, 'Anlegen')
    )
  );
  const zu = zeigeDeck(kasten);
  setTimeout(() => name.focus(), 60);
}

async function projektMenue(p, danach) {
  const wahl = await menue([
    { text: 'Umbenennen', icon: 'stift', wert: 'name' },
    { text: 'Wortziel: ' + (p.ziel ? p.ziel.toLocaleString('de-DE') : 'keins'), icon: 'ziel', wert: 'ziel' },
    { text: 'Leseansicht', icon: 'lesen', wert: 'lesen' },
    { text: 'Projekt löschen', icon: 'muell', wert: 'weg', rot: true }
  ], p.titel);
  if (wahl === 'name') {
    const neu = await eingabe({ titel: 'Das Projekt heißt jetzt …', wert: p.titel });
    if (neu) { p.titel = neu; speichere(p); }
  } else if (wahl === 'ziel') {
    const neu = await eingabe({ titel: 'Wortziel (0 = keins)', wert: String(p.ziel || '') });
    if (neu !== null) { p.ziel = parseInt(neu, 10) || 0; speichereStill(p); }
  } else if (wahl === 'lesen') {
    zeigeLeseansicht(p);
    return;
  } else if (wahl === 'weg') {
    if (await frage('„' + p.titel + '" mit allem darin in den Papierkorb legen?', { ja: 'In den Papierkorb', gefahr: true })) {
      await loesche(p.id);
      location.hash = '#/projekte';
      return;
    }
  }
  if (danach) danach();
}

RENDER.projekt = function (haupt, pid) {
  const p = D.docs.get(pid);
  if (!p) { location.hash = '#/projekte'; return; }
  const w = projektWorte(p);

  haupt.append(el('div', { class: 'kopf' },
    zurueckknopf('#/projekte'),
    el('h1', {}, p.titel, el('div', { class: 'unter' },
      w.toLocaleString('de-DE') + ' Wörter' + (p.ziel ? ' von ' + p.ziel.toLocaleString('de-DE') : '') + ' · ' + (p.art || ''))),
    el('button', { class: 'rundknopf zart', html: ik('lesen'), title: 'Leseansicht', onclick: () => zeigeLeseansicht(p) }),
    el('button', { class: 'rundknopf zart', html: ik('mehr'), onclick: () => projektMenue(p, () => zeichne()) })
  ));

  const inhalt = el('div', { class: 'inhalt' });
  if (p.ziel) {
    inhalt.append(el('div', { class: 'zielbalken', style: 'margin-top:4px' },
      el('i', { style: 'width:' + Math.min(100, Math.round(w / p.ziel * 100)) + '%' })));
  }

  const kapitel = kinder(p.id, 'kapitel');
  for (const k of kapitel) inhalt.append(baueKapitel(k, p));

  inhalt.append(el('button', {
    class: 'plusskarte', style: 'width:100%;margin-top:22px', onclick: async () => {
      const name = await eingabe({ titel: 'Neues Kapitel', wert: 'Kapitel ' + (kapitel.length + 1) });
      if (!name) return;
      neuDoc('kapitel', { parent: p.id, titel: name, ord: kapitel.length });
      zeichne();
    }
  }, el('span', { html: ik('plus'), style: 'display:flex' }), 'Neues Kapitel'));

  haupt.append(inhalt);
};

function baueKapitel(k, p) {
  const szenen = kinder(k.id, 'szene');
  const kw = szenen.reduce((n, s) => n + worte(s.text), 0);
  const block = el('div', { class: 'kapitelblock' });
  const zeile = el('div', { class: 'kapitelzeile' },
    el('h3', {}, k.titel),
    el('span', { class: 'kworte' }, kw ? kw.toLocaleString('de-DE') + ' Wörter' : ''),
    el('button', {
      class: 'rundknopf zart', style: 'width:32px;height:32px', html: ik('mehr'), onclick: async () => {
        const geschwister = kinder(p.id, 'kapitel');
        const i = geschwister.findIndex((x) => x.id === k.id);
        const wahl = await menue([
          { text: 'Umbenennen', icon: 'stift', wert: 'name' },
          i > 0 ? { text: 'Nach oben', icon: 'senden', wert: 'hoch' } : null,
          i < geschwister.length - 1 ? { text: 'Nach unten', icon: 'aufklappen', wert: 'runter' } : null,
          { text: 'Kapitel löschen', icon: 'muell', wert: 'weg', rot: true }
        ], k.titel);
        if (wahl === 'name') {
          const neu = await eingabe({ titel: 'Das Kapitel heißt jetzt …', wert: k.titel });
          if (neu) { k.titel = neu; speichereStill(k); zeichne(); }
        } else if (wahl === 'hoch' || wahl === 'runter') {
          const j = wahl === 'hoch' ? i - 1 : i + 1;
          geschwister.forEach((x, n2) => { x.ord = n2; });
          [geschwister[i].ord, geschwister[j].ord] = [j, i];
          geschwister.forEach((x) => speichereStill(x));
          zeichne();
        } else if (wahl === 'weg') {
          if (await frage('„' + k.titel + '" mit ' + szenen.length + ' Szenen löschen?', { ja: 'Löschen', gefahr: true })) {
            await loesche(k.id); zeichne();
          }
        }
      }
    })
  );
  const wand = el('div', { class: 'pinnwand', 'data-kapitel': k.id });
  for (const s of szenen) wand.append(baueSzenenkarte(s, p));
  wand.append(el('button', {
    class: 'plusskarte', onclick: () => {
      const s = neuDoc('szene', { parent: k.id, projekt: p.id, ord: szenen.length, titel: '', text: '', status: 'funke', farbe: '' });
      oeffneSchreibraum(s.id);
    }
  }, el('span', { html: ik('plus'), style: 'display:flex' }), 'Szene'));
  block.append(zeile, wand);
  return block;
}

function baueSzenenkarte(s, p) {
  const karte = el('div', { class: 'szkarte', 'data-id': s.id });
  const probe = (s.text || '').trim().replace(/\s+/g, ' ').slice(0, 110);

  const notizFeld = el('textarea', { placeholder: 'Zweifel, Ideen, Alternativen — nur für dich.' });
  notizFeld.value = s.notiz || '';
  notizFeld.addEventListener('input', entprellt(() => { s.notiz = notizFeld.value; speichereStill(s); }, 400));
  notizFeld.addEventListener('pointerdown', (e) => e.stopPropagation());

  const statusFolge = ['funke', 'entwurf', 'steht'];
  const statusPunkt = el('button', {
    class: 'statuspunkt ' + (s.status || 'funke'), title: 'Status', onpointerdown: (e) => e.stopPropagation(), onclick: (e) => {
      e.stopPropagation();
      s.status = statusFolge[(statusFolge.indexOf(s.status || 'funke') + 1) % 3];
      speichereStill(s);
      e.currentTarget.className = 'statuspunkt ' + s.status;
    }
  });

  const dreher = el('div', { class: 'dreher' },
    el('div', { class: 'szvorn', style: s.farbe ? '--szfarbe:' + s.farbe : '' },
      el('div', { class: 'sztitel' }, s.titel || 'Ohne Titel'),
      el('div', { class: 'szprobe' }, probe || 'Noch leer. Noch alles möglich.'),
      el('div', { class: 'szfusszeile' },
        statusPunkt,
        el('span', { class: 'szworte' }, worte(s.text) ? worte(s.text) + ' W.' : ''),
        el('button', {
          class: 'rundknopf zart', style: 'width:28px;height:28px', html: ik('drehen'),
          onpointerdown: (e) => e.stopPropagation(),
          onclick: (e) => { e.stopPropagation(); karte.classList.add('rueckseite'); }
        })
      )
    ),
    el('div', { class: 'szhinten' },
      el('div', { class: 'hintenhinweis' }, 'RÜCKSEITE'),
      notizFeld,
      el('div', { style: 'display:flex;justify-content:flex-end' },
        el('button', {
          class: 'rundknopf zart', style: 'width:28px;height:28px', html: ik('drehen'),
          onpointerdown: (e) => e.stopPropagation(),
          onclick: (e) => { e.stopPropagation(); karte.classList.remove('rueckseite'); }
        }))
    )
  );
  karte.append(dreher);

  szenenGesten(karte, s, p);
  return karte;
}

/* Halten hebt die Karte an, dann ziehen; kurzes Tippen öffnet. */
function szenenGesten(karte, s, p) {
  let start = null, geist = null, gezogen = false, hebeTimer = null;
  const sperreScrollen = (e) => { if (gezogen) e.preventDefault(); };
  karte.addEventListener('touchmove', sperreScrollen, { passive: false });

  const hebeAn = (e) => {
    gezogen = true;
    karte._zieht = true;
    karte.classList.add('zieht');
    try { karte.setPointerCapture(e.pointerId); } catch (x) {}
    geist = karte.cloneNode(true);
    geist.classList.add('szgeist');
    geist.classList.remove('zieht');
    geist.style.left = (e.clientX - 95) + 'px';
    geist.style.top = (e.clientY - 30) + 'px';
    document.body.append(geist);
  };

  karte.addEventListener('pointerdown', (e) => {
    if (karte.classList.contains('rueckseite')) return;
    if (e.target.closest('button') || e.target.closest('textarea')) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    if (e.pointerType === 'mouse') return;
    hebeTimer = setTimeout(() => { hebeTimer = null; if (start) hebeAn(e); }, 300);
  });
  karte.addEventListener('pointermove', (e) => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!gezogen) {
      if (Math.hypot(dx, dy) > 10) {
        if (e.pointerType === 'mouse') { hebeAn(e); }
        else { clearTimeout(hebeTimer); hebeTimer = null; start = null; }
      }
      return;
    }
    if (geist) {
      geist.style.left = (e.clientX - 95) + 'px';
      geist.style.top = (e.clientY - 30) + 'px';
    }
  });
  karte.addEventListener('pointerup', async (e) => {
    clearTimeout(hebeTimer); hebeTimer = null;
    if (!start && !gezogen) return;
    const warGezogen = gezogen;
    start = null; gezogen = false;
    karte.classList.remove('zieht');
    setTimeout(() => { karte._zieht = false; }, 0);
    if (geist) { geist.remove(); geist = null; }
    if (!warGezogen) {
      if (!e.target.closest('button') && !e.target.closest('textarea')) oeffneSchreibraum(s.id);
      return;
    }
    /* Ablegen: wohin? */
    const unter = document.elementsFromPoint(e.clientX, e.clientY);
    const zielKarte = unter.find((x) => x.classList && x.classList.contains('szkarte') && x !== karte);
    const zielWand = unter.find((x) => x.classList && x.classList.contains('pinnwand'));
    if (!zielWand) return;
    const zielKapitelId = zielWand.dataset.kapitel;
    const geschwister = kinder(zielKapitelId, 'szene').filter((x) => x.id !== s.id);
    let einfuegen = geschwister.length;
    if (zielKarte) {
      const zielSzene = D.docs.get(zielKarte.dataset.id);
      const zi = geschwister.findIndex((x) => x.id === zielSzene.id);
      const r = zielKarte.getBoundingClientRect();
      einfuegen = e.clientX < r.left + r.width / 2 ? zi : zi + 1;
    }
    s.parent = zielKapitelId;
    geschwister.splice(einfuegen, 0, s);
    geschwister.forEach((x, i) => { x.ord = i; speichereStill(x); });
    zeichne();
  });
  karte.addEventListener('pointercancel', () => {
    clearTimeout(hebeTimer); hebeTimer = null;
    start = null; gezogen = false;
    karte.classList.remove('zieht');
    if (geist) { geist.remove(); geist = null; }
  });

  langdruck(karte, async () => {
    if (karte._zieht || gezogen) return;
    const wahl = await menue([
      { text: 'Umbenennen', icon: 'stift', wert: 'name' },
      { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' },
      { text: 'Duplizieren', icon: 'wandel', wert: 'doppel' },
      { text: 'In anderes Kapitel …', icon: 'projekte', wert: 'zieh' },
      { text: 'Teilen', icon: 'teilen', wert: 'teilen' },
      { text: 'Szene löschen', icon: 'muell', wert: 'weg', rot: true }
    ], s.titel || 'Szene');
    if (wahl === 'name') {
      const neu = await eingabe({ titel: 'Die Szene heißt jetzt …', wert: s.titel });
      if (neu !== null) { s.titel = neu || s.titel; speichereStill(s); zeichne(); }
    } else if (wahl === 'farbe') {
      const i = (SZENENFARBEN.indexOf(s.farbe || '') + 1) % SZENENFARBEN.length;
      s.farbe = SZENENFARBEN[i]; speichereStill(s); zeichne();
    } else if (wahl === 'doppel') {
      neuDoc('szene', { parent: s.parent, projekt: s.projekt, ord: (s.ord || 0) + .5, titel: (s.titel || 'Szene') + ' (Fassung 2)', text: s.text, status: s.status, farbe: s.farbe, notiz: s.notiz });
      kinder(s.parent, 'szene').forEach((x, i) => { x.ord = i; speichereStill(x); });
      zeichne();
    } else if (wahl === 'zieh') {
      const wo = await waehleProjektKapitel();
      if (!wo) return;
      s.parent = wo.kapitel.id;
      s.projekt = wo.projekt.id;
      s.ord = kinder(wo.kapitel.id, 'szene').length;
      speichereStill(s);
      toast('Umgezogen nach „' + wo.projekt.titel + '".');
      zeichne();
    } else if (wahl === 'teilen') {
      teileText((s.titel ? s.titel + '\n\n' : '') + (s.text || ''));
    } else if (wahl === 'weg') {
      await loesche(s.id); zeichne();
    }
  });
}

/* ----- Leseansicht ----- */
function zeigeLeseansicht(p) {
  const kapitel = kinder(p.id, 'kapitel');
  let gesamt = '';
  const innen = el('div', { class: 'innen' });
  innen.append(el('h1', {}, p.titel));
  let w = 0;
  for (const k of kapitel) {
    const szenen = kinder(k.id, 'szene').filter((s) => (s.text || '').trim());
    if (!szenen.length) continue;
    innen.append(el('h2', {}, k.titel));
    gesamt += '\n\n' + k.titel.toUpperCase() + '\n\n';
    const texte = szenen.map((s) => s.text.trim());
    gesamt += texte.join('\n\n*\n\n');
    innen.append(el('div', { class: 'lesetext' }, texte.join('\n\n*\n\n')));
    szenen.forEach((s) => { w += worte(s.text); });
  }
  const h1 = innen.querySelector('h1');
  h1.after(el('div', { class: 'lmeta' }, w.toLocaleString('de-DE') + ' Wörter am Stück'));
  gesamt = p.titel.toUpperCase() + '\n' + gesamt;

  const bogen = el('div', { class: 'lesebogen' }, innen);
  const leiste = el('div', { class: 'schwebeleiste' },
    el('button', { class: 'rundknopf zart', html: ik('kreuz'), onclick: () => { bogen.remove(); leiste.remove(); } }),
    el('button', {
      class: 'knopf', onclick: async () => {
        try { await navigator.clipboard.writeText(gesamt); toast('Alles in der Zwischenablage.'); }
        catch (e) { toast('Die Zwischenablage wollte nicht.'); }
      }
    }, 'Kopieren'),
    el('button', { class: 'knopf', onclick: () => teileDatei(p.titel.replace(/[^\wäöüß -]/gi, '') + '.txt', gesamt) }, 'Als Datei')
  );
  document.body.append(bogen, leiste);
}
/* ================================================================
   VANI — Schreibraum: Vollbild, Fokus, Kerze, Feinwerk
   ================================================================ */

let _sr = null;

function oeffneSchreibraum(docId) {
  if (_sr) schliesseSchreibraum();
  const doc = D.docs.get(docId);
  if (!doc) return;

  const startWorte = worte(doc.text);

  const titel = el('input', {
    class: 'sr-titel', type: 'text', value: doc.titel || '',
    placeholder: doc.typ === 'szene' ? 'Szene ohne Namen' : 'Ohne Titel'
  });
  titel.addEventListener('input', entprellt(() => { doc.titel = titel.value; speichere(doc); }, 400, true));

  const worteAnzeige = el('span', { class: 'sr-worte' }, String(startWorte));
  const kerzenhalter = el('div', { class: 'kerzenhalter' });

  const ta = el('textarea', { class: 'sr-text text', placeholder: 'Schreib einfach. Der Rest der Welt wartet draußen.' });
  ta.value = doc.text || '';
  const spiegel = el('div', { class: 'sr-spiegel text', 'aria-hidden': 'true' });
  const wrap = el('div', { style: 'position:relative' }, spiegel, ta);
  const spalte = el('div', { class: 'sr-spalte ' + (D.einst.breite || 'mittel') }, wrap);
  const mitte = el('div', { class: 'sr-mitte' }, spalte);

  const klangKnopf = el('button', { class: 'rundknopf zart' + (klangAktiv() ? ' klang-an' : ''), html: ik('klang'), onclick: () => { oeffneMischpult(); } });

  const kopf = el('div', { class: 'sr-kopf' },
    el('button', { class: 'knopf', onclick: () => schliesseSchreibraum(true) }, el('span', { html: ik('haken'), style: 'display:flex' }), 'Fertig'),
    titel,
    kerzenhalter,
    worteAnzeige,
    klangKnopf,
    el('button', { class: 'rundknopf zart', html: ik('feinheiten'), onclick: () => srEinstellungen() })
  );

  /* Sonderzeichen, immer griffbereit über der Tastatur */
  const zeichen = ['–', '„', '"', '…', '‚', '’', '»', '«'];
  const leiste = el('div', { class: 'zeichenleiste' },
    zeichen.map((z) => el('button', {
      onpointerdown: (e) => e.preventDefault(),
      onclick: () => { fuegeEin(z); }
    }, z === '’' ? '’' : z))
  );

  const raum = el('div', { class: 'schreibraum' }, kopf, mitte, leiste);
  document.body.append(raum);
  _sr = { raum, doc, ta, spiegel, mitte, kopf, spalte, startWorte, sprint: null, klangKnopf };

  wendeSchriftAn();
  wendeTastaturArtAn();
  autogrow(ta);

  function fuegeEin(z) {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + z + ta.value.slice(e);
    ta.setSelectionRange(s + z.length, s + z.length);
    ta.dispatchEvent(new Event('input'));
    ta.focus();
  }

  const sichern = entprellt(() => {
    doc.text = ta.value;
    speichere(doc);
    zaehleWorte(doc.id, doc.text);
  }, 500, true);
  _sr.sichern = sichern;

  /* Deutsche Feder: -- wird –, gerade Anführungszeichen werden „so" */
  function ersetzeKlug() {
    if (!D.einst.ersetzungen) return;
    const erg = klugeZeichen(ta.value, ta.selectionStart);
    if (erg) {
      ta.value = erg.text;
      ta.setSelectionRange(erg.caret, erg.caret);
    }
  }

  let zielKlangGespielt = false;
  ta.addEventListener('input', () => {
    ersetzeKlug();
    sichern();
    const n = worte(ta.value);
    const dazu = n - startWorte;
    worteAnzeige.textContent = String(n) + (dazu > 0 ? ' · +' + dazu : '');
    kopf.classList.add('versunken');
    aktualisiereSpiegel();
    if (D.einst.typewriter) zentriereZeile();
    if (D.einst.tagesziel > 0 && !zielKlangGespielt) {
      const heute = (D.stats.tage[tagKey()] || 0);
      if (heute >= D.einst.tagesziel) { zielKlangGespielt = true; glocke(); toast('Tagesziel. Der Rest ist Geschenk.'); }
    }
  });
  ta.addEventListener('keydown', (e) => {
    if (D.einst.tastenklang && e.key.length === 1) tippKlick();
    if (e.key === 'Escape') schliesseSchreibraum(true);
  });
  document.addEventListener('selectionchange', spiegelBeiAuswahl);
  raum.addEventListener('pointerdown', (e) => { if (!e.target.closest('.zeichenleiste')) kopf.classList.remove('versunken'); });

  aktualisiereSpiegel();
  setTimeout(() => {
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    if (D.einst.typewriter) zentriereZeile();
  }, 80);

  function spiegelBeiAuswahl() {
    if (!_sr || document.activeElement !== ta) return;
    aktualisiereSpiegel();
    if (D.einst.typewriter) zentriereZeile();
  }
  _sr.spiegelBeiAuswahl = spiegelBeiAuswahl;
}

function schliesseSchreibraum(zurueck) {
  if (!_sr) return;
  _sr.sichern && _sr.sichern.sofort();
  document.removeEventListener('selectionchange', _sr.spiegelBeiAuswahl);
  if (_sr.sprint) beendeSprint(true);
  const geschrieben = worte(_sr.ta.value) - _sr.startWorte;
  _sr.raum.remove();
  _sr = null;
  if (zurueck && geschrieben > 30) toast('+' + geschrieben + ' Wörter. Gut gemacht.');
  zeichne();
}

function wendeSchriftAn() {
  if (!_sr) return;
  const s = D.einst;
  for (const zielEl of [_sr.ta, _sr.spiegel]) {
    zielEl.classList.remove('klar', 'mono');
    if (s.schrift === 'klar') zielEl.classList.add('klar');
    if (s.schrift === 'mono') zielEl.classList.add('mono');
  }
  _sr.spalte.className = 'sr-spalte ' + (s.breite || 'mittel');
  _sr.ta.style.fontSize = s.groesse + 'px';
  _sr.spiegel.style.fontSize = s.groesse + 'px';
  _sr.raum.classList.toggle('sr-fokus', !!s.fokus);
  aktualisiereSpiegel();
}
function wendeTastaturArtAn() {
  if (!_sr) return;
  const an = D.einst.autokorrektur;
  _sr.ta.setAttribute('autocorrect', an ? 'on' : 'off');
  _sr.ta.setAttribute('autocapitalize', an ? 'sentences' : 'off');
  _sr.ta.setAttribute('spellcheck', an ? 'true' : 'false');
}

function aktualisiereSpiegel() {
  if (!_sr) return;
  const { ta, spiegel, raum } = _sr;
  if (!D.einst.fokus) { if (raum.classList.contains('sr-fokus')) raum.classList.remove('sr-fokus'); spiegel.innerHTML = ''; return; }
  raum.classList.add('sr-fokus');
  const t = ta.value;
  const caret = ta.selectionStart || 0;
  let anfang = t.lastIndexOf('\n', Math.max(0, caret - 1)) + 1;
  let ende = t.indexOf('\n', caret);
  if (ende === -1) ende = t.length;

  );
  const zu = zeigeDeck(kasten);
}

RENDER.brett = function (haupt, bid) {

  flaeche.append(svg);
  const raum = el('div', { class: 'brett-raum' }, flaeche);

  const kopfleiste = el('div', { class: 'schwebeleiste', style: 'left:16px;transform:none' },

  );

  const verbindenKnopf = el('button', {
    class: 'rundknopf', html: ik('verbinden'), title: 'Verbinden', onclick: () => {
      verbinden = !verbinden;

  });
  const zoomAnzeige = el('button', {
    class: 'knopf zart', style: 'min-width:52px;justify-content:center', onclick: () => { sicht.z = 1; sicht.x = 60; sicht.y = 60; wende(); }
  }, '100%');
  const werkzeuge = el('div', { class: 'brett-werkzeuge' },
    el('button', {
      class: 'rundknopf', html: ik('plus'), title: 'Neue Blase', onclick: () => {
        const mitte = weltPunkt(raum.clientWidth / 2, raum.clientHeight / 2);

    verbindenKnopf,
    el('button', { class: 'rundknopf', html: ik('suche'), style: 'transform:scaleX(-1)', title: 'Kleiner', onclick: () => { zoomeUm(1 / 1.25, raum.clientWidth / 2, raum.clientHeight / 2); } }),
    zoomAnzeige,
    el('button', { class: 'rundknopf', html: ik('suche'), title: 'Größer', onclick: () => { zoomeUm(1.25, raum.clientWidth / 2, raum.clientHeight / 2); } })
  );

  haupt.append(raum, kopfleiste, werkzeuge);

  function wende() {
    flaeche.style.transform = 'translate(' + sicht.x + 'px,' + sicht.y + 'px) scale(' + sicht.z + ')';
    zoomAnzeige.textContent = Math.round(sicht.z * 100) + '%';
  }
  function weltPunkt(cx, cy) { return { x: (cx - sicht.x) / sicht.z, y: (cy - sicht.y) / sicht.z }; }
  function zoomeUm(f, cx, cy) {
    const alt = sicht.z;
    sicht.z = Math.max(.3, Math.min(2.2, sicht.z * f));
    const echt = sicht.z / alt;
    sicht.x = cx - (cx - sicht.x) * echt;
    sicht.y = cy - (cy - sicht.y) * echt;

    speichereStill(brett);

  /* Kanten zeichnen */
  function mittelpunkt(b) {
    const elem = flaeche.querySelector('[data-id="' + b.id + '"]');
    const w = elem ? elem.offsetWidth : 220;
    const h = elem ? elem.offsetHeight : 60;
    return { x: b.pos.x + w / 2, y: b.pos.y + h / 2 };
  }
  function baueKanten() {
    svg.innerHTML = '';
    for (const k of kinder(brett.id, 'kante')) {
      const von = D.docs.get(k.von), zu = D.docs.get(k.zu);
      if (!von || !zu) continue;
      const a = mittelpunkt(von), b = mittelpunkt(zu);
      const linie = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      linie.setAttribute('x1', a.x + 20000); linie.setAttribute('y1', a.y + 20000);
      linie.setAttribute('x2', b.x + 20000); linie.setAttribute('y2', b.y + 20000);
      svg.append(linie);
      const griff = linie.cloneNode();
      griff.setAttribute('class', 'klickbar');
      griff.addEventListener('click', async () => {

  /* Blasen bauen */
  function baueBlasen() {
    $$('.denkblase', flaeche).forEach((x) => x.remove());
    for (const b of kinder(brett.id, 'blase')) flaeche.append(baueBlase(b));
    baueKanten();
  }
  function baueBlase(b) {
    const blase = el('div', { class: 'denkblase ' + (b.farbe || ''), 'data-id': b.id });
    blase.style.left = b.pos.x + 'px';
    blase.style.top = b.pos.y + 'px';
    const ta = el('textarea', { rows: 1, placeholder: '…', readonly: 'readonly' });
    ta.value = b.text || '';
    autogrow(ta);
    ta.addEventListener('input', entprellt(() => { b.text = ta.value; speichereStill(b); }, 400));
    ta.addEventListener('blur', () => ta.setAttribute('readonly', 'readonly'));

        const bestehend = kinder(brett.id, 'kante').find((k) =>
          (k.von === verbindeVon.id && k.zu === b.id) || (k.von === b.id && k.zu === verbindeVon.id));
        if (bestehend) { loesche(bestehend.id).then(baueKanten); }
        else { neuDoc('kante', { parent: brett.id, von: verbindeVon.id, zu: b.id, label: '' }); baueKanten(); }
        $$('.denkblase.gewaehlt', flaeche).forEach((x) => x.classList.remove('gewaehlt'));
        verbindeVon = null;
        return;
      }
      ta.removeAttribute('readonly');
      ta.focus();
    });
    blase.addEventListener('pointercancel', () => { zieht = null; });

    langdruck(blase, async () => {
      const wahl = await menue([
        { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' },
        { text: 'Im Schreibraum öffnen', icon: 'stift', wert: 'sr' },
        { text: 'Blase zerplatzen', icon: 'muell', wert: 'weg', rot: true }
      ]);
      if (wahl === 'farbe') {
        b.farbe = BLASENFARBEN[(BLASENFARBEN.indexOf(b.farbe || '') + 1) % BLASENFARBEN.length];
        speichereStill(b);
        blase.className = 'denkblase ' + (b.farbe || '');
      } else if (wahl === 'sr') {
        speichereStill(brett);
        oeffneSchreibraum(b.id);
      } else if (wahl === 'weg') {
        await loesche(b.id); baueBlasen();
      }
    });
    return blase;
  }

  /* Schieben & Kneifen & Doppeltipp */
  const zeiger = new Map();
  let pan = null, kneifen = null, letzterTipp = { t: 0, x: 0, y: 0 };
  raum.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.denkblase') || e.target.closest('.schwebeleiste') || e.target.closest('.brett-werkzeuge')) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (zeiger.size === 1) {
      pan = { sx: e.clientX, sy: e.clientY, px: sicht.x, py: sicht.y };
    } else if (zeiger.size === 2) {
      pan = null;
      const [a, b] = [...zeiger.values()];
      kneifen = { abstand: Math.hypot(a.x - b.x, a.y - b.y), z: sicht.z };
    }
  });
  raum.addEventListener('pointermove', (e) => {
    if (!zeiger.has(e.pointerId)) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (kneifen && zeiger.size === 2) {
      const [a, b] = [...zeiger.values()];
      const abstand = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const f = (kneifen.z * abstand / kneifen.abstand) / sicht.z;
      zoomeUm(f, mx, my);
    } else if (pan) {
      sicht.x = pan.px + (e.clientX - pan.sx);
      sicht.y = pan.py + (e.clientY - pan.sy);
      wende();
    }
  });
  const zeigerWeg = (e) => {
    if (pan && zeiger.has(e.pointerId)) {
      const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
      if (Math.hypot(dx, dy) < 8 && !e.target.closest('.denkblase')) {
        const jetzt = Date.now();
        if (jetzt - letzterTipp.t < 340 && Math.hypot(e.clientX - letzterTipp.x, e.clientY - letzterTipp.y) < 40) {
          const p = weltPunkt(e.clientX, e.clientY);
          neuDoc('blase', { parent: brett.id, text: '', farbe: '', pos: { x: p.x - 110, y: p.y - 30 } });
          baueBlasen();
          letzterTipp = { t: 0, x: 0, y: 0 };
        } else {
          letzterTipp = { t: jetzt, x: e.clientX, y: e.clientY };
        }
      }
      speichereStill(brett);
    }
    zeiger.delete(e.pointerId);
    if (zeiger.size < 2) kneifen = null;
    if (zeiger.size === 0) pan = null;
  };
  raum.addEventListener('pointerup', zeigerWeg);
  raum.addEventListener('pointercancel', zeigerWeg);

  wende();
  baueBlasen();
  if (!kinder(brett.id, 'blase').length) {
    toast('Doppelt tippen — da, wo ein Gedanke hin soll.');
  }
};

    }

      }

  let griff = [];

    el('button', {
      class: 'knopf', onclick: () => {
        const alle = vomTyp('wort');
        if (alle.length < 3) { toast('Dafür braucht die Kiste mindestens drei Wörter.'); return; }

        bühne.innerHTML = '';

  /* Funken */

  const funkeText = el('div', { class: 'funke-text', style: 'min-height:54px' }, funke);

    el('div', { class: 'fussreihe' },
      el('button', { class: 'knopf', onclick: () => { funke = neuerFunke(false); funkeText.textContent = funke; } }, 'Neuer Funke'),
      el('button', { class: 'knopf', onclick: () => { funke = neuerFunke(true); funkeText.textContent = funke; } }, 'Wer · Wo · Aber'),
      el('button', {
        class: 'knopf voll', onclick: () => {
          const seite = blattAusText('', funke + '\n\n');
          oeffneSchreibraum(seite.id);
        }
      }, 'Dem nachgehen')
    )

/* ================================================================
   VANI — Suche: ein Feld, alles. Mit Filtern und Nachsicht
   bei Tippfehlern.
   ================================================================ */

const SUCH_GRUPPEN = [
  ['schnipsel', 'Schnipsel', 'schnipsel'],
  ['blatt', 'Blätter', 'blatt'],
  ['seite', 'Heftseiten', 'hefte'],
  ['szene', 'Szenen', 'projekte'],
  ['heft', 'Hefte', 'hefte'],
  ['projekt', 'Projekte', 'projekte'],
  ['blase', 'Blasen', 'cluster'],
  ['zettel', 'Zettel', 'pin'],
  ['wort', 'Wörter', 'woerter'],
  ['faden', 'Faden', 'faden'],
  ['mischung', 'Klang-Szenen', 'klang']
];

function oeffneSuche() {
  const feld = el('input', { type: 'text', placeholder: 'Wonach suchst du?' });
  const treffer = el('div', { class: 'suchtreffer' });
  let filter = null;

  const chips = el('div', { class: 'suchchips' });
  const baueChips = () => {
    chips.innerHTML = '';
    for (const [typ, name] of SUCH_GRUPPEN) {
      if (typ === 'faden' && !D.docs.size) continue;
      chips.append(el('button', {
        class: 'suchchip' + (filter === typ ? ' an' : ''),
        onclick: () => { filter = filter === typ ? null : typ; baueChips(); suche(); }
      }, name));
    }
  };
  baueChips();

  const kasten = el('div', { class: 'suchkasten' },
    el('div', { class: 'suchzeile' },
      el('span', { html: ik('suche'), style: 'display:flex;color:var(--blass)' }),
      feld,
      el('button', { class: 'rundknopf zart', style: 'width:32px;height:32px', html: ik('kreuz'), onclick: () => zu() })
    ),
    chips,
    treffer
  );
  const bogen = el('div', { class: 'suchbogen' }, kasten);
  bogen.addEventListener('pointerdown', (e) => { if (e.target === bogen) zu(); });
  document.body.append(bogen);
  const zu = () => bogen.remove();
  setTimeout(() => feld.focus(), 60);

  function eintrag(d, umfeldHtml) {
    return el('button', { onclick: () => { zu(); merkeSuche(feld.value); oeffneDoc(d); } },
      el('span', { class: 'ttitel' }, d.titel || ((d.text || '').split('\n')[0] || 'Ohne Titel').slice(0, 50)),
      umfeldHtml ? el('span', { class: 'tprobe', html: umfeldHtml }) : null
    );
  }

  function leererZustand() {
    treffer.innerHTML = '';
    const letzte = JSON.parse(localStorage.getItem('vani-suchen') || '[]');
    if (letzte.length) {
      treffer.append(el('div', { class: 'gruppe' }, 'ZULETZT GESUCHT'));
      for (const q of letzte.slice(0, 5)) {
        treffer.append(el('button', { onclick: () => { feld.value = q; suche(); } },
          el('span', { class: 'ttitel', style: 'font-weight:400' }, q)));
      }
    }
    const frisch = [...D.docs.values()]
      .filter((d) => ['blatt', 'szene', 'seite', 'schnipsel'].includes(d.typ) && (d.text || '').trim())
      .sort((a, b) => b.geaendert - a.geaendert).slice(0, 5);
    if (frisch.length) {
      treffer.append(el('div', { class: 'gruppe' }, 'ZULETZT ANGEFASST'));
      for (const d of frisch) treffer.append(eintrag(d, esc((d.text || '').replace(/\s+/g, ' ').slice(0, 70))));
    }
    if (!letzte.length && !frisch.length) {
      treffer.append(el('div', { style: 'padding:22px;text-align:center;color:var(--blass);font-style:italic;font-family:ui-serif,Georgia,serif' },
        'Alles, was du je geschrieben hast, liegt hier drin.'));
    }
  }

  function merkeSuche(q) {
    if (!q || q.length < 2) return;
    const letzte = JSON.parse(localStorage.getItem('vani-suchen') || '[]').filter((x) => x !== q);
    letzte.unshift(q);
    localStorage.setItem('vani-suchen', JSON.stringify(letzte.slice(0, 8)));
  }

  function suche() {
    const roh = feld.value.trim();
    if (roh.length < 2) { leererZustand(); return; }
    treffer.innerHTML = '';
    const q = normalisiere(roh);
    let gesamt = 0;
    for (const [typ, name] of SUCH_GRUPPEN) {
      if (filter && typ !== filter) continue;
      const funde = [];
      for (const d of D.docs.values()) {
        if (d.typ !== typ) continue;
        const titelN = normalisiere(d.titel || '');
        const textN = normalisiere(d.text || '');
        let stelle = titelN.indexOf(q);
        let woText = -1;
        if (stelle === -1) { woText = textN.indexOf(q); }
        let unscharf = false;
        if (stelle === -1 && woText === -1 && q.length >= 5) {
          if (fastGleich(titelN, q) || fastGleich(textN, q)) unscharf = true;
          else continue;
        } else if (stelle === -1 && woText === -1) continue;
        funde.push({ d, woText, unscharf });
      }
      funde.sort((a, b) => b.d.geaendert - a.d.geaendert);
      if (!funde.length) continue;
      treffer.append(el('div', { class: 'gruppe' }, name.toUpperCase()));
      for (const { d, woText, unscharf } of funde.slice(0, filter ? 40 : 6)) {
        gesamt++;
        let umfeld = '';
        const text = d.text || '';
        if (woText >= 0) {
          const von = Math.max(0, woText - 28);
          const stueck = text.slice(von, woText + q.length + 50).replace(/\n/g, ' ');
          const rel = woText - von;
          umfeld = (von > 0 ? '… ' : '') + esc(stueck.slice(0, rel)) + '<mark>' + esc(stueck.slice(rel, rel + q.length)) + '</mark>' + esc(stueck.slice(rel + q.length)) + ' …';
        } else {
          umfeld = esc(text.replace(/\s+/g, ' ').slice(0, 78)) + (unscharf ? ' <i style="opacity:.6">(ähnlich)</i>' : '');
        }
        treffer.append(eintrag(d, umfeld.trim() || null));
      }
    }
    if (!gesamt) {
      treffer.append(el('div', { style: 'padding:22px;text-align:center;color:var(--blass);font-style:italic;font-family:ui-serif,Georgia,serif' },
        'Nichts. Vielleicht muss es erst noch geschrieben werden.'));
    }
  }
  feld.addEventListener('input', entprellt(suche, 140));
  feld.addEventListener('keydown', (e) => { if (e.key === 'Escape') zu(); });
  leererZustand();
}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); oeffneSuche(); }
});

    korbKarte));

  /* Sicherung */
  const wann = D.stats.letzteSicherung;

  /* Kleingedrucktes */

  ));
