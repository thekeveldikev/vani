<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="cache-control" content="no-store">
<title>VANI ist umgezogen</title><style>
:root{color-scheme:light;background:#f5efe3;color:#29251f;font:17px/1.55 ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.karte{width:min(620px,100%);padding:clamp(26px,6vw,54px);border:1px solid #d8cab4;border-radius:28px;background:#fffdf7;box-shadow:0 24px 70px #513d2222}h1{font:700 clamp(34px,8vw,58px)/1.05 Georgia,serif;margin:0 0 20px}p{margin:12px 0}.adresse{display:block;overflow-wrap:anywhere;padding:12px 14px;border-radius:12px;background:#eee5d6}.aktionen{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border:1px solid #29251f;border-radius:999px;color:inherit;text-decoration:none;font-weight:700}.haupt{background:#29251f;color:#fff}small{display:block;margin-top:22px;color:#6f6557}
</style></head><body><main class="karte"><h1>VANI hat jetzt ein einziges Zuhause.</h1>
<p>Diese frühere zweite Adresse ist nur noch der unsichtbare, verschlüsselte Sync-Tresor.</p>
<strong class="adresse">https://thekeveldikev.github.io/vani/</strong>
<div class="aktionen"><a class="haupt" href="https://thekeveldikev.github.io/vani/">VANI öffnen</a><a id="retten" href="./rettung.html?rettung=1&amp;kein-sw=1">Alten Bestand retten</a></div>
<small id="hinweis">Einen Moment — ich sehe nach, ob hier noch etwas liegt.</small></main>
<script>
/* Früher leitete diese Seite nach fünf Sekunden weiter — zu schnell, um „Alten
   Bestand retten" überhaupt anzutippen, und auf einem Schul-iPad ohne
   Dateiauswahl war der Rettungsraum der einzige Weg zum alten Bestand.
   Jetzt zählt die Seite erst nach: Liegt hier noch etwas, bleibt sie stehen
   und hebt den Rettungsweg hervor. Nur ein leerer Bestand leitet weiter. */
(async()=>{
  try{await Promise.all([('serviceWorker'in navigator?navigator.serviceWorker.getRegistrations().then(r=>Promise.all(r.map(x=>x.unregister()))):0),('caches'in window?caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))):0)]);}catch(e){}
  const zaehle=(name)=>new Promise((res)=>{try{
    const r=indexedDB.open(name);let neuAngelegt=false;
    r.onupgradeneeded=()=>{neuAngelegt=true;};
    r.onsuccess=()=>{const db=r.result;try{
      if(neuAngelegt||!db.objectStoreNames.contains('docs')){db.close();if(neuAngelegt)indexedDB.deleteDatabase(name);return res(0);}
      const z=db.transaction('docs','readonly').objectStore('docs').count();
      z.onsuccess=()=>{db.close();res(z.result||0);};z.onerror=()=>{db.close();res(0);};
    }catch(e){db.close();res(0);}};
    r.onerror=()=>res(0);r.onblocked=()=>res(0);
  }catch(e){res(0);}});
  let namen=['vani'];
  try{if(indexedDB.databases){const alle=await indexedDB.databases();namen=[...new Set([...namen,...alle.map(d=>d.name).filter(n=>n&&/^vani(-profil-|$)/.test(n))])];}}catch(e){}
  let summe=0;for(const n of namen)summe+=await zaehle(n);
  const h=document.getElementById('hinweis'),r=document.getElementById('retten');
  if(summe>0){
    h.innerHTML='<b>Hier liegen noch '+summe+' Dinge aus deinem alten VANI.</b> Sie wandern nicht von allein mit. Wähle „Alten Bestand retten“ — dort zeigt dir VANI zwei Wege ins neue VANI, beide ohne Datei: Kopplungscode oder Zwischenablage. Erst wenn drüben alles da ist, darf dieses Symbol weg.';
    r.className='haupt';r.textContent='Alten Bestand retten ('+summe+')';
  }else{
    h.textContent='Hier liegt nichts mehr. Du wirst gleich zur einen VANI-Adresse weitergeleitet.';
    setTimeout(()=>location.replace("https://thekeveldikev.github.io/vani/"),4000);
  }
})();
</script>
</body></html>
