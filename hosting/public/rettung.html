function alleTexteAlsText() {
  const teile = [];
  for (const p of vomTyp('projekt')) {
    teile.push('══ PROJEKT: ' + p.titel + ' ══');
    for (const k of kinder(p.id, 'kapitel')) {
      teile.push('\n— ' + k.titel + ' —');
      for (const s of kinder(k.id, 'szene')) {
        if (s.titel) teile.push('· ' + s.titel);
        if ((s.text || '').trim()) teile.push(s.text.trim());
      }
    }
    teile.push('');
  }
  for (const h of vomTyp('heft')) {
    teile.push('══ HEFT: ' + h.titel + ' ══');
    for (const s of kinder(h.id, 'seite')) {
      if (s.titel) teile.push('· ' + s.titel);
      if ((s.text || '').trim()) teile.push(s.text.trim());
      for (const z of kinder(s.id, 'zettel')) if ((z.text || '').trim()) teile.push('[Zettel] ' + z.text.trim());
    }
    teile.push('');
  }
  const schnipsel = vomTyp('schnipsel').sort((a, b) => a.angelegt - b.angelegt);
  if (schnipsel.length) {
    teile.push('══ SCHNIPSEL ══');
    for (const s of schnipsel) if ((s.text || '').trim()) teile.push(fmtDatum(s.angelegt) + ': ' + s.text.trim());
  }
  return teile.join('\n');
}

/* Datei hinausgeben: Teilen-Menü → Download → Zwischenablage */
async function teileDatei(name, inhalt, typ = 'text/plain') {
  const blob = new Blob([inhalt], { type: typ + ';charset=utf-8' });
  const datei = new File([blob], name, { type: typ });
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei] }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name, style: 'display:none' });
    document.body.append(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
    toast('Gespeichert — schau in „Dateien" nach.');
    return true;
  } catch (e) {}
  try {
    await navigator.clipboard.writeText(inhalt);
    toast('Ging nicht als Datei — liegt jetzt in der Zwischenablage.');
    return true;
  } catch (e) {
    toast('Das hat leider nicht geklappt.');
    return false;
  }
}

/* ----- Faden entschluesseln und einlesen -----
   Die verschlüsselte Fadendatei liegt bewusst nicht mehr öffentlich im Netz.
   Sie kommt aus der Desktop-App, die sie mitbringt, oder wird einmal von Hand
   gewählt. Auf schon gekoppelten Geräten reist der Faden über den Tresor. */
async function fadenPaketHolen() {
  try {
    const antwort = await fetch('faden.enc', { cache: 'no-store' });
    if (antwort.ok) return await antwort.json();
  } catch (e) {}
  const wahl = await menue([
    { text: 'Fadendatei von Hand wählen', icon: 'runter', wert: 'datei' },
    { text: 'Doch nicht', icon: 'kreuz', wert: null }
  ], 'Der Faden liegt auf diesem Gerät nicht bereit');
  if (wahl !== 'datei') {
    toast('Auf gekoppelten Geräten kommt der Faden über deinen privaten Bereich mit.', 5200);
    return null;
  }
  return new Promise((res) => {
    const inp = el('input', { type: 'file', accept: '.enc,.json,application/json', style: 'display:none' });
    document.body.append(inp);
    let fertig = false;
    inp.addEventListener('change', async () => {
      fertig = true;
      const datei = inp.files && inp.files[0];
      inp.remove();
      if (!datei) return res(null);
      if (datei.size > 200 * 1024 * 1024) { toast('Diese Datei ist zu groß für den Faden.'); return res(null); }
      try { res(JSON.parse(await datei.text())); }
      catch (e) { toast('Das ist keine Fadendatei.'); res(null); }
    });
    inp.addEventListener('cancel', () => { if (!fertig) { inp.remove(); res(null); } });
    inp.click();
  });
}

async function holeFaden() {
  const passwort = await eingabe({ titel: 'Das Passwort für den Faden', platzhalter: 'wort-wort-zahl-wort-wort', ok: 'Holen' });
  if (!passwort) return;
  toast('Hole den Faden …', 4000);
  let paket = await fadenPaketHolen();
  if (!paket) return;
  let klartext;
  try {
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(passwort), 'PBKDF2', false, ['deriveKey']);
    const schluessel = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(paket.salz), iterations: 600000, hash: 'SHA-256' },
      basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const roh = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(paket.iv) }, schluessel, b64(paket.daten));
    klartext = JSON.parse(new TextDecoder().decode(roh));
  } catch (e) { toast('Das Passwort passt nicht. Nochmal?'); return; }
  if (!pruefeSicherung(klartext)) { toast('Der Faden ist beschaedigt.'); return; }
  let dazu = 0;
  for (const roh of klartext.docs) {
    const d = sauberesDokument(roh);
    if (!d) continue;
    if (D.docs.has(d.id)) continue;
    D.docs.set(d.id, d);
    D.stats.letzte[d.id] = worte(d.text || '');
    await dbPut('docs', d);
    dazu++;
  }
  speichereStats();
  raumConfig();
  const f = D.einst.raeume.find((x) => x.id === 'faden');
  if (f) f.an = true;
  speichereEinst();
  baueLeiste();
  toast(dazu ? 'Da ist er. ' + dazu + ' Dinge sind angekommen.' : 'War schon alles da.', 4000);
  setTimeout(() => { location.hash = '#/faden'; }, 900);
}

/* ================================================================
   VANI — Ankommen: alles hereinholen, auch ohne Datei.

   Manche Geräte (Schul-iPads mit Verwaltungsprofil) lassen keine Dateiauswahl
   zu. Dann bleibt trotzdem jeder Weg offen: über die Zwischenablage oder den
   Kopplungscode. Dieses Modul erkennt, was jemand einfügt — eine Sicherung,
   einen Kopplungscode, einen WhatsApp-Verlauf, den Text-Export eines älteren
   VANI, einen Text mit Überschriften oder einfach Text — und legt es dort ab,
   wo es hingehört. Die Erkenner sind pur und werden einzeln getestet.
   ================================================================ */

/* ----- Erkennen ----- */

/* WhatsApp-Verlauf: „12.03.23, 14:05 - Name: Text" (Android) oder
   „[12.03.23, 14:05:33] Name: Text" (iPhone). Zeilen ohne Datum gehören zur
   Nachricht davor. Systemzeilen ohne „Name:" zählen als Sonstiges. */
function whatsappZerlegen(roh) {
  const kopf = /^‎?\[?(\d{1,2})\.(\d{1,2})\.(\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\]?\s*(?:-\s*)?([^:\n]{1,80}?):\s?(.*)$/;
  const nachrichten = [];
  let sonst = 0;
  for (const zeile of String(roh || '').split(/\r?\n/)) {
    const m = zeile.match(kopf);
    if (m) {
      let jahr = Number(m[3]);
      if (jahr < 100) jahr += 2000;
      const wann = new Date(jahr, Number(m[2]) - 1, Number(m[1]), Number(m[4]), Number(m[5]), Number(m[6] || 0)).getTime();
      nachrichten.push({ wann: Number.isFinite(wann) ? wann : 0, wer: m[7].trim(), text: m[8] });
    } else if (nachrichten.length && zeile.trim()) {
      nachrichten[nachrichten.length - 1].text += '\n' + zeile;
    } else if (zeile.trim()) sonst++;
  }
  for (const n of nachrichten) n.text = n.text.trim();
  return { nachrichten: nachrichten.filter((n) => n.text), sonst };
}

/* Text mit Überschriften: „# Titel", „## Titel" oder unterstrichen mit ===/---.
   Was vor der ersten Überschrift steht, ist der Vorspann. */
function markdownZerlegen(roh) {
  const zeilen = String(roh || '').split(/\r?\n/);
  const teile = [];
  const vorspann = [];
  let akt = null;
  for (let i = 0; i < zeilen.length; i++) {
    const z = zeilen[i];
    const raute = z.match(/^(#{1,3})\s+(.+?)\s*#*\s*$/);
    const naechste = zeilen[i + 1] || '';
    const unterstrichen = !raute && z.trim() && z.trim().length <= 120 && /^(={3,}|-{3,})\s*$/.test(naechste)
      ? (naechste.trim()[0] === '=' ? 1 : 2) : 0;
    if (raute || unterstrichen) {
      akt = { ebene: raute ? raute[1].length : unterstrichen, titel: (raute ? raute[2] : z).trim(), zeilen: [] };
      teile.push(akt);
      if (unterstrichen) i++;
    } else if (akt) akt.zeilen.push(z);
    else vorspann.push(z);
  }
  return {
    vorspann: vorspann.join('\n').trim(),
    teile: teile.map((t) => ({ ebene: t.ebene, titel: t.titel, text: t.zeilen.join('\n').trim() }))
  };
}

/* Der Text-Export eines VANI — „Nur Texte kopieren" gibt es seit der allerersten
   Fassung. Daraus lassen sich Projekte, Hefte und Schnipsel zurückbauen. Seiten
   und Szenen ohne Titel standen im Export ohne Trennung hintereinander; sie
   kommen deshalb als ein Stück zurück — mehr gab der Export nie her. */
function vaniTextZerlegen(roh) {
  const zeilen = String(roh || '').split(/\r?\n/);
  const aus = { projekte: [], hefte: [], schnipsel: [] };
  let block = null, kapitel = null, stueck = null, heft = null;
  const jetzt = new Date();
  const schnipselDatum = (t) => {
    /* „Mo, 20. Aug" — ohne Jahr. Liegt der Tag in der Zukunft, war es voriges Jahr. */
    const m = t.match(/^(?:So|Mo|Di|Mi|Do|Fr|Sa),\s*(\d{1,2})\.\s*([A-Za-zäöü]+)$/);
    if (!m) return 0;
    const monat = ['jan', 'feb', 'mär', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez'].indexOf(m[2].toLowerCase().slice(0, 3));
    if (monat < 0) return 0;
    let d = new Date(jetzt.getFullYear(), monat, Number(m[1]), 12);
    if (d.getTime() > jetzt.getTime() + 86400000) d = new Date(jetzt.getFullYear() - 1, monat, Number(m[1]), 12);
    return d.getTime();
  };
  const textZu = (ziel, z) => { if (!ziel) return; ziel.zeilen.push(z); };
  for (const z of zeilen) {
    let m;
    if ((m = z.match(/^══ PROJEKT: (.*?) ══$/))) { block = { art: 'projekt', titel: m[1].trim() || 'Projekt', kapitel: [] }; aus.projekte.push(block); kapitel = null; stueck = null; continue; }
    if ((m = z.match(/^══ HEFT: (.*?) ══$/))) { block = heft = { art: 'heft', titel: m[1].trim() || 'Heft', seiten: [] }; aus.hefte.push(heft); stueck = null; continue; }
    if (/^══ SCHNIPSEL ══$/.test(z)) { block = { art: 'schnipsel' }; stueck = null; continue; }
    if (!block) continue;
    if (block.art === 'projekt') {
      if ((m = z.match(/^— (.*) —$/))) { kapitel = { titel: m[1].trim() || 'Kapitel', szenen: [] }; block.kapitel.push(kapitel); stueck = null; continue; }
      if (!kapitel) { if (z.trim()) { kapitel = { titel: 'Kapitel 1', szenen: [] }; block.kapitel.push(kapitel); } else continue; }
      if ((m = z.match(/^· (.*)$/))) { stueck = { titel: m[1].trim(), zeilen: [] }; kapitel.szenen.push(stueck); continue; }
      if (!stueck) { if (!z.trim()) continue; stueck = { titel: '', zeilen: [] }; kapitel.szenen.push(stueck); }
      textZu(stueck, z);
    } else if (block.art === 'heft') {
      if ((m = z.match(/^· (.*)$/))) { stueck = { titel: m[1].trim(), zeilen: [], zettel: [] }; heft.seiten.push(stueck); continue; }
      if ((m = z.match(/^\[Zettel\] (.*)$/))) { if (!stueck) { stueck = { titel: '', zeilen: [], zettel: [] }; heft.seiten.push(stueck); } stueck.zettel.push(m[1]); continue; }
      if (!stueck) { if (!z.trim()) continue; stueck = { titel: '', zeilen: [], zettel: [] }; heft.seiten.push(stueck); }
      textZu(stueck, z);
    } else if (block.art === 'schnipsel') {
      if ((m = z.match(/^((?:So|Mo|Di|Mi|Do|Fr|Sa),\s*\d{1,2}\.\s*[A-Za-zäöü]+): (.*)$/))) {
        stueck = { wann: schnipselDatum(m[1]), zeilen: [m[2]] }; aus.schnipsel.push(stueck); continue;
      }
      if (stueck && z.trim()) stueck.zeilen.push(z);
    }
  }
  const fertig = (s) => ({ ...s, text: s.zeilen.join('\n').trim(), zeilen: undefined });
  for (const p of aus.projekte) for (const k of p.kapitel) k.szenen = k.szenen.map(fertig).filter((s) => s.text || s.titel);
  for (const h of aus.hefte) h.seiten = h.seiten.map(fertig).filter((s) => s.text || s.titel || (s.zettel && s.zettel.length));
  aus.schnipsel = aus.schnipsel.map(fertig).filter((s) => s.text);
  return aus;
}

/* Was ist das, was da eingefügt wurde? Reihenfolge: das Eindeutige zuerst. */
function erkenneEinfuegeInhalt(roh) {
  const text = String(roh || '').replace(/^﻿/, '');
  const t = text.trim();
  if (!t) return { art: 'leer' };
  if (/^VANI1-[A-Za-z0-9+/=._~-]{8,}$/.test(t)) return { art: 'kopplungscode', code: t };
  if (t[0] === '{') {
    let paket = null;
    try { paket = JSON.parse(t); } catch (e) { return { art: 'kaputt', grund: 'unvollstaendig' }; }
    if (typeof pruefeSicherung === 'function' && pruefeSicherung(paket)) return { art: 'sicherung', paket };
    return { art: 'kaputt', grund: 'fremd' };
  }
  if (/^══ (PROJEKT: .*|HEFT: .*|SCHNIPSEL) ══$/m.test(t)) {
    const v = vaniTextZerlegen(t);
    if (v.projekte.length || v.hefte.length || v.schnipsel.length) return { art: 'vanitext', ...v };
  }
  const wa = whatsappZerlegen(t);
  if (wa.nachrichten.length >= 3 && wa.nachrichten.length >= wa.sonst) return { art: 'whatsapp', nachrichten: wa.nachrichten, sonst: wa.sonst };
  const md = markdownZerlegen(t);
  if (md.teile.length >= 2) return { art: 'gegliedert', vorspann: md.vorspann, teile: md.teile };
  return { art: 'text', text: t };
}

/* Zusammenfassung einer Menge Dokumente — fürs „Das ist angekommen". */
const ANKUNFT_NAMEN = {
  projekt: ['Projekt', 'Projekte'], kapitel: ['Kapitel', 'Kapitel'], szene: ['Szene', 'Szenen'],
  heft: ['Heft', 'Hefte'], seite: ['Seite', 'Seiten'], zettel: ['Zettel', 'Zettel'], foto: ['Foto', 'Fotos'],
  blatt: ['Blatt', 'Blätter'], schnipsel: ['Schnipsel', 'Schnipsel'], faden: ['Fadennachricht', 'Fadennachrichten'],
  board: ['Brett', 'Bretter'], blase: ['Blase', 'Blasen'], gruppe: ['Gruppe', 'Gruppen'], brettbild: ['Brettbild', 'Brettbilder'],
  wort: ['Wort', 'Wörter'], wortkiste: ['Wortkiste', 'Wortkisten'], funke: ['Funke', 'Funken'],
  mischung: ['Klangmischung', 'Klangmischungen'], klangbild: ['Klangbild', 'Klangbilder'], klang: ['eigener Klang', 'eigene Klänge'],
  goodnote: ['Goodnotes-Datei', 'Goodnotes-Dateien'], figur: ['Figur', 'Figuren'], ort: ['Ort', 'Orte']
};
function ankunftZusammenfassen(docs, medien = 0) {
  const zaehler = {};
  let woerter = 0;
  for (const d of docs) {
    if (!d || !d.typ) continue;
    zaehler[d.typ] = (zaehler[d.typ] || 0) + 1;
    woerter += worte(d.text || '');
  }
  const reihenfolge = Object.keys(ANKUNFT_NAMEN);
  const zeilen = Object.entries(zaehler)
    .sort((a, b) => (reihenfolge.indexOf(a[0]) + 1 || 99) - (reihenfolge.indexOf(b[0]) + 1 || 99))
    .map(([typ, n]) => n + ' ' + ((ANKUNFT_NAMEN[typ] || [typ, typ])[n === 1 ? 0 : 1]));
  if (medien) zeilen.push(medien + (medien === 1 ? ' Bild oder Datei' : ' Bilder und Dateien'));
  return { zaehler, woerter, zeilen, gesamt: docs.length };
}

/* ----- Sicherung: packen und einspielen (von Datei und Zwischenablage geteilt) ----- */

async function baueSicherungsPaket({ mitMedien = true } = {}) {
  const media = {};
  if (mitMedien) {
    const ids = new Set();
    for (const d of D.docs.values()) { if (d.bild) ids.add(d.bild); if (d.skizze) ids.add(d.skizze); if (d.datei) ids.add(d.datei); }
    for (const id of ids) {
      const blob = await dbGet('media', id);
      if (blob) media[id] = await blobZuDataURL(blob);
    }
  }
  return {
    vani: 2, wann: Date.now(),
    docs: [...D.docs.values()],
    einst: D.einst,
    stats: D.stats,
    media,
    sync: await dbAlle('sync')
  };
}

/* Spielt ein geprüftes Paket ein. „dazu" lässt Vorhandenes in Ruhe, „ersetzen"
   räumt vorher alles weg. Gibt zurück, was wirklich neu angekommen ist. */
async function sicherungEinspielen(paket, modus) {
  if (modus === 'ersetzen') {
    await dbTu('docs', 'readwrite', (s) => s.clear());
    await dbTu('media', 'readwrite', (s) => s.clear());
    await dbTu('sync', 'readwrite', (s) => s.clear());
    D.docs.clear();
  }
  const neu = [];
  let uebersprungen = 0;
  const benoetigteMedien = new Set();
  for (const roh of paket.docs) {
    const d = sauberesDokument(roh);
    if (!d) continue;
    if (modus === 'dazu' && D.docs.has(d.id)) { uebersprungen++; continue; }
    D.docs.set(d.id, d);
    await dbPut('docs', d);
    neu.push(d);
    if (d.bild) benoetigteMedien.add(d.bild);
    if (d.skizze) benoetigteMedien.add(d.skizze);
    if (d.datei) benoetigteMedien.add(d.datei);
  }
  let medien = 0;
  for (const [id, durl] of Object.entries(paket.media || {})) {
    if (!benoetigteMedien.has(id)) continue;
    try {
      if (modus === 'ersetzen' || !(await dbGet('media', id))) { await dbPut('media', dataURLZuBlob(durl), id); medien++; }
    } catch (e) {}
  }
  for (const marker of paket.sync || []) {
    const sauber = saubererSyncMarker(marker);
    if (sauber) try { await dbPut('sync', sauber, sauber.id); } catch (e) {}
  }
  if (modus === 'ersetzen') {
    if (paket.einst) { uebernehmeEinstellungen(paket.einst); speichereEinst(); setzeThema(D.einst.thema); }
    if (paket.stats) {
      D.stats = { tage: saubereZaehler(paket.stats.tage), letzte: saubereZaehler(paket.stats.letzte),
        letzteSicherung: begrenze(paket.stats.letzteSicherung, 0, Date.now() + 86400000, 0) };
      speichereStats();
    }
  }
  return { neu, uebersprungen, medien };
}

/* Ein Paket annehmen: fragen wie, einspielen, zeigen was kam. */
async function sicherungAnnehmen(paket, woher) {
  const vorschau = ankunftZusammenfassen(paket.docs, Object.keys(paket.media || {}).length);
  const modus = await menue([

  ], vorschau.gesamt + ' Dinge vom ' + fmtDatum(begrenze(paket.wann, 0, Date.now() + 86400000, Date.now())) + (woher ? ' · ' + woher : ''));
  if (!modus) return null;
  if (modus === 'ersetzen' && !await frage('Wirklich alles Jetzige durch die Sicherung ersetzen?', { ja: 'Ersetzen', gefahr: true })) return null;
  toast('Lese ein …');
  const ergebnis = await sicherungEinspielen(paket, modus);

  return ergebnis;
}

/* ----- Zwischenablage: hinaus ----- */

/* iOS erlaubt das Schreiben nur kurz nach einer Berührung. Dauert das Packen
   länger, ist die Erlaubnis verfallen — außer man übergibt gleich ein
   Versprechen, das später zu Text wird. Genau dafür ist ClipboardItem da. */
async function textInZwischenablage(quelle) {
  const text = typeof quelle === 'string' ? Promise.resolve(quelle) : quelle;
  if (navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem === 'function') {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'text/plain': text.then((t) => new Blob([t], { type: 'text/plain' })) })]);
      return true;
    } catch (e) {}
  }
  try { await navigator.clipboard.writeText(await text); return true; } catch (e) { return false; }
}

async function inZwischenablageSichern() {
  const wahl = await menue([
    { text: 'Nur Texte und Einstellungen — klein und schnell', icon: 'blatt', wert: 'texte' },
    { text: 'Alles, auch Bilder — kann groß werden', icon: 'kamera', wert: 'alles' }
  ], 'Was soll in die Zwischenablage?');
  if (!wahl) return false;
  toast('Packe ein …');
  const versprechen = baueSicherungsPaket({ mitMedien: wahl === 'alles' }).then((p) => JSON.stringify(p));
  const ok = await textInZwischenablage(versprechen);
  if (!ok) { toast('Die Zwischenablage wollte nicht. Dann den Weg über „Alles sichern" als Datei.', 4600); return false; }
  const groesse = (await versprechen).length;
  toast('Liegt in der Zwischenablage (' + formatBytes(groesse) + '). Drüben: „Aus der Zwischenablage einlesen".', 5600);
  return true;
}

/* ----- Zwischenablage: herein ----- */

function ausZwischenablageEinlesen() {
  return new Promise((res) => {
    let fertig = false;
    const feld = el('textarea', {
      rows: 6, class: 'ankommen-feld', spellcheck: 'false', autocapitalize: 'off', autocorrect: 'off',
      placeholder: 'Hier einfügen — lange drücken und „Einfügen", oder Strg+V …'
    });
    const hinweis = el('div', { class: 'ankommen-hinweis' },
      'Es darf alles sein: eine VANI-Sicherung, ein Kopplungscode, „Nur Texte" aus einem älteren VANI, ein WhatsApp-Verlauf, ein Text mit Überschriften — oder einfach Text. VANI erkennt, was es ist.');
    const verarbeite = async (text) => {
      if (fertig) return;
      fertig = true; zu();
      res(await einfuegeInhaltVerarbeiten(text));
    };
    /* Große Sicherungen nicht erst ins Feld malen — das dauert und friert ein. */
    feld.addEventListener('paste', (e) => {
      const cd = e.clipboardData;
      if (!cd) return;
      const text = cd.getData('text/plain') || '';
      if (!text) return;
      e.preventDefault();
      verarbeite(text);
    });
    const lesen = el('button', {
      class: 'knopf voll', onclick: async () => {
        try {
          const t = navigator.clipboard && navigator.clipboard.readText ? await navigator.clipboard.readText() : '';
          if (t && t.trim()) return verarbeite(t);
          toast('Die Zwischenablage ist leer — oder das Gerät gibt sie nur per Einfügen her.', 3800);
        } catch (e) { toast('Bitte direkt ins Feld einfügen — so gibt das Gerät die Zwischenablage her.', 3800); }
        feld.focus();
      }
    }, 'Zwischenablage lesen');
    const weiter = el('button', { class: 'knopf', onclick: () => { if (feld.value.trim()) verarbeite(feld.value); else toast('Da ist noch nichts.'); } }, 'Einlesen');
    const kasten = el('div', { class: 'modal ankommen' },
      el('h2', {}, 'Aus der Zwischenablage einlesen'),
      hinweis, feld,
      el('div', { class: 'reihe' }, el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'), lesen, weiter));
    const zu = zeigeDeck(kasten, () => { if (!fertig) { fertig = true; res(null); } });
    setTimeout(() => feld.focus(), 60);
  });
}

async function einfuegeInhaltVerarbeiten(text) {
  const e = erkenneEinfuegeInhalt(text);
  if (e.art === 'leer') { toast('Da war nichts drin.'); return null; }
  if (e.art === 'kaputt') {
    await zeigeAnkunft('Das kam nicht ganz an',
      [e.grund === 'unvollstaendig'
        ? 'Das sieht aus wie eine Sicherung, ist aber abgeschnitten — vermutlich wurde nicht alles kopiert.'
        : 'Das ist eine Datei, aber keine VANI-Sicherung.'],
      e.grund === 'unvollstaendig' ? 'Drüben noch einmal „In die Zwischenablage sichern", dann hier gleich einlesen. Bei sehr großen Sicherungen hilft „Nur Texte".' : '');
    return null;
  }
  if (e.art === 'kopplungscode') return vorhandenenSyncBereichKoppeln(e.code);
  if (e.art === 'sicherung') return sicherungAnnehmen(e.paket, 'Zwischenablage');
  if (e.art === 'vanitext') return vaniTextAnnehmen(e);
  if (e.art === 'whatsapp') return whatsappAnnehmen(e);
  if (e.art === 'gegliedert') return gegliedertAnnehmen(e);
  return textAnnehmen(e.text);
}

function neuesHeftFuer(titel) {
  return neuDoc('heft', { titel: titel || 'Eingelesen', farbe: zufall(HEFTFARBEN), farbe2: zufall(HEFTFARBEN), band: '#d6bd92', muster: 'leinen', papier: 'liniert', ansicht: 'seiten' });
}
function textSignatur(texte) { return texte.map((t) => (t || '').trim()).join(''); }

async function vaniTextAnnehmen(e) {
  const vorschau = [];
  if (e.projekte.length) vorschau.push(e.projekte.length + (e.projekte.length === 1 ? ' Projekt' : ' Projekte'));
  if (e.hefte.length) vorschau.push(e.hefte.length + (e.hefte.length === 1 ? ' Heft' : ' Hefte'));
  if (e.schnipsel.length) vorschau.push(e.schnipsel.length + ' Schnipsel');
  if (!await frage('Das ist der Text-Export eines VANI: ' + vorschau.join(', ') + '. Alles davon hier anlegen? Was wortgleich schon da ist, wird übersprungen.', { ja: 'Anlegen' })) return null;
  const neu = [];
  let uebersprungen = 0;
  for (const p of e.projekte) {
    const sig = textSignatur(p.kapitel.flatMap((k) => k.szenen.map((s) => s.titel + '\n' + s.text)));
    const schonDa = vomTyp('projekt').some((alt) => alt.titel === p.titel &&
      textSignatur(kinder(alt.id, 'kapitel').flatMap((k) => kinder(k.id, 'szene').map((s) => s.titel + '\n' + s.text))) === sig);
    if (schonDa) { uebersprungen++; continue; }
    const projekt = neuDoc('projekt', { titel: p.titel, art: 'Anderes', ziel: 0 });
    neu.push(projekt);
    p.kapitel.forEach((k, ki) => {
      const kapitel = neuDoc('kapitel', { parent: projekt.id, titel: k.titel, ord: ki });
      neu.push(kapitel);
      k.szenen.forEach((s, si) => neu.push(neuDoc('szene', { parent: kapitel.id, projekt: projekt.id, ord: si, titel: s.titel, text: s.text, rich: richAusText(s.text), format: 'rich', status: 'funke', farbe: '' })));
    });
  }
  for (const h of e.hefte) {
    const sig = textSignatur(h.seiten.map((s) => s.titel + '\n' + s.text));
    const schonDa = vomTyp('heft').some((alt) => alt.titel === h.titel &&
      textSignatur(kinder(alt.id, 'seite').map((s) => s.titel + '\n' + s.text)) === sig);
    if (schonDa) { uebersprungen++; continue; }
    const heft = neuesHeftFuer(h.titel);
    neu.push(heft);
    h.seiten.forEach((s, si) => {
      const seite = neuDoc('seite', { parent: heft.id, ord: si, titel: s.titel, text: s.text });
      neu.push(seite);
      (s.zettel || []).forEach((zt, zi) => neu.push(neuDoc('zettel', {
        parent: seite.id, text: zt, farbe: zufall(['gelb', 'rosa', 'blau', 'gruen']),
        pos: { x: 8 + (zi * 13) % 50, y: 6 + (zi * 11) % 40, rot: -4 + (zi * 3) % 8, w: 30 }
      })));
    });
  }
  const bekannte = new Set(vomTyp('schnipsel').map((s) => (s.text || '').trim()));
  for (const s of e.schnipsel) {
    if (bekannte.has(s.text)) { uebersprungen++; continue; }
    const felder = { text: s.text };
    if (s.wann) { felder.angelegt = s.wann; felder.geaendert = s.wann; }
    neu.push(neuDoc('schnipsel', felder));
    bekannte.add(s.text);
  }
  zeichne();
  const z = ankunftZusammenfassen(neu);
  await zeigeAnkunft(neu.length ? 'Angekommen' : 'Nichts Neues',
    neu.length ? z.zeilen : ['Alles davon war schon wortgleich da.'],
    uebersprungen ? uebersprungen + ' schon vorhanden, übersprungen.' : (z.woerter ? z.woerter.toLocaleString('de-DE') + ' Wörter.' : ''));
  return { neu, uebersprungen };
}

async function whatsappAnnehmen(e) {

/* ================================================================
   VANI — Klangwelten: alles aus dem Nichts gerechnet, keine Dateien.
   Rezepte nach Andy Farnell („Designing Sound") und eigenen Ohren.
   ================================================================ */

let _audio = null;
let _audioMussNeu = false;
let _audioFehler = '';
let _audioBrueckeLaeuft = null;

function audioUnterstuetzt() { return !!(window.AudioContext || window.webkitAudioContext); }

/* Die Lautstärkeskala war technisch linear und dadurch auf iPad-Lautsprechern
   in der unteren Hälfte kaum hörbar. Diese Kurve bleibt bei 0 wirklich stumm,
   gibt den übrigen Bereich aber so wieder, wie Menschen Lautheit wahrnehmen. */
function audioLautheitsKurve(wert) {
  const w = begrenze(wert, 0, 1, .5);
  return w <= 0 ? 0 : .08 + .82 * Math.pow(w, .75);
}

function _weckImpuls(a) {
  try {
    const p = a.ctx.createBuffer(1, 1, Math.max(8000, a.ctx.sampleRate || 44100));
    const q = a.ctx.createBufferSource(); q.buffer = p; q.connect(a.master); q.start(0);
  } catch (e) {}
}

function _baueAudio() {
  if (!audioUnterstuetzt()) throw new Error('Web Audio wird hier nicht unterstützt');
  const Ctx = window.AudioContext || window.webkitAudioContext;
  let ctx;
  try { ctx = new Ctx({ latencyHint: 'interactive' }); } catch (e) { ctx = new Ctx(); }
  const master = ctx.createGain();
  master.gain.value = audioLautheitsKurve(D.einst.lautstaerke);
  const drossel = ctx.createDynamicsCompressor();
  drossel.threshold.value = -18; drossel.ratio.value = 4;
  master.connect(drossel); drossel.connect(ctx.destination);
  const a = { ctx, master, drossel, puffer: {}, hallen: {}, ebenen: new Map(), generation: Date.now() + Math.random() };
  ctx.onstatechange = () => {
    if (ctx.state === 'interrupted' || ctx.state === 'closed') _audioMussNeu = klangAktiv();
  };
  _weckImpuls(a);
  _audioFehler = '';
  return a;
}

function _verwerfeAudio() {
  const alt = _audio;
  _audio = null;
  if (!alt) return;
  for (const e of alt.ebenen.values()) { try { clearTimeout(e.stopTimer); e.werk.stop(); e.gain.disconnect(); } catch (x) {} }
  alt.ebenen.clear();
  try { alt.ctx.onstatechange = null; alt.ctx.close(); } catch (e) {}
}

function holeAudio() {
  if (!_audio || _audio.ctx.state === 'closed') _audio = _baueAudio();
  if (_audio.ctx.state === 'suspended' || _audio.ctx.state === 'interrupted') {
    try { Promise.resolve(_audio.ctx.resume()).catch((e) => { _audioFehler = e && e.message || 'Klang blieb stumm'; }); } catch (e) { _audioFehler = e.message; }
  }
  return _audio;
}

function _warte(ms) { return new Promise((resolve) => setTimeout(() => resolve(false), ms)); }

async function _warteAufAudio(ctx, ms = 1100) {
  if (ctx.state === 'running') return true;
  try {
    const fortsetzen = Promise.resolve(ctx.resume()).then(() => ctx.state === 'running', () => false);
    await Promise.race([fortsetzen, _warte(ms)]);
  } catch (e) { _audioFehler = e && e.message || 'Klang wurde nicht freigegeben'; }
  return ctx.state === 'running';
}

/* Safari/WebKit kann in einer installierten Home-Bildschirm-App nach dem
   Hintergrundwechsel einen scheinbar „running“ AudioContext ohne Ton behalten.
   Ein winziger echter Medienklang innerhalb derselben Berührung weckt die
   iOS-Mediensitzung, bevor wir die errechneten Atmosphären anschließen. */
async function _audioMedienBruecke() {
  if (_audioBrueckeLaeuft) return _audioBrueckeLaeuft;
  _audioBrueckeLaeuft = (async () => {
    if (typeof document === 'undefined' || !document.createElement || typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) return false;
    const rate = 16000, anzahl = 1440, kopf = 44;
    const puffer = new ArrayBuffer(kopf + anzahl * 2), v = new DataView(puffer);
    const wort = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    wort(0, 'RIFF'); v.setUint32(4, 36 + anzahl * 2, true); wort(8, 'WAVE'); wort(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    wort(36, 'data'); v.setUint32(40, anzahl * 2, true);
    for (let i = 0; i < anzahl; i++) {
      const h = Math.min(1, i / 100, (anzahl - i) / 180);
      v.setInt16(kopf + i * 2, Math.sin(i * Math.PI * 2 * 440 / rate) * 950 * h, true);
    }
    const url = URL.createObjectURL(new Blob([puffer], { type: 'audio/wav' }));
    const ton = document.createElement('audio');
    ton.setAttribute('playsinline', ''); ton.preload = 'auto'; ton.src = url; ton.volume = .45;
    (document.body || document.documentElement).append(ton);
    try {
      const gespielt = await Promise.race([Promise.resolve(ton.play()).then(() => true, () => false), _warte(1200)]);
      return gespielt;
    } finally {
      setTimeout(() => { try { ton.pause(); ton.remove(); URL.revokeObjectURL(url); } catch (e) {} }, 180);
    }
  })();
  try { return await _audioBrueckeLaeuft; } finally { _audioBrueckeLaeuft = null; }
}

async function audioFreigeben({ neu = false, probe = false } = {}) {
  if (!audioUnterstuetzt()) { _audioFehler = 'Dieser Browser unterstützt Web Audio nicht.'; return false; }
  try {
    if (neu || !_audio || _audio.ctx.state !== 'running' || _audioMussNeu) await _audioMedienBruecke();
    if (neu || _audioMussNeu || (_audio && (_audio.ctx.state === 'closed' || _audio.ctx.state === 'interrupted'))) _verwerfeAudio();
    let a = holeAudio();
    let frei = await _warteAufAudio(a.ctx);
    if (!frei) {
      _verwerfeAudio();
      _audio = _baueAudio(); a = _audio;
      frei = await _warteAufAudio(a.ctx);
    }
    if (!frei) { _audioFehler = 'iOS hält den Klang noch fest. Noch einmal auf „Klang wecken“ tippen.'; return false; }
    _audioMussNeu = false; _audioFehler = '';
    for (const [id, pegel] of Object.entries(D.einst.mischung || {})) if (pegel > 0) ebeneAn(id, pegel);
    if (probe) audioProbe();
    return true;
  } catch (e) { _audioFehler = e && e.message || 'Klang konnte nicht starten'; return false; }
}

function audioNeuStarten() {
  const pegel = Object.assign({}, D.einst.mischung || {});
  _verwerfeAudio();
  _audioMussNeu = false;
  try {
    const a = holeAudio(); /* synchron im Tippen erzeugt: wichtig auf iPad/iPhone */
    _weckImpuls(a);
    const gewollt = Object.keys(pegel).filter((id) => pegel[id] > 0);
    for (const id of gewollt) ebeneAn(id, pegel[id]);
    return true;
  } catch (e) { _audioFehler = e && e.message || 'Klang konnte nicht starten'; return false; }
}

function audioZustand() {
  if (!audioUnterstuetzt()) return { ok: false, state: 'nicht unterstützt', fehler: 'Dieser Browser hat keine Web-Audio-Unterstützung.' };
  return { ok: !!(_audio && _audio.ctx.state === 'running'), state: _audio ? _audio.ctx.state : 'bereit', fehler: _audioFehler };
}

function setzeLautstaerke(wert) {
  wert = begrenze(wert, 0, 1, .5);
  D.einst.lautstaerke = wert;
  speichereEinst();
  if (_audio) _audio.master.gain.setTargetAtTime(audioLautheitsKurve(wert), _audio.ctx.currentTime, .1);
}

/* ----- Rauschfarben (einmal gerechnet, dann geloopt) ----- */
function _rauschpuffer(a, farbe) {
  if (a.puffer[farbe]) return a.puffer[farbe];
  const sek = 3, n = a.ctx.sampleRate * sek;
  const p = a.ctx.createBuffer(2, n, a.ctx.sampleRate);
  for (let k = 0; k < 2; k++) {
    const d = p.getChannelData(k);
    if (farbe === 'weiss') {
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } else if (farbe === 'rosa') {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759;
        b2 = .96900 * b2 + w * .1538520; b3 = .86650 * b3 + w * .3104856;
        b4 = .55000 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .11;
        b6 = w * .115926;
      }
    } else {
      let letzt = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        letzt = (letzt + .02 * w) / 1.02;
        d[i] = letzt * 3.5;
      }
    }
  }
  a.puffer[farbe] = p;
  return p;
}

function _hallIR(a, sek, tiefpass) {
  const key = sek + ':' + tiefpass;
  if (a.hallen[key]) return a.hallen[key];
  const n = Math.floor(a.ctx.sampleRate * sek);
  const p = a.ctx.createBuffer(2, n, a.ctx.sampleRate);
  for (let k = 0; k < 2; k++) {
    const d = p.getChannelData(k);
    let glatt = 0;
    const alpha = Math.min(1, tiefpass / (a.ctx.sampleRate / 2));
    for (let i = 0; i < n; i++) {
      const w = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
      glatt += alpha * (w - glatt);
      d[i] = glatt;
    }
  }
  a.hallen[key] = p;
  return p;
}

/* ----- Werkbank: baut & räumt hinter jeder Ebene auf ----- */
function neueWerkbank(a, out) {
  const quellen = [], timer = new Set(), intervalle = new Set();
  const w = {
    a, out,
    rauschen(farbe) {
      const q = a.ctx.createBufferSource();
      q.buffer = _rauschpuffer(a, farbe); q.loop = true; q.start();
      quellen.push(q); return q;
    },
    ton(typ, freq) {
      const o = a.ctx.createOscillator();
      o.type = typ; o.frequency.value = freq; o.start();
      quellen.push(o); return o;
    },
    filter(typ, freq, q) {
      const f = a.ctx.createBiquadFilter();
      f.type = typ; f.frequency.value = freq; if (q) f.Q.value = q;
      return f;
    },
    pegel(v) { const g = a.ctx.createGain(); g.gain.value = v; return g; },
    lfo(rate, hub, ziel) {
      const o = a.ctx.createOscillator(); o.frequency.value = rate;
      const g = a.ctx.createGain(); g.gain.value = hub;
      o.connect(g); g.connect(ziel); o.start();
      quellen.push(o); return o;
    },
    wandel(param, min, max, msMin, msMax, glaette) {
      const tu = () => {
        param.setTargetAtTime(min + Math.random() * (max - min), a.ctx.currentTime, glaette ?? .6);
        w.spaeter(tu, msMin + Math.random() * (msMax - msMin));
      };
      tu();
    },
    takt(msMittel, fn) {
      const tu = () => {
        fn(a.ctx.currentTime);
        w.spaeter(tu, Math.max(30, -Math.log(Math.max(Number.EPSILON, Math.random())) * msMittel));
      };
      w.spaeter(tu, Math.random() * msMittel);
    },
    spaeter(fn, ms) {
      const id = setTimeout(() => { timer.delete(id); fn(); }, Math.max(0, Number(ms) || 0));
      timer.add(id); return id;
    },
    immer(ms, fn) { const id = setInterval(fn, Math.max(16, Number(ms) || 16)); intervalle.add(id); return id; },
    hall(sek, tiefpass, anteil) {
      const c = a.ctx.createConvolver();
      c.buffer = _hallIR(a, sek, tiefpass);
      const g = a.ctx.createGain(); g.gain.value = anteil;
      c.connect(g); g.connect(out);
      return c;
    },
    huelle(ziel, t, spitze, decaySek) {
      ziel.setValueAtTime(Math.max(.0001, spitze), t);
      ziel.exponentialRampToValueAtTime(.0001, t + decaySek);
    },
    stop() {
      timer.forEach(clearTimeout); timer.clear();
      intervalle.forEach(clearInterval); intervalle.clear();
      quellen.forEach((q) => { try { q.stop(); } catch (e) {} });
    }
  };
  return w;
}

/* kurzer tonaler Ping (Tropfen, Blasen, Vogel-Silben) */
function _ping(w, ziel, { f0, f1, dauer, staerke, typ }) {
  const t = w.a.ctx.currentTime;
  const o = w.a.ctx.createOscillator();
  o.type = typ || 'sine';
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dauer);
  const g = w.pegel(0);
  w.huelle(g.gain, t, staerke, dauer);
  o.connect(g); g.connect(ziel);
  o.start(t); o.stop(t + dauer + .05);
}
function _knack(w, ziel, { freq, q, dauer, staerke }) {

  b.buffer = _rauschpuffer(w.a, 'weiss');
  b.loop = true;
  const f = w.filter('bandpass', freq, q || 2);
  const g = w.pegel(0);
  w.huelle(g.gain, t, staerke, dauer);
  b.connect(f); f.connect(g); g.connect(ziel);

}

  { id: 'zug', name: 'Zugfahrt', kat: 'Orte', bau(a, out) {

    rumpel.connect(rlp); rlp.connect(rg); rg.connect(out);

/* ================================================================
   VANI — Ambiences: echte Aufnahmen statt gerechneter Klänge

   Drei Dinge machen das hier besser als üblich:

   1. Nahtlos. Zwei Abspieler laufen versetzt und blenden ineinander über.
      Dadurch hört man nie die Naht, an der ein Loop von vorn beginnt — auch
      bei Aufnahmen, die gar nicht als Loop geschnitten wurden.
   2. Lebendig. Jede Ebene atmet: Lautstärke und Klangfarbe wandern langsam,
      damit eine Minute Aufnahme nicht nach einer Minute Aufnahme klingt.
   3. Sparsam. Nichts wird geladen, bevor es gebraucht wird. Einmal geholt,
      liegt eine Aufnahme dauerhaft im Gerät — auch offline, auch im Flugzeug.
   ================================================================ */

const AMBIENCE_VERSION = 1;
const AMBIENCE_MAX = 40 * 1024 * 1024;   /* je Datei: großzügig, aber begrenzt */

/* Der mitgelieferte Fundus. `datei` liegt neben der App, `quelle` nennt die
   Herkunft ehrlich. Eigene Aufnahmen kommen als Dokumente vom Typ „klang"
   dazu und stehen gleichberechtigt daneben. */
let AMBIENCE_KATALOG = [];
function ambienceKatalogSetzen(liste) {
  AMBIENCE_KATALOG = (Array.isArray(liste) ? liste : []).filter((k) => k && typeof k.id === 'string' && /^[a-z0-9_-]{1,40}$/.test(k.id))
    .map((k) => ({
      id: k.id,
      name: String(k.name || k.id).slice(0, 60),
      kat: String(k.kat || 'Sonst').slice(0, 30),
      datei: String(k.datei || (k.id + '.opus')).replace(/[^a-zA-Z0-9._-]/g, ''),
      mb: begrenze(k.mb, 0, 100, 0),
      quelle: String(k.quelle || '').slice(0, 200)
    }));
  return AMBIENCE_KATALOG;
}

/* Eigene Klänge: Dokumente vom Typ „klang" mit der Aufnahme in `datei` (Medien). */
function eigeneAmbiences() { return vomTyp('klang'); }
function alleAmbiences() {
  return [...AMBIENCE_KATALOG.map((k) => ({ ...k, eigen: false })),
    ...eigeneAmbiences().map((d) => ({ id: 'eigen:' + d.id, name: d.titel || 'Eigener Klang', kat: d.art || 'Meine', eigen: true, doc: d }))];
}
function ambienceFinde(id) { return alleAmbiences().find((a) => a.id === id) || null; }
function ambienceKategorien() {
  const raus = [];
  for (const a of alleAmbiences()) if (!raus.includes(a.kat)) raus.push(a.kat);
  return raus;
}

/* ----- Vorrat: einmal geholt, für immer da ----- */
function ambienceSchluessel(id) { return 'ambience:' + AMBIENCE_VERSION + ':' + id; }
async function ambienceImVorrat(id) {
  try { return !!(await dbGet('media', ambienceSchluessel(id))); } catch (e) { return false; }
}
async function ambienceVorratStand() {
  const raus = { da: [], fehlt: [], bytes: 0 };
  for (const a of alleAmbiences()) {
    if (a.eigen) { raus.da.push(a.id); continue; }
    const blob = await dbGet('media', ambienceSchluessel(a.id)).catch(() => null);
    if (blob) { raus.da.push(a.id); raus.bytes += blob.size || 0; } else raus.fehlt.push(a.id);
  }
  return raus;
}
async function ambienceVorratLeeren() {
  let weg = 0;
  for (const a of AMBIENCE_KATALOG) {
    if (await ambienceImVorrat(a.id)) { await dbDel('media', ambienceSchluessel(a.id)).catch(() => {}); weg++; }
  }
  _ambiencePuffer.clear();
  return weg;
}

/* Holt eine Aufnahme — aus dem Vorrat, sonst aus dem Netz und dann in den Vorrat. */
async function ambienceBlob(id, beiFortschritt) {
  const a = ambienceFinde(id);
  if (!a) throw new Error('Diesen Klang gibt es nicht.');
  if (a.eigen) {
    const blob = await dbGet('media', a.doc.datei);
    if (!blob) throw new Error('Die Aufnahme ist nicht mehr da.');
    return blob;
  }
  const schluessel = ambienceSchluessel(id);
  const gespeichert = await dbGet('media', schluessel).catch(() => null);
  if (gespeichert) return gespeichert;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) throw new Error('Dafür braucht es einmal Internet.');
  const antwort = await fetch('klang/' + a.datei, { cache: 'force-cache' });
  if (!antwort.ok) throw new Error('Der Klang ließ sich nicht laden.');
  const gesamt = Number(antwort.headers.get('content-length')) || 0;
  let blob;
  if (antwort.body && beiFortschritt && gesamt) {
    const leser = antwort.body.getReader();
    const stuecke = [];
    let geladen = 0;
    for (;;) {
      const { done, value } = await leser.read();
      if (done) break;
      stuecke.push(value); geladen += value.length;
      if (geladen > AMBIENCE_MAX) throw new Error('Diese Aufnahme ist zu groß.');
      beiFortschritt(Math.min(1, geladen / gesamt));
    }
    blob = new Blob(stuecke, { type: 'audio/ogg' });
  } else {
    blob = await antwort.blob();
    if (blob.size > AMBIENCE_MAX) throw new Error('Diese Aufnahme ist zu groß.');
  }
  await dbPut('media', blob, schluessel).catch(() => {});
  return blob;
}

/* Dekodierte Aufnahmen bleiben im Speicher, solange die App offen ist. */
const _ambiencePuffer = new Map();
async function ambiencePuffer(id, beiFortschritt) {
  if (_ambiencePuffer.has(id)) return _ambiencePuffer.get(id);
  const a = holeAudio();
  const blob = await ambienceBlob(id, beiFortschritt);
  const roh = await blob.arrayBuffer();
  const puffer = await new Promise((res, rej) => {
    const fertig = (p) => res(p), schief = (e) => rej(e || new Error('Diese Aufnahme versteht der Browser nicht.'));
    try {
      const p = a.ctx.decodeAudioData(roh, fertig, schief);
      if (p && typeof p.then === 'function') p.then(fertig, schief);
    } catch (e) { schief(e); }
  });
  _ambiencePuffer.set(id, puffer);
  return puffer;
}

/* ----- Der Kern: ein Loop ohne hörbare Naht -----
   Zwei Quellen laufen abwechselnd. Die zweite startet, während die erste noch
   ausklingt; beide Rampen kreuzen sich. Wo eine harte Wiederholung knacken
   würde, entsteht so ein weicher, endloser Übergang. */
function ambienceStimmeBauen(a, puffer, ziel, einstellung) {
  const e = einstellung || {};
  const blende = begrenze(e.blende, .5, 12, Math.min(4, puffer.duration / 5));
  const tempo = begrenze(e.tempo, .5, 2, 1);
  const laenge = puffer.duration / tempo;
  const abstand = Math.max(.6, laenge - blende);

  const aus = a.ctx.createGain();
  aus.gain.value = 1;
  const filter = a.ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = begrenze(e.klarheit, 300, 20000, 20000);
  const tiefe = a.ctx.createBiquadFilter();
  tiefe.type = 'highpass';
  tiefe.frequency.value = begrenze(e.tiefe, 20, 2000, 20);
  aus.connect(tiefe); tiefe.connect(filter); filter.connect(ziel);

  const quellen = new Set();
  let timer = null, gestoppt = false, erster = true;

  const starte = (wann) => {
    if (gestoppt) return;
    const q = a.ctx.createBufferSource();
    q.buffer = puffer;
    q.playbackRate.value = tempo;
    /* Der erste Einsatz kommt schnell — sonst wartet man beim Antippen
       sekundenlang auf Stille. Erst die Wiederholungen blenden weich. */
    const auf = erster ? Math.min(.9, blende) : blende;
    erster = false;
    const g = a.ctx.createGain();
    g.gain.setValueAtTime(.0001, wann);
    g.gain.exponentialRampToValueAtTime(1, wann + auf);
    g.gain.setValueAtTime(1, wann + Math.max(auf, laenge - blende));
    g.gain.exponentialRampToValueAtTime(.0001, wann + laenge);
    q.connect(g); g.connect(aus);
    q.start(wann);
    q.stop(wann + laenge + .1);
    quellen.add(q);
    q.onended = () => { quellen.delete(q); try { g.disconnect(); } catch (x) {} };
    timer = setTimeout(() => starte(a.ctx.currentTime + .05), Math.max(120, abstand * 1000 - 220));
  };
  starte(a.ctx.currentTime + .04);

  /* Atmen: die Aufnahme wandert langsam in Lautstärke und Klangfarbe. */
  let atem = null;
  const atmen = begrenze(e.atmen, 0, 1, .35);
  if (atmen > 0) {
    const tu = () => {
      const t = a.ctx.currentTime;
      aus.gain.setTargetAtTime(1 - atmen * .45 * Math.random(), t, 4.5);
      if (filter.frequency.value < 19000) filter.frequency.setTargetAtTime(begrenze(e.klarheit, 300, 20000, 20000) * (.8 + Math.random() * .35), t, 6);
      atem = setTimeout(tu, 7000 + Math.random() * 9000);
    };
    atem = setTimeout(tu, 3000 + Math.random() * 5000);
  }

  return {
    ausgang: aus,
    setzeTempo(v) { for (const q of quellen) { try { q.playbackRate.setTargetAtTime(begrenze(v, .5, 2, 1), a.ctx.currentTime, .4); } catch (x) {} } },
    setzeKlarheit(v) { try { filter.frequency.setTargetAtTime(begrenze(v, 300, 20000, 20000), a.ctx.currentTime, .3); } catch (x) {} },
    setzeTiefe(v) { try { tiefe.frequency.setTargetAtTime(begrenze(v, 20, 2000, 20), a.ctx.currentTime, .3); } catch (x) {} },
    stop() {
      gestoppt = true;
      clearTimeout(timer); clearTimeout(atem);
      for (const q of quellen) { try { q.stop(); } catch (x) {} }
      quellen.clear();
      try { aus.disconnect(); } catch (x) {}
    }
  };
}

/* ----- Steuerung: welche Ambience läuft wie laut ----- */
function saubereAmbienceMischung(pegel) {
  const raus = {};
  if (!pegel || typeof pegel !== 'object' || Array.isArray(pegel)) return raus;
  const erlaubt = new Set(alleAmbiences().map((a) => a.id));
  for (const [id, wert] of Object.entries(pegel)) {
    if (!erlaubt.has(id)) continue;
    const v = begrenze(wert, 0, 1, 0);
    if (v > 0) raus[id] = v;
  }
  return raus;
}
function saubereAmbienceFeinheit(f) {
  const q = f && typeof f === 'object' && !Array.isArray(f) ? f : {};
  return {
    tempo: begrenze(q.tempo, .5, 2, 1),
    klarheit: begrenze(q.klarheit, 300, 20000, 20000),
    tiefe: begrenze(q.tiefe, 20, 2000, 20),
    atmen: begrenze(q.atmen, 0, 1, .35),
    blende: begrenze(q.blende, .5, 12, 4)
  };
}

const _ambienceLaeuft = new Map();   /* id -> { gain, stimme } */

function ambienceFeinheitVon(id) {
  const alle = D.einst.ambienceFein && typeof D.einst.ambienceFein === 'object' ? D.einst.ambienceFein : {};
  return saubereAmbienceFeinheit(alle[id]);
}
function ambienceFeinheitSetzen(id, teil) {
  if (!D.einst.ambienceFein || typeof D.einst.ambienceFein !== 'object') D.einst.ambienceFein = {};
  const jetzt = ambienceFeinheitVon(id);
  D.einst.ambienceFein[id] = saubereAmbienceFeinheit({ ...jetzt, ...teil });
  speichereEinst();
  const laeuft = _ambienceLaeuft.get(id);
  if (laeuft && laeuft.stimme) {
    const f = D.einst.ambienceFein[id];
    laeuft.stimme.setzeTempo(f.tempo);
    laeuft.stimme.setzeKlarheit(f.klarheit);
    laeuft.stimme.setzeTiefe(f.tiefe);
  }
  return D.einst.ambienceFein[id];
}

function ambienceAus(id) {
  const l = _ambienceLaeuft.get(id);
  if (!l) return;
  _ambienceLaeuft.delete(id);
  try {
    l.gain.gain.setTargetAtTime(.0001, _audio.ctx.currentTime, .5);
    setTimeout(() => { try { l.stimme.stop(); l.gain.disconnect(); } catch (e) {} }, 1600);
  } catch (e) { try { l.stimme.stop(); } catch (x) {} }
}

async function ambienceAn(id, staerke, beiFortschritt) {
  staerke = begrenze(staerke, 0, 1, .5);
  if (staerke <= 0) { ambienceAus(id); return false; }
  const a = holeAudio();
  const laeuft = _ambienceLaeuft.get(id);
  if (laeuft) { laeuft.gain.gain.setTargetAtTime(staerke, a.ctx.currentTime, .4); return true; }
  const puffer = await ambiencePuffer(id, beiFortschritt);
  if (!D.einst.ambience || !D.einst.ambience[id]) return false;  /* zwischenzeitlich abgewählt */
  const gain = a.ctx.createGain();
  gain.gain.value = .0001;
  gain.connect(a.master);
  const stimme = ambienceStimmeBauen(a, puffer, gain, ambienceFeinheitVon(id));
  gain.gain.setTargetAtTime(staerke, a.ctx.currentTime, .25);
  _ambienceLaeuft.set(id, { gain, stimme });
  return true;
}

/* Wendet eine ganze Mischung an: neue an, alte aus, Lautstärken nach. */
async function ambienceMischungAnwenden(pegel, beiFortschritt) {
  D.einst.ambience = saubereAmbienceMischung(pegel);
  speichereEinst();
  for (const id of [..._ambienceLaeuft.keys()]) if (!D.einst.ambience[id]) ambienceAus(id);
  const fehler = [];
  for (const [id, v] of Object.entries(D.einst.ambience)) {
    try { await ambienceAn(id, v, beiFortschritt ? (p) => beiFortschritt(id, p) : null); }
    catch (e) { fehler.push({ id, meldung: (e && e.message) || 'Ging nicht.' }); delete D.einst.ambience[id]; }
  }
  if (fehler.length) speichereEinst();
  return fehler;
}
function ambienceAktiv() { return Object.values(D.einst.ambience || {}).some((v) => v > 0); }
function ambienceAllesAus() { return ambienceMischungAnwenden({}); }

/* ----- Klangbilder: eine Mischung mit Namen -----
   Ein Klangbild kann an einer Szene, einem Kapitel, einem Heft oder einem
   Projekt hängen. Wer dort zu schreiben beginnt, hört es von selbst. */
function klangbilder() { return vomTyp('klangbild').sort((a, b) => (a.titel || '').localeCompare(b.titel || '', 'de')); }
function klangbildJetzt(titel) {
  const pegel = { ...(D.einst.ambience || {}) };
  const gewebt = { ...(D.einst.mischung || {}) };
  return neuDoc('klangbild', {
    titel: String(titel || 'Ohne Namen').slice(0, 60),
    pegel, gewebt,
    fein: JSON.parse(JSON.stringify(D.einst.ambienceFein || {})),
    lautstaerke: begrenze(D.einst.lautstaerke, 0, 1, .5)
  });
}
async function klangbildAnwenden(doc) {
  if (!doc) return false;
  if (doc.fein && typeof doc.fein === 'object') {
    D.einst.ambienceFein = {};
    for (const [id, f] of Object.entries(doc.fein)) D.einst.ambienceFein[id] = saubereAmbienceFeinheit(f);
  }
  if (typeof doc.lautstaerke === 'number') setzeLautstaerke(begrenze(doc.lautstaerke, 0, 1, .5));
  if (typeof mischungAnwenden === 'function') mischungAnwenden(doc.gewebt || {});
  await ambienceMischungAnwenden(doc.pegel || {});
  return true;
}

/* Bindung: welches Klangbild gehört zu diesem Ort im Text? */
function klangbildFuer(doc) {
  if (!doc) return null;
  const kette = [doc.id, doc.parent, doc.projekt];
  for (const id of kette) {
    if (!id) continue;
    const b = klangbilder().find((k) => Array.isArray(k.orte) && k.orte.includes(id));
    if (b) return b;
  }
  /* eine Ebene höher: Kapitel eines Elternteils */
  const eltern = doc.parent && D.docs.get(doc.parent);
  if (eltern && eltern.parent) {
    const b = klangbilder().find((k) => Array.isArray(k.orte) && k.orte.includes(eltern.parent));
    if (b) return b;
  }
  return null;
}
function klangbildBinden(bild, ortId) {
  if (!bild || !ortId) return false;
  for (const k of klangbilder()) {
    if (!Array.isArray(k.orte)) continue;
    if (k.orte.includes(ortId) && k.id !== bild.id) { k.orte = k.orte.filter((x) => x !== ortId); speichereStill(k); }
  }
  bild.orte = [...new Set([...(Array.isArray(bild.orte) ? bild.orte : []), ortId])].slice(0, 200);
  speichereStill(bild);
  return true;
}
function klangbildLoesen(ortId) {
  let ab = 0;
  for (const k of klangbilder()) {
    if (Array.isArray(k.orte) && k.orte.includes(ortId)) { k.orte = k.orte.filter((x) => x !== ortId); speichereStill(k); ab++; }
  }
  return ab;
}

/* Beim Öffnen eines Textes das passende Klangbild anlegen — nur wenn erlaubt
   und nur, wenn nicht schon genau dieses läuft. */
let _klangbildZuletzt = null;
async function klangbildFolgen(doc) {
  if (!D.einst.klangFolgt) return false;
  const bild = klangbildFuer(doc);
  if (!bild || _klangbildZuletzt === bild.id) return false;
  _klangbildZuletzt = bild.id;
  await klangbildAnwenden(bild);
  toast('Klangbild „' + (bild.titel || 'Ohne Namen') + '" — passend zu diesem Ort.', 3200);
  return true;
}

/* ----- Einschlafen: langsam leiser werden ----- */
let _ausklang = null;
function ausklangLaeuft() { return !!_ausklang; }
function ausklangRestMinuten() {
  if (!_ausklang) return 0;
  return Math.max(0, Math.ceil((_ausklang.ende - Date.now()) / 60000));
}
function ausklangStoppen() {
  if (!_ausklang) return false;
  clearInterval(_ausklang.takt);
  if (typeof setzeLautstaerke === 'function') setzeLautstaerke(_ausklang.start);
  _ausklang = null;
  return true;
}
function ausklangStarten(minuten) {
  ausklangStoppen();
  const dauer = begrenze(minuten, 1, 180, 30) * 60000;
  const start = begrenze(D.einst.lautstaerke, 0, 1, .5);
  const von = Date.now();
  const takt = setInterval(() => {
    const anteil = (Date.now() - von) / dauer;
    if (anteil >= 1) {
      clearInterval(takt);
      _ausklang = null;
      ambienceAllesAus();
      if (typeof alleKlaengeAus === 'function') alleKlaengeAus();
      setzeLautstaerke(start);
      toast('Gute Nacht. Der Klang ist ausgegangen.', 5000);
      return;
    }
    /* die letzten 40 % werden hörbar leiser, davor bleibt es fast gleich */
    const kurve = anteil < .6 ? 1 - anteil * .18 : (1 - .108) * Math.pow(1 - (anteil - .6) / .4, 1.6);
    setzeLautstaerke(start * Math.max(0, kurve));
  }, 2000);
  _ausklang = { ende: von + dauer, start, takt };
  return ausklangRestMinuten();
}

/* Eine eigene Aufnahme hereinholen. */
async function ambienceEigeneHinzufuegen() {
  return new Promise((res) => {
    const inp = el('input', { type: 'file', accept: 'audio/*,.mp3,.ogg,.opus,.m4a,.wav,.flac,.webm', style: 'display:none' });
    document.body.append(inp);
    let fertig = false;
    inp.addEventListener('change', async () => {
      fertig = true;
      const datei = inp.files && inp.files[0];
      inp.remove();
      if (!datei) return res(null);
      if (datei.size > AMBIENCE_MAX) { toast('Die Aufnahme ist zu groß (höchstens ' + Math.round(AMBIENCE_MAX / 1048576) + ' MB).'); return res(null); }
      const name = await eingabe({ titel: 'Wie heißt dieser Klang?', wert: datei.name.replace(/\.[a-z0-9]+$/i, '').slice(0, 60), ok: 'Aufnehmen' });
      if (!name) return res(null);
      try {
        const id = await speichereDateiBlob(datei);
        const doc = neuDoc('klang', { titel: name, datei: id, art: 'Meine', groesse: datei.size, dateiname: datei.name.slice(0, 200) });
        toast('„' + name + '" liegt jetzt bei deinen Klängen.');
        res(doc);
      } catch (e) { toast('Die Aufnahme wollte nicht.'); res(null); }
    });
    inp.addEventListener('cancel', () => { if (!fertig) { inp.remove(); res(null); } });
    inp.click();
  });
}

/* ================================================================
   VANI — Klang: echte Aufnahmen und gewebte Klänge, ein Mischpult
   ================================================================ */

function klangStatuszeile() {
  const status = el('div', { class: 'klangstatus', role: 'status' });
  const neu = () => {
    const z = audioZustand();
    status.className = 'klangstatus ' + (z.ok ? 'laeuft' : z.fehler ? 'fehler' : 'bereit');
    status.textContent = !audioUnterstuetzt() ? 'Klang wird von diesem Browser nicht unterstützt.'
      : z.ok ? (ausklangLaeuft() ? 'Klang läuft — wird in ' + ausklangRestMinuten() + ' Min. leise.' : 'Klang läuft.')
      : z.state === 'suspended' || z.state === 'interrupted' ? 'Klang wartet auf eine Berührung.'
      : z.fehler ? 'Klang braucht einen Neustart: ' + z.fehler
      : 'Klang ist bereit.';
  };
  neu();
  return { knoten: status, neu };
}

/* ----- Reiter 1: echte Aufnahmen ----- */
function baueAmbiencePult(kompakt, statusNeu) {
  const wurzel = el('div', { class: 'ambience-pult' });
  const liste = el('div', { class: 'ambience-liste' });

  const zeileBauen = (a) => {
    const pegel = (D.einst.ambience || {})[a.id] || 0;
    const zeile = el('div', { class: 'ambience-zeile' + (pegel > 0 ? ' an' : ''), 'data-klang': a.id });
    const balken = el('i', { class: 'ambience-balken' });
    const stand = el('span', { class: 'ambience-stand' });
    const schieber = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round(pegel * 100)), 'aria-label': 'Lautstärke ' + a.name });

    const standNeu = async () => {
      if (a.eigen) { stand.textContent = 'eigen'; stand.className = 'ambience-stand da'; return; }
      const da = await ambienceImVorrat(a.id);
      stand.textContent = da ? 'im Gerät' : (a.mb ? a.mb.toFixed(1) + ' MB' : 'holen');
      stand.className = 'ambience-stand ' + (da ? 'da' : 'fehlt');
    };
    standNeu();

    const anAus = async (wert) => {
      const m = { ...(D.einst.ambience || {}) };
      if (wert > 0) m[a.id] = wert; else delete m[a.id];
      zeile.classList.toggle('an', wert > 0);
      zeile.classList.toggle('laedt', wert > 0 && !a.eigen);
      await audioFreigeben();
      const fehler = await ambienceMischungAnwenden(m, (id, p) => {
        if (id !== a.id) return;
        balken.style.width = Math.round(p * 100) + '%';
      });
      zeile.classList.remove('laedt');
      balken.style.width = '';
      const schief = fehler.find((f) => f.id === a.id);
      if (schief) { zeile.classList.remove('an'); schieber.value = '0'; toast(a.name + ': ' + schief.meldung, 4200); }
      standNeu();
      setTimeout(statusNeu, 150);
    };

    schieber.addEventListener('input', () => { zeile.classList.toggle('an', Number(schieber.value) > 0); });
    schieber.addEventListener('change', () => anAus(Number(schieber.value) / 100));
    schieber.addEventListener('pointerdown', () => { audioFreigeben().catch(() => {}); }, { once: true });

    const name = el('button', {
      class: 'ambience-name', onclick: () => {
        const jetzt = Number(schieber.value) / 100;
        const neu = jetzt > 0 ? 0 : .55;
        schieber.value = String(Math.round(neu * 100));
        anAus(neu);
      }
    }, el('span', { class: 'ambience-titel' }, a.name), stand);

    const feinKnopf = el('button', { class: 'ambience-fein-knopf', title: 'Feineinstellung', html: ik('feinheiten'), onclick: () => {
      const offen = zeile.classList.toggle('fein-offen');
      if (offen && !zeile.querySelector('.ambience-fein')) zeile.append(baueFeineinstellung(a, statusNeu));
    } });

    zeile.append(balken, name, schieber, feinKnopf);
    if (a.eigen) {
      langdruck(zeile, async () => {
        const wahl = await menue([
          { text: 'Umbenennen', icon: 'stift', wert: 'name' },
          { text: 'Aus den Klängen nehmen', icon: 'muell', wert: 'weg', rot: true }
        ], a.name);
        if (wahl === 'name') {
          const n = await eingabe({ titel: 'Der Klang heißt jetzt …', wert: a.name });
          if (n) { a.doc.titel = n; speichere(a.doc); zeichne(); }
        } else if (wahl === 'weg' && await frage('„' + a.name + '" entfernen? Die Aufnahme wird gelöscht.', { ja: 'Entfernen', gefahr: true })) {
          ambienceAus(a.id);
          const m = { ...(D.einst.ambience || {}) }; delete m[a.id];
          await ambienceMischungAnwenden(m);
          await loesche(a.doc.id, true);
          zeichne();
        }
      });
    }
    return zeile;
  };

  /* Der Fundus ist auf über sechzig Aufnahmen gewachsen. Ohne Suche scrollt man
     durch acht Blöcke, bis man den Regen findet. Das Feld liegt außerhalb von
     `liste`, damit es beim Neuaufbau den Eingabefokus behält. */
  let filter = '';
  const suche = el('input', {
    type: 'search', class: 'klang-suche', placeholder: 'Klang suchen — Regen, Meer, Café …',
    'aria-label': 'Klang suchen'
  });
  const zaehler = el('span', { class: 'klang-zaehler' });

  const baueListe = () => {
    liste.innerHTML = '';
    const alle = alleAmbiences();
    zaehler.textContent = alle.length ? alle.length + ' Aufnahmen' : '';
    if (!alle.length) {
      liste.append(el('div', { class: 'leer klein' }, 'Noch keine Aufnahmen da. Über „Eigenen Klang" holst du dir welche herein.'));
      return;
    }
    const treffer = !filter ? alle : alle.filter((a) =>
      (a.name || '').toLowerCase().includes(filter) || (a.kat || '').toLowerCase().includes(filter));
    if (!treffer.length) {
      liste.append(el('div', { class: 'leer klein' }, 'Nichts gefunden zu „' + suche.value.trim() + '".'));
      return;
    }
    if (filter) zaehler.textContent = treffer.length + ' von ' + alle.length;
    for (const kat of ambienceKategorien()) {
      const drin = treffer.filter((x) => x.kat === kat);
      if (!drin.length) continue;   /* leere Überschriften wären nur Lärm */
      const block = el('div', { class: 'klangblock' }, el('div', { class: 'kartenkopf', style: 'margin-top:14px' }, kat.toUpperCase()));
      for (const a of drin) block.append(zeileBauen(a));
      liste.append(block);
    }
  };
  suche.addEventListener('input', () => { filter = suche.value.trim().toLowerCase(); baueListe(); });
  suche.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !suche.value) return;
    e.stopPropagation();            /* sonst schließt Escape den ganzen Raum */
    suche.value = ''; filter = ''; baueListe();
  });
  baueListe();

  wurzel.append(el('div', { class: 'klang-suchzeile' }, suche, zaehler), liste);
  wurzel.baueListe = baueListe;
  return wurzel;
}

/* Feineinstellung je Aufnahme — das, was aus einem Loop eine Stimmung macht. */
function baueFeineinstellung(a, statusNeu) {
  const f = ambienceFeinheitVon(a.id);
  const kasten = el('div', { class: 'ambience-fein' });
  const regler = (name, schluessel, min, max, schritt, formatiere) => {
    const wert = el('span', { class: 'fein-wert' }, formatiere(f[schluessel]));
    const s = el('input', { type: 'range', min: String(min), max: String(max), step: String(schritt), value: String(f[schluessel]), 'aria-label': name });
    s.addEventListener('input', () => { wert.textContent = formatiere(Number(s.value)); });
    s.addEventListener('change', () => { ambienceFeinheitSetzen(a.id, { [schluessel]: Number(s.value) }); if (statusNeu) setTimeout(statusNeu, 120); });
    return el('div', { class: 'fein-zeile' }, el('span', { class: 'fein-name' }, name), s, wert);
  };
  kasten.append(
    regler('Tempo', 'tempo', .5, 2, .01, (v) => v === 1 ? 'normal' : (v < 1 ? 'langsamer ' : 'schneller ') + Math.round(Math.abs(1 - v) * 100) + '%'),
    regler('Klarheit', 'klarheit', 300, 20000, 100, (v) => v >= 19900 ? 'offen' : v < 1200 ? 'dumpf' : v < 5000 ? 'weich' : 'klar'),
    regler('Tiefe', 'tiefe', 20, 2000, 10, (v) => v <= 30 ? 'voll' : v < 200 ? 'schlank' : 'fern'),
    regler('Atmen', 'atmen', 0, 1, .05, (v) => v === 0 ? 'gleichmäßig' : v < .4 ? 'ruhig' : v < .75 ? 'lebendig' : 'unruhig'),
    regler('Übergang', 'blende', .5, 12, .5, (v) => v.toFixed(1) + ' s'),
    el('div', { class: 'fein-fuss' },
      el('button', { class: 'knopf zart', onclick: () => {
        ambienceFeinheitSetzen(a.id, { tempo: 1, klarheit: 20000, tiefe: 20, atmen: .35, blende: 4 });
        kasten.replaceWith(baueFeineinstellung(a, statusNeu));
      } }, 'Zurücksetzen'),
      a.quelle ? el('small', { class: 'ambience-quelle', title: a.quelle }, 'Aufnahme: BBC Sound Effects (privat, RemArc)') : null)
  );
  return kasten;
}

/* ----- Klangbilder: Mischungen mit Namen, an Orte gebunden ----- */
function baueKlangbilder(statusNeu, neuZeichnen) {
  const chips = el('div', { class: 'szenenchips' });
  for (const s of KLANG_SZENEN) {
    chips.append(el('button', { class: 'szenenchip gewebt', title: 'Gewebte Klänge', onclick: async () => {
      await audioFreigeben(); mischungAnwenden({ ...s.pegel }); if (neuZeichnen) neuZeichnen(); setTimeout(statusNeu, 150);
    } }, s.name));
  }
  for (const b of klangbilder()) {
    const anzahl = Array.isArray(b.orte) ? b.orte.length : 0;
    const chip = el('button', { class: 'szenenchip eigen', onclick: async () => {
      await audioFreigeben(); await klangbildAnwenden(b); if (neuZeichnen) neuZeichnen(); setTimeout(statusNeu, 200);
    } }, b.titel, anzahl ? el('small', {}, String(anzahl)) : null);
    langdruck(chip, async () => {
      const wahl = await menue([
        { text: 'Umbenennen', icon: 'stift', wert: 'name' },
        { text: 'Mit dem Jetzigen überschreiben', icon: 'wieder', wert: 'ueber' },
        { text: anzahl ? 'Bindungen lösen (' + anzahl + ')' : 'An einen Ort binden …', icon: 'verbinden', wert: anzahl ? 'los' : 'binden' },
        { text: 'Klangbild löschen', icon: 'muell', wert: 'weg', rot: true }
      ], b.titel);
      if (wahl === 'name') {
        const n = await eingabe({ titel: 'Das Klangbild heißt jetzt …', wert: b.titel });
        if (n) { b.titel = n; speichere(b); if (neuZeichnen) neuZeichnen(); }
      } else if (wahl === 'ueber') {
        b.pegel = { ...(D.einst.ambience || {}) };
        b.gewebt = { ...(D.einst.mischung || {}) };
        b.fein = JSON.parse(JSON.stringify(D.einst.ambienceFein || {}));
        b.lautstaerke = begrenze(D.einst.lautstaerke, 0, 1, .5);
        speichere(b); toast('„' + b.titel + '" merkt sich jetzt diese Mischung.');
      } else if (wahl === 'los') {
        b.orte = []; speichereStill(b); toast('Bindungen gelöst.'); if (neuZeichnen) neuZeichnen();
      } else if (wahl === 'binden') {
        const ziel = await waehleDokument(null, 'Woran soll „' + b.titel + '" hängen?');
        if (ziel) { klangbildBinden(b, ziel.id); toast('Hängt jetzt an „' + docName(ziel) + '".'); if (neuZeichnen) neuZeichnen(); }
      } else if (wahl === 'weg' && await frage('„' + b.titel + '" löschen?', { ja: 'Löschen', gefahr: true })) {
        await loesche(b.id, true); if (neuZeichnen) neuZeichnen();
      }
    });
    chips.append(chip);
  }
  chips.append(el('button', { class: 'szenenchip leiser', onclick: async () => {
    await ambienceAllesAus(); alleKlaengeAus(); if (neuZeichnen) neuZeichnen(); setTimeout(statusNeu, 150);
  } }, 'Stille'));
  return chips;
}

/* ----- Das ganze Pult ----- */
function baueMischpult(kompakt) {
  const wurzel = el('div', { class: 'mischpult' + (kompakt ? ' kompakt' : '') });
  const status = klangStatuszeile();
  const inhalt = el('div', { class: 'klang-inhalt' });
  const szenenhalter = el('div');

  let reiter = D.einst.klangReiter === 'gewebt' ? 'gewebt' : 'echt';
  const reiterleiste = el('div', { class: 'wahlgruppe klang-reiter' });
  const neuZeichnen = () => {
    szenenhalter.innerHTML = '';
    szenenhalter.append(el('div', { class: 'kartenkopf' }, el('span', { html: ik('woerter') }), 'KLANGBILDER'),
      baueKlangbilder(status.neu, neuZeichnen));
    inhalt.innerHTML = '';
    inhalt.append(reiter === 'echt' ? baueAmbiencePult(kompakt, status.neu) : baueGewebtPult(kompakt, status.neu));
  };
  for (const [id, name] of [['echt', 'Aufnahmen'], ['gewebt', 'Gewebt']]) {
    reiterleiste.append(el('button', {
      class: reiter === id ? 'an' : '', onclick: (e) => {
        reiter = id; D.einst.klangReiter = id; speichereEinst();
        $$('button', reiterleiste).forEach((b) => b.classList.toggle('an', b === e.currentTarget));
        neuZeichnen();
      }
    }, name));
  }

  wurzel.append(status.knoten, reiterleiste, szenenhalter, inhalt, baueKlangFuss(status.neu, () => neuZeichnen()));
  neuZeichnen();
  return wurzel;
}

/* Reiter 2: die gewebten Klänge (gerechnet, ohne Datei) */
function baueGewebtPult(kompakt, statusNeu) {
  const halter = el('div', { class: 'gewebt-pult' });
  const misch = D.einst.mischung || {};
  for (const kat of KLANG_KATEGORIEN) {
    const block = el('div', { class: 'klangblock' });
    block.append(el('div', { class: 'kartenkopf', style: 'margin-top:14px' }, kat.toUpperCase()));
    for (const ebene of KLANG_EBENEN.filter((e) => e.kat === kat)) {
      const wert = misch[ebene.id] || 0;
      const schieber = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round(wert * 100)), 'aria-label': ebene.name });
      const zeile = el('div', { class: 'klangzeile' + (wert > 0 ? ' an' : '') },
        el('button', {
          class: 'klangname', onclick: async () => {
            const m = D.einst.mischung || {};
            if ((m[ebene.id] || 0) > 0) { delete m[ebene.id]; schieber.value = '0'; }
            else { m[ebene.id] = .5; schieber.value = '50'; await audioFreigeben(); }
            mischungAnwenden(m);
            zeile.classList.toggle('an', !!m[ebene.id]);
            setTimeout(statusNeu, 120);
          }
        }, ebene.name),
        schieber
      );
      schieber.addEventListener('input', () => {
        const m = D.einst.mischung || {};
        const v = parseInt(schieber.value, 10) / 100;
        if (v > 0) m[ebene.id] = v; else delete m[ebene.id];
        mischungAnwenden(m);
        zeile.classList.toggle('an', v > 0);
        setTimeout(statusNeu, 120);
      });
      schieber.addEventListener('pointerdown', () => { audioFreigeben().catch(() => {}); }, { once: true });
      block.append(zeile);
    }
    halter.append(block);
  }
  return halter;
}

/* Fuß: Gesamtlautstärke, Merken, Einschlafen, Vorrat, Prüfton */
function baueKlangFuss(statusNeu, neuZeichnen) {
  const laut = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round((D.einst.lautstaerke ?? .5) * 100)), 'aria-label': 'Gesamtlautstärke' });
  laut.addEventListener('input', () => { setzeLautstaerke(parseInt(laut.value, 10) / 100); statusNeu(); });

  const ausklangKnopf = el('button', { class: 'knopf' + (ausklangLaeuft() ? ' voll' : ''), onclick: async () => {
    if (ausklangLaeuft()) { ausklangStoppen(); toast('Einschlafen abgebrochen.'); neuZeichnen(); return; }
    const min = await menue([
      { text: 'In 15 Minuten', wert: 15 }, { text: 'In 30 Minuten', wert: 30 },
      { text: 'In 45 Minuten', wert: 45 }, { text: 'In einer Stunde', wert: 60 },
      { text: 'In zwei Stunden', wert: 120 }
    ], 'Langsam leiser werden und ausgehen');
    if (!min) return;
    ausklangStarten(min);
    toast('Der Klang wird in ' + min + ' Minuten leise. Schlaf gut.', 4200);
    neuZeichnen();
  } }, ausklangLaeuft() ? 'Einschlafen: noch ' + ausklangRestMinuten() + ' Min.' : 'Einschlafen …');

  const folgt = el('button', {
    class: 'schalter' + (D.einst.klangFolgt ? ' an' : ''), title: 'Klangbilder folgen dem Text',
    onclick: (e) => { D.einst.klangFolgt = !D.einst.klangFolgt; e.currentTarget.classList.toggle('an', D.einst.klangFolgt); speichereEinst(); }
  }, el('i'));

  return el('div', { class: 'klangfuss' },
    el('div', { class: 'klangzeile an', style: 'box-shadow:none' }, el('span', { class: 'klangname', style: 'font-weight:600' }, 'Gesamt'), laut),
    el('div', { class: 'einstellzeile klang-folgt' },
      el('span', { class: 'ename' }, 'Klangbilder folgen dem Text',
        el('div', { style: 'font-size:12.5px;color:var(--blass)' }, 'Wenn ich eine Szene öffne, an der ein Klangbild hängt, legt es sich von selbst auf.')),
      folgt),
    el('div', { class: 'fussreihe' },
      el('button', { class: 'knopf voll', onclick: async () => {
        const name = await eingabe({ titel: 'Dieses Klangbild heißt …', platzhalter: 'z. B. Regen überm Schreibtisch' });
        if (!name) return;
        klangbildJetzt(name);
        toast('Gemerkt. Lange drücken, um es an eine Szene zu hängen.', 4200);
        neuZeichnen();
      } }, 'Klangbild merken'),
      el('button', { class: 'knopf', onclick: () => ambienceEigeneHinzufuegen().then((d) => { if (d) neuZeichnen(); }) }, '+ Eigener Klang'),
      ausklangKnopf,
      el('button', { class: 'knopf zart', onclick: async () => {
        if ((D.einst.lautstaerke || 0) <= 0) { setzeLautstaerke(.5); laut.value = '50'; }
        const ok = await audioFreigeben({ probe: true });
        toast(ok ? 'Du solltest jetzt einen hellen Prüfton hören.' : 'Der Klang ist noch gesperrt. Tippe auf „Klang neu wecken".');
        setTimeout(statusNeu, 120);
      } }, 'Ton prüfen'),
      el('button', { class: 'knopf zart', onclick: async () => {
        if (await audioFreigeben({ neu: true, probe: true })) toast('Klang frisch aufgeweckt.');
        else toast('Der Browser gibt den Klang gerade nicht frei.');
        setTimeout(statusNeu, 120);
      } }, 'Klang neu wecken'),
      el('button', { class: 'knopf zart', onclick: () => zeigeKlangVorrat(neuZeichnen) }, 'Vorrat …')
    )
  );
}

/* Der Vorrat: was liegt schon im Gerät, was fehlt noch */
async function zeigeKlangVorrat(neuZeichnen) {
  const stand = await ambienceVorratStand();
  const mb = (stand.bytes / 1048576).toFixed(1);
  const kasten = el('div', { class: 'modal' },
    el('div', { class: 'kartenkopf' }, el('span', { html: ik('klang') }), 'KLANGVORRAT'),
    el('h2', {}, 'Was schon im Gerät liegt'),
    el('p', { style: 'font-size:14px;color:var(--blass);line-height:1.6' },
      stand.da.length + (stand.da.length === 1 ? ' Aufnahme liegt' : ' Aufnahmen liegen') + ' hier und brauchen kein Internet mehr (' + mb + ' MB). '
      + (stand.fehlt.length ? stand.fehlt.length + ' warten noch im Netz.' : 'Es fehlt nichts.')),
    el('div', { class: 'reihe', style: 'flex-wrap:wrap;justify-content:flex-start' },
      stand.fehlt.length ? el('button', { class: 'knopf voll', onclick: async () => {
        zu();
        toast('Hole ' + stand.fehlt.length + ' Aufnahmen …', 4000);
        let ok = 0;
        for (const id of stand.fehlt) { try { await ambienceBlob(id); ok++; } catch (e) {} }
        toast(ok + ' Aufnahmen liegen jetzt im Gerät. Ab jetzt auch offline.', 5000);
        if (neuZeichnen) neuZeichnen();
      } }, 'Alle holen (' + stand.fehlt.length + ')') : null,
      stand.bytes ? el('button', { class: 'knopf zart', onclick: async () => {
        if (!await frage('Alle geholten Aufnahmen aus dem Gerät nehmen? Sie lassen sich jederzeit wieder holen.', { ja: 'Platz schaffen', gefahr: true })) return;
        await ambienceAllesAus();
        const weg = await ambienceVorratLeeren();
        zu(); toast(weg + ' Aufnahmen entfernt.');
        if (neuZeichnen) neuZeichnen();
      } }, 'Platz schaffen') : null,
      el('button', { class: 'knopf', onclick: () => zu() }, 'Fertig')));
  const zu = zeigeDeck(kasten);
}

RENDER.klang = function (haupt) {
  haupt.append(raumkopf('Klang', 'echte Aufnahmen und gewebte Klänge — mischen erlaubt'));
  const inhalt = el('div', { class: 'inhalt' });
  inhalt.append(baueMischpult(false));
  haupt.append(inhalt);
};

/* Kompakte Fassung als Überlagerung (aus dem Schreibraum) */
function oeffneMischpult() {
  const kasten = el('div', { class: 'modal', style: 'width:min(620px,calc(100vw - 40px))' },
    el('h2', {}, 'Klang'),
    baueMischpult(true),
    el('div', { class: 'reihe' }, el('button', { class: 'knopf voll', onclick: () => zu() }, 'Fertig'))
  );
  const zu = zeigeDeck(kasten);
}
