  haupt.append(inhalt);
};

/* ----- Text von außen hereinholen -----
   Auf einem verwalteten iPad lässt sich oft keine Datei auswählen. Kopieren und
   Einfügen geht immer. Hier landet alles in einem ruhigen Feld, wird von fremden
   Schriftgrößen, Farben und Hintergründen befreit und danach als Seite abgelegt. */
async function textHereinholen(heft, danach) {
  const feld = el('div', {
    class: 'rich-editor text einfuegefeld', contenteditable: 'true', role: 'textbox',
    'aria-multiline': 'true', 'data-placeholder': 'Hier hinein einfügen — ⌘V oder lange tippen und „Einsetzen".'
  });
  const zaehler = el('div', { class: 'einfuege-zaehler' }, 'Noch nichts eingesetzt.');
  const messen = () => {
    const w = worte(richReinerText(feld.innerHTML));
    zaehler.textContent = w ? (w === 1 ? 'Ein Wort bereit.' : w.toLocaleString('de-DE') + ' Wörter bereit.') : 'Noch nichts eingesetzt.';
  };
  feld.addEventListener('paste', (e) => {
    if (!e.clipboardData) return;
    const html = e.clipboardData.getData('text/html');
    const roh = e.clipboardData.getData('text/plain');
    if (!html && !roh) return;
    e.preventDefault();
    richBefehl(feld, 'insertHTML', html ? einfuegeHTML(html) : einfuegeAusText(roh));
    setTimeout(messen, 0);
  });
  feld.addEventListener('input', messen);

  return new Promise((res) => {
    const kasten = el('div', { class: 'modal einfuege-modal' },
      el('div', { class: 'kartenkopf' }, el('span', { html: ik('runter') }), 'TEXT HEREINHOLEN'),
      el('h2', {}, 'Aus einer anderen App in „' + heft.titel + '"'),
      el('p', { class: 'einfuege-hinweis' }, 'In Goodnotes alles markieren und kopieren, dann hier einsetzen. VANI nimmt die fremden Schriftgrößen, Farben und Hintergründe heraus und behält Absätze, Überschriften, Listen und Hervorhebungen.'),
      feld, zaehler,
      el('div', { class: 'reihe' },
        el('button', { class: 'knopf zart', onclick: () => { res(null); zu(); } }, 'Abbrechen'),
        el('button', { class: 'knopf voll', onclick: () => {
          const rich = sauberesRichHTML(feld.innerHTML);
          const text = richReinerText(rich).replace(/\n{3,}/g, '\n\n').trim();
          if (!text) { toast('Da ist noch nichts zum Hereinholen.'); return; }
          const seiten = kinder(heft.id, 'seite');
          const letzte = seiten[seiten.length - 1];
          const zielIstLeer = letzte && !(letzte.text || '').trim() && !kinder(letzte.id).length;
          let seite;
          if (zielIstLeer) {
            seite = letzte;
            seite.rich = rich; seite.text = text; seite.format = 'rich';
            speichere(seite);
          } else {
            seite = neuDoc('seite', { parent: heft.id, ord: seiten.length, titel: '', text, rich, format: 'rich' });
          }
          D.stats.letzte[seite.id] = worte(text); speichereStats();
          heft.geaendert = Date.now(); speichereStill(heft);
          res(seite);
          zu();
          toast(worte(text).toLocaleString('de-DE') + ' Wörter sind angekommen. In der Ansicht „Am Stück" liegt alles auf einer langen Seite.', 5200);
          if (danach) danach();
        } }, 'Hereinholen')));
    const zu = zeigeDeck(kasten, () => res(null));
    setTimeout(() => feld.focus(), 80);
  });
}

async function heftMenue(h, danach) {
  const wahl = await menue([
    { text: 'Umbenennen', icon: 'stift', wert: 'name' },
    { text: 'Umschlag & Papier gestalten', icon: 'farbe', wert: 'gestalten' },
    { text: 'Ansicht: ' + ({ rolle: 'Seiten untereinander', fluss: 'eine lange Seite am Stück' }[h.ansicht] || 'einzelne Seiten'), icon: 'lesen', wert: 'ansicht' },
    { text: h.projektRef ? 'Projekt-Zuordnung ändern' : 'Einem Projekt zuordnen', icon: 'projekte', wert: 'projekt' },
    { text: 'Text aus einer anderen App hereinholen', icon: 'runter', wert: 'einfuegen' },
    { text: 'Hinzufügen & verbinden', icon: 'verbinden', wert: 'dazu' },
    h.archiv ? { text: 'Zurück auf den Tisch', icon: 'archiv', wert: 'zurueck' } : { text: 'Ins Regal stellen', icon: 'archiv', wert: 'archiv' },
    { text: 'Heft verbrennen', icon: 'muell', wert: 'weg', rot: true }
  ], h.titel);
  if (wahl === 'name') {
    const neu = await eingabe({ titel: 'Das Heft heißt jetzt …', wert: h.titel });
    if (neu) { h.titel = neu; speichere(h); }
  } else if (wahl === 'gestalten') {
    await heftGestalten(h, danach); return;
  } else if (wahl === 'ansicht') {
    h.ansicht = { seiten: 'rolle', rolle: 'fluss' }[h.ansicht || 'seiten'] || 'seiten'; speichere(h);
  } else if (wahl === 'einfuegen') {
    await textHereinholen(h, danach); return;
  } else if (wahl === 'projekt') {
    await ordneHeftProjektZu(h);
  } else if (wahl === 'dazu') {
    await hinzufuegenMenue(h);
  } else if (wahl === 'archiv') {
    h.archiv = Date.now(); speichereStill(h);
    toast('Feierlich ins Regal gestellt.');
  } else if (wahl === 'zurueck') {
    delete h.archiv; speichereStill(h);
  } else if (wahl === 'weg') {
    const seiten = kinder(h.id, 'seite').length;
    if (await frage('„' + h.titel + '" mit ' + (seiten === 1 ? 'einer Seite' : seiten + ' Seiten') + ' in den Papierkorb legen?', { ja: 'In den Papierkorb', gefahr: true })) {
      await loesche(h.id);
      if (location.hash.includes(h.id)) location.hash = '#/hefte';
    }
  }
  if (danach) danach();
}

/* ----- Ein Heft, eine Seite ----- */
RENDER.heft = function (haupt, heftId) {
  const heft = D.docs.get(heftId);
  if (!heft) { location.hash = '#/hefte'; return; }

  let seiten = kinder(heft.id, 'seite');
  if (!seiten.length) {
    neuDoc('seite', { parent: heft.id, ord: 0, titel: '', text: '' });
    seiten = kinder(heft.id, 'seite');
  }

  let idx = Math.min(seiten.length - 1, parseInt(sessionStorage.getItem('heftSeite:' + heftId) || '0', 10) || 0);
  /* Das Lesezeichen öffnet das Heft dort, wo ich zuletzt „hierher" gesagt habe —
     nur beim ersten Öffnen in dieser Sitzung, danach zählt die letzte Seite. */
  if (!sessionStorage.getItem('heftSeite:' + heftId) && heft.lesezeichen) {
    const li = seiten.findIndex((s) => s.id === heft.lesezeichen);
    if (li >= 0) idx = li;
  }
  /* Ein Sprungziel (Inhalt, Suche, verschobene oder verdoppelte Seite) wird
     genau einmal eingelöst — in jeder Ansicht, und ohne später nachzuwirken. */
  let springZu = null;
  const zielAufnehmen = () => {
    const z = sessionStorage.getItem('zielSeite');
    if (!z) return null;
    sessionStorage.removeItem('zielSeite');
    return z;
  };
  const ziel = zielAufnehmen();
  if (ziel) {
    const zi = seiten.findIndex((s) => s.id === ziel);
    if (zi >= 0) { idx = zi; springZu = ziel; }
  }
  const scrolleZuZiel = () => {
    if (!springZu) return;
    requestAnimationFrame(() => {
      const z = halter.querySelector('[data-seite="' + springZu + '"]');
      if (z) z.scrollIntoView({ behavior: 'smooth', block: 'start' });
      springZu = null;
    });
  };

  haupt.append(el('div', { class: 'kopf' },
    zurueckknopf('#/hefte'),
    el('h1', {}, heft.titel),
    el('div', { class: 'heft-ansichtswahl', role: 'group', 'aria-label': 'Heftansicht' },
      el('button', { class: (heft.ansicht || 'seiten') === 'seiten' ? 'an' : '', title: 'Einzelne Seiten', onclick: () => { heft.ansicht = 'seiten'; speichere(heft); zeichne(); } }, 'Seiten'),
      el('button', { class: heft.ansicht === 'rolle' ? 'an' : '', title: 'Seite für Seite untereinander', onclick: () => { heft.ansicht = 'rolle'; speichere(heft); zeichne(); } }, 'Rolle'),
      el('button', { class: heft.ansicht === 'fluss' ? 'an' : '', title: 'Eine einzige lange Seite, ohne Umbruch', onclick: () => { heft.ansicht = 'fluss'; speichere(heft); zeichne(); } }, 'Am Stück')),
    el('button', { class: 'rundknopf zart', html: ik('inhalt'), title: 'Inhalt: alle Seiten', onclick: () => heftInhalt(heft, (seite) => {
      sessionStorage.setItem('zielSeite', seite.id); zeichne();
    }) }),
    el('button', { class: 'rundknopf zart', html: ik('mehr'), title: 'Heft-Menü', onclick: () => heftMenue(heft, () => zeichne()) })
  ));

  const inhalt = el('div', { class: 'inhalt' });
  const halter = el('div', { class: 'seitenhalter' });
  const fuss = el('div', { class: 'seitenfuss' });
  inhalt.append(halter, fuss);
  haupt.append(inhalt);

  function zeigeRolle() {
    seiten = kinder(heft.id, 'seite');
    { const z = zielAufnehmen(); if (z) springZu = z; }
    halter.className = 'heftrolle'; fuss.style.display = 'none'; halter.innerHTML = '';
    for (let i = 0; i < seiten.length; i++) {
      const seite = seiten[i];
      halter.append(el('section', { class: 'rollen-seite', 'data-seite': seite.id },
        el('div', { class: 'rollen-seitennummer' }, 'Seite ' + (i + 1)),
        baueSeite(seite, heft, zeigeRolle, { rolle: true })));
    }
    halter.append(el('button', { class: 'plusskarte rollen-plus', onclick: () => {
      neuDoc('seite', { parent: heft.id, ord: seiten.length, titel: '', text: '' });
      heft.geaendert = Date.now(); speichereStill(heft); zeigeRolle();
      requestAnimationFrame(() => { const letzte = halter.lastElementChild && halter.lastElementChild.previousElementSibling; if (letzte) letzte.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    } }, el('span', { html: ik('plus'), style: 'display:flex' }), 'Neue Seite darunter'));
    scrolleZuZiel();
  }

  /* Am Stück: alles Geschriebene auf einer einzigen langen Seite. Kein Umbruch,
     keine Seitenkanten dazwischen — zum Lesen und zum Hineinschütten großer
     Textmengen aus anderen Apps. */
  function zeigeFluss() {
    seiten = kinder(heft.id, 'seite');
    { const z = zielAufnehmen(); if (z) springZu = z; }
    halter.className = 'heftfluss'; fuss.style.display = 'none'; halter.innerHTML = '';
    const bogen = el('div', { class: 'fluss-bogen ' + (heft.papier || 'liniert') + ' papierfarbe-' + (heft.papierfarbe || 'hell') });
    /* Ein Werkzeug für die ganze lange Seite. Es wirkt auf das Stück, in dem
       gerade geschrieben wird — sonst auf das letzte. */
    const aktuellesStueck = () => {
      const aktiv = document.activeElement && document.activeElement.closest
        ? document.activeElement.closest('.papierseite.fluss')
        : null;
      const blatt = (aktiv && bogen.contains(aktiv)) ? aktiv : $$('.papierseite.fluss', bogen).pop();
      if (!blatt) return null;
      const seite = D.docs.get(blatt.dataset.seite);
      return seite ? { seite, blatt, heft } : null;
    };
    bogen.append(seitenWerkzeuge(aktuellesStueck, { neuZeichnen: zeigeFluss, klasse: 'fluss-werkzeuge' }));
    for (const seite of seiten) bogen.append(baueSeite(seite, heft, zeigeFluss, { fluss: true }));
    halter.append(bogen);
    halter.append(el('button', { class: 'plusskarte rollen-plus', onclick: () => {
      neuDoc('seite', { parent: heft.id, ord: kinder(heft.id, 'seite').length, titel: '', text: '' });
      heft.geaendert = Date.now(); speichereStill(heft); zeigeFluss();
    } }, el('span', { html: ik('plus'), style: 'display:flex' }), 'Noch ein Stück anfügen'));
    scrolleZuZiel();
  }

  function zeigeSeite() {
    seiten = kinder(heft.id, 'seite');
    /* Ein Heft bleibt immer benutzbar, auch wenn seine letzte Seite
       herausgenommen oder gelöscht wurde. */
    if (!seiten.length) {
      neuDoc('seite', { parent: heft.id, ord: 0, titel: '', text: '' });
      seiten = kinder(heft.id, 'seite');
      idx = 0;
    }
    { const z = zielAufnehmen(); if (z) { const zi = seiten.findIndex((s) => s.id === z); if (zi >= 0) idx = zi; } }
    idx = Math.max(0, Math.min(idx, seiten.length - 1));
    sessionStorage.setItem('heftSeite:' + heftId, String(idx));
    const seite = seiten[idx];
    halter.innerHTML = '';
    fuss.innerHTML = '';
    halter.append(baueSeite(seite, heft, zeigeSeite, {
      autoWeiter: D.einst.autoSeitenwechsel !== false ? (weiter) => {
        const paket = weiter && typeof weiter === 'object'
          ? { text: String(weiter.text || ''), rich: String(weiter.rich || ''), format: weiter.format === 'rich' ? 'rich' : 'plain' }
          : { text: String(weiter || ''), rich: '', format: 'plain' };
        seiten = kinder(heft.id, 'seite');
        let naechste = seiten[idx + 1];
        const leerUndFrei = naechste && !(naechste.text || '').trim() && !kinder(naechste.id).length;
        if (!leerUndFrei) {
          for (let i = seiten.length - 1; i > idx; i--) { seiten[i].ord = i + 1; speichereStill(seiten[i]); }
          naechste = neuDoc('seite', { parent: heft.id, ord: idx + 1, titel: '', text: paket.text, rich: paket.rich, format: paket.format });
        } else {
          naechste.text = paket.text; naechste.rich = paket.rich; naechste.format = paket.format;
          speichere(naechste); D.stats.letzte[naechste.id] = worte(paket.text);
        }
        idx++;
        heft.geaendert = Date.now(); speichereStill(heft);
        zeigeSeite();
        requestAnimationFrame(() => {
          const feld = $('.schreibflaeche', halter);
          if (feld) {
            feld.focus();
            if (feld.setSelectionRange) feld.setSelectionRange(feld.value.length, feld.value.length);
            else { const r = document.createRange(), s = window.getSelection(); r.selectNodeContents(feld); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
            /* Ein großer Paste kann mehrere Seiten auf einmal füllen. Der
               neue Rest wird daher erneut geprüft, bis die letzte Seite
               tatsächlich hineinpasst. */
            if (feld.scrollHeight > feld.clientHeight + 2) {
              feld.dispatchEvent(new Event('input', { bubbles: true }));
            }
          }
        });
        toast('Weiter auf Seite ' + (idx + 1) + '.');
      } : null
    }));

    fuss.append(
      el('button', { class: 'rundknopf zart', html: ik('zurueck'), title: 'Vorherige Seite', style: idx === 0 ? 'opacity:.25;pointer-events:none' : '', onclick: () => { idx--; zeigeSeite(); } }),
      el('div', { class: 'snummer' }, 'Seite ' + (idx + 1) + ' von ' + seiten.length),
      el('button', { class: 'rundknopf zart', html: ik('rechts'), title: 'Nächste Seite', style: idx === seiten.length - 1 ? 'opacity:.25;pointer-events:none' : '', onclick: () => { idx++; zeigeSeite(); } }),
      el('button', {
        class: 'rundknopf', html: ik('plus'), title: 'Neue Seite', onclick: () => {
          neuDoc('seite', { parent: heft.id, ord: seiten.length, titel: '', text: '' });
          heft.geaendert = Date.now(); speichereStill(heft);
          idx = seiten.length; zeigeSeite();
        }
      }),
      el('button', {
        class: 'auto-weiter-schalter' + (D.einst.autoSeitenwechsel !== false ? ' an' : ''),
        title: 'Automatisch auf die nächste Seite', onclick: () => {
          D.einst.autoSeitenwechsel = D.einst.autoSeitenwechsel === false;
          speichereEinst(); zeigeSeite();
        }
      }, 'Auto weiter ' + (D.einst.autoSeitenwechsel !== false ? 'an' : 'aus'))
    );
  }
  if (heft.ansicht === 'rolle') zeigeRolle();
  else if (heft.ansicht === 'fluss') zeigeFluss();
  else zeigeSeite();
};

/* Das Inhaltsverzeichnis: jede Seite mit Titel oder erster Zeile, Wörtern und
   Lesezeichen. Ein Tipp springt hin — in jeder Ansicht. */
function heftInhalt(heft, wohin) {
  const seiten = kinder(heft.id, 'seite');
  return menue(seiten.map((s, i) => {
    const erste = (s.titel || (s.text || '').trim().split('\n').find((z) => z.trim()) || '').trim();
    const w = worte(s.text);
    const anlagen = kinder(s.id).length;
    return {
      text: (i + 1) + ' · ' + (erste ? erste.slice(0, 44) : 'Leere Seite') + (w ? '  —  ' + w + ' W.' : '') + (anlagen ? ' · ' + anlagen + ' angeklebt' : ''),
      icon: heft.lesezeichen === s.id ? 'lesezeichen' : (s.skizze ? 'stift' : null), wert: s.id
    };
  }), 'Inhalt · ' + seiten.length + (seiten.length === 1 ? ' Seite' : ' Seiten')).then((id) => {
    const seite = id && D.docs.get(id);
    if (seite && wohin) wohin(seite);
  });
}

/* Eine Werkzeugreihe, zwei Verwendungen: fest an einer Seite oder oben an der
   langen Seite. ziel() sagt beim Antippen, welches Stück gerade gemeint ist. */
function seitenWerkzeuge(ziel, { neuZeichnen, frisch, klasse } = {}) {
  const auffrischen = () => { if (frisch) frisch(); else if (neuZeichnen) neuZeichnen(); };
  return el('div', { class: 'seitenwerkzeuge' + (klasse ? ' ' + klasse : '') },
    el('button', {
      class: 'rundknopf', title: 'Zettel ankleben', html: ik('pin'), onclick: () => {
        const z = ziel(); if (!z) return;
        neuDoc('zettel', { parent: z.seite.id, text: '', farbe: zufall(['gelb', 'rosa', 'blau', 'gruen']), pos: { x: 8 + Math.random() * 40, y: 6 + Math.random() * 20, rot: -4 + Math.random() * 8, w: 30 } });
        auffrischen();
      }
    }),
    el('button', {
      class: 'rundknopf', title: 'Foto einkleben', html: ik('kamera'), onclick: async () => {
        const z = ziel(); if (!z) return;
        const bild = await waehleBild();
        if (!bild) return;
        neuDoc('foto', { parent: z.seite.id, bild: bild.id, pos: { x: 12 + Math.random() * 35, y: 8 + Math.random() * 20, rot: -3 + Math.random() * 6, w: 42 } });
        auffrischen();
      }
    }),
    el('button', { class: 'rundknopf', title: 'Kritzeln', html: ik('stift'), onclick: () => {
      const z = ziel(); if (z) starteKritzeln(z.blatt, z.seite);
    } }),
    el('button', { class: 'rundknopf', title: 'Sticker aufkleben', html: ik('sticker'), onclick: async () => {
      const z = ziel(); if (!z) return;
      const s = await stickerAufkleben(z.seite);
      if (s) auffrischen();
    } }),
    el('button', { class: 'rundknopf format-seite-knopf', title: 'Text formatieren', onclick: () => {
      const z = ziel(); if (!z) return;
      if (z.seite.format !== 'rich') {
        z.seite.format = 'rich'; z.seite.rich = richAusText(z.seite.text || ''); speichere(z.seite);
        if (neuZeichnen) neuZeichnen();
      } else {
        const leiste = $('.formatleiste', z.blatt);
        if (leiste) leiste.classList.toggle('eingeklappt');
      }
    } }, 'Aa'),
    el('button', {
      class: 'rundknopf', title: 'Mehr', html: ik('mehr'), onclick: async () => {
        const z = ziel(); if (!z) return;
        const geschwister = kinder(z.heft.id, 'seite');
        const i = geschwister.findIndex((x) => x.id === z.seite.id);
        const istLesezeichen = z.heft.lesezeichen === z.seite.id;
        const wahl = await menue([
          { text: 'Im Schreibraum öffnen', icon: 'stift', wert: 'sr' },
          { text: istLesezeichen ? 'Lesezeichen entfernen' : 'Lesezeichen hierher', icon: 'lesezeichen', wert: 'lesezeichen' },
          i > 0 ? { text: 'Seite nach vorn', icon: 'auf', wert: 'vor' } : null,
          i < geschwister.length - 1 ? { text: 'Seite nach hinten', icon: 'ab', wert: 'zurueck' } : null,
          { text: 'Seite verdoppeln', icon: 'wandel', wert: 'doppel' },
          { text: 'Hinzufügen & verbinden', icon: 'verbinden', wert: 'dazu' },
          { text: 'Als loses Blatt herausnehmen', icon: 'blatt', wert: 'blatt' },
          { text: 'Seite herausreißen', icon: 'muell', wert: 'weg', rot: true }
        ], 'Seite ' + (i + 1) + ' von ' + geschwister.length);
        if (wahl === 'sr') oeffneSchreibraum(z.seite.id);
        else if (wahl === 'lesezeichen') {
          if (istLesezeichen) delete z.heft.lesezeichen; else z.heft.lesezeichen = z.seite.id;
          speichereStill(z.heft);
          toast(istLesezeichen ? 'Lesezeichen entfernt.' : 'Lesezeichen liegt auf Seite ' + (i + 1) + '. Das Heft öffnet sich hier.');
          if (neuZeichnen) neuZeichnen();
        } else if (wahl === 'vor' || wahl === 'zurueck') {
          const j = wahl === 'vor' ? i - 1 : i + 1;
          geschwister.forEach((x, n) => { x.ord = n; });
          [geschwister[i].ord, geschwister[j].ord] = [j, i];
          geschwister.forEach((x) => speichereStill(x));
          sessionStorage.setItem('zielSeite', z.seite.id);
          if (neuZeichnen) neuZeichnen();
        } else if (wahl === 'doppel') {
          geschwister.forEach((x, n) => { x.ord = n >= i + 1 ? n + 1 : n; speichereStill(x); });
          const kopie = neuDoc('seite', { parent: z.heft.id, ord: i + 1, titel: z.seite.titel ? z.seite.titel + ' (Abschrift)' : '', text: z.seite.text || '', rich: z.seite.rich || '', format: z.seite.format || 'plain' });
          for (const a of kinder(z.seite.id)) {
            if (a.typ === 'zettel') neuDoc('zettel', { parent: kopie.id, text: a.text, farbe: a.farbe, schrift: a.schrift, befestigung: a.befestigung, pos: Object.assign({}, a.pos) });
            else if (a.typ === 'sticker') neuDoc('sticker', { parent: kopie.id, bild: a.bild, verhaeltnis: a.verhaeltnis, befestigung: 'lose', pos: Object.assign({}, a.pos) });
          }
          sessionStorage.setItem('zielSeite', kopie.id);
          toast('Verdoppelt. Fotos und Kritzeleien bleiben beim Original.');
          if (neuZeichnen) neuZeichnen();
        }
        else if (wahl === 'dazu') await hinzufuegenMenue(z.seite);
        else if (wahl === 'blatt') {
          seiteZuBlatt(z.seite); toast('Liegt jetzt wieder bei den Blättern.');
          if (neuZeichnen) neuZeichnen();
        } else if (wahl === 'weg' && await frage('Diese Seite herausreißen? Alles darauf geht mit.', { ja: 'Herausreißen', gefahr: true })) {
          await loesche(z.seite.id);
          kinder(z.heft.id, 'seite').forEach((x, i) => { x.ord = i; speichereStill(x); });
          if (neuZeichnen) neuZeichnen();
        }
      }
    })
  );
}

function baueSeite(seite, heft, neuZeichnen, optionen = {}) {
  const blatt = el('div', { class: papierKlassen(heft, optionen.fluss ? ' fluss' : ''), 'data-seite': seite.id });

  /* Werkzeuge: auf einer einzelnen Seite oben rechts auf dem Papier. In der
     Ansicht „Am Stück" gibt es sie nur einmal ganz oben — dort ist alles eine
     einzige lange Seite, und eine Werkzeugreihe je Stück wäre bloß Lärm. */
  const werkzeuge = optionen.fluss ? null : seitenWerkzeuge(
    () => ({ seite, blatt, heft }), { neuZeichnen, frisch: () => baueAnlagen() });

  /* Titel + Text */
  const titel = el('input', { class: 'stitel serif', type: 'text', value: seite.titel || '', placeholder: 'Überschrift, wenn du magst' });
  titel.addEventListener('input', entprellt(() => { seite.titel = titel.value; speichere(seite); }, 400));

  let text, formatleiste = null;
  if (seite.format === 'rich') {
    const rp = baueRichEditor(seite, { class: 'schreibflaeche', platzhalter: 'Hier darf alles stehen.', kompakt: true });
    text = rp.editor; formatleiste = rp.leiste;
    if (optionen.rolle || optionen.fluss) text.classList.add('rollen-rich');
    if (optionen.autoWeiter) {
      text.classList.add('auto-weiter');
      let richBlaettert = false;
      const pruefeRich = () => requestAnimationFrame(() => {
        if (richBlaettert || !text.isConnected || text.scrollHeight <= text.clientHeight + 2) return;
        const passt = (html) => {
          const messer = text.cloneNode(false);
          messer.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;left:0;top:0;min-height:0;max-height:none;overflow:hidden;width:' + text.clientWidth + 'px';
          messer.innerHTML = html; blatt.append(messer);
          const ok = messer.scrollHeight <= text.clientHeight + 2; messer.remove(); return ok;
        };
        const teil = richTeileFuerHoehe(text, passt);
        if (!teil) return;
        richBlaettert = true; rp.sichern.sofort();
        text.innerHTML = teil.hier; seite.rich = teil.hier; seite.text = richReinerText(teil.hier).trimEnd(); seite.format = 'rich'; speichere(seite);
        D.stats.letzte[seite.id] = worte(seite.text); speichereStats();
        optionen.autoWeiter({ rich: teil.weiter, text: richReinerText(teil.weiter).trimStart(), format: 'rich' });
      });
      text.addEventListener('input', pruefeRich);
      requestAnimationFrame(() => { if (text.isConnected && text.scrollHeight > text.clientHeight + 2) pruefeRich(); });
    }
  } else {
    text = el('textarea', { class: 'schreibflaeche text', placeholder: 'Hier darf alles stehen.' });
    text.value = seite.text || '';
    if (optionen.autoWeiter) text.classList.add('auto-weiter'); else autogrow(text);
    const sichereText = entprellt(() => {
      seite.text = text.value;
      speichere(seite);
      zaehleWorte(seite.id, seite.text);
    }, 400, true);
    let blaettert = false;
    text.addEventListener('input', () => {
      sichereText();
      if (!optionen.autoWeiter || blaettert || text.selectionStart < text.value.length - 2) return;
      requestAnimationFrame(() => {
        if (blaettert || !text.isConnected) return;
        const passt = (wert) => {
          const messer = text.cloneNode();
          messer.className = text.className;
          messer.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;height:auto;min-height:0;max-height:none;overflow:hidden;width:' + text.clientWidth + 'px';
          messer.value = wert; blatt.append(messer);
          const ok = messer.scrollHeight <= text.clientHeight + 2;
          messer.remove(); return ok;
        };
        const teil = seitenUmbruch(text.value, passt);
        if (!teil) return;
        blaettert = true;
        sichereText.sofort(); /* zählt den eben geschriebenen Zuwachs noch auf dieser Seite */
        text.value = teil.hier; seite.text = teil.hier; speichere(seite);
        D.stats.letzte[seite.id] = worte(teil.hier); speichereStats();
        optionen.autoWeiter(teil.weiter);
      });
    });
    if (optionen.autoWeiter) requestAnimationFrame(() => { if (text.isConnected && text.scrollHeight > text.clientHeight + 2) text.dispatchEvent(new Event('input', { bubbles: true })); });
  }

  const skizzenbild = el('div', { class: 'skizzenbild' });
  if (seite.skizze) {
    const img = el('img', { alt: '' });
    setzeBild(img, seite.skizze);
    skizzenbild.append(img);
  }

  /* Ohne Filter macht die native append-Methode aus einem fehlenden Element
     den sichtbaren Text „null" — auf jeder schlichten Heftseite. */
  blatt.append(...[skizzenbild, titel, formatleiste, text, werkzeuge].filter(Boolean));

  /* Angeklebtes */
  function baueAnlagen() {
    $$('.anlage', blatt).forEach((a) => a.remove());
    for (const a of kinder(seite.id)) {
      if (a.typ === 'zettel') blatt.append(baueZettel(a, blatt, baueAnlagen));
      else if (a.typ === 'foto') blatt.append(baueFoto(a, blatt, baueAnlagen));
      else if (a.typ === 'sticker') blatt.append(baueSticker(a, blatt, baueAnlagen));
    }
  }
  baueAnlagen();

  blatt.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.anlage')) $$('.anlage.aktiv', blatt).forEach((a) => a.classList.remove('aktiv'));
  });

  return blatt;
}

function positioniere(elem, a) {
  const p = a.pos || (a.pos = { x: 10, y: 10, rot: 0, w: 30 });
  elem.style.left = p.x + '%';
  elem.style.top = p.y + '%';
  elem.style.width = p.w + '%';
  elem.style.transform = 'rotate(' + (p.rot || 0) + 'deg)';
}

function anlageGesten(elem, a, blatt, neuBauen) {
  let zieht = null;
  elem.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'TEXTAREA' && elem.classList.contains('aktiv')) return;
    $$('.anlage.aktiv', blatt).forEach((x) => { if (x !== elem) x.classList.remove('aktiv'); });
    const r = blatt.getBoundingClientRect();
    zieht = { sx: e.clientX, sy: e.clientY, px: a.pos.x, py: a.pos.y, r, bewegt: false };
    try { elem.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  elem.addEventListener('pointermove', (e) => {
    if (!zieht) return;
    const dx = e.clientX - zieht.sx, dy = e.clientY - zieht.sy;
    if (!zieht.bewegt && Math.hypot(dx, dy) < 6) return;
    zieht.bewegt = true;
    elem._zieht = true;
    /* Über den Rand hinaus ist erlaubt — nur nicht ganz weg. */
    a.pos.x = Math.max(-30, Math.min(100, zieht.px + dx / zieht.r.width * 100));
    a.pos.y = Math.max(-14, Math.min(106, zieht.py + dy / zieht.r.height * 100));
    elem.style.left = a.pos.x + '%';
    elem.style.top = a.pos.y + '%';
  });
  const ende = (e) => {
    if (!zieht) return;
    if (zieht.bewegt) speichereStill(a);
    else elem.classList.add('aktiv');
    zieht = null;
    setTimeout(() => { elem._zieht = false; }, 0);
  };
  elem.addEventListener('pointerup', ende);
  elem.addEventListener('pointercancel', ende);

  /* Griff: Größe ziehen */
  const griff = el('div', { class: 'griff', html: ik('rechts') });
  griff.style.transform = 'rotate(45deg)';
  let groesse = null;
  griff.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const r = blatt.getBoundingClientRect();
    groesse = { sx: e.clientX, w: a.pos.w, r };
    try { griff.setPointerCapture(e.pointerId); } catch (x) {}
  });
  griff.addEventListener('pointermove', (e) => {
    if (!groesse) return;
    a.pos.w = Math.max(a.typ === 'sticker' ? 5 : 12, Math.min(92, groesse.w + (e.clientX - groesse.sx) / groesse.r.width * 100));
    elem.style.width = a.pos.w + '%';
  });
  griff.addEventListener('pointerup', () => { if (groesse) speichereStill(a); groesse = null; });
  elem.append(griff);

  /* Drehgriff: um die Mitte drehen, nahe null rastet es gerade ein. */
  const dreh = el('div', { class: 'drehgriff', html: ik('drehen'), title: 'Drehen' });
  let drehung = null;
  dreh.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    const r = elem.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    drehung = { cx, cy, start: Math.atan2(e.clientY - cy, e.clientX - cx), rot0: a.pos.rot || 0 };
    try { dreh.setPointerCapture(e.pointerId); } catch (x) {}
  });
  dreh.addEventListener('pointermove', (e) => {
    if (!drehung) return;
    const w = Math.atan2(e.clientY - drehung.cy, e.clientX - drehung.cx);
    let grad = drehung.rot0 + (w - drehung.start) * 180 / Math.PI;
    grad = ((grad + 180) % 360 + 360) % 360 - 180;
    if (Math.abs(grad) < 2.5) grad = 0;
    a.pos.rot = Math.round(grad * 10) / 10;
    elem.style.transform = 'rotate(' + a.pos.rot + 'deg)';
  });
  const drehEnde = () => { if (drehung) speichereStill(a); drehung = null; };
  dreh.addEventListener('pointerup', drehEnde); dreh.addEventListener('pointercancel', drehEnde);
  elem.append(dreh);

  langdruck(elem, async () => {
    const inKiste = a.typ === 'sticker' && vomTyp('stickervorlage').some((v) => v.bild === a.bild);
    const wahl = await menue([
      a.typ === 'sticker' && !inKiste ? { text: 'In die Stickerkiste legen', icon: 'archiv', wert: 'kiste' } : null,
      a.typ === 'sticker' ? { text: 'Noch einmal aufkleben', icon: 'plus', wert: 'nochmal' } : null,
      a.typ === 'zettel' ? { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' } : null,
      a.typ === 'zettel' ? { text: 'Schrift: ' + ({ hand: 'Handschrift', klar: 'Klar', serif: 'Serife' }[a.schrift || 'hand']), icon: 'stift', wert: 'schrift' } : null,
      a.typ === 'zettel' ? { text: 'Form: ' + (a.pos.w <= 24 ? 'schmal' : a.pos.w >= 44 ? 'breit' : 'normal'), icon: 'wandel', wert: 'form' } : null,
      { text: 'Befestigung: ' + ({ tesa: 'Tesa', pin: 'Reißzwecke', lose: 'lose aufgelegt' }[a.befestigung || 'tesa']), icon: 'pin', wert: 'befestigung' },
      { text: 'Etwas drehen', icon: 'drehen', wert: 'drehen' },
      { text: 'Gerade rücken', icon: 'ausBlock', wert: 'gerade' },
      { text: 'Abmachen', icon: 'muell', wert: 'weg', rot: true }
    ]);
    if (wahl === 'kiste') {
      neuDoc('stickervorlage', { bild: a.bild, verhaeltnis: a.verhaeltnis, zuletzt: Date.now() });
      toast('Liegt in der Stickerkiste.');
    } else if (wahl === 'nochmal') {
      neuDoc('sticker', { parent: a.parent, bild: a.bild, verhaeltnis: a.verhaeltnis, befestigung: 'lose', pos: { x: Math.min(90, a.pos.x + 8), y: Math.min(100, a.pos.y + 8), rot: a.pos.rot, w: a.pos.w } });
      neuBauen();
    } else if (wahl === 'farbe') {
      a.farbe = ZETTELFARBEN[(ZETTELFARBEN.indexOf(a.farbe) + 1) % ZETTELFARBEN.length];
      speichereStill(a); neuBauen();
    } else if (wahl === 'schrift') {
      a.schrift = { hand: 'klar', klar: 'serif', serif: 'hand' }[a.schrift || 'hand'];
      speichereStill(a); neuBauen();
    } else if (wahl === 'form') {
      a.pos.w = a.pos.w <= 24 ? 30 : a.pos.w >= 44 ? 22 : 46;
      speichereStill(a); neuBauen();
    } else if (wahl === 'gerade') {
      a.pos.rot = 0; speichereStill(a);
      elem.style.transform = 'rotate(0deg)';
    } else if (wahl === 'befestigung') {
      a.befestigung = { tesa: 'pin', pin: 'lose', lose: 'tesa' }[a.befestigung || 'tesa']; speichereStill(a); neuBauen();
    } else if (wahl === 'drehen') {
      a.pos.rot = ((a.pos.rot || 0) + 4.5);
      if (a.pos.rot > 10) a.pos.rot = -9;
      speichereStill(a);
      elem.style.transform = 'rotate(' + a.pos.rot + 'deg)';
    } else if (wahl === 'weg') {
      if (await frage(a.typ === 'zettel' ? 'Zettel abmachen und wegwerfen?' : a.typ === 'sticker' ? 'Sticker abmachen?' : 'Foto abmachen?', { ja: 'Abmachen', gefahr: true })) {
        await loesche(a.id); neuBauen();
      }
    }
  });
}

const ZETTELFARBEN = ['gelb', 'rosa', 'blau', 'gruen', 'orange', 'lila', 'weiss', 'grau'];
function baueZettel(a, blatt, neuBauen) {
  const halter = el('div', { class: 'anlage befestigung-' + (a.befestigung || 'tesa') });
  positioniere(halter, a);
  const z = el('div', { class: 'zettel ' + (ZETTELFARBEN.includes(a.farbe) ? a.farbe : 'gelb') + ' schrift-' + (a.schrift || 'hand') });
  const ta = el('textarea', { placeholder: '…', rows: 1 });
  ta.value = a.text || '';
  autogrow(ta);
  ta.addEventListener('input', entprellt(() => { a.text = ta.value; speichereStill(a); }, 400));
  z.append(ta);
  halter.append(z);
  anlageGesten(halter, a, blatt, neuBauen);
  return halter;
}

function baueFoto(a, blatt, neuBauen) {
  const halter = el('div', { class: 'anlage befestigung-' + (a.befestigung || 'tesa') });
  positioniere(halter, a);
  const rahmen = el('div', { class: 'foto-anlage' });
  const img = el('img', { alt: '' });
  setzeBild(img, a.bild);
  rahmen.append(img);
  halter.append(rahmen);
  anlageGesten(halter, a, blatt, neuBauen);
  return halter;
}

/* ----- Kritzeln ----- */
const STIFTFARBEN = ['#2c251c', '#6a5742', '#b0552f', '#cb6b62', '#d08b31', '#b8923f', '#5f7752', '#2f7c72', '#41597a', '#5c6fb3', '#765187', '#a34f77'];
/* ----- Kritzeln -----
   Ein Strich ist eine Folge von Punkten, nicht nur eine Spur Pixel. Die Punkte
   liegen auf die Breite normiert vor. Dadurch landet jeder Strich exakt unter
   dem Stift — auch wenn sich das Layout danach noch verschiebt — und
   Rückgängig, Wiederholen und Alles löschen brauchen keinen Bildspeicher. */
function kritzelZeichneStrich(ctx, s, breite) {
  const p = s.punkte || [];
  if (!p.length) return;
  ctx.globalCompositeOperation = s.radierer ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s.farbe || '#000';
  ctx.fillStyle = s.farbe || '#000';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (p.length === 1) {
    ctx.beginPath();
    ctx.arc(p[0].x * breite, p[0].y * breite, Math.max(.35, p[0].w * breite / 2), 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  for (let i = 1; i < p.length; i++) {
    ctx.lineWidth = Math.max(.4, p[i].w * breite);
    ctx.beginPath();
    ctx.moveTo(p[i - 1].x * breite, p[i - 1].y * breite);
    ctx.lineTo(p[i].x * breite, p[i].y * breite);
    ctx.stroke();
  }
}

async function starteKritzeln(blatt, seite) {
  if ($('.kritzelflaeche', blatt)) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const canvas = el('canvas', { class: 'kritzelflaeche' });
  const ctx = canvas.getContext('2d');

  let farbe = /^#[0-9a-f]{6}$/i.test(D.einst.stiftFarbe || '') ? D.einst.stiftFarbe : (D.einst.thema === 'tinte' || D.einst.thema === 'kerze' ? '#eae0cd' : STIFTFARBEN[0]);
  let dicke = begrenze(D.einst.stiftDicke, 1, 24, 3.5);
  let radierer = false;
  let striche = [];
  let zurueckgelegt = [];
  let basis = null;
  let breite = 0, hoehe = 0;
  let strich = null;

  const altesBild = $('.skizzenbild', blatt);
  if (altesBild) altesBild.style.display = 'none';

  /* Der Stift folgt immer der wirklichen Zeichenfläche, nie einer alten Messung. */
  function messen() {
    const cr = canvas.getBoundingClientRect();
    const b = Math.max(1, Math.round(cr.width)), h = Math.max(1, Math.round(cr.height));
    if (b === breite && h === hoehe) return false;
    breite = b; hoehe = h;
    canvas.width = Math.round(b * dpr);
    canvas.height = Math.round(h * dpr);
    return true;
  }
  function punktAus(e) {
    const cr = canvas.getBoundingClientRect();
    const skalaX = cr.width ? breite / cr.width : 1;
    const skalaY = cr.height ? hoehe / cr.height : 1;
    return { x: (e.clientX - cr.left) * skalaX / breite, y: (e.clientY - cr.top) * skalaY / breite };
  }
  function strichbreite(e) {
    if (radierer) return Math.max(8, dicke * 3.4) / breite;
    const druck = e && e.pointerType === 'pen' && e.pressure > 0 ? e.pressure : .5;
    return dicke * (.72 + druck * .56) / breite;
  }
  function alleszeichnen() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, breite, hoehe);
    ctx.globalCompositeOperation = 'source-over';
    if (basis) {
      try { ctx.drawImage(basis, 0, 0, breite, basis.height / basis.width * breite); } catch (e) {}
    }
    for (const s of striche) {
      if (s.leeren) { ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, breite, hoehe); continue; }
      kritzelZeichneStrich(ctx, s, breite);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  function knoepfeAuffrischen() {
    zurueckKnopf.disabled = !striche.length;
    vorKnopf.disabled = !zurueckgelegt.length;
    zurueckKnopf.style.opacity = striche.length ? '' : '.35';
    vorKnopf.style.opacity = zurueckgelegt.length ? '' : '.35';
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button > 0) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
    const p = punktAus(e);
    strich = { farbe, radierer, punkte: [{ x: p.x, y: p.y, w: strichbreite(e) }] };
    striche.push(strich);
    zurueckgelegt = [];
    kritzelZeichneStrich(ctx, strich, breite);
    ctx.globalCompositeOperation = 'source-over';
    knoepfeAuffrischen();
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!strich) return;
    const punkte = (e.getCoalescedEvents && e.getCoalescedEvents().length ? e.getCoalescedEvents() : [e]);
    ctx.globalCompositeOperation = strich.radierer ? 'destination-out' : 'source-over';
    ctx.strokeStyle = strich.farbe;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const roh of punkte) {
      const p = punktAus(roh);
      const w = strichbreite(roh.pressure != null ? roh : e);
      const vorher = strich.punkte[strich.punkte.length - 1];
      if (Math.abs(p.x - vorher.x) * breite < .35 && Math.abs(p.y - vorher.y) * breite < .35) continue;
      ctx.lineWidth = Math.max(.4, w * breite);
      ctx.beginPath();
      ctx.moveTo(vorher.x * breite, vorher.y * breite);
      ctx.lineTo(p.x * breite, p.y * breite);
      ctx.stroke();
      strich.punkte.push({ x: p.x, y: p.y, w });
    }
    ctx.globalCompositeOperation = 'source-over';
  });
  const strichEnde = () => { strich = null; };
  canvas.addEventListener('pointerup', strichEnde);
  canvas.addEventListener('pointercancel', strichEnde);

  /* Werkzeuge */
  const eigeneFarbe = el('input', { type: 'color', value: farbe, title: 'Eigene Stiftfarbe', 'aria-label': 'Eigene Stiftfarbe' });
  const dickeRegler = el('input', { type: 'range', min: '1', max: '18', step: '.5', value: String(dicke), title: 'Stiftdicke', 'aria-label': 'Stiftdicke' });
  const dickeProbe = el('span', { class: 'stift-dicke-probe', style: 'width:' + dicke + 'px;height:' + dicke + 'px;background:' + farbe });
  const stiftWaehlen = (f, knopf) => {
    farbe = f; eigeneFarbe.value = f; D.einst.stiftFarbe = f; speichereEinst();
    radierer = false; radierKnopf.classList.remove('an');
    dickeProbe.style.background = f;
    $$('.stiftfarbe', leiste).forEach((k) => k.classList.toggle('an', k === knopf));
  };
  eigeneFarbe.addEventListener('input', () => stiftWaehlen(eigeneFarbe.value, null));
  dickeRegler.addEventListener('input', () => {
    dicke = Number(dickeRegler.value); D.einst.stiftDicke = dicke; speichereEinst();
    dickeProbe.style.width = dicke + 'px'; dickeProbe.style.height = dicke + 'px';
  });

  const radierKnopf = el('button', {
    class: 'rundknopf kritzel-werkzeug', html: ik('radierer'), title: 'Radierer', onclick: () => {
      radierer = !radierer;
      radierKnopf.classList.toggle('an', radierer);
      if (radierer) $$('.stiftfarbe', leiste).forEach((x) => x.classList.remove('an'));
    }
  });
  const zurueckKnopf = el('button', {
    class: 'rundknopf kritzel-werkzeug', html: ik('zurueck'), title: 'Einen Schritt zurück', onclick: () => {
      if (!striche.length) return;
      zurueckgelegt.push(striche.pop());
      alleszeichnen(); knoepfeAuffrischen();
    }
  });
  const vorKnopf = el('button', {
    class: 'rundknopf kritzel-werkzeug', html: ik('rechts'), title: 'Schritt wiederherstellen', onclick: () => {
      if (!zurueckgelegt.length) return;
      striche.push(zurueckgelegt.pop());
      alleszeichnen(); knoepfeAuffrischen();
    }
  });
  const leerKnopf = el('button', {
    class: 'rundknopf kritzel-werkzeug', html: ik('muell'), title: 'Alles löschen', onclick: async () => {
      if (!striche.length && !basis) { toast('Hier ist noch nichts.'); return; }
      if (!await frage('Die ganze Zeichnung von dieser Seite nehmen?', { ja: 'Alles löschen', gefahr: true })) return;
      striche.push({ leeren: true });
      zurueckgelegt = [];
      alleszeichnen(); knoepfeAuffrischen();
      toast('Weg. Der Pfeil zurück holt es wieder.');
    }
  });

  const aufraeumen = () => {
    try { beobachter.disconnect(); } catch (e) {}
    window.removeEventListener('resize', beiGroesse);
    leiste.remove(); canvas.remove();
  };
  const fertigKnopf = el('button', {
    class: 'knopf voll', style: 'padding:7px 14px', onclick: async () => {
      const leer = !striche.length && !basis;
      seite.skizze = leer ? seite.skizze : await speichereKritzelei(canvas, seite.skizze);
      speichere(seite);
      aufraeumen();
      if (altesBild) {
        altesBild.style.display = '';
        altesBild.innerHTML = '';
        if (seite.skizze) {
          const img = el('img', { alt: '' });
          setzeBild(img, seite.skizze);
          altesBild.append(img);
        }
      }
    }
  }, 'Fertig');
  const abbrechenKnopf = el('button', {
    class: 'knopf zart', style: 'padding:7px 14px', onclick: async () => {
      if (striche.length && !await frage('Diese Zeichnung verwerfen? Der Stand von vorher bleibt.', { ja: 'Verwerfen', gefahr: true })) return;
      aufraeumen();
      if (altesBild) altesBild.style.display = '';
    }
  }, 'Abbrechen');

  const leiste = el('div', { class: 'kritzelleiste' },
    STIFTFARBEN.map((f) => {
      const k = el('button', { class: 'stiftfarbe' + (f === farbe ? ' an' : ''), style: 'background:' + f, title: 'Stiftfarbe', onclick: () => stiftWaehlen(f, k) });
      return k;
    }),
    el('label', { class: 'stift-eigen', title: 'Eigene Farbe' }, '＋', eigeneFarbe),
    el('label', { class: 'stift-dicke' }, dickeProbe, dickeRegler),
    radierKnopf,
    el('span', { class: 'kritzel-trenner' }),
    zurueckKnopf, vorKnopf, leerKnopf,
    el('span', { class: 'kritzel-trenner' }),
    abbrechenKnopf, fertigKnopf
  );

  /* Erst einbauen, dann messen — die Leiste verändert das Layout der Seite. */
  blatt.append(canvas);
  document.body.append(leiste);
  messen();
  knoepfeAuffrischen();

  const beiGroesse = () => { if (messen()) alleszeichnen(); };
  window.addEventListener('resize', beiGroesse);
  const beobachter = typeof ResizeObserver === 'function' ? new ResizeObserver(beiGroesse) : { observe() {}, disconnect() {} };
  try { beobachter.observe(canvas); } catch (e) {}

  if (seite.skizze) {
    const url = await bildURL(seite.skizze);
    if (url && canvas.isConnected) {
      const alt = new Image();
      await new Promise((res) => { alt.onload = res; alt.onerror = res; alt.src = url; });
      if (alt.width && alt.height) basis = alt;
    }
  }
  if (canvas.isConnected) { messen(); alleszeichnen(); }
}

/* ================================================================
   VANI — Sticker: Handgezeichnetes, das man auf Seiten klebt.

   Ein Sticker ist eine kleine Zeichnung mit durchsichtigem Grund — ein rotes
   „SCHMU!", ein Pfeil, ein Herz, ein Kringel. Man zeichnet ihn einmal im
   Stickerblock, dann liegt er als Anlage auf der Seite: verschiebbar, drehbar
   am Griff, größer und kleiner, abmachbar. Und weil man dieselben Dinge immer
   wieder in Hefte schreibt, wandert jeder Sticker auf Wunsch in die
   Stickerkiste und lässt sich von dort beliebig oft wieder aufkleben.
   ================================================================ */

const STICKER_DOC = 'sticker';          /* auf einer Seite klebend */
const STICKER_VORLAGE = 'stickervorlage'; /* in der Kiste, wiederverwendbar */

/* Schneidet die gezeichnete Fläche auf ihren Inhalt zu — ein Sticker soll so
   groß sein wie das, was man gezeichnet hat, nicht wie der Block. */
function stickerZuschneiden(canvas, rand = 6) {
  const ctx = canvas.getContext('2d');
  const { width, height } = canvas;
  if (!width || !height) return null;
  const daten = ctx.getImageData(0, 0, width, height).data;
  let links = width, oben = height, rechts = -1, unten = -1;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (daten[(y * width + x) * 4 + 3] > 8) {
        if (x < links) links = x; if (x > rechts) rechts = x;
        if (y < oben) oben = y; if (y > unten) unten = y;
      }
    }
  }
  if (rechts < 0) return null;
  links = Math.max(0, links - rand); oben = Math.max(0, oben - rand);
  rechts = Math.min(width - 1, rechts + rand); unten = Math.min(height - 1, unten + rand);
  const aus = document.createElement('canvas');
  aus.width = rechts - links + 1; aus.height = unten - oben + 1;
  aus.getContext('2d').drawImage(canvas, links, oben, aus.width, aus.height, 0, 0, aus.width, aus.height);
  return aus;
}

/* Der Stickerblock: eine kleine Zeichenfläche mit Stiften, Radierer, Zurück. */
function stickerZeichnen({ titel = 'Ein Sticker', inKiste = true } = {}) {
  return new Promise((res) => {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const BREITE = Math.min(440, Math.max(260, window.innerWidth - 96)), HOEHE = Math.round(BREITE * .56);
    const canvas = el('canvas', { class: 'stickerblock-flaeche', width: String(Math.round(BREITE * dpr)), height: String(Math.round(HOEHE * dpr)) });
    canvas.style.width = BREITE + 'px'; canvas.style.height = HOEHE + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let farbe = /^#[0-9a-f]{6}$/i.test(D.einst.stickerFarbe || '') ? D.einst.stickerFarbe : '#c8322b';
    let dicke = begrenze(D.einst.stickerDicke, 1, 24, 5);
    let radierer = false;
    const striche = [];
    let zurueckgelegt = [];
    let strich = null;

    const punktAus = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * BREITE / r.width, y: (e.clientY - r.top) * HOEHE / r.height }; };
    const breiteFuer = (e) => radierer ? Math.max(10, dicke * 3) : dicke * (.7 + ((e && e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : .5) * .6);
    const zeichneStrich = (s) => {
      ctx.globalCompositeOperation = s.radierer ? 'destination-out' : 'source-over';
      ctx.strokeStyle = s.farbe; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 1; i < s.punkte.length; i++) {
        const a = s.punkte[i - 1], b = s.punkte[i];
        ctx.lineWidth = b.w; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      if (s.punkte.length === 1) { const p = s.punkte[0]; ctx.fillStyle = s.farbe; ctx.beginPath(); ctx.arc(p.x, p.y, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalCompositeOperation = 'source-over';
    };
    const allesZeichnen = () => { ctx.clearRect(0, 0, BREITE, HOEHE); for (const s of striche) zeichneStrich(s); knoepfe(); };
    const knoepfe = () => { zurueck.style.opacity = striche.length ? '' : '.35'; vor.style.opacity = zurueckgelegt.length ? '' : '.35'; };

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
      const p = punktAus(e);
      strich = { farbe, radierer, punkte: [{ x: p.x, y: p.y, w: breiteFuer(e) }] };
      striche.push(strich); zurueckgelegt = [];
      zeichneStrich(strich); knoepfe(); e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!strich) return;
      const roh = e.getCoalescedEvents && e.getCoalescedEvents().length ? e.getCoalescedEvents() : [e];
      ctx.globalCompositeOperation = strich.radierer ? 'destination-out' : 'source-over';
      ctx.strokeStyle = strich.farbe; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const ev of roh) {
        const p = punktAus(ev), w = breiteFuer(ev.pressure != null ? ev : e);
        const v = strich.punkte[strich.punkte.length - 1];
        if (Math.hypot(p.x - v.x, p.y - v.y) < .4) continue;
        ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(v.x, v.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        strich.punkte.push({ x: p.x, y: p.y, w });
      }
      ctx.globalCompositeOperation = 'source-over';
    });
    const ende = () => { strich = null; };
    canvas.addEventListener('pointerup', ende); canvas.addEventListener('pointercancel', ende);

    const farben = ['#c8322b', '#2c251c', '#1f5fa8', '#2f7c72', '#d08b31', '#765187', '#cb6b62', '#5f7752'];
    const eigene = el('input', { type: 'color', value: farbe, title: 'Eigene Farbe' });
    const probe = el('span', { class: 'stift-dicke-probe', style: 'width:' + dicke + 'px;height:' + dicke + 'px;background:' + farbe });
    const waehle = (f) => { farbe = f; eigene.value = f; radierer = false; radierKnopf.classList.remove('an'); probe.style.background = f; D.einst.stickerFarbe = f; speichereEinst(); $$('.stiftfarbe', leiste).forEach((k) => k.classList.toggle('an', k.dataset.f === f)); };
    eigene.addEventListener('input', () => waehle(eigene.value));
    const regler = el('input', { type: 'range', min: '1', max: '22', step: '.5', value: String(dicke), title: 'Stiftdicke' });
    regler.addEventListener('input', () => { dicke = Number(regler.value); probe.style.width = dicke + 'px'; probe.style.height = dicke + 'px'; D.einst.stickerDicke = dicke; speichereEinst(); });
    const radierKnopf = el('button', { class: 'rundknopf kritzel-werkzeug', html: ik('radierer'), title: 'Radierer', onclick: () => { radierer = !radierer; radierKnopf.classList.toggle('an', radierer); if (radierer) $$('.stiftfarbe', leiste).forEach((k) => k.classList.remove('an')); } });
    const zurueck = el('button', { class: 'rundknopf kritzel-werkzeug', html: ik('zurueck'), title: 'Schritt zurück', onclick: () => { if (!striche.length) return; zurueckgelegt.push(striche.pop()); allesZeichnen(); } });
    const vor = el('button', { class: 'rundknopf kritzel-werkzeug', html: ik('rechts'), title: 'Wiederherstellen', onclick: () => { if (!zurueckgelegt.length) return; striche.push(zurueckgelegt.pop()); allesZeichnen(); } });
    const leer = el('button', { class: 'rundknopf kritzel-werkzeug', html: ik('muell'), title: 'Alles löschen', onclick: () => { if (!striche.length) return; zurueckgelegt = [...striche.reverse()]; striche.length = 0; allesZeichnen(); } });
    const leiste = el('div', { class: 'stickerblock-leiste' },
      farben.map((f) => el('button', { class: 'stiftfarbe' + (f === farbe ? ' an' : ''), 'data-f': f, style: 'background:' + f, onclick: () => waehle(f) })),
      el('label', { class: 'stift-eigen', title: 'Eigene Farbe' }, '＋', eigene),
      el('label', { class: 'stift-dicke' }, probe, regler),
      radierKnopf, el('span', { class: 'kritzel-trenner' }), zurueck, vor, leer);

    const kisteHaken = el('input', { type: 'checkbox' });
    kisteHaken.checked = !!inKiste;
    let fertig = false;
    const kasten = el('div', { class: 'modal stickerblock' },
      el('h2', {}, titel),
      el('div', { class: 'stickerblock-hinweis' }, 'Zeichne mit Stift oder Finger. Der Sticker wird so groß wie das Gezeichnete — der Rest bleibt durchsichtig.'),
      el('div', { class: 'stickerblock-rahmen' }, canvas),
      leiste,
      el('label', { class: 'stickerblock-kiste' }, kisteHaken, ' Auch in die Stickerkiste legen, zum Wiederverwenden'),
      el('div', { class: 'reihe' },
        el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'),
        el('button', { class: 'knopf voll', onclick: async () => {
          const zuschnitt = stickerZuschneiden(canvas);
          if (!zuschnitt) { toast('Da ist noch nichts gezeichnet.'); return; }
          fertig = true; zu();
          const bild = await speichereKritzelei(zuschnitt, null);
          res(bild ? { bild, seitenverhaeltnis: zuschnitt.height / zuschnitt.width, inKiste: kisteHaken.checked } : null);
        } }, 'Aufkleben')));
    const zu = zeigeDeck(kasten, () => { if (!fertig) { fertig = true; res(null); } });
  });
}

/* Die Stickerkiste: alles, was man sich aufgehoben hat. */
function stickerKiste() {
  return vomTyp(STICKER_VORLAGE).sort((a, b) => (b.zuletzt || b.angelegt || 0) - (a.zuletzt || a.angelegt || 0));
}

/* Mitgebrachte Sticker: liegen als Bilddateien neben der App und werden beim
   ersten Aufkleben in den Medienvorrat geholt — mit fester Kennung, damit
   Sicherung und Sync sie wie jedes andere Bild mitnehmen. */
const STICKER_MITGEBRACHT = [
  { id: 'schmu', name: 'Schmu!', datei: 'sticker/schmu.png', verhaeltnis: 724 / 2172 }
];
async function stickerMitgebrachtBild(m) {
  const id = 'sticker:' + m.id;
  if (await dbGet('media', id)) return id;
  const antwort = await fetch(m.datei, { cache: 'force-cache' });
  if (!antwort.ok) throw new Error('Sticker nicht erreichbar');
  const blob = await antwort.blob();
  await dbPut('media', blob, id);
  if (typeof syncMediaGeaendert === 'function') syncMediaGeaendert(id);
  loeseMedienURL(id);
  return id;
}

/* Einen Sticker aufkleben: aus der Kiste, aus dem Mitgebrachten, oder neu zeichnen. */
async function stickerAufkleben(seite) {
  const kiste = stickerKiste();
  const wahl = await new Promise((res) => {
    let fertig = false;
    const feld = (img, titel, beiWahl) => el('button', { class: 'stickerkiste-feld', title: titel, onclick: () => { fertig = true; zu(); res(beiWahl()); } }, img);
    const eigene = el('div', { class: 'stickerkiste' });
    for (const v of kiste) {
      const img = el('img', { alt: '' });
      setzeBild(img, v.bild);
      const k = feld(img, 'Aufkleben', () => ({ art: 'kiste', v }));
      langdruck(k, async () => {
        if (await frage('Diesen Sticker aus der Kiste nehmen? Schon aufgeklebte bleiben, wo sie sind.', { ja: 'Aus der Kiste nehmen', gefahr: true })) {
          await loesche(v.id, true); k.remove();
        }
      });
      eigene.append(k);
    }
    const mitgebracht = el('div', { class: 'stickerkiste' },
      STICKER_MITGEBRACHT.map((m) => feld(el('img', { alt: m.name, src: m.datei }), m.name, () => ({ art: 'mitgebracht', m }))));
    const kasten = el('div', { class: 'modal stickerwahl' },
      el('h2', {}, 'Stickerkiste'),
      el('div', { class: 'stickerblock-hinweis' }, 'Antippen klebt ihn auf. Lange drücken nimmt einen eigenen aus der Kiste.'),
      kiste.length ? el('div', { class: 'kartenkopf' }, 'MEINE') : null,
      kiste.length ? eigene : null,
      el('div', { class: 'kartenkopf', style: kiste.length ? 'margin-top:12px' : '' }, 'MITGEBRACHT'),
      mitgebracht,
      el('div', { class: 'reihe' },
        el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'),
        el('button', { class: 'knopf voll', onclick: () => { fertig = true; zu(); res({ art: 'neu' }); } }, el('span', { html: ik('stift'), style: 'display:flex' }), 'Neuen zeichnen')));
    const zu = zeigeDeck(kasten, () => { if (!fertig) { fertig = true; res(null); } });
  });
  if (!wahl) return null;
  let bild, verhaeltnis;
  if (wahl.art === 'neu') {
    const neu = await stickerZeichnen({});
    if (!neu) return null;
    bild = neu.bild; verhaeltnis = neu.seitenverhaeltnis;
    if (neu.inKiste) neuDoc(STICKER_VORLAGE, { bild, verhaeltnis, zuletzt: Date.now() });
  } else if (wahl.art === 'mitgebracht') {
    try { bild = await stickerMitgebrachtBild(wahl.m); } catch (e) { toast('Der Sticker ließ sich gerade nicht laden.'); return null; }
    verhaeltnis = wahl.m.verhaeltnis;
  } else {
    bild = wahl.v.bild; verhaeltnis = wahl.v.verhaeltnis || .5;
    wahl.v.zuletzt = Date.now(); speichereStill(wahl.v);
  }
  /* Breite so, dass ein Wort lesbar bleibt; lange schmale Sticker etwas breiter. */
  const w = begrenze(22 + (verhaeltnis < .35 ? 10 : 0), 10, 60, 24);
  return neuDoc(STICKER_DOC, {
    parent: seite.id, bild, verhaeltnis,
    befestigung: 'lose',
    pos: { x: 30 + Math.random() * 30, y: 10 + Math.random() * 30, rot: -6 + Math.random() * 12, w }
  });
}

function baueSticker(a, blatt, neuBauen) {
  const halter = el('div', { class: 'anlage sticker-anlage befestigung-lose' });
  positioniere(halter, a);
  const img = el('img', { alt: '', draggable: 'false' });
  setzeBild(img, a.bild);
  halter.append(img);
  anlageGesten(halter, a, blatt, neuBauen);
  return halter;
}

}

async function projektMenue(p, danach) {
  const wahl = await menue([
    { text: 'Umbenennen', icon: 'stift', wert: 'name' },
    { text: 'Wortziel: ' + (p.ziel ? p.ziel.toLocaleString('de-DE') : 'keins'), icon: 'ziel', wert: 'ziel' },
    { text: 'Leseansicht', icon: 'lesen', wert: 'lesen' },
    { text: 'Als Manuskript hinausgeben', icon: 'teilen', wert: 'export' },
    { text: 'Verbindungen ansehen', icon: 'verbinden', wert: 'bezug' },
    { text: 'Projekt löschen', icon: 'muell', wert: 'weg', rot: true }
  ], p.titel);
  if (wahl === 'name') {
    const neu = await eingabe({ titel: 'Das Projekt heißt jetzt …', wert: p.titel });
    if (neu) { p.titel = neu; speichere(p); }
  } else if (wahl === 'ziel') {
    const neu = await eingabe({ titel: 'Wortziel (0 = keins)', wert: String(p.ziel || '') });
    if (neu !== null) { p.ziel = parseInt(neu, 10) || 0; speichereStill(p); }
  } else if (wahl === 'lesen') {
    zeigeLeseansicht(p);
    return;
  } else if (wahl === 'export') {
    await projektHinausgeben(p);
    return;
  } else if (wahl === 'bezug') {
    zeigeBeziehungen(p);
    return;
  } else if (wahl === 'weg') {
    if (await frage('„' + p.titel + '" mit allem darin in den Papierkorb legen?', { ja: 'In den Papierkorb', gefahr: true })) {
      await loesche(p.id);
      location.hash = '#/projekte';
      return;
    }
  }
  if (danach) danach();
}

RENDER.projekt = function (haupt, pid) {

/* ----- Figuren & Orte: die Welt eines Projekts -----
   Jeder Eintrag ist ein Dokument vom Typ „figur" mit Name, Art und Notiz.
   [[Name]] im Text springt direkt hierher, weil der Name der Titel ist. */
const FIGUR_ARTEN = [['figur', 'Figur'], ['ort', 'Ort'], ['ding', 'Ding'], ['sonst', 'Anderes']];
function figurenVon(p) { return kinder(p.id, 'figur'); }
function figurVorkommen(p, name) {
  const n = normalisiere(String(name || '').trim());
  if (!n) return 0;
  let z = 0;
  for (const d of D.docs.values()) if (d.typ === 'szene' && d.projekt === p.id && normalisiere(d.text || '').includes(n)) z++;
  return z;
}
async function figurAnlegenOderAendern(p, alt) {
  const name = await eingabe({ titel: alt ? 'Heißt jetzt …' : 'Wer oder was kommt dazu?', wert: alt ? alt.titel : '', platzhalter: 'Name der Figur, des Ortes, des Dings' });
  if (name === null || (!alt && !name)) return null;
  const art = await menue(FIGUR_ARTEN.map(([w, t]) => ({ text: t, wert: w, icon: w === 'figur' ? 'figur' : w === 'ort' ? 'zuhause' : 'wuerfel' })), 'Was ist es?');
  if (!art) return null;
  const notiz = await eingabe({ titel: 'Was ich darüber weiß', wert: alt ? alt.notiz || '' : '', platzhalter: 'Alter, Geruch, Geheimnis, was auf dem Tisch liegt …', mehrzeilig: true, ok: alt ? 'So bleibt es' : 'Aufnehmen' });
  if (notiz === null) return null;
  if (alt) { alt.titel = name || alt.titel; alt.art = art; alt.notiz = notiz; speichere(alt); return alt; }
  return neuDoc('figur', { parent: p.id, projekt: p.id, titel: name, art, notiz, ord: figurenVon(p).length });
}
function baueFigurenUndOrte(p) {
  const liste = figurenVon(p).sort((a, b) => (FIGUR_ARTEN.findIndex((x) => x[0] === a.art) - FIGUR_ARTEN.findIndex((x) => x[0] === b.art)) || (a.titel || '').localeCompare(b.titel || '', 'de'));
  const band = el('div', { class: 'figurenband' });
  for (const f of liste) {
    const vorkommen = figurVorkommen(p, f.titel);
    const chip = el('button', { class: 'figurchip art-' + (f.art || 'figur'), title: f.notiz || '' },
      el('span', { class: 'figur-icon', html: ik(f.art === 'ort' ? 'zuhause' : f.art === 'figur' ? 'figur' : 'wuerfel') }),
      el('span', { class: 'figur-name' }, f.titel || 'Ohne Namen'),
      vorkommen ? el('small', {}, String(vorkommen)) : null);
    chip.addEventListener('click', async () => {
      const wahl = await menue([
        f.notiz ? { text: (f.notiz.length > 60 ? f.notiz.slice(0, 60) + '…' : f.notiz), wert: '_lesen' } : null,
        { text: 'Ändern', icon: 'stift', wert: 'aendern' },
        vorkommen ? { text: 'Wo kommt „' + f.titel + '" vor? (' + vorkommen + ')', icon: 'suche', wert: 'suche' } : null,
        { text: 'Verbindungen ansehen', icon: 'verbinden', wert: 'bezug' },
        { text: 'Entfernen', icon: 'muell', wert: 'weg', rot: true }
      ], f.titel);
      if (wahl === '_lesen') zeigeTextFund({ titel: f.titel, text: f.notiz, typ: 'figur' });
      else if (wahl === 'aendern') { if (await figurAnlegenOderAendern(p, f)) zeichne(); }
      else if (wahl === 'suche') { oeffneSuche(); setTimeout(() => { const feld = $('.suchbogen input'); if (feld) { feld.value = f.titel; feld.dispatchEvent(new Event('input', { bubbles: true })); } }, 120); }
      else if (wahl === 'bezug') zeigeBeziehungen(f);
      else if (wahl === 'weg' && await frage('„' + f.titel + '" aus Figuren & Orten nehmen?', { ja: 'Entfernen', gefahr: true })) { await loesche(f.id); zeichne(); }
    });
    band.append(chip);
  }
  if (!liste.length) band.append(el('span', { class: 'projekt-hefte-leer' }, 'Noch niemand und nirgends. Wer tritt auf, wo spielt es?'));
  return el('div', { class: 'projekt-figuren' },
    el('div', { class: 'kartenkopf' }, el('span', { html: ik('figur') }), 'FIGUREN & ORTE', el('span', { class: 'rest' }),
      el('button', { class: 'knopf zart', onclick: async () => { if (await figurAnlegenOderAendern(p)) zeichne(); } }, '+ Dazu')),
    el('div', { class: 'projekt-figuren-hinweis' }, 'Mit [[Name]] im Text springt man hierher. Die kleine Zahl sagt, in wie vielen Szenen der Name vorkommt.'),
    band);
}

function baueKapitel(k, p) {

    el('button', {
      class: 'rundknopf zart', style: 'width:32px;height:32px', html: ik('mehr'), title: 'Kapitel-Menü', onclick: async () => {
        const geschwister = kinder(p.id, 'kapitel');
        const i = geschwister.findIndex((x) => x.id === k.id);

          { text: 'Umbenennen', icon: 'stift', wert: 'name' },

          if (neu) { k.titel = neu; speichereStill(k); zeichne(); }
        } else if (wahl === 'hoch' || wahl === 'runter') {
          const j = wahl === 'hoch' ? i - 1 : i + 1;
          geschwister.forEach((x, n2) => { x.ord = n2; });
          [geschwister[i].ord, geschwister[j].ord] = [j, i];
          geschwister.forEach((x) => speichereStill(x));
          zeichne();
        } else if (wahl === 'weg') {

  }, el('span', { html: ik('plus'), style: 'display:flex' }), 'Szene'));

function baueSzenenkarte(s, p) {

  notizFeld.value = s.notiz || '';
  notizFeld.addEventListener('input', entprellt(() => { s.notiz = notizFeld.value; speichereStill(s); }, 400));
  notizFeld.addEventListener('pointerdown', (e) => e.stopPropagation());

  const statusFolge = ['funke', 'entwurf', 'steht'];
  const statusPunkt = el('button', {

    }

  const dreher = el('div', { class: 'dreher' },

          class: 'rundknopf zart', style: 'width:28px;height:28px', html: ik('drehen'), title: 'Karte umdrehen',
          onpointerdown: (e) => e.stopPropagation(),
          onclick: (e) => { e.stopPropagation(); karte.classList.add('rueckseite'); }
        })
      )
    ),
    el('div', { class: 'szhinten' },
      el('div', { class: 'hintenhinweis' }, 'RÜCKSEITE'),
      notizFeld,
      el('div', { style: 'display:flex;justify-content:flex-end' },
        el('button', {
          class: 'rundknopf zart', style: 'width:28px;height:28px', html: ik('drehen'), title: 'Karte zurückdrehen',
          onpointerdown: (e) => e.stopPropagation(),
          onclick: (e) => { e.stopPropagation(); karte.classList.remove('rueckseite'); }
        }))
    )
  );
  karte.append(dreher);

  szenenGesten(karte, s, p);
  return karte;
}

/* Halten hebt die Karte an, dann ziehen; kurzes Tippen öffnet. */
function szenenGesten(karte, s, p) {
  let start = null, geist = null, gezogen = false, hebeTimer = null;
  const sperreScrollen = (e) => { if (gezogen) e.preventDefault(); };
  karte.addEventListener('touchmove', sperreScrollen, { passive: false });

  const hebeAn = (e) => {
    gezogen = true;
    karte._zieht = true;
    karte.classList.add('zieht');
    try { karte.setPointerCapture(e.pointerId); } catch (x) {}
    geist = karte.cloneNode(true);
    geist.classList.add('szgeist');
    geist.classList.remove('zieht');
    geist.style.left = (e.clientX - 95) + 'px';
    geist.style.top = (e.clientY - 30) + 'px';
    document.body.append(geist);
  };

  karte.addEventListener('pointerdown', (e) => {
    if (karte.classList.contains('rueckseite')) return;
    if (e.target.closest('button') || e.target.closest('textarea')) return;
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    if (e.pointerType === 'mouse') return;
    hebeTimer = setTimeout(() => { hebeTimer = null; if (start) hebeAn(e); }, 300);
  });
  karte.addEventListener('pointermove', (e) => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!gezogen) {
      if (Math.hypot(dx, dy) > 10) {
        if (e.pointerType === 'mouse') { hebeAn(e); }
        else { clearTimeout(hebeTimer); hebeTimer = null; start = null; }
      }
      return;
    }
    if (geist) {
      geist.style.left = (e.clientX - 95) + 'px';
      geist.style.top = (e.clientY - 30) + 'px';
    }
  });
  karte.addEventListener('pointerup', async (e) => {
    clearTimeout(hebeTimer); hebeTimer = null;
    if (!start && !gezogen) return;
    const warGezogen = gezogen;
    start = null; gezogen = false;
    karte.classList.remove('zieht');
    setTimeout(() => { karte._zieht = false; }, 0);
    if (geist) { geist.remove(); geist = null; }
    if (!warGezogen) {
      if (!e.target.closest('button') && !e.target.closest('textarea')) oeffneSchreibraum(s.id);
      return;
    }
    /* Ablegen: wohin? */
    const unter = document.elementsFromPoint(e.clientX, e.clientY);
    const zielKarte = unter.find((x) => x.classList && x.classList.contains('szkarte') && x !== karte);
    const zielWand = unter.find((x) => x.classList && x.classList.contains('pinnwand'));
    if (!zielWand) return;
    const zielKapitelId = zielWand.dataset.kapitel;
    const geschwister = kinder(zielKapitelId, 'szene').filter((x) => x.id !== s.id);
    let einfuegen = geschwister.length;
    if (zielKarte) {
      const zielSzene = D.docs.get(zielKarte.dataset.id);
      const zi = geschwister.findIndex((x) => x.id === zielSzene.id);
      const r = zielKarte.getBoundingClientRect();
      einfuegen = e.clientX < r.left + r.width / 2 ? zi : zi + 1;
    }
    s.parent = zielKapitelId;
    geschwister.splice(einfuegen, 0, s);
    geschwister.forEach((x, i) => { x.ord = i; speichereStill(x); });
    zeichne();
  });
  karte.addEventListener('pointercancel', () => {
    clearTimeout(hebeTimer); hebeTimer = null;
    start = null; gezogen = false;
    karte.classList.remove('zieht');
    if (geist) { geist.remove(); geist = null; }
  });

  langdruck(karte, async () => {
    if (karte._zieht || gezogen) return;
    const wahl = await menue([
      { text: 'Umbenennen', icon: 'stift', wert: 'name' },
      { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' },
      { text: 'Duplizieren', icon: 'wandel', wert: 'doppel' },
      { text: 'In anderes Kapitel …', icon: 'projekte', wert: 'zieh' },
      { text: 'Teilen', icon: 'teilen', wert: 'teilen' },
      { text: 'Szene löschen', icon: 'muell', wert: 'weg', rot: true }
    ], s.titel || 'Szene');
    if (wahl === 'name') {
      const neu = await eingabe({ titel: 'Die Szene heißt jetzt …', wert: s.titel });
      if (neu !== null) { s.titel = neu || s.titel; speichereStill(s); zeichne(); }
    } else if (wahl === 'farbe') {
      const i = (SZENENFARBEN.indexOf(s.farbe || '') + 1) % SZENENFARBEN.length;
      s.farbe = SZENENFARBEN[i]; speichereStill(s); zeichne();
    } else if (wahl === 'doppel') {
      neuDoc('szene', { parent: s.parent, projekt: s.projekt, ord: (s.ord || 0) + .5, titel: (s.titel || 'Szene') + ' (Fassung 2)', text: s.text, rich: s.rich || '', format: s.format || 'plain', status: s.status, farbe: s.farbe, notiz: s.notiz });
      kinder(s.parent, 'szene').forEach((x, i) => { x.ord = i; speichereStill(x); });
      zeichne();
    } else if (wahl === 'zieh') {
      const wo = await waehleProjektKapitel();
      if (!wo) return;
      s.parent = wo.kapitel.id;
      s.projekt = wo.projekt.id;
      s.ord = kinder(wo.kapitel.id, 'szene').length;
      speichereStill(s);
      toast('Umgezogen nach „' + wo.projekt.titel + '".');
      zeichne();
    } else if (wahl === 'teilen') {
      teileText((s.titel ? s.titel + '\n\n' : '') + (s.text || ''));
    } else if (wahl === 'weg') {
      await loesche(s.id); zeichne();
    }
  });
}

/* ----- Als Manuskript hinausgeben -----
   Eine einzige Datei, die überall aufgeht: Markdown. Kapitel als Überschriften,
   Szenen durch eine Trennlinie geschieden, wahlweise mit Notizen, Figuren und
   dem Stand jeder Szene. Wer es in Word will, zieht es dort einfach hinein. */
function manuskriptText(p, was = {}) {
  const zeilen = [];
  const w = projektWorte(p);
  zeilen.push('# ' + (p.titel || 'Ohne Titel'));
  if (was.kopf !== false) {
    const zeile = [p.art || 'Projekt', w.toLocaleString('de-DE') + ' Wörter'];
    if (p.ziel) zeile.push('Ziel: ' + p.ziel.toLocaleString('de-DE'));
    zeile.push('Stand: ' + fmtDatum(Date.now()));
    zeilen.push('', '*' + zeile.join(' · ') + '*');
  }
  if (was.figuren) {
    const figuren = kinder(p.id, 'figur');
    if (figuren.length) {
      zeilen.push('', '## Figuren & Orte', '');
      for (const f of figuren) {
        zeilen.push('**' + (f.titel || 'Ohne Namen') + '** — ' + ({ figur: 'Figur', ort: 'Ort', ding: 'Ding' }[f.art] || 'Anderes'));
        if (f.notiz) zeilen.push('', f.notiz.trim());
        zeilen.push('');
      }
    }
  }
  for (const k of kinder(p.id, 'kapitel')) {
    const szenen = kinder(k.id, 'szene').filter((sz) => was.leere || (sz.text || '').trim() || (sz.titel || '').trim());
    if (!szenen.length && !was.leere) continue;
    zeilen.push('', '## ' + (k.titel || 'Kapitel'), '');
    szenen.forEach((sz, i) => {
      if (i) zeilen.push('', '* * *', '');
      if (was.szenentitel !== false && (sz.titel || '').trim()) {
        zeilen.push('### ' + sz.titel.trim() + (was.status ? '  `' + ({ funke: 'Funke', entwurf: 'Entwurf', steht: 'Steht' }[sz.status] || 'Funke') + '`' : ''), '');
      }
      const text = (sz.text || '').trim();
      if (text) zeilen.push(text);
      else if (was.leere) zeilen.push('*(noch leer)*');
      if (was.notizen && (sz.notiz || '').trim()) zeilen.push('', '> **Notiz:** ' + sz.notiz.trim().replace(/\n/g, '\n> '));
    });
  }
  if (was.hefte) {
    const hefte = vomTyp('heft').filter((h) => h.projektRef === p.id);
    for (const h of hefte) {
      zeilen.push('', '## Heft: ' + (h.titel || 'Ohne Titel'), '');
      for (const seite of kinder(h.id, 'seite')) {
        if ((seite.titel || '').trim()) zeilen.push('### ' + seite.titel.trim(), '');
        if ((seite.text || '').trim()) zeilen.push(seite.text.trim(), '');
        for (const z of kinder(seite.id, 'zettel')) if ((z.text || '').trim()) zeilen.push('> ' + z.text.trim().replace(/\n/g, '\n> '), '');
      }
    }
  }
  return zeilen.join('\n').replace(/\n{4,}/g, '\n\n\n').trim() + '\n';
}

async function projektHinausgeben(p) {
  const was = { kopf: true, szenentitel: true, status: false, notizen: false, figuren: true, hefte: false, leere: false };
  const schalter = (name, schluessel, hinweis) => {

function zeigeLeseansicht(p) {
  const kapitel = kinder(p.id, 'kapitel');
  let gesamt = '';
  const innen = el('div', { class: 'innen' });
  innen.append(el('h1', {}, p.titel));

    innen.append(el('h2', {}, k.titel));
    gesamt += '\n\n' + k.titel.toUpperCase() + '\n\n';
    const texte = szenen.map((s) => s.text.trim());
    gesamt += texte.join('\n\n*\n\n');
    innen.append(el('div', { class: 'lesetext' }, texte.join('\n\n*\n\n')));
    szenen.forEach((s) => { w += worte(s.text); });
  }
  const h1 = innen.querySelector('h1');
  h1.after(el('div', { class: 'lmeta' }, w.toLocaleString('de-DE') + ' Wörter am Stück'));

let _sr = null;

/* ----- Vorlesen: die Stimme des Geräts, ganz ohne Netz -----
   Gut zum Gegenlesen: Was holpert, hört man, bevor man es sieht. */
let _vorleser = null;
function vorlesenMoeglich() { return typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined'; }
function vorlesenLaeuft() { return !!(_vorleser && vorlesenMoeglich() && speechSynthesis.speaking); }
function vorlesenStopp() {
  if (vorlesenMoeglich()) { try { speechSynthesis.cancel(); } catch (e) {} }
  _vorleser = null;
  document.body.classList.remove('liest-vor');
  $$('.vorlese-knopf.an').forEach((k) => k.classList.remove('an'));
}
function vorlesen(text, knopf) {
  if (!vorlesenMoeglich()) { toast('Dieses Gerät kann noch nicht vorlesen.'); return false; }
  if (vorlesenLaeuft()) { vorlesenStopp(); return false; }
  const rein = String(text || '').replace(/\s+/g, ' ').trim();
  if (!rein) { toast('Da steht noch nichts zum Vorlesen.'); return false; }
  try { speechSynthesis.cancel(); } catch (e) {}
  /* Lange Texte in Stücke: manche Geräte brechen bei langen Äußerungen ab. */
  const stuecke = rein.match(/[^.!?…]+[.!?…]+["“”»«)]?|[^.!?…]+$/g) || [rein];
  const bloecke = [];
  let puffer = '';
  for (const st of stuecke) {
    if ((puffer + st).length > 700 && puffer) { bloecke.push(puffer.trim()); puffer = ''; }
    puffer += st + ' ';
  }
  if (puffer.trim()) bloecke.push(puffer.trim());
  const stimmen = (speechSynthesis.getVoices() || []);
  const deutsch = stimmen.find((v) => /^de[-_]/i.test(v.lang) && /siri|anna|petra|markus|google|natural|premium/i.test(v.name)) || stimmen.find((v) => /^de[-_]/i.test(v.lang)) || null;
  _vorleser = { bloecke, i: 0 };
  document.body.classList.add('liest-vor');
  if (knopf) knopf.classList.add('an');
  const weiter = () => {
    if (!_vorleser || _vorleser.i >= _vorleser.bloecke.length) { vorlesenStopp(); return; }
    const u = new SpeechSynthesisUtterance(_vorleser.bloecke[_vorleser.i++]);
    u.lang = deutsch ? deutsch.lang : 'de-DE';
    if (deutsch) u.voice = deutsch;
    u.rate = begrenze(D.einst.vorleseTempo, .6, 1.4, .95);
    u.onend = weiter;
    u.onerror = () => vorlesenStopp();
    try { speechSynthesis.speak(u); } catch (e) { vorlesenStopp(); }
  };
  weiter();
  return true;
}

function oeffneSchreibraum(docId) {

      doc.format = 'rich'; doc.rich = richAusText(srAktuellerText()); speichere(doc);

  );

  );

  const raum = el('div', { class: 'schreibraum' }, kopf, mitte, leiste);

  wendeSchriftAn();
  wendeTastaturArtAn();

    if (istRich) { richBefehl(ta, 'insertText', z); ta.dispatchEvent(new Event('input', { bubbles: true })); return; }
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + z + ta.value.slice(e);
    ta.setSelectionRange(s + z.length, s + z.length);

    ta.focus();

  const sichern = istRich ? richPaket.sichern : entprellt(() => {
    doc.text = ta.value;

  }, 500, true);
  _sr.sichern = sichern;
  /* Jeder Anschlag ist ein kleiner Luftzug für die Kerze. */
  ta.addEventListener('input', () => { if (_sr && _sr.sprint && _sr.sprint.kerze) _sr.sprint.kerze.puste(.22); });

  function ersetzeKlug() {
    if (istRich || !D.einst.ersetzungen) return;

  let zielKlangGespielt = false;
  ta.addEventListener('input', () => {
    ersetzeKlug();
    sichern();
    const roh = istRich ? richReinerText(ta.innerHTML) : ta.value;
    const n = worte(roh);
    const dazu = n - startWorte;

    worteAnzeige.title = n.toLocaleString('de-DE') + ' Wörter · ' + roh.length.toLocaleString('de-DE')
      + ' Zeichen · etwa ' + Math.max(1, Math.round(n / 200)) + ' Min. Lesezeit';
    kopf.classList.add('versunken');

    }
  });
  ta.addEventListener('keydown', (e) => {
    if (D.einst.tastenklang && e.key.length === 1) tippKlick();
    if (e.key === 'Escape') { schliesseSchreibraum(true); return; }
    const cmd = e.metaKey || e.ctrlKey;
    /* Die Griffe, die man aus jedem Schreibprogramm im Finger hat. */
    if (cmd && e.key.toLowerCase() === 's') { e.preventDefault(); friereEin(); return; }
    if (cmd && e.key.toLowerCase() === 'f') { e.preventDefault(); sucheErsetze(); return; }
    if (cmd && e.key === 'Enter') { e.preventDefault(); schliesseSchreibraum(true); return; }
    /* Tab rückt ein, statt den Fokus aus dem Text zu werfen. */
    if (e.key === 'Tab' && !istRich) {

  }

}

/* ----- Sprint: die Kerze ----- */
function starteSprint(minuten) {
  if (!_sr || _sr.sprint) return;
  const startWorte = worte(srAktuellerText());
  /* Die Kerze steht rechts unten im Raum und brennt über die Zeit herunter.
     Sie selbst meldet das Ende — kein zweiter Timer, der auseinanderläuft. */
  const kerze = kerzeAnzuenden({
    minuten,
    beiEnde: () => beendeSprint(false),

      if (!_sr || !_sr.sprint) return;

      ], m > 1 ? 'Noch etwa ' + m + ' Minuten.' : 'Gleich ausgebrannt.');
      if (wahl === 'aus') beendeSprint(true);
    }
  });
  _sr.raum.append(kerze.element);
  _sr.raum.classList.add('kerze-brennt');

    toast('Ein Atemzug Rauch. ' + geschrieben + ' Wörter in ' + sp.minuten + ' Minuten.' + klangDazu, 4200);
