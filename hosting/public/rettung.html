    inhalt.append(el('div', { class: 'sicherungs-mahnung' },
      tageOhneSicherung === null ? 'Noch nie gesichert. ' : 'Letzte Sicherung: vor ' + tageOhneSicherung + ' Tagen. ',
      el('button', { onclick: () => { location.hash = '#/feinheiten'; } }, 'Sicher ist sicher →')
    ));
  }

  haupt.append(inhalt);
};

/* ================================================================
   VANI — Schnipsel: der Chat mit mir selbst
   ================================================================ */

RENDER.schnipsel = function (haupt) {
  const raum = el('div', { class: 'schnipsel-raum' });

  const kopf = el('div', { class: 'kopf', style: 'position:static;background:none' },
    el('h1', {}, 'Schnipsel', el('div', { class: 'unter' }, 'an mich, für später')));
  const modus = el('div', { class: 'schnipsel-modus wahlgruppe' });
  for (const [id, name] of [['lauf', 'Faden'], ['frei', 'Ungeordnet']]) modus.append(el('button', {
    class: D.einst.schnipselAnsicht === id ? 'an' : '', onclick: () => {
      D.einst.schnipselAnsicht = id; speichereEinst();
      $$('button', modus).forEach((b) => b.classList.toggle('an', b.textContent === name));
      baueLauf();
    }
  }, name));
  kopf.append(modus);
  raum.append(kopf);

  const pinnzeile = el('div', { class: 'pinnzeile' });
  const lauf = el('div', { class: 'schnipsel-lauf' });
  const innen = el('div', { class: 'innen' });
  lauf.append(innen);

  let freieSuche = '';
  const suchfeld = el('input', { type: 'search', placeholder: 'Auf der Fläche suchen …' });
  const fundzahl = el('span', {}, '');
  const suchzeile = el('div', { class: 'freie-suche' }, el('span', { html: ik('suche') }), suchfeld, fundzahl,
    el('button', { class: 'knopf zart', onclick: () => {
      const sichtbar = $$('.freier-schnipsel:not(.such-versteckt)', innen);
      if (!sichtbar.length) return;
      zufall(sichtbar).scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    } }, 'Fundstück'));
  suchfeld.addEventListener('input', entprellt(() => { freieSuche = normalisiere(suchfeld.value.trim()).slice(0, 120); filtereFreie(); }, 100));

  const feld = el('textarea', { placeholder: 'An mich …', rows: 1 });
  autogrow(feld);
  /* Enter schickt ab wie in jedem Chat; Umschalt+Enter macht eine neue Zeile. */
  feld.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const t = feld.value.trim();
    if (!t) return;
    neuDoc('schnipsel', { text: t });
    feld.value = ''; feld.style.height = 'auto';
    baueLauf(); runter(); feld.focus();
  });
  const zeile = el('div', { class: 'schreibzeile' },
    el('button', {
      class: 'rundknopf zart', html: ik('kamera'), title: 'Bild hinzufügen', onclick: async () => {
        const bild = await waehleBild();
        if (!bild) return;
        neuDoc('schnipsel', { text: feld.value.trim(), bild: bild.id });
        feld.value = ''; feld.style.height = 'auto';
        baueLauf(); runter();
      }
    }),
    feld,
    el('button', {
      class: 'rundknopf voll', html: ik('senden'), title: 'Schnipsel festhalten', onclick: () => {
        const t = feld.value.trim();
        if (!t) return;
        neuDoc('schnipsel', { text: t });
        feld.value = ''; feld.style.height = 'auto';
        baueLauf(); runter();
        feld.focus();
      }
    })
  );

  raum.append(suchzeile, pinnzeile, lauf, zeile);
  haupt.append(raum);

  function runter() { requestAnimationFrame(() => { lauf.scrollTop = lauf.scrollHeight; }); }

  function baueLauf() {
    innen.innerHTML = '';
    pinnzeile.innerHTML = '';
    const alle = vomTyp('schnipsel').sort((a, b) => a.angelegt - b.angelegt);

    const frei = D.einst.schnipselAnsicht === 'frei';
    lauf.classList.toggle('frei', frei);
    innen.classList.toggle('freie-flaeche', frei);
    suchzeile.style.display = frei ? 'flex' : 'none';
    pinnzeile.style.display = frei ? 'none' : '';
    if (!frei) { innen.style.width = ''; innen.style.height = ''; }

    if (frei) {
      baueFreie(alle);
      return;
    }

    for (const s of alle.filter((x) => x.gepinnt)) {
      pinnzeile.append(el('button', {
        class: 'pinnchip', onclick: () => {
          const ziel = innen.querySelector('[data-id="' + s.id + '"]');
          if (ziel) { ziel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
      }, s.text || '[Bild]'));
    }

    if (!alle.length) {
      innen.append(el('div', { class: 'leer' }, 'Noch still hier.',
        el('div', { class: 'klein' }, 'Der erste Gedanke findet von allein den Weg.')));
      return;
    }

    let letzterTag = '';
    for (const s of alle) {
      const tag = tagKey(s.angelegt);
      if (tag !== letzterTag) {
        letzterTag = tag;
        const heute = tagKey();
        const gestern = tagKey(Date.now() - 86400000);
        innen.append(el('div', { class: 'datumstrenner' },
          tag === heute ? 'Heute' : tag === gestern ? 'Gestern' : fmtDatum(s.angelegt)));
      }
      const blase = el('div', { class: 'blase' + (s.gepinnt ? ' gepinnt' : ''), 'data-id': s.id });
      if (s.bild) {
        const img = el('img', { alt: '' });
        setzeBild(img, s.bild);
        blase.append(img);
      }
      if (s.text) blase.append(el('div', { class: 'btext', html: schmuecke(s.text) }));
      blase.append(el('div', { class: 'bzeit' },
        s.gepinnt ? el('span', { html: ik('pin'), style: 'display:flex;width:11px;color:var(--gold)' }) : null,
        fmtZeit(s.angelegt)));
      blase.addEventListener('click', (e) => {
        if (e.target.closest('.verweis') || e.target.closest('textarea')) return;
        schnipselMenue(s, blase, baueLauf);
      });
      innen.append(blase);
    }
  }

  function baueFreie(alle) {
    if (!alle.length) {
      innen.append(el('div', { class: 'leer freie-leere' }, 'Noch viel freie Fläche.', el('div', { class: 'klein' }, 'Schnipsel werden hier lose ausgelegt. Du kannst sie verschieben und in alle Richtungen wandern.')));
      return;
    }
    const positionen = alle.map((s, i) => s.freiPos || freieSchnipselPosition(i, s.id));
    const grenze = freieFlaechenGrenzen(positionen, Math.max(900, lauf.clientWidth || 0), Math.max(680, lauf.clientHeight || 0));
    innen.style.width = grenze.breite + 'px'; innen.style.height = grenze.hoehe + 'px';
    const rand = 80;
    alle.forEach((s, i) => {
      const p = positionen[i];
      const karte = el('article', {
        class: 'freier-schnipsel' + (s.gepinnt ? ' gepinnt' : ''), 'data-id': s.id,
        style: 'left:' + (p.x - grenze.minX + rand) + 'px;top:' + (p.y - grenze.minY + rand) + 'px;width:' + begrenze(p.w, 180, 520, 260) + 'px;--frei-rot:' + begrenze(p.rot, -12, 12, 0) + 'deg'
      });
      if (s.bild) { const img = el('img', { alt: '' }); setzeBild(img, s.bild); karte.append(img); }
      if (s.text) karte.append(el('div', { class: 'btext', html: schmuecke(s.text) }));
      karte.append(el('div', { class: 'bzeit' }, s.gepinnt ? el('span', { html: ik('pin') }) : null, fmtDatum(s.angelegt) + ' · ' + fmtZeit(s.angelegt)));
      freieGeste(karte, s, p, grenze);
      karte.addEventListener('click', (e) => {
        if (karte._zieht || e.target.closest('.verweis')) return;
        schnipselMenue(s, karte, baueLauf);
      });
      innen.append(karte);
    });
    filtereFreie();
  }

  function freieGeste(karte, s, p, grenze) {
    let zug = null;
    karte.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.verweis')) return;
      zug = { sx: e.clientX, sy: e.clientY, x: p.x, y: p.y, bewegt: false };
      try { karte.setPointerCapture(e.pointerId); } catch (x) {}
    });
    karte.addEventListener('pointermove', (e) => {
      if (!zug) return;
      const dx = e.clientX - zug.sx, dy = e.clientY - zug.sy;
      if (!zug.bewegt && Math.hypot(dx, dy) < 7) return;
      zug.bewegt = true; karte._zieht = true;
      p.x = zug.x + dx; p.y = zug.y + dy;
      karte.style.left = (p.x - grenze.minX + 80) + 'px'; karte.style.top = (p.y - grenze.minY + 80) + 'px';
    });
    const ende = () => {
      if (!zug) return;
      if (zug.bewegt) { s.freiPos = { x: p.x, y: p.y, rot: p.rot, w: p.w }; speichereStill(s); }
      zug = null; setTimeout(() => { karte._zieht = false; }, 0);
    };
    karte.addEventListener('pointerup', ende); karte.addEventListener('pointercancel', ende);
  }

  function filtereFreie() {
    if (D.einst.schnipselAnsicht !== 'frei') return;
    let n = 0;
    for (const karte of $$('.freier-schnipsel', innen)) {
      const s = D.docs.get(karte.dataset.id);
      const passt = !freieSuche || normalisiere((s && s.text) || '').includes(freieSuche);
      karte.classList.toggle('such-versteckt', !passt); if (passt) n++;
    }
    fundzahl.textContent = freieSuche ? (n === 1 ? '1 Fund' : n + ' Funde') : '';
  }

  baueLauf();
  runter();
};

async function schnipselMenue(s, blase, neuZeichnen) {
  const wahl = await menue([
    { text: s.gepinnt ? 'Losmachen' : 'Anpinnen', icon: 'pin', wert: 'pin' },
    s.text ? { text: 'Bearbeiten', icon: 'stift', wert: 'edit' } : null,
    { text: 'Hinzufügen & verbinden', icon: 'verbinden', wert: 'dazu' },
    { text: 'Verwandeln …', icon: 'wandel', wert: 'wandel' },
    { text: 'Löschen', icon: 'muell', wert: 'weg', rot: true }
  ]);
  if (wahl === 'pin') { s.gepinnt = !s.gepinnt; speichereStill(s); neuZeichnen(); }
  else if (wahl === 'edit') {
    const neu = await eingabe({ titel: 'Schnipsel', wert: s.text, mehrzeilig: true });
    if (neu !== null) { s.text = neu; speichere(s); neuZeichnen(); }
  }
  else if (wahl === 'weg') {
    if (await frage('Diesen Schnipsel wegwerfen?', { ja: 'Wegwerfen', gefahr: true })) { await loesche(s.id); neuZeichnen(); }
  }
  else if (wahl === 'dazu') { await hinzufuegenMenue(s); if (neuZeichnen) neuZeichnen(); }
  else if (wahl === 'wandel') verwandleSchnipsel(s, neuZeichnen);
}

async function verwandleSchnipsel(s, neuZeichnen) {
  const ziel = await menue([
    { text: 'Als Blatt in den Stapel', icon: 'blatt', wert: 'blatt' },
    { text: 'Auf eine Heftseite kleben', icon: 'hefte', wert: 'seite' },
    { text: 'Als Szene in ein Projekt', icon: 'projekte', wert: 'szene' },
    { text: 'Als Blase auf ein Brett', icon: 'cluster', wert: 'blase' },
    { text: 'Als Wort in die Kiste', icon: 'woerter', wert: 'wort' }
  ], 'Woraus soll das werden?');
  if (!ziel) return;

  if (ziel === 'blatt') {
    blattAusText('', s.text || '');
    await loesche(s.id, true);
    toast('Liegt jetzt bei den Blättern.');
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'wort') {
    neuDoc('wort', { text: (s.text || '').slice(0, 60) });
    toast('Liegt in der Wortschatzkiste.');
    await loesche(s.id, true);
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'seite') {
    const heft = await waehleHeft();
    if (!heft) return;
    const geschwister = kinder(heft.id, 'seite');
    const seite = neuDoc('seite', { parent: heft.id, ord: geschwister.length, titel: '', text: s.text || '' });
    if (s.bild) {
      neuDoc('foto', { parent: seite.id, bild: s.bild, pos: { x: 55, y: 8, rot: -2 + Math.random() * 4, w: 38 } });
      delete s.bild;
    }
    await loesche(s.id);
    toast('Eingeklebt: ' + heft.titel);
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'szene') {
    const wo = await waehleProjektKapitel();
    if (!wo) return;
    const geschwister = kinder(wo.kapitel.id, 'szene');
    neuDoc('szene', {
      parent: wo.kapitel.id, projekt: wo.projekt.id, ord: geschwister.length,
      titel: (s.text || '').split('\n')[0].slice(0, 40), text: s.text || '', rich: richAusText(s.text || ''), format: 'rich', status: 'funke', farbe: ''
    });
    await loesche(s.id);
    toast('Jetzt eine Szene in „' + wo.projekt.titel + '".');
    if (neuZeichnen) neuZeichnen();
    return;
  }
  if (ziel === 'blase') {
    const brett = await waehleBrett();
    if (!brett) return;
    neuDoc('blase', { parent: brett.id, text: s.text || '', farbe: '', pos: { x: 80 + Math.random() * 300, y: 80 + Math.random() * 300 } });
    await loesche(s.id);
    toast('Schwebt jetzt auf „' + brett.titel + '".');
    if (neuZeichnen) neuZeichnen();
  }
}

/* Auswahl-Helfer */
async function waehleHeft() {
  const hefte = vomTyp('heft').filter((h) => !h.archiv);
  const wahl = await menue([
    ...hefte.map((h) => ({ text: h.titel, icon: 'hefte', wert: h.id })),
    { text: 'Neues Heft', icon: 'plus', wert: '_neu' }
  ], 'In welches Heft?');
  if (!wahl) return null;
  if (wahl === '_neu') {
    const name = await eingabe({ titel: 'Ein neues Heft', platzhalter: 'Wie soll es heißen?' });
    if (!name) return null;
    return neuDoc('heft', { titel: name, farbe: zufall(HEFTFARBEN), farbe2: zufall(HEFTFARBEN), band: '#d6bd92', muster: 'leinen', papier: 'liniert', ansicht: 'seiten' });
  }
  return D.docs.get(wahl);
}
async function waehleProjektKapitel() {
  const projekte = vomTyp('projekt');
  if (!projekte.length) { toast('Noch kein Projekt. Leg erst eins an.'); return null; }
  const pWahl = await menue(projekte.map((p) => ({ text: p.titel, icon: 'projekte', wert: p.id })), 'Welches Projekt?');
  if (!pWahl) return null;
  const projekt = D.docs.get(pWahl);
  const kapitel = kinder(projekt.id, 'kapitel');
  if (!kapitel.length) {
    const k = neuDoc('kapitel', { parent: projekt.id, titel: 'Kapitel 1', ord: 0 });
    return { projekt, kapitel: k };
  }
  if (kapitel.length === 1) return { projekt, kapitel: kapitel[0] };
  const kWahl = await menue(kapitel.map((k) => ({ text: k.titel, wert: k.id })), 'Wohin genau?');
  if (!kWahl) return null;
  return { projekt, kapitel: D.docs.get(kWahl) };
}
async function waehleBrett() {
  const bretter = vomTyp('board');
  const wahl = await menue([
    ...bretter.map((b) => ({ text: b.titel, icon: 'cluster', wert: b.id })),
    { text: 'Neues Brett', icon: 'plus', wert: '_neu' }
  ], 'Auf welches Brett?');
  if (!wahl) return null;
  if (wahl === '_neu') {
    const name = await eingabe({ titel: 'Ein neues Brett', platzhalter: 'Wofür ist es?' });
    if (!name) return null;
    return neuDoc('board', { titel: name });
  }
  return D.docs.get(wahl);
}

/* ================================================================
   VANI — Blätter: nur Texte, nichts sonst.
   ================================================================ */

/* Blätter sind von Anfang an formatierbar — Rich-Text überall, wo man schreibt. */
function blattAusText(titel, text) {
  return neuDoc('blatt', { titel: titel || '', text: text || '', rich: richAusText(text || ''), format: 'rich', ord: Date.now() });
}

RENDER.blaetter = function (haupt) {
  haupt.append(raumkopf('Blätter', 'ein Stapel Texte, mehr nicht',
    el('button', {
      class: 'rundknopf voll', html: ik('plus'), title: 'Neues Blatt', onclick: () => {
        const b = blattAusText('', '');
        oeffneSchreibraum(b.id);
      }
    })
  ));
  const inhalt = el('div', { class: 'inhalt' });

  const sortierung = D.einst.blattSortierung || 'zuletzt';
  let alle = vomTyp('blatt');
  /* Ab einer Handvoll Blättern hilft ein Suchfeld mehr als Scrollen. */
  const suchfeld = el('input', { type: 'search', class: 'blattsuche', placeholder: 'In den Blättern suchen …' });
  const filter = normalisiere((sessionStorage.getItem('blattSuche') || '').trim());
  if (filter) {
    suchfeld.value = sessionStorage.getItem('blattSuche') || '';
    alle = alle.filter((b) => normalisiere((b.titel || '') + ' ' + (b.text || '')).includes(filter));
  }
  suchfeld.addEventListener('input', entprellt(() => {
    sessionStorage.setItem('blattSuche', suchfeld.value);
    const stelle = suchfeld.selectionStart;
    zeichne();
    requestAnimationFrame(() => { const f = $('.blattsuche'); if (f) { f.focus(); f.setSelectionRange(stelle, stelle); } });
  }, 220));
  if (sortierung === 'az') alle.sort((a, b) => (a.titel || a.text || '').localeCompare(b.titel || b.text || '', 'de'));
  else if (sortierung === 'aeltest') alle.sort((a, b) => a.angelegt - b.angelegt);
  /* Angepinnte Blätter liegen oben — in jeder Sortierung. */
  alle.sort((a, b) => Number(!!b.gepinnt) - Number(!!a.gepinnt));

  if (alle.length > 1) {
    const wahl = el('div', { class: 'wahlgruppe', style: 'margin-bottom:12px' });
    for (const [id, name] of [['zuletzt', 'Zuletzt'], ['aeltest', 'Älteste zuerst'], ['az', 'A–Z']]) {
      wahl.append(el('button', {
        class: sortierung === id ? 'an' : '', onclick: () => { D.einst.blattSortierung = id; speichereEinst(); zeichne(); }
      }, name));
    }
    inhalt.append(wahl);
  }
  if (vomTyp('blatt').length > 5) inhalt.append(suchfeld);

  if (!alle.length) {
    inhalt.append(el('div', { class: 'leer' }, 'Ein leerer Stapel.',
      el('div', { class: 'klein' }, 'Für alles, was einfach nur geschrieben werden will.')));
  }

  const liste = el('div', { class: 'blattliste' });
  for (const b of alle) {
    const worteZahl = worte(b.text);
    const erste = (b.text || '').trim().split('\n')[0] || '';
    const karte = el('button', { class: 'karte blattkarte' + (b.gepinnt ? ' gepinnt' : ''), onclick: () => oeffneSchreibraum(b.id) },
      b.gepinnt ? el('span', { class: 'blatt-nadel', html: ik('pin') }) : null,
      el('div', { class: 'btitel serif' }, b.titel || erste.slice(0, 60) || 'Ohne Titel'),
      el('div', { class: 'bprobe' }, (b.text || '').trim().replace(/\s+/g, ' ').slice(0, 140) || 'Noch leer.'),
      el('div', { class: 'bfuss' }, (worteZahl ? worteZahl.toLocaleString('de-DE') + ' Wörter · ' : '') + vorZeit(b.geaendert)
        + (worteZahl > 60 ? ' · ' + Math.max(1, Math.round(worteZahl / 200)) + ' Min.' : ''))
    );
    langdruck(karte, async () => {
      const wahl = await menue([
        { text: b.gepinnt ? 'Losmachen' : 'Oben anpinnen', icon: 'pin', wert: 'pin' },
        { text: 'Umbenennen', icon: 'stift', wert: 'name' },
        { text: 'Vorlesen lassen', icon: 'vorlesen', wert: 'vorlesen' },
        { text: 'Teilen', icon: 'teilen', wert: 'teilen' },
        { text: 'Duplizieren', icon: 'wandel', wert: 'doppel' },
        { text: 'In ein Heft legen …', icon: 'hefte', wert: 'heft' },
        { text: 'Hinzufügen & verbinden', icon: 'verbinden', wert: 'dazu' },
        { text: 'Löschen', icon: 'muell', wert: 'weg', rot: true }
      ], b.titel || 'Blatt');
      if (wahl === 'pin') {
        b.gepinnt = !b.gepinnt; speichereStill(b); zeichne();
      } else if (wahl === 'vorlesen') {
        vorlesen((b.titel ? b.titel + '. ' : '') + (b.text || ''));
      } else if (wahl === 'name') {
        const neu = await eingabe({ titel: 'Das Blatt heißt jetzt …', wert: b.titel });
        if (neu !== null) { b.titel = neu; speichereStill(b); zeichne(); }
      } else if (wahl === 'teilen') {
        teileText((b.titel ? b.titel + '\n\n' : '') + (b.text || ''));
      } else if (wahl === 'doppel') {
        neuDoc('blatt', { titel: (b.titel || 'Blatt') + ' (Abschrift)', text: b.text, rich: b.rich || '', format: b.format || 'plain', ord: Date.now() });
        zeichne();
      } else if (wahl === 'heft') {
        if (await legeBlattInHeft(b)) zeichne();
      } else if (wahl === 'dazu') {
        await hinzufuegenMenue(b); zeichne();
      } else if (wahl === 'weg') {
        await loesche(b.id); zeichne();
      }
    });
    liste.append(karte);
  }
  inhalt.append(liste);
  haupt.append(inhalt);
};

/* ================================================================
   VANI — Der Faden: der lange Chat, weitergesponnen.
   ================================================================ */

RENDER.faden = function (haupt) {
  const raum = el('div', { class: 'schnipsel-raum' });
  raum.append(el('div', { class: 'kopf', style: 'position:static;background:none' },
    el('h1', {}, 'Faden', el('div', { class: 'unter' }, 'alles, was je an Vani ging'))
  ));

  const lauf = el('div', { class: 'schnipsel-lauf' });
  const innen = el('div', { class: 'innen' });
  lauf.append(innen);

  const feld = el('textarea', { placeholder: 'Weiter im Faden …', rows: 1 });
  feld.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const knopf = feld.parentElement && feld.parentElement.querySelector('.rundknopf.voll');
    if (knopf) knopf.click();
  });
  autogrow(feld);
  const zeile = el('div', { class: 'schreibzeile' },
    feld,
    el('button', {
      class: 'rundknopf voll', html: ik('senden'), title: 'In den Faden schreiben', onclick: () => {
        const t = feld.value.trim();
        if (!t) return;
        neuDoc('faden', { text: t });
        feld.value = ''; feld.style.height = 'auto';
        baueLauf(true);
        feld.focus();
      }
    })
  );
  raum.append(lauf, zeile);
  haupt.append(raum);

  const alle = () => vomTyp('faden').sort((a, b) => a.angelegt - b.angelegt);
  let zeigeAb = Math.max(0, alle().length - 150);
  let zielFaden = sessionStorage.getItem('zielFaden');
  if (zielFaden) {
    sessionStorage.removeItem('zielFaden');
    const zi = alle().findIndex((d) => d.id === zielFaden);
    if (zi >= 0) zeigeAb = Math.max(0, zi - 35);
  }

  function baueBlase(s) {
    const blase = el('div', { class: 'blase fadenblase', 'data-id': s.id },
      el('div', { class: 'btext', html: schmuecke(s.text) }),
      el('div', { class: 'bzeit' }, fmtZeit(s.angelegt))
    );
    blase.addEventListener('click', async (e) => {
      if (e.target.closest('.verweis')) return;
      const wahl = await menue([
        { text: 'Kopieren', icon: 'teilen', wert: 'kopie' },
        { text: 'Als Blatt herauslösen', icon: 'blatt', wert: 'blatt' },
        { text: 'Löschen', icon: 'muell', wert: 'weg', rot: true }
      ]);
      if (wahl === 'kopie') { try { await navigator.clipboard.writeText(s.text); toast('Kopiert.'); } catch (x) { teileText(s.text); } }
      else if (wahl === 'blatt') { blattAusText('', s.text); toast('Liegt jetzt bei den Blättern.'); }
      else if (wahl === 'weg') { await loesche(s.id); baueLauf(); }
    });
    return blase;
  }

  function baueLauf(ansEnde) {
    innen.innerHTML = '';
    const liste = alle();
    if (!liste.length) {
      innen.append(el('div', { class: 'leer' }, 'Der Faden liegt noch woanders.',
        el('div', { class: 'klein' }, 'Er kommt als private Datei zu dir — Feinheiten → „Sicher ist sicher" → einlesen. Danach läuft er hier weiter.')));
      return;
    }
    if (zeigeAb > 0) {
      innen.append(el('button', {
        class: 'knopf zart', style: 'align-self:center;margin:10px 0', onclick: () => {
          const alteHoehe = lauf.scrollHeight;
          zeigeAb = Math.max(0, zeigeAb - 300);
          baueLauf();
          lauf.scrollTop = lauf.scrollHeight - alteHoehe;
        }
      }, '… frühere zeigen (' + zeigeAb + ')'));
    }
    let letzterTag = '';
    for (const s of liste.slice(zeigeAb)) {
      const tag = tagKey(s.angelegt);
      if (tag !== letzterTag) {
        letzterTag = tag;
        const d = new Date(s.angelegt);
        innen.append(el('div', { class: 'datumstrenner' }, fmtDatum(s.angelegt) + ' ' + d.getFullYear()));
      }
      innen.append(baueBlase(s));
    }
    if (zielFaden) {
      const zielId = zielFaden; zielFaden = null;
      requestAnimationFrame(() => {
      /* Nicht als CSS-Selektor zusammensetzen: auch ein importierter alter
         Faden darf Sonderzeichen in seiner ID haben und trotzdem exakt springen. */
      const ziel = [...innen.querySelectorAll('[data-id]')].find((e) => e.dataset.id === zielId);
      if (ziel) { ziel.classList.add('wieder-ziel'); ziel.scrollIntoView({ block: 'center' }); }
      });
    }
    else if (ansEnde !== false) requestAnimationFrame(() => { lauf.scrollTop = lauf.scrollHeight; });
  }

  baueLauf();
};

/* ================================================================
   VANI — Goodnotes-Archiv: ganze Notizbücher, ruhig und unverändert
   ================================================================ */

const GOODNOTES_MAX = 250 * 1024 * 1024;
function goodnotesArt(datei) {
  const name = String(datei && datei.name || '').toLowerCase();
  const mime = String(datei && datei.type || '').toLowerCase();
  if (mime === 'application/pdf' || name.endsWith('.pdf')) return 'pdf';
  if (mime.startsWith('image/') || /\.(png|jpe?g|webp)$/i.test(name)) return 'bild';
  if (name.endsWith('.goodnotes')) return 'goodnotes';
  if (mime === 'application/zip' || name.endsWith('.zip')) return 'paket';
  return null;
}
function goodnotesFingerabdruck(datei) {
  return [String(datei.name || '').toLowerCase(), Number(datei.size) || 0, Number(datei.lastModified) || 0].join(':');
}
async function blobsGleich(a, b, block = 1024 * 1024) {
  if (!a || !b || a.size !== b.size) return false;
  const schritt = Math.max(4096, Math.min(4 * 1024 * 1024, Number(block) || 1024 * 1024));
  for (let ab = 0; ab < a.size; ab += schritt) {
    const [aa, bb] = await Promise.all([a.slice(ab, ab + schritt).arrayBuffer(), b.slice(ab, ab + schritt).arrayBuffer()]);
    const x = new Uint8Array(aa), y = new Uint8Array(bb);
    if (x.length !== y.length) return false;
    for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
  }
  return true;
}

async function importiereGoodnotes() {
  const inp = el('input', { type: 'file', multiple: 'multiple', accept: '.pdf,.goodnotes,.zip,application/zip,image/png,image/jpeg,image/webp', style: 'display:none' });
  document.body.append(inp);
  inp.addEventListener('change', async () => {
    const dateien = [...(inp.files || [])];
    inp.remove();
    if (!dateien.length) return;
    let frei = Infinity;
    try {
      const s = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      if (s && Number.isFinite(s.quota) && Number.isFinite(s.usage)) frei = s.quota - s.usage;
    } catch (e) {}
    let dazu = 0, doppelt = 0, abgelehnt = 0, verbraucht = 0;
    const bekannt = new Map();
    for (const d of vomTyp('goodnote')) {
      if (!d.fingerabdruck) continue;
      if (!bekannt.has(d.fingerabdruck)) bekannt.set(d.fingerabdruck, []);
      bekannt.get(d.fingerabdruck).push(d);
    }
    for (const datei of dateien) {
      const art = goodnotesArt(datei);
      const fp = goodnotesFingerabdruck(datei);
      if (!art || !datei.size || datei.size > GOODNOTES_MAX || verbraucht + datei.size > frei * .85) { abgelehnt++; continue; }
      let istDoppelt = false;
      for (const alt of bekannt.get(fp) || []) {
        try { const blob = await dbGet('media', alt.datei); if (blob && await blobsGleich(datei, blob)) { istDoppelt = true; break; } }
        catch (e) {}
      }
      if (istDoppelt) { doppelt++; continue; }
      try {
        const id = await speichereDateiBlob(datei);
        const neu = neuDoc('goodnote', {
          titel: datei.name.replace(/\.(pdf|goodnotes|zip|png|jpe?g|webp)$/i, ''), datei: id,
          dateiname: datei.name, dateityp: datei.type || (art === 'pdf' ? 'application/pdf' : 'application/octet-stream'),
          art, groesse: datei.size, fingerabdruck: fp, notiz: '', schlagworte: ''
        });
        if (!bekannt.has(fp)) bekannt.set(fp, []);
        bekannt.get(fp).push(neu);
        verbraucht += datei.size; dazu++;
      } catch (e) { abgelehnt++; }
    }
    if (dazu) {
      raumConfig();
      const r = D.einst.raeume.find((x) => x.id === 'goodnotes');
      if (r) r.an = true;
      speichereEinst(); baueLeiste();
      toast(dazu === 1 ? 'Ein Notizbuch liegt sicher im Goodnotes-Archiv.' : dazu + ' Notizbücher liegen sicher im Goodnotes-Archiv.', 4000);
      location.hash = '#/goodnotes';
    }
    if (doppelt) toast(doppelt + (doppelt === 1 ? ' vorhandene Datei wurde' : ' vorhandene Dateien wurden') + ' nicht doppelt abgelegt.');
    if (abgelehnt) toast(abgelehnt + (abgelehnt === 1 ? ' Datei war' : ' Dateien waren') + ' zu groß oder kein unterstütztes Format.', 4200);
  });
  inp.addEventListener('cancel', () => inp.remove());
  inp.click();
}

function formatBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1).replace('.', ',') + ' KB';
  return (n / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
}

async function goodnoteMenue(d) {
  const wahl = await menue([
    { text: 'Öffnen', icon: 'lesen', wert: 'auf' },
    { text: 'Titel, Stichwörter & Notiz', icon: 'stift', wert: 'meta' },
    { text: 'Hinzufügen & verbinden', icon: 'verbinden', wert: 'bezug' },
    { text: 'Original herausgeben', icon: 'teilen', wert: 'raus' },
    { text: 'Ins Archiv-Papierkorb legen', icon: 'muell', wert: 'weg', rot: true }
  ], d.titel || d.dateiname);
  if (wahl === 'auf') oeffneGoodnote(d);
  else if (wahl === 'meta') {
    const neu = await eingabe({ titel: 'Titel', wert: d.titel || '' });
    if (neu === null) return;
    const tags = await eingabe({ titel: 'Stichwörter', wert: d.schlagworte || '', platzhalter: 'z. B. Figuren, Schule, Ideen' });
    if (tags === null) return;
    const notiz = await eingabe({ titel: 'Eine Notiz dazu', wert: d.notiz || '', mehrzeilig: true });
    if (notiz === null) return;
    d.titel = neu; d.schlagworte = tags; d.notiz = notiz; speichere(d); zeichne();
  } else if (wahl === 'bezug') { await hinzufuegenMenue(d); }
  else if (wahl === 'raus') { await teileGespeicherteDatei(d); }
  else if (wahl === 'weg' && await frage('„' + docName(d) + '" in den Papierkorb legen? Die Originaldatei bleibt dort 30 Tage erhalten.', { ja: 'In den Papierkorb', gefahr: true })) {
    await loesche(d.id); zeichne();
  }
}

async function teileGespeicherteDatei(d) {
  const blob = await dbGet('media', d.datei);
  if (!blob) { toast('Die Originaldatei ist nicht mehr da.'); return false; }
  const datei = new File([blob], d.dateiname || (d.titel + '.pdf'), { type: d.dateityp || blob.type || 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei] }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: datei.name, style: 'display:none' });
  document.body.append(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  toast('Originaldatei gespeichert.');
  return true;
}

async function oeffneGoodnote(d) {
  const bogen = el('div', { class: 'goodnote-leser' });
  const leiste = el('div', { class: 'schwebeleiste' },
    el('button', { class: 'rundknopf zart', html: ik('kreuz'), title: 'Notizbuch schließen', onclick: () => { bogen.remove(); leiste.remove(); } }),
    el('span', { class: 'goodnote-lesertitel' }, d.titel || d.dateiname),
    el('button', { class: 'knopf', onclick: () => teileGespeicherteDatei(d) }, 'Original'));
  bogen.append(el('div', { class: 'leer' }, 'Notizbuch wird geöffnet …'));
  document.body.append(bogen, leiste);
  const url = await bildURL(d.datei);
  if (!bogen.isConnected) return;
  bogen.innerHTML = '';
  if (!url) { bogen.append(el('div', { class: 'leer' }, 'Die Datei ist nicht mehr da.')); return; }
  if (d.art === 'bild') bogen.append(el('img', { class: 'goodnote-bild', src: url, alt: d.titel || '' }));
  else if (d.art === 'pdf') bogen.append(el('iframe', { class: 'goodnote-pdf', src: url, title: d.titel || 'Goodnotes PDF', sandbox: '' }));
  else bogen.append(el('div', { class: 'goodnote-original' },
    el('div', { html: ik('buchzu') }), el('h2', {}, 'Sicher verwahrt.'),
    el('p', {}, d.art === 'paket' ? 'Das ganze exportierte Ordnerpaket bleibt als eine Datei zusammen. Du kannst es jederzeit über „Original" wieder herausgeben und in Goodnotes öffnen.' : 'Das Goodnotes-Original bleibt unverändert. Anzeigen kann es nur Goodnotes; du kannst es jederzeit über „Original" wieder herausgeben.')));
}

/* ================================================================
   VANI — Hefte: Papier, Zettel, Fotos, Kritzeleien
   ================================================================ */

function heftDeckelDaten(h) {
  const farbe = /^#[0-9a-f]{6}$/i.test(h && h.farbe || '') ? h.farbe : HEFTFARBEN[0];
  const farbe2 = /^#[0-9a-f]{6}$/i.test(h && h.farbe2 || '') ? h.farbe2 : farbe;
  const band = /^#[0-9a-f]{6}$/i.test(h && h.band || '') ? h.band : '#d6bd92';
  const muster = HEFT_MUSTER.some((m) => m[0] === (h && h.muster)) ? h.muster : 'schlicht';
  return { farbe, farbe2, band, muster, style: '--heft1:' + farbe + ';--heft2:' + farbe2 + ';--heftband:' + band };
}

const PAPIERFARBEN = [['hell', 'Hell'], ['weiss', 'Weiß'], ['creme', 'Creme'], ['kraft', 'Kraft'], ['nacht', 'Nacht']];
function papierKlassen(heft, extra = '') {
  return 'papierseite ' + (heft.papier || 'liniert') + ' papierfarbe-' + (heft.papierfarbe || 'hell') + (heft.rand ? ' mit-rand' : '') + extra;
}

async function heftGestalten(h, danach) {
  const vorschau = el('div', { class: 'heftdeckel heft-vorschau' }, el('div', { class: 'htitel' }, h.titel));
  const farben = el('div', { class: 'heft-farben' });
  const muster = el('div', { class: 'wahlgruppe heft-musterwahl', style: 'flex-wrap:wrap' });
  const frei = el('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(h.farbe || '') ? h.farbe : HEFTFARBEN[0], title: 'Eigene Grundfarbe' });
  const zweit = el('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(h.farbe2 || '') ? h.farbe2 : (h.farbe || HEFTFARBEN[0]), title: 'Zweite Farbe' });
  const band = el('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(h.band || '') ? h.band : '#d6bd92', title: 'Buchband' });
  const aktualisiere = () => {
    const d = heftDeckelDaten(h); vorschau.className = 'heftdeckel heft-vorschau muster-' + d.muster; vorschau.style.cssText = d.style;
  };
  for (const f of HEFTFARBEN) farben.append(el('button', { class: 'heft-farbpunkt', style: 'background:' + f, title: f, onclick: () => { h.farbe = f; frei.value = f; aktualisiere(); } }));
  for (const [id, name] of HEFT_MUSTER) muster.append(el('button', { class: (h.muster || 'schlicht') === id ? 'an' : '', onclick: (e) => {
    h.muster = id; $$('button', muster).forEach((b) => b.classList.toggle('an', b === e.currentTarget)); aktualisiere();
  } }, name));
  frei.addEventListener('input', () => { h.farbe = frei.value; aktualisiere(); });
  zweit.addEventListener('input', () => { h.farbe2 = zweit.value; aktualisiere(); });
  band.addEventListener('input', () => { h.band = band.value; aktualisiere(); });
  const papier = el('div', { class: 'wahlgruppe', style: 'flex-wrap:wrap' });
  for (const [id, name] of [['liniert', 'Liniert'], ['breit', 'Breite Linien'], ['kariert', 'Kariert'], ['punkte', 'Punktraster'], ['blank', 'Blanko']]) papier.append(el('button', {
    class: (h.papier || 'liniert') === id ? 'an' : '', onclick: (e) => { h.papier = id; $$('button', papier).forEach((b) => b.classList.toggle('an', b === e.currentTarget)); }
  }, name));
  /* Papierfarbe und Randlinie: wie das Heft innen aussieht */
  const papierfarbe = el('div', { class: 'wahlgruppe papierfarben', style: 'flex-wrap:wrap' });
  for (const [id, name] of PAPIERFARBEN) papierfarbe.append(el('button', {
    class: 'papierfarbe-' + id + ((h.papierfarbe || 'hell') === id ? ' an' : ''), title: name,
    onclick: (e) => { h.papierfarbe = id; $$('button', papierfarbe).forEach((b) => b.classList.toggle('an', b === e.currentTarget)); }
  }, name));
  const rand = el('button', { class: 'schalter' + (h.rand ? ' an' : ''), onclick: (e) => { h.rand = !h.rand; e.currentTarget.classList.toggle('an', h.rand); } }, el('i'));
  let behalten = false;
  const kasten = el('div', { class: 'modal heft-atelier' }, el('h2', {}, 'Heft gestalten'), vorschau,
    el('div', { class: 'einstellgruppe' }, el('b', {}, 'Grundfarbe'), farben,
      el('div', { class: 'heft-freifarben' }, el('label', {}, 'Grundton ', frei), el('label', {}, 'Zweitton ', zweit), el('label', {}, 'Band ', band))),
    el('div', { class: 'einstellgruppe' }, el('b', {}, 'Muster'), muster),
    el('div', { class: 'einstellgruppe' }, el('b', {}, 'Papier'), papier),
    el('div', { class: 'einstellgruppe' }, el('b', {}, 'Papierfarbe'), papierfarbe),
    el('div', { class: 'einstellgruppe einstellzeile' }, el('span', { class: 'ename' }, 'Randlinie', el('div', { style: 'font-size:12.5px;color:var(--blass)' }, 'Eine Linie am linken Rand wie im Schulheft — Platz für Notizen.')), rand),
    el('div', { class: 'reihe' }, el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'),
      el('button', { class: 'knopf voll', onclick: () => { behalten = true; speichere(h); zu(); if (danach) danach(); } }, 'So bleibt es')));
  const alt = { farbe: h.farbe, farbe2: h.farbe2, band: h.band, muster: h.muster, papier: h.papier, papierfarbe: h.papierfarbe, rand: h.rand };
  const zu = zeigeDeck(kasten, () => { if (!behalten) { Object.assign(h, alt); if (danach) danach(); } });
  aktualisiere();
}
