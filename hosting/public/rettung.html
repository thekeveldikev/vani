.heftdeckel { --heft1:#8c5a3b; --heft2:var(--heft1); --heftband:#d6bd92; background-color: var(--heft1); transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, filter .28s ease; isolation: isolate; }
.heftdeckel:hover { transform: translateY(-4px) rotate(-.25deg); box-shadow: 0 11px 26px var(--schein), inset -2px 0 6px rgba(0,0,0,.1); }
.heftdeckel::before { left: 8px; width: 6px; z-index: 2; background: linear-gradient(90deg, rgba(0,0,0,.28), var(--heftband), rgba(255,255,255,.16)); box-shadow: 2px 0 3px rgba(0,0,0,.16); }
.heftdeckel::after { z-index: -1; mix-blend-mode: soft-light; }
.heftdeckel.muster-schlicht { background-image: linear-gradient(145deg, var(--heft1), color-mix(in srgb, var(--heft2) 82%, #111)); }
.heftdeckel.muster-leinen { background-image: repeating-linear-gradient(2deg, transparent 0 3px, rgba(255,255,255,.045) 3px 4px), repeating-linear-gradient(92deg, transparent 0 4px, rgba(0,0,0,.07) 4px 5px), linear-gradient(145deg, var(--heft1), var(--heft2)); }
.heftdeckel.muster-diagonal { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--heft1) 90%, black) 0 17px, var(--heft2) 17px 34px); }
.heftdeckel.muster-punkte { background-image: radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.5px), linear-gradient(145deg, var(--heft1), var(--heft2)); background-size: 15px 15px, auto; }
.heftdeckel.muster-rahmen { background-image: linear-gradient(var(--heft1), var(--heft2)); box-shadow: 0 3px 10px var(--schein), inset 0 0 0 9px rgba(255,255,255,.075), inset 0 0 0 11px rgba(0,0,0,.18), inset -2px 0 6px rgba(0,0,0,.08); }
.heftdeckel.muster-welle { background-image: radial-gradient(ellipse at 50% 0, transparent 0 32px, rgba(255,255,255,.1) 33px 35px, transparent 36px), linear-gradient(145deg, var(--heft1), var(--heft2)); background-size: 64px 38px, auto; }
.mini-deckel { --heft1:#8c5a3b; --heft2:var(--heft1); background: linear-gradient(145deg, var(--heft1), var(--heft2)); }
.mini-deckel.muster-diagonal { background: repeating-linear-gradient(135deg, var(--heft1) 0 4px, var(--heft2) 4px 8px); }
.mini-deckel.muster-punkte { background: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px), var(--heft1); background-size: 5px 5px; }
.heft-vorschau { width: 176px; margin: 4px auto 22px; }
.heft-atelier { max-height: min(880px, 90dvh); overflow: auto; }
.heft-atelier .einstellgruppe { display: grid; gap: 9px; padding: 13px 0; border-top: 1px solid var(--linie); }
.heft-farben { display: flex; gap: 7px; flex-wrap: wrap; }
.heft-farbpunkt { width: 29px; height: 29px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.16), 0 1px 3px var(--schein); transition: transform .18s ease; }
.heft-farbpunkt:hover { transform: scale(1.12); }
.heft-freifarben { display: flex; gap: 12px; flex-wrap: wrap; color: var(--blass); font-size: 12px; }
.heft-freifarben label { display: flex; align-items: center; gap: 7px; }
.heft-freifarben input[type="color"] { width: 35px; height: 27px; padding: 0; border-radius: 8px; overflow: hidden; }
.heft-musterwahl { border-radius: 14px; }
.heft-ansichtswahl { display: inline-flex; padding: 3px; border-radius: 100px; background: var(--hg2); }
.heft-ansichtswahl button { padding: 6px 10px; border-radius: 100px; color: var(--blass); font-size: 12px; }
.heft-ansichtswahl button.an { color: var(--tinte); background: var(--papier); box-shadow: 0 1px 4px var(--schein); }
.papierseite.breit .schreibflaeche { background-image: repeating-linear-gradient(transparent, transparent 39px, var(--linie) 39px, var(--linie) 40px); background-position-y: 11px; line-height: 40px; }
.papierseite.punkte { background-image: radial-gradient(var(--linie) 1px, transparent 1.25px); background-size: 23px 23px; }
.papierseite.blank .schreibflaeche { background: none; }
.heftrolle { max-width: 840px; margin: 8px auto 70px; display: flex; flex-direction: column; gap: 22px; }
.rollen-seite { position: relative; }
.rollen-seite .papierseite { min-height: 340px; overflow: visible; }
.rollen-seite .schreibflaeche { min-height: 260px; }
.rollen-seitennummer { margin: 0 0 7px 7px; color: var(--blass); font: italic 12px ui-serif, Georgia, serif; }
.rollen-plus { min-height: 86px; background: color-mix(in srgb, var(--karte) 65%, transparent); }
.auto-weiter { height: 56dvh; overflow: hidden; resize: none; }
.rich-editor.auto-weiter { min-height: 0; }
.auto-weiter-schalter { white-space: nowrap; }

/* Kleben: Tesa, Reißzwecke oder nur lose aufgelegt. */
.anlage { transition: filter .2s ease, box-shadow .2s ease; }
.anlage.aktiv { filter: drop-shadow(0 10px 12px rgba(0,0,0,.18)); }
.befestigung-pin::before { content: ''; position: absolute; z-index: 12; top: -7px; left: 50%; width: 15px; height: 15px; border-radius: 50%; transform: translateX(-50%); background: radial-gradient(circle at 35% 30%, #fff3ca, #b34834 38%, #6e231b 75%); box-shadow: 1px 3px 4px rgba(0,0,0,.32); pointer-events: none; }
.befestigung-pin .zettel::before, .befestigung-lose .zettel::before { display: none; }
.befestigung-pin .foto-anlage::before, .befestigung-pin .foto-anlage::after, .befestigung-lose .foto-anlage::before, .befestigung-lose .foto-anlage::after { display: none; }
.befestigung-lose { filter: drop-shadow(0 5px 5px rgba(0,0,0,.16)); }
.befestigung-lose .zettel, .befestigung-lose .foto-anlage { box-shadow: none; }

/* Stiftkasten */
.kritzelleiste { max-width: calc(100% - 24px); flex-wrap: wrap; border-radius: 19px; }
.stiftfarbe { transition: transform .17s ease, box-shadow .17s ease; }
.stiftfarbe:hover { transform: scale(1.08); }
.stift-eigen { position: relative; width: 30px; height: 30px; display: grid; place-items: center; overflow: hidden; border-radius: 50%; color: white; background: conic-gradient(#d75b55,#e9b54e,#71a36a,#5d8eb6,#8d69a7,#d75b55); }
.stift-eigen input { position: absolute; inset: 0; opacity: 0; }
.stift-dicke { display: flex; align-items: center; gap: 7px; min-width: 132px; }
.stift-dicke input[type="range"] { width: 92px; }
.stift-dicke-probe { display: block; flex: none; min-width: 3px; min-height: 3px; max-width: 24px; max-height: 24px; border-radius: 50%; }

/* Eigene Funken */
.funke-meta { display: grid; grid-template-columns: minmax(130px,.6fr) 1.4fr; gap: 9px; margin-top: 10px; }
.funke-meta select, .funke-meta input, .funkenkiste-modal > input { width: 100%; padding: 11px 13px; border-radius: 12px; background: var(--hg2); box-shadow: inset 0 0 0 1px var(--linie); }
.funken-sammlung { display: flex; flex-direction: column; gap: 9px; max-height: 54dvh; overflow: auto; margin-top: 12px; padding: 2px; }
.eigener-funke { display: flex; align-items: stretch; gap: 7px; border-radius: 14px; background: var(--hg2); box-shadow: inset 0 0 0 1px var(--linie); overflow: hidden; }
.eigener-funke-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 13px 14px; text-align: left; font: 16px/1.45 ui-serif, Georgia, serif; }
.funke-vibe { color: var(--akzent); font: 700 10px/1.3 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.eigener-funke-aktionen { display: flex; align-items: center; gap: 2px; padding-right: 7px; }
.eigener-funke-aktionen button { padding: 7px 5px; color: var(--blass); font-size: 11px; }
.eigener-funke-aktionen button:last-child { font-size: 18px; }

/* Bewegungen bleiben weich, aber nie im Weg. */
.karte, .blattkarte, .projektkarte, .wieder-fund { transition: transform .24s cubic-bezier(.2,.8,.2,1), box-shadow .24s ease, background-color .24s ease; }
button.karte:hover, .blattkarte:hover, .projektkarte:hover { transform: translateY(-2px); box-shadow: 0 7px 18px var(--schein), inset 0 0 0 1px var(--linie); }
.papierseite { animation: seite-landet .32s cubic-bezier(.2,.8,.2,1); }
@keyframes seite-landet { from { opacity: .3; transform: translateX(12px) rotate(.25deg); } }

@media (max-width: 700px) {
  .formatleiste { position: relative; top: 0; width: 100%; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; border-radius: 13px; }
  .format-trenner { flex: none; } .format-knopf, .format-farbe, .format-slider { flex: none; }
  .papierseite { padding: 27px 18px 42px; }
  .rollen-seite .papierseite { padding-inline: 17px; }
  .seitenwerkzeuge { right: 7px; top: 7px; }
  .seitenwerkzeuge .rundknopf { width: 33px; height: 33px; }
  .funke-meta { grid-template-columns: 1fr; }
  .eigener-funke { flex-direction: column; }
  .eigener-funke-aktionen { justify-content: flex-end; padding: 0 9px 7px; }
  .heft-ansichtswahl button { padding-inline: 8px; }
}
@media (max-width: 430px) {
  .profil-karte { padding: 27px 22px; }
  .profil-liste { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .regal { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .heftdeckel .htitel { font-size: 16px; }
  .kritzelleiste { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; }
  .stiftfarbe, .stift-eigen, .stift-dicke, .kritzelleiste .rundknopf { flex: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ================================================================
   Sechste Feinschicht: Ankommen in jedem Raum, ruhige Werkzeuge
   ================================================================ */

/* Jeder Raum kommt mit einem Atemzug an, statt hart umzuspringen. */
@keyframes raum-kommt { from { opacity: 0; transform: translateY(6px); } }
#raum > .kopf, #raum > .inhalt { animation: raum-kommt .24s cubic-bezier(.2,.8,.2,1) both; }
#raum > .inhalt { animation-delay: .03s; }
#raum > .schnipsel-raum, #raum > .brett-raum { animation: einblenden .2s ease both; }

/* Formatleiste: Ausrichtung als klare Zeichen, nicht als Rätsel. */
.format-knopf svg.ik { width: 17px; height: 17px; }

/* ----- Die Anleitung: ein ruhiges Buch über der App ----- */
.anleitung-bogen { position: fixed; inset: 0; z-index: 95; background: var(--hg); display: flex; flex-direction: column; animation: einblenden .18s ease; }
.anleitung-kopf { flex: none; padding: calc(env(safe-area-inset-top) + 14px) 22px 12px; background: var(--hg); box-shadow: 0 1px 0 var(--linie); }
.anleitung-titelzeile { display: flex; align-items: center; gap: 12px; max-width: 1060px; margin: 0 auto; }
.anleitung-marke { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--akzent); color: var(--papier); font-family: ui-serif, "New York", Georgia, serif; font-weight: 700; font-size: 21px; }
.anleitung-titelzeile h1 { flex: 1; min-width: 0; display: flex; flex-direction: column; font-family: ui-serif, "New York", Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15; }
.anleitung-titelzeile h1 small { font-size: 12.5px; color: var(--blass); font-weight: 400; font-family: ui-rounded, -apple-system, system-ui, sans-serif; margin-top: 2px; }
.anleitung-suchzeile { display: flex; align-items: center; gap: 10px; max-width: 1060px; margin: 10px auto 0; background: var(--karte); border-radius: 12px; padding: 8px 12px; box-shadow: inset 0 0 0 1px var(--linie); }
.anleitung-suchzeile input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: var(--tinte); }
.anleitung-zaehler { font-size: 12.5px; color: var(--blass); white-space: nowrap; }
.anleitung-koerper { flex: 1; min-height: 0; display: grid; grid-template-columns: 224px minmax(0, 1fr); width: 100%; max-width: 1060px; margin: 0 auto; }
.anleitung-nav { overflow-y: auto; padding: 16px 10px calc(env(safe-area-inset-bottom) + 40px) 22px; display: flex; flex-direction: column; gap: 2px; }
.anleitung-navknopf { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px; font-size: 14px; text-align: left; color: var(--tinte); }
.anleitung-navknopf:hover, .anleitung-navknopf:active { background: var(--karte); }
.anleitung-navknopf svg.ik { width: 17px; height: 17px; color: var(--blass); }
.anleitung-inhalt { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 22px calc(env(safe-area-inset-bottom) + 70px); }
.anleitung-kapitel { padding: 14px 0 26px; border-bottom: 1px solid var(--linie); scroll-margin-top: 12px; }
.anleitung-kapitel:last-child { border-bottom: 0; }
.anleitung-kapitelkopf { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.anleitung-kapitelicon { display: flex; color: var(--akzent2); flex: none; }
.anleitung-kapitelkopf h2 { flex: 1; min-width: 0; font-family: ui-serif, "New York", Georgia, serif; font-size: 24px; font-weight: 600; }
.anleitung-springen { flex: none; }
.anleitung-kurz { color: var(--blass); font-size: 14.5px; font-style: italic; margin-bottom: 14px; font-family: ui-serif, "New York", Georgia, serif; }
.anleitung-abschnitt { margin: 0 0 18px; }
.anleitung-abschnitt h3 { font-size: 16.5px; font-weight: 600; margin-bottom: 6px; }
.anleitung-abschnitt p { font-size: 15.5px; line-height: 1.65; margin: 0 0 8px; max-width: 70ch; }
.anleitung-abschnitt ol { margin: 6px 0 10px 22px; font-size: 15.5px; line-height: 1.6; max-width: 68ch; }
.anleitung-abschnitt li { margin-bottom: 4px; }
.anleitung-beispiel, .anleitung-tipp { display: flex; gap: 10px; padding: 10px 14px; border-radius: 12px; font-size: 14.5px; line-height: 1.6; margin: 8px 0 10px; max-width: 70ch; }
.anleitung-beispiel { background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie); }
.anleitung-tipp { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.anleitung-beispiel b, .anleitung-tipp b { flex: none; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blass); padding-top: 3px; }
.anleitung-inhalt mark { background: color-mix(in srgb, var(--gold) 55%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.anleitung-inhalt .leer { padding-top: 40px; }

/* Die Karte in den Feinheiten, die zur Anleitung führt */
.anleitung-karte { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin-bottom: 18px; }
.anleitung-karte-icon { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 13px; background: var(--akzent); color: var(--papier); flex: none; }
.anleitung-karte-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.anleitung-karte-text b { font-family: ui-serif, "New York", Georgia, serif; font-size: 18px; }
.anleitung-karte-text small { font-size: 13px; color: var(--blass); line-height: 1.45; }
.anleitung-karte-pfeil { display: flex; color: var(--blass); flex: none; }

/* Eine einzige App-Adresse, plus ein sicherer Rettungsweg für den alten Host. */
.hauptadresse-abschnitt { margin-top: 2px; }
.hauptadresse-karte {
  position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr);
  gap: 4px 14px; overflow: hidden; padding: 19px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--karte) 94%, var(--akzent)), var(--karte));
}
.hauptadresse-karte::after {
  content: ""; position: absolute; inset: 0 0 auto; height: 3px;
  background: linear-gradient(90deg, var(--akzent), var(--gold)); opacity: .72;
}
.hauptadresse-karte.umzug::after { background: linear-gradient(90deg, #ad704f, var(--gold)); }
.hauptadresse-siegel {
  grid-row: 1 / span 3; width: 46px; height: 46px; display: grid; place-items: center;
  border-radius: 50%; color: var(--papier); background: var(--akzent);
  box-shadow: 0 5px 15px color-mix(in srgb, var(--akzent) 24%, transparent);
}
.hauptadresse-siegel svg { width: 21px; height: 21px; }
.hauptadresse-karte.umzug .hauptadresse-siegel { background: #8c5b42; }
.hauptadresse-text { min-width: 0; }
.hauptadresse-text b { font: 600 18px/1.3 ui-serif, "New York", Georgia, serif; }
.hauptadresse-text p { margin: 5px 0 9px; color: var(--blass); font-size: 13.5px; line-height: 1.55; }
.hauptadresse-text code {
  display: block; overflow: hidden; padding: 8px 10px; border-radius: 9px;
  color: var(--tinte); background: var(--hg2); box-shadow: inset 0 0 0 1px var(--linie);
  font: 11.5px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis;
}
.hauptadresse-schritte {
  grid-column: 2; margin: 8px 0 2px 18px; color: var(--blass);
  font-size: 13px; line-height: 1.55;
}
.hauptadresse-aktionen { grid-column: 2; margin-top: 10px; }
.hauptadresse-aktionen a { text-decoration: none; }

@media (max-width: 760px) {
  .anleitung-koerper { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .anleitung-nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 10px 16px; gap: 6px; scrollbar-width: none; }
  .anleitung-nav::-webkit-scrollbar { display: none; }
  .anleitung-navknopf { flex: none; white-space: nowrap; background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie); }
  .anleitung-kopf, .anleitung-inhalt { padding-left: 16px; padding-right: 16px; }
  .anleitung-kapitelkopf h2 { font-size: 21px; }
  .hauptadresse-karte { grid-template-columns: 42px minmax(0, 1fr); gap: 6px 11px; padding: 16px; }
  .hauptadresse-siegel { width: 39px; height: 39px; }
  .hauptadresse-schritte, .hauptadresse-aktionen { grid-column: 1 / -1; }
  .hauptadresse-aktionen .knopf { flex: 1 1 150px; justify-content: center; }
}

/* ----- Kritzelwerkzeuge: Radierer, Schritte, Alles löschen ----- */
.kritzelleiste { max-width: calc(100vw - 32px); }
.kritzel-werkzeug { width: 34px; height: 34px; flex: none; }
.kritzel-werkzeug.an { background: var(--akzent); color: var(--papier); }
.kritzel-werkzeug[disabled] { pointer-events: none; }
.kritzel-trenner { width: 1px; height: 22px; background: var(--linie); flex: none; }

/* ----- Am Stück: ein einziger langer Bogen statt einzelner Seiten ----- */
.heftfluss { max-width: 840px; margin: 8px auto 70px; }
.fluss-bogen {
  position: relative; border-radius: 4px; background: var(--papier);
  box-shadow: 0 4px 18px var(--schein), 0 1px 3px var(--schein);
  overflow: hidden; padding: 10px 0 24px;
}
.fluss-bogen.kariert { background-image: linear-gradient(var(--linie) 1px, transparent 1px), linear-gradient(90deg, var(--linie) 1px, transparent 1px); background-size: 26px 26px; }
.fluss-bogen.punkte { background-image: radial-gradient(var(--linie) 1px, transparent 1.25px); background-size: 23px 23px; }
.papierseite.fluss {
  min-height: 0; box-shadow: none; border-radius: 0; background: none;
  background-image: none; padding: 8px 38px 4px; overflow: visible; animation: none;
}
.papierseite.fluss .schreibflaeche { min-height: 0; }
.papierseite.fluss .stitel { margin-top: 12px; }
.papierseite.fluss .stitel:placeholder-shown { opacity: .4; }
/* Eine Werkzeugreihe für die ganze lange Seite, oben rechts und beim Scrollen
   in Reichweite. Niemals per Hover verstecken — ein iPad kennt kein Hover. */
.fluss-werkzeuge {
  position: sticky; top: 8px; float: right; right: auto;
  margin: 0 12px 0 0; z-index: 8;
}
.fluss-bogen { padding-top: 4px; }
.papierseite.fluss + .papierseite.fluss::before {
  content: ""; position: absolute; left: 38px; right: 38px; top: 0; height: 1px;
  background: var(--linie); opacity: .35;
}
@media (max-width: 700px) {
  .papierseite.fluss { padding-inline: 17px; }
  .papierseite.fluss + .papierseite.fluss::before { left: 17px; right: 17px; }
}

/* ----- Einfügefeld für große Textmengen aus anderen Apps ----- */
.einfuege-modal { width: min(680px, calc(100vw - 36px)); }
.einfuege-hinweis { font-size: 13.5px; color: var(--blass); line-height: 1.6; margin-bottom: 12px; }
.einfuegefeld {
  min-height: 220px; max-height: 46dvh; overflow-y: auto; padding: 14px 16px;
  border-radius: 12px; background: var(--papier); box-shadow: inset 0 0 0 1px var(--linie);
  font-size: 16px; line-height: 1.65;
}
.einfuege-zaehler { margin-top: 9px; font-size: 13px; color: var(--blass); font-style: italic; }

/* In der langen Seite ruhen Werkzeuge und leere Titelzeilen, bis man
   wirklich in diesem Stück schreibt — sonst wäre es keine Seite, sondern
   eine Liste von Kästen. */
.papierseite.fluss .formatleiste { display: none; }
.papierseite.fluss:focus-within .formatleiste { display: flex; }
.papierseite.fluss .stitel:placeholder-shown { display: none; }
.papierseite.fluss:focus-within .stitel:placeholder-shown { display: block; }

/* ================================================================
   Papier: die Schrift sitzt auf der Linie
   ================================================================
   Nachgemessen: bei 17,5px Schrift in 32px Zeilenhöhe liegt die Grundlinie
   22px unter der Oberkante der Zeile. Die Linie gehört also auf 23px und
   von da an alle 32px. Das Muster liegt auf der Schreibfläche, nicht auf der
   Seite — nur dort kennt es den Rhythmus der Zeilen.
   Formatierter Text hat wechselnde Zeilenhöhen (Überschriften, Listen) und
   kann keinem festen Linienraster folgen; dort bleibt das Papier ruhig. */
.papierseite.liniert .schreibflaeche { background-position-y: 24px; }
.papierseite.breit .schreibflaeche { background-position-y: 28px; }

.papierseite.kariert { background-image: none; }
.papierseite.kariert .schreibflaeche:not(.rich-editor) {
  background-image: linear-gradient(var(--linie) 1px, transparent 1px), linear-gradient(90deg, var(--linie) 1px, transparent 1px);
  background-size: 32px 32px;
  background-position: 0 23px, 0 23px;
}
.papierseite.punkte { background-image: none; }
.papierseite.punkte .schreibflaeche:not(.rich-editor) {
  background-image: radial-gradient(var(--linie) 1px, transparent 1.25px);
  background-size: 32px 32px;
  background-position: 0 7px;
}
.papierseite .schreibflaeche.rich-editor { background-image: none; }

/* ================================================================
   Handy: alles bleibt sichtbar und antippbar
   ================================================================ */

/* Die Räume liegen in einer eigenen Rolle. */
.raumrolle { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }

/* Tagesbalken müssen schrumpfen dürfen — sonst wird die Hälfte abgeschnitten. */
.statistikbalken .tag { min-width: 0; }
.statistikbalken .tag b { overflow: hidden; }

@media (max-width: 620px) {
  /* Die Leiste selbst scrollt nicht mehr: nur die Räume schieben sich. Suche
     und Feinheiten stehen fest am Rand und sind immer erreichbar.
     min-width: 0 ist entscheidend — ein Grid-Element wächst sonst mit seinem
     Inhalt über den Bildschirm hinaus, statt sich zu begrenzen. */
  #leiste { overflow: visible; justify-content: flex-start; gap: 0; min-width: 0; max-width: 100%; }
  .raumrolle {
    flex-direction: row; flex: 1; min-width: 0; width: auto;
    overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
  }
  .raumrolle::-webkit-scrollbar { display: none; }
  .raumrolle .lknopf { flex: none; }
  #leiste > .lknopf { flex: none; box-shadow: -1px 0 0 var(--linie); }

  /* Alle Funkenarten sichtbar statt versteckt hinter einem Seitwärtsschub. */
  .funke-arten { flex-wrap: wrap; overflow-x: visible; }

  /* Klangnamen sind Schalter — sie brauchen eine Fläche, die ein Finger trifft. */
  .klangzeile .klangname { min-height: 40px; display: flex; align-items: center; }
  .statistikbalken { gap: 3px; }
  .statistikbalken .tag i { max-width: 18px; }

  /* Toasts gehören über die Leiste, nicht dahinter. */
  #toasts { bottom: calc(env(safe-area-inset-bottom) + 78px); }
}

/* ================================================================
   Welle 1: Papierfarben, Randlinie, Zettel-Looks, Figuren & Orte,
   Schlagworte, Jahresraster, Vorlesen, angepinnte Blätter
   ================================================================ */

/* Papierfarben — hell ist das bisherige Papier */
.papierseite.papierfarbe-weiss, .fluss-bogen.papierfarbe-weiss { background-color: #fffefb; }
.papierseite.papierfarbe-creme, .fluss-bogen.papierfarbe-creme { background-color: #f7ecd2; }
.papierseite.papierfarbe-kraft, .fluss-bogen.papierfarbe-kraft { background-color: #d9c3a0; }
.papierseite.papierfarbe-kraft .schreibflaeche, .papierseite.papierfarbe-kraft .stitel { color: #2c2216; }
.papierseite.papierfarbe-nacht, .fluss-bogen.papierfarbe-nacht { background-color: #26221d; }
.papierseite.papierfarbe-nacht .schreibflaeche, .papierseite.papierfarbe-nacht .stitel, .papierseite.papierfarbe-nacht .rich-editor { color: #ece3d1; }
.papierseite.papierfarbe-nacht .stitel::placeholder, .papierseite.papierfarbe-nacht .schreibflaeche::placeholder { color: #9c9080; }
.papierseite.papierfarbe-nacht.liniert .schreibflaeche, .papierseite.papierfarbe-nacht.breit .schreibflaeche { background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(255,255,255,.13) 31px, rgba(255,255,255,.13) 32px); }
.papierseite.papierfarbe-nacht.breit .schreibflaeche { background-image: repeating-linear-gradient(transparent, transparent 39px, rgba(255,255,255,.13) 39px, rgba(255,255,255,.13) 40px); }
.papierseite.papierfarbe-nacht .seitenwerkzeuge .rundknopf { background: #3a342c; color: #ece3d1; }
.papierseite.fluss.papierfarbe-nacht, .papierseite.fluss.papierfarbe-kraft, .papierseite.fluss.papierfarbe-creme, .papierseite.fluss.papierfarbe-weiss { background-color: transparent; }

/* Randlinie wie im Schulheft */
.papierseite.mit-rand::after { content: ""; position: absolute; top: 0; bottom: 0; left: 30px; width: 1px; background: rgba(176, 85, 47, .42); pointer-events: none; }
.papierseite.mit-rand .schreibflaeche, .papierseite.mit-rand .stitel { padding-left: 10px; }
.papierseite.papierfarbe-nacht.mit-rand::after { background: rgba(217, 138, 84, .5); }
@media (max-width: 700px) { .papierseite.mit-rand::after { left: 14px; } }

/* Papierfarben-Wahl im Atelier */
.papierfarben button { padding: 6px 12px; border-radius: 100px; box-shadow: inset 0 0 0 1px var(--linie); font-size: 13px; color: var(--tinte); }
.papierfarben button.an { box-shadow: 0 0 0 2px var(--akzent); }
.papierfarben .papierfarbe-hell { background: #f8f3e7; } .papierfarben .papierfarbe-weiss { background: #fffefb; }
.papierfarben .papierfarbe-creme { background: #f7ecd2; } .papierfarben .papierfarbe-kraft { background: #d9c3a0; color: #2c2216; }
.papierfarben .papierfarbe-nacht { background: #26221d; color: #ece3d1; }

/* Zettel: mehr Farben, mehr Schriften */
.zettel.orange { background: #f7d9a6; } .zettel.lila { background: #e0d2ee; }
.zettel.weiss { background: #fbfaf4; } .zettel.grau { background: #e3e1dc; }
.zettel.schrift-klar textarea { font-family: ui-rounded, -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
.zettel.schrift-serif textarea { font-family: ui-serif, "New York", Georgia, serif; font-size: 15px; line-height: 1.45; }

/* Figuren & Orte */
.projekt-figuren { margin-top: 26px; }
.projekt-figuren-hinweis { font-size: 12.5px; color: var(--blass); margin: -4px 0 10px; }
.figurenband { display: flex; flex-wrap: wrap; gap: 8px; }
.figurchip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 9px; border-radius: 100px; background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie); font-size: 14px; color: var(--tinte); max-width: 100%; }
.figurchip .figur-icon { display: flex; color: var(--akzent2); } .figurchip .figur-icon svg.ik { width: 16px; height: 16px; }
.figurchip.art-ort .figur-icon { color: var(--akzent); } .figurchip.art-ding .figur-icon, .figurchip.art-sonst .figur-icon { color: var(--gold); }
.figurchip .figur-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.figurchip small { font-size: 11px; color: var(--blass); padding: 1px 6px; border-radius: 100px; background: var(--papier); }
.figurchip:active { transform: scale(.97); }

/* Schlagwortwolke in der Suche */
.schlagwortwolke { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 14px 12px; }
.schlagwortchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 100px; background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie); font-size: 13px; color: var(--akzent); }
.schlagwortchip small { font-size: 10.5px; color: var(--blass); }

/* Jahresraster */
.jahresraster-kopf { display: flex; justify-content: space-between; font-size: 13px; color: var(--blass); margin-bottom: 8px; }
.jahresraster { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.jahresraster::-webkit-scrollbar { display: none; }
.jr-woche { display: flex; flex-direction: column; gap: 3px; flex: none; }
.jr-tag { display: block; width: 11px; height: 11px; border-radius: 3px; background: var(--linie); }
.jr-tag.stufe--1 { background: transparent; }
.jr-tag.stufe-1 { background: color-mix(in srgb, var(--akzent) 35%, var(--karte)); }
.jr-tag.stufe-2 { background: color-mix(in srgb, var(--akzent) 65%, var(--karte)); }
.jr-tag.stufe-3 { background: var(--akzent); }
.jr-tag.heute { box-shadow: 0 0 0 1.5px var(--akzent2); }

/* Vorlesen */
.vorlese-knopf.an { color: var(--papier); background: var(--akzent2); animation: sync-atmen 1.6s ease-in-out infinite; }

/* Angepinnte Blätter */
.blattkarte { position: relative; }
.blattkarte.gepinnt { box-shadow: 0 2px 10px var(--schein), inset 0 0 0 1.5px var(--gold); }
.blatt-nadel { position: absolute; top: 8px; right: 10px; display: flex; color: var(--gold); }
.blatt-nadel svg.ik { width: 15px; height: 15px; }

/* ================================================================
   Klang: echte Aufnahmen
   ================================================================ */
.klang-reiter { margin: 10px 0 4px; }
.ambience-liste { margin-top: 4px; }
.ambience-zeile {
  position: relative; display: grid; grid-template-columns: minmax(0,1fr) 38% 34px;
  align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 6px;
  border-radius: 13px; background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie);
  opacity: .72; transition: opacity .18s ease, box-shadow .18s ease; overflow: hidden;
}
.ambience-zeile.an { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--akzent2); }
.ambience-balken { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: color-mix(in srgb, var(--akzent2) 18%, transparent); pointer-events: none; transition: width .2s linear; }
.ambience-zeile.laedt .ambience-balken { box-shadow: inset -1px 0 0 var(--akzent2); }
.ambience-name { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; z-index: 1; }
.ambience-titel { font-size: 15.5px; color: var(--tinte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ambience-stand { font-size: 11px; color: var(--blass); }
.ambience-stand.da { color: var(--akzent2); }
.ambience-zeile input[type="range"] { z-index: 1; width: 100%; }
.ambience-fein-knopf { z-index: 1; width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--blass); }
.ambience-fein-knopf svg.ik { width: 17px; height: 17px; }
.ambience-zeile.fein-offen { grid-template-columns: minmax(0,1fr) 38% 34px; }
.ambience-zeile.fein-offen .ambience-fein-knopf { color: var(--akzent); }
.ambience-fein { grid-column: 1 / -1; padding: 10px 2px 2px; border-top: 1px solid var(--linie); margin-top: 6px; z-index: 1; }
.fein-zeile { display: grid; grid-template-columns: 78px minmax(0,1fr) 82px; align-items: center; gap: 9px; margin-bottom: 6px; }
.fein-name { font-size: 12.5px; color: var(--blass); }
.fein-wert { font-size: 12px; color: var(--tinte); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fein-fuss { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; }
.ambience-quelle { font-size: 11px; color: var(--blass); }
.szenenchip.eigen { box-shadow: inset 0 0 0 1.5px var(--gold); }
.szenenchip small { margin-left: 6px; font-size: 10.5px; color: var(--blass); padding: 1px 5px; border-radius: 100px; background: var(--papier); }
.klang-folgt { margin: 10px 0 2px; }
@media (max-width: 620px) {
  .ambience-zeile { grid-template-columns: minmax(0,1fr) 34% 32px; gap: 7px; padding: 8px 10px; }
  .fein-zeile { grid-template-columns: 66px minmax(0,1fr) 66px; }
}

/* ----- Bretter: Gruppen und Bilder ----- */
.brettgruppe { position: absolute; z-index: 0; border-radius: 18px; border: 1.5px dashed var(--linie); background: color-mix(in srgb, var(--papier) 26%, transparent); }
.brettgruppe.b-gelb { border-color: #c8a83e; background: color-mix(in srgb, #f6e9a8 20%, transparent); }
.brettgruppe.b-rot { border-color: #c98088; background: color-mix(in srgb, #f3cfd3 20%, transparent); }
.brettgruppe.b-gruen { border-color: #8faa6e; background: color-mix(in srgb, #d3e3bd 20%, transparent); }
.brettgruppe.b-blau { border-color: #7ba3bb; background: color-mix(in srgb, #cadfea 20%, transparent); }
.gruppentitel { position: absolute; top: -26px; left: 4px; font: 600 13px ui-rounded, system-ui, sans-serif; color: var(--blass); background: var(--hg); padding: 2px 9px; border-radius: 100px; cursor: grab; touch-action: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.gruppengriff { position: absolute; right: -7px; bottom: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--karte); box-shadow: inset 0 0 0 1.5px var(--linie); cursor: nwse-resize; touch-action: none; }
.brettbild { position: absolute; z-index: 4; padding: 8px 8px 8px; background: #fdfcf7; box-shadow: 0 5px 16px rgba(0,0,0,.24); touch-action: none; }
.brettbild img { width: 100%; display: block; pointer-events: none; border-radius: 1px; }
.brettbildtitel { font: 12px ui-rounded, system-ui, sans-serif; color: #3a3325; text-align: center; padding: 7px 2px 1px; }
.brettbildgriff { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--karte); box-shadow: inset 0 0 0 1.5px var(--linie); cursor: ew-resize; touch-action: none; }
.manuskript-modal { width: min(660px, calc(100vw - 36px)); }
.manuskript-vorschau { max-height: 30dvh; overflow: auto; padding: 12px 14px; border-radius: 12px; background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie); font: 12.5px/1.6 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; color: var(--tinte); }
.blattsuche { width: 100%; padding: 10px 14px; border-radius: 12px; background: var(--karte); box-shadow: inset 0 0 0 1px var(--linie); font-size: 15px; margin-bottom: 12px; color: var(--tinte); }
.menue button:focus-visible { background: var(--karte); outline: 2px solid var(--akzent); outline-offset: -2px; }

</style>
</head>

</div>
<div id="app">
  <nav id="leiste" aria-label="Räume"></nav>
  <main id="raum"></main>
</div>
<div id="deck"></div>
<div id="toasts"></div>

    if (d.quelle && opferSet.has(d.quelle)) { buendel.referenzen.push({ id: d.id, feld: 'quelle', wert: d.quelle }); delete d.quelle; geputzt = true; }
    if (kinderDerWurzelBehalten && d.parent === id) { buendel.referenzen.push({ id: d.id, feld: 'parent', wert: d.parent }); delete d.parent; geputzt = true; }
    if (geputzt) speichereStill(d);
  }
  for (const oid of opfer) {
    const d = D.docs.get(oid);
    if (!d) continue;
    buendel.docs.push(d);
    markiereAenderung(d, true);
    D.docs.delete(oid);
    await dbDel('docs', oid);
  }
  await dbPut('papierkorb', buendel);
  if (!still) {
    toastMitAktion('Im Papierkorb.', 'Rückgängig', async () => {
      await holeZurueck(buendel.id);
      zeichne();
    });
  }
}

}

function zeigeDeck(inhalt, beiZu) {
  const schleier = el('div', { class: 'schleier' }, inhalt);
  schleier.addEventListener('pointerdown', (e) => { if (e.target === schleier) zu(); });
  /* Escape schließt nur die oberste Lage — wie ein Tipp neben den Kasten. */
  const beiTaste = (e) => {
    if (e.key !== 'Escape') return;
    if (!schleier.parentElement || schleier !== schleier.parentElement.lastElementChild) return;
    e.stopPropagation(); e.preventDefault();
    zu();
  };
  const zu = () => { document.removeEventListener('keydown', beiTaste, true); schleier.remove(); if (beiZu) beiZu(); };
  document.addEventListener('keydown', beiTaste, true);
  $('#deck').append(schleier);
  return zu;
}

      e.preventDefault(); e.stopImmediatePropagation();
    }
  }, true);
  elem.addEventListener('pointerdown', (e) => {
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { timer = null; if (!elem._zieht) { elem._langGedrueckt = Date.now(); fn(e); } }, 480);
  });
  const abbruch = (e) => {
    if (timer && e.type === 'pointermove' && Math.hypot(e.clientX - sx, e.clientY - sy) < 12) return;
    clearTimeout(timer); timer = null;
  };
  elem.addEventListener('pointermove', abbruch);
  elem.addEventListener('pointerup', abbruch);
  elem.addEventListener('pointercancel', abbruch);
  elem.addEventListener('contextmenu', (e) => { e.preventDefault(); elem._langGedrueckt = Date.now(); fn(e); });
}

/* ----- Schlagworte: #wort im Text, über alles gezählt ----- */
function schlagwortIndex(docs, max = 40) {
  const zaehl = new Map();
  const re = /(^|\s)#([\wäöüÄÖÜß-]{2,30})/g;
  for (const d of docs) {
    if (!d || typeof d.text !== 'string' || d.typ === 'goodnote') continue;
    const gesehen = new Set();
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(d.text))) {
      const w = m[2].toLowerCase();
      if (gesehen.has(w)) continue;
      gesehen.add(w);
      zaehl.set(w, (zaehl.get(w) || 0) + 1);
    }
  }
  return [...zaehl.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'de')).slice(0, Math.max(0, max)).map(([wort, anzahl]) => ({ wort, anzahl }));
}

/* ----- Startauftrag aus der Adresse: geteilter Text oder Schnellstart -----
   Android kann Text nach VANI teilen; das Home-Icon kann mit „Neuer Schnipsel"
   aufgehen. Beides kommt als Suchteil der Adresse an und wird sofort wieder
   entfernt — die Adresse bleibt die eine Hauptadresse. */
function startAuftrag(search) {
  let q;
  try { q = new URLSearchParams(String(search || '')); } catch (e) { return null; }
  const titel = String(q.get('titel') || '').trim().slice(0, 500);
  const text = String(q.get('text') || '').trim().slice(0, 200000);
  const url = String(q.get('url') || '').trim().slice(0, 2000);
  if (titel || text || url) {
    const teile = [];
    if (titel && titel !== text) teile.push(titel);
    if (text) teile.push(text);
    if (url && !text.includes(url)) teile.push(url);
    return { art: 'geteilt', text: teile.join('\n') };
  }
  const neu = String(q.get('neu') || '').trim();
  if (['schnipsel', 'blatt', 'suche'].includes(neu)) return { art: 'neu', was: neu };
  return null;
}

/* ----- Jahresraster: 7 Reihen × Wochen, wie ein Kalender aus Punkten ----- */
function jahresRaster(tage, wochen = 53, jetzt = Date.now()) {
  const n = Number(wochen);
  wochen = Math.max(1, Math.min(60, Number.isFinite(n) ? Math.round(n) : 53));
  const quelle = tage && typeof tage === 'object' ? tage : {};
  const heute = new Date(jetzt); heute.setHours(0, 0, 0, 0);
  /* Montag als Wochenanfang */
  const wochentag = (heute.getDay() + 6) % 7;
  const ende = new Date(heute); ende.setDate(heute.getDate() + (6 - wochentag));
  const start = new Date(ende); start.setDate(ende.getDate() - wochen * 7 + 1);
  const spalten = [];
  let max = 0;
  const d = new Date(start);
  for (let w = 0; w < wochen; w++) {
    const spalte = [];
    for (let t = 0; t < 7; t++) {
      const k = tagKey(d);
      const n = d > heute ? null : Math.max(0, Math.round(Number(quelle[k]) || 0));
      if (n) max = Math.max(max, n);
      spalte.push({ tag: k, worte: n, heute: k === tagKey(heute) });
      d.setDate(d.getDate() + 1);
    }
    spalten.push(spalte);
  }
  for (const sp of spalten) for (const z of sp) {
    z.stufe = z.worte === null ? -1 : z.worte === 0 ? 0 : z.worte >= max * .66 ? 3 : z.worte >= max * .33 ? 2 : 1;
  }
  return { spalten, max, von: tagKey(start), bis: tagKey(ende) };
}

/* ================================================================
   VANI — lokale Profile: eine Tür pro Mensch, ein eigener Datenraum
   ================================================================ */

const PROFIL_SPEICHER = 'vani-profile-registry-v1';
const PROFIL_ITERATIONEN = 350000;
let PROFIL_SCHLUESSEL = null;
let _profilLetzteAktivitaet = Date.now();
let _profilSperrtimer = null;

function profilSaubererName(name) {
  return String(name || '').replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
}

function profilSaubereRegistry(roh) {
  if (!Array.isArray(roh)) return [];
  const ids = new Set();
  return roh.slice(0, 12).filter((p) => p && typeof p === 'object')
    .map((p) => ({
      id: String(p.id || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 80),
      name: profilSaubererName(p.name),
      salz: String(p.salz || '').slice(0, 120),
      pruefung: String(p.pruefung || '').slice(0, 180),
      datenbank: p.datenbank === 'vani' ? 'vani' : '',
      angelegt: begrenze(p.angelegt, 0, Date.now() + 86400000, Date.now()),
      zuletzt: begrenze(p.zuletzt, 0, Date.now() + 86400000, 0)
    }))
    .filter((p) => p.id && p.name && /^[A-Za-z0-9_-]{16,120}$/.test(p.salz) && /^[A-Za-z0-9_-]{32,180}$/.test(p.pruefung))
    .filter((p) => !ids.has(p.id) && ids.add(p.id));
}

function profilLadeRegistry() {
  try { return profilSaubereRegistry(JSON.parse(localStorage.getItem(PROFIL_SPEICHER) || '[]')); }
  catch (e) { return []; }
}
function profilSpeichereRegistry(profile) {
  localStorage.setItem(PROFIL_SPEICHER, JSON.stringify(profilSaubereRegistry(profile)));
}

function profilB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function profilBytes(s) {
  const b64 = String(s || '').replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - String(s || '').length % 4) % 4);
  const bin = atob(b64), aus = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) aus[i] = bin.charCodeAt(i);
  return aus;
}

async function profilLeiteAb(passwort, salz) {
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(passwort || '')), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
  const opts = { name: 'PBKDF2', salt: profilBytes(salz), iterations: PROFIL_ITERATIONEN, hash: 'SHA-256' };
  const pruefung = new Uint8Array(await crypto.subtle.deriveBits(opts, basis, 256));

function profilGleich(a, b) {
  const x = String(a || ''), y = String(b || '');

  for (let i = 0; i < Math.max(x.length, y.length); i++) diff |= (x.charCodeAt(i) || 0) ^ (y.charCodeAt(i) || 0);
  return diff === 0;
}

async function profilPruefePasswort(profil, passwort) {
  if (!profil || typeof passwort !== 'string' || passwort.length > 200) return null;
  const ab = await profilLeiteAb(passwort, profil.salz);
  return profilGleich(ab.pruefung, profil.pruefung) ? ab.schluessel : null;
}

async function profilErstelle(name, passwort, erstes) {

  if (!name || typeof passwort !== 'string' || passwort.length < 4 || passwort.length > 200) throw new Error('Name oder Passwort passt nicht');

function profilTor(erstes, profile) {
  return new Promise((resolve) => {
    let ausgewaehlt = profile.length === 1 ? profile[0] : null;
    let versucht = 0, blockiertBis = 0;
    const name = el('input', { type: 'text', maxlength: '40', placeholder: 'Dein Name', autocomplete: 'username' });
    const pass = el('input', { type: 'password', maxlength: '200', placeholder: erstes ? 'Dein Passwort oder Code' : 'Passwort', autocomplete: erstes ? 'new-password' : 'current-password' });
    const pass2 = el('input', { type: 'password', maxlength: '200', placeholder: 'Noch einmal', autocomplete: 'new-password' });
    const meldung = el('div', { class: 'profil-meldung', role: 'status' });
    const profilListe = el('div', { class: 'profil-liste' });
    const titel = el('h1', {}, erstes ? 'Wem gehört dieses VANI?' : 'Willkommen zurück.');

    const bestaetigen = el('button', { class: 'knopf voll profil-weiter' }, erstes ? 'Mein VANI öffnen' : 'Öffnen');

    const waehle = (p) => {
      ausgewaehlt = p;
      $$('.profil-wahl', profilListe).forEach((b) => b.classList.toggle('an', b.dataset.id === p.id));
      name.value = p.name; name.hidden = true; pass2.hidden = true;
      pass.value = ''; meldung.textContent = ''; pass.focus();
    };
    for (const p of profile) profilListe.append(el('button', { class: 'profil-wahl', 'data-id': p.id, onclick: () => waehle(p) },
      el('span', { class: 'profil-monogramm' }, p.name.slice(0, 1).toUpperCase()), el('span', {}, p.name)));
    if (!erstes) profilListe.append(el('button', { class: 'profil-wahl neu', onclick: () => resolve({ neu: true, zu }) },
      el('span', { class: 'profil-monogramm' }, '+'), el('span', {}, 'Neues Profil auf diesem Gerät')));

    bestaetigen.addEventListener('click', async () => {
      if (Date.now() < blockiertBis) { meldung.textContent = 'Einen Augenblick warten, dann noch einmal.'; return; }
      bestaetigen.disabled = true; meldung.textContent = 'Die Tür öffnet sich …';
      try {
        if (erstes) {
          if (!profilSaubererName(name.value)) throw new Error('Bitte einen Namen eintragen.');
          if (pass.value.length < 4) throw new Error('Mindestens vier Zeichen. Länger ist sicherer.');
          if (pass.value !== pass2.value) throw new Error('Die beiden Eingaben sind noch nicht gleich.');
          const profil = await profilErstelle(name.value, pass.value, profile.length === 0);
          zu(); resolve({ profil });
        } else {
          if (!ausgewaehlt) throw new Error('Bitte zuerst dein Profil wählen.');
          const schluessel = await profilPruefePasswort(ausgewaehlt, pass.value);
          if (!schluessel) {
            versucht++;
            if (versucht >= 5) blockiertBis = Date.now() + Math.min(60000, 2000 * Math.pow(2, versucht - 5));
            throw new Error('Das Passwort passt nicht.');
          }
          PROFIL_SCHLUESSEL = schluessel; ausgewaehlt.zuletzt = Date.now();
          profilSpeichereRegistry(profile); aktiviereProfil(ausgewaehlt);
          zu(); resolve({ profil: ausgewaehlt });
        }
      } catch (e) { meldung.textContent = e && e.message || 'Das hat nicht geklappt.'; }
      bestaetigen.disabled = false;
    });
    pass.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (!erstes || pass2.value)) bestaetigen.click(); });
    pass2.addEventListener('keydown', (e) => { if (e.key === 'Enter') bestaetigen.click(); });

      el('div', { class: 'profil-siegel' }, 'V'), titel, unter,
      profilListe, name, pass, erstes ? pass2 : null, meldung, bestaetigen,
      erstes ? el('small', {}, 'Vier Zeichen sind erlaubt; ein längerer Satz schützt besser. Das Passwort verlässt dieses Gerät nie.') : null);
    const tor = el('div', { class: 'profil-tor' }, karte);
    const zu = () => tor.remove();
    document.body.append(tor);
    if (erstes) setTimeout(() => name.focus(), 60);
    else if (ausgewaehlt) { requestAnimationFrame(() => waehle(ausgewaehlt)); }
  });
}

async function profilPasswortAendern() {

        eintrag.salz = salz; eintrag.pruefung = ab.pruefung;

        try {
          profilSpeichereRegistry(registry);
          Object.assign(AKTIVES_PROFIL, { salz, pruefung: ab.pruefung });
          if (syncConfig && typeof syncSpeichereConfig === 'function') await syncSpeichereConfig(syncConfig);
        } catch (e) {

      } catch (e) { meldung.textContent = e && e.message || 'Das Passwort konnte nicht geändert werden.'; speichern.disabled = false; }
    } }, 'Passwort ändern');
    const kasten = el('div', { class: 'modal profil-passwort-modal' }, el('h2', {}, 'Neue Tür für ' + AKTIVES_PROFIL.name),
      el('p', { style: 'color:var(--blass);line-height:1.55;margin:8px 0 14px' }, 'Deine Texte bleiben unverändert. Auch ein vorhandener Kopplungscode wird sicher mit dem neuen Passwort umhüllt.'),
      alt, neu, neu2, meldung,
      el('div', { class: 'reihe' }, el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'), speichern));

}

async function profilVerschluesseleObjekt(objekt) {

function syncTextSetzen(ytext, text) {
  text = String(text || '');
  const alt = ytext.toString();
  if (alt === text) return;
  let vorne = 0;
  while (vorne < alt.length && vorne < text.length && alt[vorne] === text[vorne]) vorne++;
  let hinten = 0;
  while (hinten < alt.length - vorne && hinten < text.length - vorne && alt[alt.length - 1 - hinten] === text[text.length - 1 - hinten]) hinten++;
  const loesch = alt.length - vorne - hinten;
  if (loesch > 0) ytext.delete(vorne, loesch);
  const neu = text.slice(vorne, text.length - hinten);
  if (neu) ytext.insert(vorne, neu);
}

  if (!(y instanceof Y.Map)) { y = new Y.Map(); _sync.ydocs.set(d.id, y); }
  const felder = new Set(Object.keys(d).filter((k) => !SYNC_INTERNE_FELDER.has(k)));
  for (const k of [...y.keys()]) if (!felder.has(k)) y.delete(k);

      if (!(text instanceof Y.Text)) { text = new Y.Text(); y.set(k, text); }

      try { gepackt = JSON.stringify(wert); } catch (e) { continue; }

/* ================================================================
   VANI — formatiertes Schreiben, sicher und überall gleich lesbar
   ================================================================ */

const RICH_TAGS = new Set(['DIV', 'P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'SPAN']);

/* Ein losgel\u00f6stes Element wird nie gesetzt \u2014 dort liefert innerText keine
   Zeilenumbr\u00fcche, und aus zwei Abs\u00e4tzen w\u00fcrde ein zusammengeklebtes Wort.
   Darum werden Zeilen- und Blockenden vorher zu echten Umbr\u00fcchen. */
function richReinerText(html) {
  html = String(html || '').slice(0, 10000000);
  if (typeof document !== 'undefined' && document.createElement) {
    const d = document.createElement('div');
    d.innerHTML = html
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(?:p|div|li|h[1-6]|blockquote|tr|section|article|figcaption|dd|dt|pre)\s*>/gi, '\n');
    return (d.textContent || '').replace(/\u00a0/g, ' ').replace(/\u200b/g, '');
  }
  return html.replace(/<script[\s\S]*?<\/script\s*>/gi, '').replace(/<style[\s\S]*?<\/style\s*>/gi, '')
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(?:p|div|li|h[1-3]|blockquote)>/gi, '\n').replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/gi, ' ').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>').replace(/&amp;/gi, '&');
}

function richAusText(text) {
  return esc(String(text || '')).replace(/\n/g, '<br>');
}

function _richFarbe(wert, ersatz = '') {
  wert = String(wert || '').trim().toLowerCase();
  if (/^#[0-9a-f]{3,8}$/.test(wert) || /^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)$/.test(wert)) return wert;
  return ersatz;
}

function sauberesRichHTML(html) {
  html = String(html || '').slice(0, 10000000);
  if (typeof document === 'undefined' || !document.createElement || !document.createTreeWalker) return richAusText(richReinerText(html));
  const vorlage = document.createElement('template');
  vorlage.innerHTML = html.replace(/<script[\s\S]*?<\/script\s*>/gi, '').replace(/<style[\s\S]*?<\/style\s*>/gi, '');
  /* <font> ist das, was execCommand ohne styleWithCSS erzeugt (Farbe, Größe).
     Vorher flog das Element samt Farbe hinaus — jetzt wird es ein span. */
  for (const font of [...vorlage.content.querySelectorAll('font')]) {
    const span = document.createElement('span');
    const farbe = _richFarbe(font.getAttribute('color') || '');
    const groesse = ({ 1: 11, 2: 13, 3: 16, 4: 18, 5: 24, 6: 32, 7: 48 })[String(font.getAttribute('size') || '').replace('+', '')];
    if (farbe) span.style.color = farbe;
    if (groesse) span.style.fontSize = groesse + 'px';
    while (font.firstChild) span.append(font.firstChild);
    font.replaceWith(span);

  const walker = document.createTreeWalker(vorlage.content, (globalThis.NodeFilter && NodeFilter.SHOW_ELEMENT) || 1);
  const elemente = [];
  while (walker.nextNode()) elemente.push(walker.currentNode);
  for (const node of elemente) {
    if (!RICH_TAGS.has(node.tagName)) {
      const text = document.createTextNode(node.textContent || '');
      node.replaceWith(text); continue;
    }
    const style = node.style || {};
    const farbe = _richFarbe(style.color);
    const hintergrund = _richFarbe(style.backgroundColor);
    const px = parseFloat(style.fontSize || '');
    const ausrichtung = ['left', 'center', 'right', 'justify'].includes(style.textAlign) ? style.textAlign
      : ['left', 'center', 'right', 'justify'].includes(String(node.getAttribute('align') || '').toLowerCase()) ? String(node.getAttribute('align')).toLowerCase() : '';
    /* Safari schreibt fett/kursiv/unterstrichen als Stil auf ein span —
       nicht als <b>/<i>/<u>. Genau diese Stile wurden beim Aufräumen
       weggeworfen: im Editor sah man die Formatierung noch, nach dem
       Wiederöffnen war sie fort. Jetzt werden sie zu echten Elementen. */

    const fett = gewicht === 'bold' || gewicht === 'bolder' || parseInt(gewicht, 10) >= 600;
    const kursiv = style.fontStyle === 'italic' || style.fontStyle === 'oblique';

    if (Number.isFinite(px)) teile.push('font-size:' + begrenze(px, 11, 72, 18) + 'px');
    if (ausrichtung) teile.push('text-align:' + ausrichtung);
    if (teile.length) node.setAttribute('style', teile.join(';'));

      const h = document.createElement(tag);

      node.append(h);

/* ----- Drei kleine Reparaturen für fremden Text -----
   Goodnotes (und andere) schreiben Leerzeichen am Zeilenende als „&#x20;" in
   den Text — nicht als HTML, sondern als Buchstaben. Beim Einfügen standen
   sie dann wörtlich auf der Seite. Hier werden solche Reste zurückverwandelt.
   Nur das Eindeutige: Zahlen-Entitäten und die paar benannten, die in Text
   wirklich vorkommen. */
const ENTITAETEN = { nbsp: ' ', amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", shy: '', hellip: '…', ndash: '–', mdash: '—', laquo: '«', raquo: '»', bdquo: '„', ldquo: '“', rdquo: '”', lsquo: '‘', rsquo: '’', sbquo: '‚' };
function entitaetenReparieren(text) {
  const t = String(text || '');
  if (t.indexOf('&') < 0) return t;
  return t.replace(/&(#x([0-9a-f]{1,6})|#(\d{1,7})|([a-z]{2,8}));/gi, (ganz, _, hex, dez, name) => {
    let code = null;
    if (hex) code = parseInt(hex, 16);
    else if (dez) code = parseInt(dez, 10);
    else if (name && Object.prototype.hasOwnProperty.call(ENTITAETEN, name.toLowerCase())) return ENTITAETEN[name.toLowerCase()];
    else return ganz;
    if (!Number.isFinite(code) || code < 9 || code > 0x10ffff || (code >= 0xd800 && code <= 0xdfff)) return ganz;
    try { return String.fromCodePoint(code); } catch (e) { return ganz; }
  });
}

/* Kurzschrift: _kursiv_, *fett*, ~durchgestrichen~ — so, wie man es in
   WhatsApp oder Goodnotes tippt. Arbeitet auf schon escaptem HTML, deshalb
   dürfen die Zeichen drinnen keine Tags anreißen. */
function kurzschriftZuHTML(html) {
  let h = String(html || '');
  if (!/[_*~]/.test(h)) return h;
  const tausche = (zeichen, tag) => {
    const z = zeichen === '*' ? '\\*' : zeichen;
    const re = new RegExp('(^|[\\s(„"“>])' + z + '([^' + z + '<>\\n][^' + z + '<>\\n]{0,400}?[^' + z + '<>\\n\\s]|[^' + z + '<>\\n\\s])' + z + '(?=[\\s.,;:!?)“"”»<]|$)', 'g');
    h = h.replace(re, (ganz, vor, inhalt) => /^\s/.test(inhalt) ? ganz : vor + '<' + tag + '>' + inhalt + '</' + tag + '>');
  };
  tausche('_', 'i'); tausche('*', 'b'); tausche('~', 's');

/* Weiche Umbrüche: Goodnotes bricht lange Absätze an der Zeilenkante um und
   liefert jede Zeile als eigenen Absatz. Auf der Seite stand dann mitten im
   Satz eine Lücke. Endet ein Absatz ohne Satzzeichen und der nächste beginnt
   klein, gehören beide zusammen. Arbeitet auf Blöcken {tag, inhalt}. */

  const text = (html) => String(html || '').replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#39;|&apos;/g, "'").trim();
  const raus = [];
  for (const b of bloecke) {

      const a = text(vorher.inhalt), z = text(b.inhalt);
      const offen = a && !/[.!?:;…"“”»›)\]}—–]$/.test(a) && !/^[-–—•·*]/.test(z);
      if (offen && /^[a-zäöüß]/.test(z)) { vorher.inhalt = vorher.inhalt.replace(/\s+$/, '') + ' ' + b.inhalt.replace(/^\s+/, ''); continue; }
    }
    raus.push(b);

  return raus;

/* Aus fremdem HTML wird ruhiger VANI-Text.
   Was bleibt: Absätze, Zeilen, Überschriften, Listen, Zitate, fett/kursiv/
   unterstrichen/durchgestrichen. Was draußen bleibt: fremde Schriftgrößen
   (12pt wird sonst zu winzigen 12px), fremde Textfarben (schwarz auf dunklem
   Papier ist unlesbar), fremde Hintergründe und Ausrichtungen.

    .replace(/<script[\s\S]*?<\/script\s*>/gi, '').replace(/<style[\s\S]*?<\/style\s*>/gi, '')

      const name = k.tagName;
      if (name === 'BR') { ablegen(); continue; }
      if (name === 'TD' || name === 'TH') { lauf(k, tiefe + 1); jetzt.html += ' '; continue; }
      if (name === 'LI') { ablegen(); jetzt.tag = 'li'; lauf(k, tiefe + 1); ablegen(); continue; }
      if (/^H[1-6]$/.test(name)) { ablegen(); jetzt.tag = 'h' + Math.min(3, Number(name[1]) || 3); lauf(k, tiefe + 1); ablegen(); continue; }
      if (name === 'BLOCKQUOTE') { ablegen(); jetzt.tag = 'blockquote'; lauf(k, tiefe + 1); ablegen(); continue; }
      if (INLINE[name]) { jetzt.html += '<' + INLINE[name] + '>'; lauf(k, tiefe + 1); jetzt.html += '</' + INLINE[name] + '>'; continue; }
      if (BLOCK.has(name)) { ablegen(); lauf(k, tiefe + 1); ablegen(); continue; }
      lauf(k, tiefe + 1); /* span, a, font und alles Unbekannte: nur auspacken */
    }
  };
  lauf(vorlage.content, 0);
  ablegen();

  const verbunden = verbindeWeicheUmbrueche(bloecke);
  for (const b of verbunden) b.inhalt = kurzschriftZuHTML(b.inhalt);
  const raus = [];
  for (let i = 0; i < verbunden.length; i++) {
    if (verbunden[i].tag !== 'li') { raus.push('<' + verbunden[i].tag + '>' + verbunden[i].inhalt + '</' + verbunden[i].tag + '>'); continue; }
    const punkte = [];
    while (i < verbunden.length && verbunden[i].tag === 'li') { punkte.push('<li>' + verbunden[i].inhalt + '</li>'); i++; }
    i--;
    raus.push('<ul>' + punkte.join('') + '</ul>');
  }
  return sauberesRichHTML(raus.join(''));
}

/* Reiner Text von außen wird zu ruhigen Absätzen, ohne Leerzeilenwüsten. */
function einfuegeAusText(text) {
  const zeilen = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const bloecke = [];
  for (const z of zeilen) {
    const sauber = entitaetenReparieren(z).replace(/[ \t ]+/g, ' ').trim();
    if (sauber) bloecke.push({ tag: 'p', inhalt: kurzschriftZuHTML(esc(sauber)) });
    else if (bloecke.length && bloecke[bloecke.length - 1].inhalt !== '<br>') bloecke.push({ tag: 'p', inhalt: '<br>' });
  }
  const raus = verbindeWeicheUmbrueche(bloecke).map((b) => '<p>' + b.inhalt + '</p>');
  return sauberesRichHTML(raus.join(''));
}

/* Kurzschrift beim Tippen: Sobald das schließende _, * oder ~ fällt, wird
   das Wort dazwischen kursiv, fett oder durchgestrichen. Der Cursor landet
   dahinter und schreibt wieder normal — dafür sorgt ein unsichtbares Zeichen,
   das beim Speichern wieder verschwindet. */
function kurzschriftLive(editor) {
  const sel = typeof window !== 'undefined' && window.getSelection ? window.getSelection() : null;
  if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  const knoten = r.startContainer;
  if (!knoten || knoten.nodeType !== 3 || !editor.contains(knoten)) return false;
  const davor = knoten.nodeValue.slice(0, r.startOffset);
  const m = davor.match(/(^|[\s(„"“])([_*~])([^_*~\n]{1,200}?)\2$/);
  if (!m) return false;
  const inhalt = m[3];
  if (!inhalt.trim() || /^\s|\s$/.test(inhalt)) return false;
  const tag = { _: 'i', '*': 'b', '~': 's' }[m[2]];
  const start = r.startOffset - (inhalt.length + 2);
  if (start < 0) return false;
  const bereich = document.createRange();
  bereich.setStart(knoten, start); bereich.setEnd(knoten, r.startOffset);
  bereich.deleteContents();
  const neu = document.createElement(tag);
  neu.textContent = inhalt;
  bereich.insertNode(neu);
  const nach = document.createTextNode('\u200b');
  neu.after(nach);
  const ziel = document.createRange();
  ziel.setStart(nach, 1); ziel.collapse(true);
  sel.removeAllRanges(); sel.addRange(ziel);
  return true;
}

function richBefehl(editor, befehl, wert) {
  if (!editor || !editor.isConnected) return false;
  editor.focus();
  /* Farben, Größe und Ausrichtung als Stil; fett/kursiv/unterstrichen als
     echte Elemente — so liefert jeder Browser dasselbe, und der Aufräumer
     kennt beides. */
  const alsStil = /^(foreColor|hiliteColor|backColor|fontSize|justify)/i.test(String(befehl));
  try { document.execCommand('styleWithCSS', false, alsStil); } catch (e) {}
  try { return document.execCommand(befehl, false, wert == null ? null : wert); }
  catch (e) { return false; }
}

function richGroesse(editor, px) {
  px = Math.round(begrenze(px, 11, 72, 18));
  if (!richBefehl(editor, 'fontSize', '7')) return false;
  $$('font[size="7"]', editor).forEach((font) => {
    const span = el('span', { style: 'font-size:' + px + 'px' });
    while (font.firstChild) span.append(font.firstChild);
    font.replaceWith(span);
  });
  editor.dispatchEvent(new Event('input', { bubbles: true }));
  return true;
}

/* Teilt formatierten Inhalt an der letzten noch passenden Textstelle. Range
   klont dabei die umgebenden Fett-/Farb-/Listen-Elemente auf beide Seiten. */
function richTeileFuerHoehe(editor, passtHtml) {
  if (!editor || typeof document === 'undefined' || !document.createRange || typeof passtHtml !== 'function') return null;
  const walker = document.createTreeWalker(editor, (globalThis.NodeFilter && NodeFilter.SHOW_TEXT) || 4);
  const knoten = []; let gesamt = 0, node;
  while ((node = walker.nextNode())) { if (node.data.length) { knoten.push({ node, von: gesamt, bis: gesamt + node.data.length }); gesamt += node.data.length; } }
  if (gesamt < 2 || !knoten.length) return null;
  const htmlBis = (stelle) => {
    const k = knoten.find((x) => stelle <= x.bis) || knoten[knoten.length - 1];
    const lokal = Math.max(0, Math.min(k.node.data.length, stelle - k.von));
    const links = document.createRange(); links.selectNodeContents(editor); links.setEnd(k.node, lokal);
    const rechts = document.createRange(); rechts.selectNodeContents(editor); rechts.setStart(k.node, lokal);
    const a = document.createElement('div'), b = document.createElement('div');
    a.append(links.cloneContents()); b.append(rechts.cloneContents());
    return { hier: a.innerHTML, weiter: b.innerHTML };
  };
  let lo = 1, hi = gesamt - 1, best = 0;
  while (lo <= hi) {
    const mitte = Math.floor((lo + hi) / 2), teil = htmlBis(mitte);
    if (passtHtml(teil.hier)) { best = mitte; lo = mitte + 1; } else hi = mitte - 1;
  }
  if (best < 1 || best >= gesamt) return null;
  const klar = knoten.map((x) => x.node.data).join('');
  const wortgrenze = Math.max(klar.lastIndexOf(' ', best), klar.lastIndexOf('\n', best));
  if (wortgrenze > Math.max(1, best - 180)) best = wortgrenze + 1;
  const teil = htmlBis(best);
  if (!richReinerText(teil.weiter).trim()) return null;
  return { hier: sauberesRichHTML(teil.hier), weiter: sauberesRichHTML(teil.weiter) };
}

function baueFormatleiste(editor, beiAenderung, kompakt) {
  const knopf = (text, titel, befehl, wert) => el('button', {
    class: 'format-knopf', title: titel, 'aria-label': titel,
    onpointerdown: (e) => e.preventDefault(), onclick: () => { richBefehl(editor, befehl, wert); if (beiAenderung) beiAenderung(); }
  }, text);
  const farbe = el('input', { type: 'color', value: '#2c251c', title: 'Textfarbe', 'aria-label': 'Textfarbe' });
  farbe.addEventListener('input', () => { richBefehl(editor, 'foreColor', farbe.value); if (beiAenderung) beiAenderung(); });
  const marker = el('input', { type: 'color', value: '#f1d982', title: 'Markierfarbe', 'aria-label': 'Markierfarbe' });
  marker.addEventListener('input', () => { richBefehl(editor, 'hiliteColor', marker.value); if (beiAenderung) beiAenderung(); });
  const groesse = el('input', { type: 'range', min: '11', max: '64', value: '19', title: 'Schriftgröße', 'aria-label': 'Schriftgröße' });
  const groesseWert = el('span', { class: 'format-groesse' }, '19');
  groesse.addEventListener('input', () => { groesseWert.textContent = groesse.value; });
  groesse.addEventListener('change', () => { richGroesse(editor, Number(groesse.value)); if (beiAenderung) beiAenderung(); });
  const ikKnopf = (icon, titel, befehl, wert) => knopf(el('span', { html: ik(icon), style: 'display:flex' }), titel, befehl, wert);
  return el('div', { class: 'formatleiste' + (kompakt ? ' kompakt' : ''), role: 'toolbar', 'aria-label': 'Text formatieren' },
    knopf('B', 'Fett', 'bold'), knopf('I', 'Kursiv', 'italic'), knopf('U', 'Unterstrichen', 'underline'), knopf('S', 'Durchgestrichen', 'strikeThrough'),
    el('span', { class: 'format-trenner' }),
    knopf('Ü', 'Überschrift', 'formatBlock', 'h2'), knopf('¶', 'Normaler Absatz', 'formatBlock', 'p'),
    knopf('• Liste', 'Ungeordnete Liste', 'insertUnorderedList'), knopf('1. Liste', 'Nummerierte Liste', 'insertOrderedList'),
    knopf('❝', 'Zitat', 'formatBlock', 'blockquote'),
    el('span', { class: 'format-trenner' }),
    ikKnopf('ausLinks', 'Links ausrichten', 'justifyLeft'), ikKnopf('ausMitte', 'Zentrieren', 'justifyCenter'),
    ikKnopf('ausRechts', 'Rechts ausrichten', 'justifyRight'), ikKnopf('ausBlock', 'Blocksatz', 'justifyFull'),
    el('label', { class: 'format-farbe', title: 'Textfarbe' }, 'A', farbe),
    el('label', { class: 'format-farbe marker', title: 'Markierfarbe' }, '▰', marker),
    el('label', { class: 'format-slider' }, 'Größe', groesse, groesseWert));
}

function baueRichEditor(doc, optionen = {}) {
  const editor = el('div', {
    class: (optionen.class || '') + ' rich-editor text', contenteditable: 'true', role: 'textbox', 'aria-multiline': 'true',
    'data-placeholder': optionen.platzhalter || 'Schreib einfach.'
  });
  editor.innerHTML = sauberesRichHTML(doc.rich || richAusText(doc.text || ''));
  let startWorte = worte(doc.text || '');
  const sichern = entprellt(() => {
    doc.rich = sauberesRichHTML(editor.innerHTML);
    doc.text = richReinerText(doc.rich).replace(/\n{3,}/g, '\n\n').trimEnd();
    doc.format = 'rich';
    speichere(doc); zaehleWorte(doc.id, doc.text);
    if (optionen.beiSpeichern) optionen.beiSpeichern(doc, editor);
  }, optionen.warten || 400, true);
  editor.addEventListener('input', (e) => {
    if (D.einst.kurzschrift !== false && e && e.inputType === 'insertText' && /[_*~]/.test(e.data || '')) { try { kurzschriftLive(editor); } catch (x) {} }
    sichern(); if (optionen.beiInput) optionen.beiInput(doc, editor, startWorte);
  });
  /* Sofort sichern, sobald der Blick den Text verlässt — nicht erst nach der
     Schonfrist. Wer „Fertig" tippt oder die Seite wechselt, verliert nichts. */
  editor.addEventListener('blur', () => { if (sichern.haengt && sichern.haengt()) sichern.sofort(); });
  editor.addEventListener('paste', (e) => {
    if (!e.clipboardData) return;
    const html = e.clipboardData.getData('text/html');
    const roh = e.clipboardData.getData('text/plain');
    if (!html && !roh) return;
    e.preventDefault();
    const fertig = html ? einfuegeHTML(html) : einfuegeAusText(roh);
    if (!fertig.trim()) return;
    richBefehl(editor, 'insertHTML', fertig);
    editor.dispatchEvent(new Event('input', { bubbles: true }));
  });
  return { editor, leiste: baueFormatleiste(editor, () => editor.dispatchEvent(new Event('input', { bubbles: true })), !!optionen.kompakt), sichern };
}

function waehleBild() {
  return new Promise((res) => {
    const inp = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    document.body.append(inp);
    let fertig = false;
    inp.addEventListener('change', async () => {
      fertig = true;
      const datei = inp.files && inp.files[0];
      inp.remove();
      if (!datei) return res(null);
      try { res(await verkleinereUndSpeichere(datei)); }
      catch (e) { toast('Das Bild wollte nicht.'); res(null); }
    });
    inp.addEventListener('cancel', () => { if (!fertig) { inp.remove(); res(null); } });
    inp.click();
  });
}

function verkleinereUndSpeichere(datei, maxKante = 1600) {
  return new Promise((res, rej) => {
    const leser = new FileReader();
    leser.onerror = rej;
    leser.onload = () => {
      const bild = new Image();
      bild.onerror = rej;
      bild.onload = () => {
        let { width: b, height: h } = bild;
        const f = Math.min(1, maxKante / Math.max(b, h));
        b = Math.round(b * f); h = Math.round(h * f);
        const c = document.createElement('canvas');
        c.width = b; c.height = h;
        c.getContext('2d').drawImage(bild, 0, 0, b, h);
        c.toBlob(async (blob) => {
          if (!blob) return rej(new Error('kein Blob'));
          const id = uid();
          await dbPut('media', blob, id);
          if (typeof syncMediaGeaendert === 'function') syncMediaGeaendert(id);
          res({ id, breite: b, hoehe: h });
        }, 'image/jpeg', .82);
      };
      bild.src = leser.result;
    };
    leser.readAsDataURL(datei);
  });
}

const _bildURLs = new Map();
async function bildURL(id) {
  if (_bildURLs.has(id)) return _bildURLs.get(id);
  const blob = await dbGet('media', id);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  _bildURLs.set(id, url);
  return url;
}
function setzeBild(img, id) {
  bildURL(id).then((u) => { if (u) img.src = u; });
}
function loeseMedienURL(id) {
  const url = _bildURLs.get(id);
  if (url) URL.revokeObjectURL(url);
  _bildURLs.delete(id);
}
async function speichereDateiBlob(datei) {
  if (!datei || typeof datei.size !== 'number') throw new Error('Keine Datei');
  const id = uid();
  await dbPut('media', datei, id);
  if (typeof syncMediaGeaendert === 'function') syncMediaGeaendert(id);
  return id;
}
async function speichereKritzelei(canvas, alteId) {
  return new Promise((res) => {
    canvas.toBlob(async (blob) => {
      if (!blob) return res(null);
      const id = alteId || uid();
      await dbPut('media', blob, id);
      if (typeof syncMediaGeaendert === 'function') syncMediaGeaendert(id);
      loeseMedienURL(id);
      res(id);
    }, 'image/png');
  });
}

window.addEventListener('pagehide', () => {
  for (const id of [..._bildURLs.keys()]) loeseMedienURL(id);
});

function strukturelleBeziehungen(doc) {
  const raus = [];
  const parent = doc.parent && D.docs.get(doc.parent);

  const projekt = (doc.projektRef || doc.projekt) && D.docs.get(doc.projektRef || doc.projekt);

function _wiederHash(s) {
  let h = 2166136261;
  for (const c of String(s || '')) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function wiederFunde(jetzt = Date.now()) {
  const heute = new Date(jetzt), tagSaat = tagKey(jetzt);
  const typen = new Set(['schnipsel', 'szene', 'seite', 'blatt', 'blase', 'faden', 'funkeln']);
  const funde = [];
  for (const d of D.docs.values()) {
    const text = (d.text || '').trim();
    if (!typen.has(d.typ) || text.length < 24 || jetzt - d.angelegt < 2 * 86400000) continue;
    const damals = new Date(d.angelegt);
    let art = d.typ === 'funkeln' ? 'FUNKELN' : d.typ === 'faden' ? 'AUS DEM FADEN' : 'LIEGEN GEBLIEBEN';
    if (damals.getDate() === heute.getDate() && damals.getMonth() === heute.getMonth() && damals.getFullYear() < heute.getFullYear()) {
      const jahre = heute.getFullYear() - damals.getFullYear(); art = 'HEUTE VOR ' + jahre + (jahre === 1 ? ' JAHR' : ' JAHREN');
    } else if (/\?\s*(?:\n|$)/.test(text)) art = 'EINE OFFENE FRAGE';
    else if (/(?:,|:|…|\.{3}|\b(?:dass|weil|aber|und|oder))\s*$/i.test(text)) art = 'NOCH NICHT FERTIG';
    else if (/\b(?:erster|erste)\s+satz\b/i.test(text)) art = 'EIN ANFANG';
    else if (/\b(?:letzter|letzte)\s+satz\b/i.test(text)) art = 'EIN ENDE';
    else if (/\b(?:verbind(?:ung|et|en)|connection|drähte|fäden)\b/i.test(text)) art = 'EINE VERBINDUNG';
    else if (/\b(?:traum|träum|dream|albtraum)\w*\b/i.test(text)) art = 'AUS EINEM TRAUM';
    else if (/\b(?:19|20)\d{2}\b.*\b(?:19|20)\d{2}\b/s.test(text)) art = 'EIN ZEITFADEN';
    else if (/^[\s„“"']*[A-ZÄÖÜ][^\n]{0,100}[.!?][\s„“"']*$/m.test(text) && text.length < 280) art = 'EIN SATZ WIE EINE TÜR';
    else if (/(?:^|\n)\s*(?:\d+[.)]|[-•])\s+/.test(text) || text.split('\n').length >= 5) art = 'EINE ALTE LISTE';
    else if (text.length > 700) art = 'ERSTER & LETZTER SATZ';
    let auszug = text;
    if (art === 'ERSTER & LETZTER SATZ') {
      const saetze = text.replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [text];
      auszug = (saetze[0] || '').trim() + (saetze.length > 1 ? '\n…\n' + (saetze[saetze.length - 1] || '').trim() : '');
    }
    funde.push({ doc: d, art, auszug: auszug.slice(0, 760), hash: _wiederHash(tagSaat + ':' + d.id) });
  }
  funde.sort((a, b) => a.hash - b.hash);
  const gemischt = [], jeArt = new Map();
  for (const f of funde) {
    const n = jeArt.get(f.art) || 0;
    if (n >= 3) continue;
    jeArt.set(f.art, n + 1); gemischt.push(f);
  }
  return gemischt;
}

function findeWiederEchos(funde, max = 6) {
  const stopp = new Set(['dieser', 'diese', 'dieses', 'einen', 'einem', 'einer', 'nicht', 'aber', 'dass', 'hatte', 'haben', 'wurde', 'würde', 'waren', 'sagte', 'immer', 'etwas', 'eines', 'their', 'there', 'about', 'with', 'from', 'eine', 'the', 'und', 'oder', 'schon', 'jetzt', 'dann', 'wenn', 'mich', 'auch', 'noch', 'mein', 'meine', 'seine', 'ihnen', 'because', 'would', 'could', 'should']);
  const woerter = new Map();
  const kandidaten = [], paare = new Set();
  for (const f of funde.slice(0, 180)) {
    const menge = new Set(normalisiere(f.auszug).split(/[^a-z0-9]+/).filter((w) => w.length >= 6 && !stopp.has(w)));
    for (const w of menge) {
      const alt = woerter.get(w);
      if (alt && alt.doc.id !== f.doc.id && Math.abs(alt.doc.angelegt - f.doc.angelegt) > 21 * 86400000) {
        const paar = [alt.doc.id, f.doc.id].sort().join(':');
        if (!paare.has(paar)) { paare.add(paar); kandidaten.push({ wort: w, a: alt, b: f, hash: _wiederHash(tagKey() + paar + w) }); }
      }
      if (!alt) woerter.set(w, f);
    }
  }
  return kandidaten.sort((a, b) => a.hash - b.hash).slice(0, Math.max(0, max));
}
function findeWiederEcho(funde) { return findeWiederEchos(funde, 1)[0] || null; }

RENDER.zuhause = function (haupt) {
  const inhalt = el('div', { class: 'inhalt' });

  });

          neuDoc('schnipsel', { text: t });
          fangFeld.value = ''; fangFeld.style.height = 'auto';
          toast('Eingefangen.');
        }
      })
    )
  ));

  /* Schreibfeuer */
  const heutigeWorte = D.stats.tage[tagKey()] || 0;
  const str = straehne();
  const feuerKarte = el('div', { class: 'karte feuerkarte' },

      el('div', { class: 'feuer-flamme', html: flammeHTML() }),

        el('div', { class: 'gross' }, heutigeWorte.toLocaleString('de-DE')),
        el('div', { class: 'einheit' }, heutigeWorte === 1 ? 'Wort heute' : 'Wörter heute'),
        el('div', { class: 'klein' },
          str >= 2 ? str + ' Tage in Folge am Feuer' :
          heutigeWorte > 0 ? 'Das Feuer brennt.' :
          feuerstufe() === 'glut' ? 'Noch Glut von neulich. Ein Satz genügt.' :
          'Kalt hier. Ein Satz macht Feuer.')
      ),
      (() => {
        const b = el('div', { class: 'wochenbalken' });
        const max = Math.max(1, ...[...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return D.stats.tage[tagKey(d)] || 0; }));
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const w = D.stats.tage[tagKey(d)] || 0;
          b.append(el('i', { class: (i === 0 ? 'heute ' : '') + (w ? '' : 'null'), style: 'height:' + Math.max(8, Math.round(w / max * 100)) + '%' }));
        }

    ),

    ) : null

  gitter.append(feuerKarte);
