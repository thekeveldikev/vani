/* ================================================================
   VANI — Die Kerze: brennt wirklich herunter.

   Früher war die Kerze ein elf Pixel schmaler Balken, der kleiner wurde.
   Jetzt steht eine echte Stumpenkerze im Schreibraum — gemalt, nicht gebaut:
   ein Körper aus Wachs mit Rinnsalen und Tropfnasen, ein Docht, eine Flamme,
   die kein Bild ist, sondern ein Stück Physik (drei überlagerte Schwingungen
   für das Züngeln, dazu eine Neigung, die auf Zug reagiert — jeder Anschlag
   ist ein kleiner Luftzug), ein warmer Schein ohne harte Kante, Ruß, wenn
   es zu wild wird, und am Ende ein Faden Rauch. Über die gewählte Zeit brennt
   sie sichtbar ab; das Wachs läuft und sammelt sich am Fuß.

   Die Techniken stammen aus der Talgkerze des PAPA-OS-Projekts (Canvas-
   Physik-Flamme, kantenfreier Schein, einmal gewürfelte Wachsbahnen) — hier
   neu und klein gebaut, ohne Abhängigkeiten.
   ================================================================ */

/* Ein radialer Verlauf ist kreisförmig; in eine Ellipse gefüllt, die nicht
   zum Verlauf passt, bricht er mitten im Wert ab — das ist die harte Kante.
   Hier wird der Kontext skaliert, sodass Verlauf und Form dieselbe Ellipse
   beschreiben. */
function kerzeSchein(ctx, cx, cy, rx, ry, stops) {
  if (!(rx > 0) || !(ry > 0)) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  for (const [p, f] of stops) g.addColorStop(p, f);
  ctx.fillStyle = g;
  ctx.fillRect(-rx * 1.02, -rx * 1.02, rx * 2.04, rx * 2.04);
  ctx.restore();
}

/* Flammenprofil: breit bei gut einem Drittel Höhe, dann weich auslaufend.
   (Linear auf null ergäbe ein Dreieck, keine Flamme.) */
function kerzeFlammenBreite(u) { return Math.pow(u, .35) * Math.pow(1 - u, .85) * 2.45 + .1; }

/* Zufall mit Saat — damit Wachsbahnen je Kerze gleich bleiben, statt zu zappeln. */
function kerzeZufall(saat) {
  let s = (saat >>> 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* Reine Geometrie: wie hoch steht die Kerze nach einem Anteil der Zeit?
   Getestet — der Rest ist Malerei. */
function kerzeStand(anteil, maxHoehe = 150, minHoehe = 14) {
  const a = Math.max(0, Math.min(1, Number(anteil) || 0));
  return minHoehe + (maxHoehe - minHoehe) * (1 - a);
}

/* Baut die Kerze. Gibt Steuerung zurück; der Aufrufer hängt das Element ein. */
function kerzeAnzuenden({ minuten = 20, beiEnde = null, beiTipp = null, saat = 0 } = {}) {
  const W = 120, H = 270;
  const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  const canvas = el('canvas', { class: 'kerzenbuehne', width: String(W * dpr), height: String(H * dpr), title: 'Die Kerze — antippen für Zeit und Ausblasen' });
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const dauerMs = Math.max(1, minuten) * 60000;
  const start = Date.now();
  const zufall = kerzeZufall(saat || (start & 0xffff));
  const MAX_H = 150, MIN_H = 14, KB = 46, CX = 60, FUSS = 236;

  /* Wachsbahnen: einmal gewürfelt, dann stabil. */
  const bahnen = Array.from({ length: 7 }, (_, i) => ({
    seite: i % 2 ? 1 : -1, pos: .1 + zufall() * .8, anfang: zufall() * .2,
    laenge: .3 + zufall() * .55, breite: 1.2 + zufall() * 1.8, nase: zufall() < .6, ton: zufall()
  }));
  const tropfen = [];      /* dauerhafte Tropfnasen am Fuß */
  const russ = [];         /* aufsteigende Rußflocken */
  const rauch = [];        /* Rauchfaden nach dem Ausblasen */
  let laufender = null;    /* gerade herablaufender Tropfen */

  let phase = zufall() * 100, neigung = 0, neigungV = 0, zug = 0;
  let leben = 1;           /* 1 brennt, 0 aus */
  let aus = false, fertig = false, stopper = null;
  let letzte = performance.now(), bild = 0;

  const rest = () => Math.max(0, dauerMs - (Date.now() - start));
  const anteil = () => Math.min(1, (Date.now() - start) / dauerMs);

  function zeichne(jetzt) {
    const dt = Math.min(.05, (jetzt - letzte) / 1000); letzte = jetzt;
    phase += dt;
    /* Neigung: Feder zurück zur Senkrechten, Zug stößt sie an. */
    const zielNeigung = zug * .9 + Math.sin(phase * .7) * .08 * leben;
    neigungV += (zielNeigung - neigung) * 14 * dt - neigungV * 4.5 * dt;
    neigung += neigungV * dt * 6;
    zug *= Math.pow(.2, dt);
    const flacker = leben * (1 + .1 * Math.sin(phase * 9.3) + .07 * Math.sin(phase * 17.1 + 1.3) + .05 * Math.sin(phase * 31.7));
    const hoehe = kerzeStand(anteil(), MAX_H, MIN_H);
    const oben = FUSS - hoehe;
    const fh = 30 * flacker * (1 - Math.min(.45, Math.abs(neigung) * .5));
    const fw = 9.5 * (1 + Math.min(.3, Math.abs(neigung) * .3));
    const dochtX = CX, dochtY = oben - 2;
    const spitzeX = dochtX + neigung * 26;

    ctx.clearRect(0, 0, W, H);

    /* Schein — groß, weich, atmet mit der Flamme. */
    if (leben > 0) {
      const hell = flacker * leben;
      kerzeSchein(ctx, dochtX, dochtY - fh * .4, 70, 86, [
        [0, 'rgba(255,178,82,' + (.34 * hell).toFixed(3) + ')'],
        [.45, 'rgba(255,140,50,' + (.12 * hell).toFixed(3) + ')'],
        [1, 'rgba(255,120,40,0)']]);
    }

    /* Teller aus dunklem Eisen mit Wachsrand */
    ctx.save();
    ctx.fillStyle = '#3a3230';
    ctx.beginPath(); ctx.ellipse(CX, FUSS + 7, 44, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#524641';
    ctx.beginPath(); ctx.ellipse(CX, FUSS + 4, 40, 7, 0, 0, Math.PI * 2); ctx.fill();
    /* Wachssee auf dem Teller wächst mit dem Abbrand */
    const see = 8 + anteil() * 22;
    ctx.fillStyle = '#efe2c0';
    ctx.beginPath(); ctx.ellipse(CX, FUSS + 2, KB / 2 + see * .6, 3 + see * .18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    /* Körper: Wachs mit Licht von der Flamme her (oben hell, unten kühl) */
    const koerper = ctx.createLinearGradient(CX - KB / 2, 0, CX + KB / 2, 0);
    koerper.addColorStop(0, '#d9c79a'); koerper.addColorStop(.35, '#f3e6c6'); koerper.addColorStop(.7, '#efe0bd'); koerper.addColorStop(1, '#c9b68a');
    ctx.fillStyle = koerper;
    ctx.beginPath();
    ctx.moveTo(CX - KB / 2, FUSS);
    ctx.lineTo(CX - KB / 2, oben + 4);
    ctx.quadraticCurveTo(CX - KB / 2, oben - 1, CX - KB / 2 + 5, oben - 1);
    ctx.lineTo(CX + KB / 2 - 5, oben - 1);
    ctx.quadraticCurveTo(CX + KB / 2, oben - 1, CX + KB / 2, oben + 4);
    ctx.lineTo(CX + KB / 2, FUSS);
    ctx.closePath(); ctx.fill();
    /* Krater oben: dunkler, geschmolzen, leicht vertieft */
    ctx.fillStyle = 'rgba(120,90,40,.22)';
    ctx.beginPath(); ctx.ellipse(CX, oben + 1, KB / 2 - 3, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,225,150,.55)';
    ctx.beginPath(); ctx.ellipse(CX, oben + 1, KB / 2 - 8, 2, 0, 0, Math.PI * 2); ctx.fill();
    /* Wachsbahnen: laufen vom Kraterrand herab, länger je weiter abgebrannt */
    for (const b of bahnen) {
      const x = CX + b.seite * (KB / 2 - 1.5) + b.seite * (b.pos - .5) * 3;
      const von = oben + 2 + b.anfang * 18;
      const bis = Math.min(FUSS - 1, von + (hoehe * b.laenge) * (.55 + anteil() * .7));
      ctx.strokeStyle = b.ton < .5 ? 'rgba(255,250,236,.9)' : 'rgba(236,221,185,.9)';
      ctx.lineWidth = b.breite; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, von); ctx.quadraticCurveTo(x + b.seite * .8, (von + bis) / 2, x, bis); ctx.stroke();
      if (b.nase) { ctx.fillStyle = 'rgba(255,250,236,.95)'; ctx.beginPath(); ctx.ellipse(x, bis, b.breite * 1.1, b.breite * 1.6, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    for (const t of tropfen) {
      ctx.fillStyle = 'rgba(250,240,214,.95)';
      ctx.beginPath(); ctx.ellipse(t.x, t.y, t.r, t.r * 1.35, 0, 0, Math.PI * 2); ctx.fill();
    }
    /* Ein Tropfen, der gerade läuft */
    if (laufender) {
      laufender.y += dt * 22;
      ctx.fillStyle = 'rgba(255,248,226,.98)';
      ctx.beginPath(); ctx.ellipse(laufender.x, laufender.y, 2.2, 3.2, 0, 0, Math.PI * 2); ctx.fill();
      if (laufender.y >= FUSS - 2) { tropfen.push({ x: laufender.x, y: FUSS - 1, r: 2.4 + zufall() * 1.4 }); if (tropfen.length > 40) tropfen.shift(); laufender = null; }
    } else if (leben > 0 && zufall() < dt * .035) {
      laufender = { x: CX + (zufall() < .5 ? -1 : 1) * (KB / 2 + .5), y: oben + 6 };
    }
    /* Docht */
    ctx.strokeStyle = '#3b2e22'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(dochtX, oben + 1); ctx.quadraticCurveTo(dochtX + neigung * 3, oben - 4, dochtX + neigung * 5, oben - 7); ctx.stroke();
    ctx.fillStyle = leben > 0 ? '#ff9a3c' : '#6b5a48';
    ctx.beginPath(); ctx.arc(dochtX + neigung * 5, oben - 7, 1.4, 0, Math.PI * 2); ctx.fill();

    /* Flamme: Silhouette aus dem Profil, mit Zug gebogen; drinnen heller Kern */
    if (leben > 0) {
      const wob = (u) => (Math.sin(phase * 6.1 + u * 7) * .35 + Math.sin(phase * 11.3 + u * 13) * .2) * u;
      const form = (sw, sh) => {
        const bx = dochtX, by = dochtY - 4, N = 20;
        ctx.beginPath();
        ctx.moveTo(bx - fw * sw * kerzeFlammenBreite(.02), by);
        for (let k = 1; k <= N; k++) { const u = k / N; const cx3 = bx + (spitzeX - bx) * u * u + wob(u) * fw * 2; ctx.lineTo(cx3 - fw * sw * kerzeFlammenBreite(u), by - fh * sh * u); }
        for (let k = N; k >= 1; k--) { const u = k / N; const cx3 = bx + (spitzeX - bx) * u * u + wob(u) * fw * 2; ctx.lineTo(cx3 + fw * sw * kerzeFlammenBreite(u), by - fh * sh * u); }
        ctx.closePath();
      };
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      kerzeSchein(ctx, dochtX, dochtY - fh * .45, fh * 1.1, fh * 1.4, [[0, 'rgba(255,170,70,' + (.28 * leben).toFixed(3) + ')'], [.5, 'rgba(255,130,40,' + (.1 * leben).toFixed(3) + ')'], [1, 'rgba(255,120,40,0)']]);
      ctx.restore();
      ctx.save();
      form(1, 1);
      const gf = ctx.createLinearGradient(0, dochtY, 0, dochtY - fh);
      gf.addColorStop(0, 'rgba(255,150,40,' + (.85 * leben) + ')'); gf.addColorStop(.55, 'rgba(255,196,90,' + (.95 * leben) + ')'); gf.addColorStop(1, 'rgba(255,240,200,' + (.2 * leben) + ')');
      ctx.fillStyle = gf; ctx.fill();
      /* Der kleine blaue Saum unten — klein, sonst wird es Gasherd */
      form(.55, .22);
      ctx.fillStyle = 'rgba(120,160,255,' + (.35 * leben) + ')'; ctx.fill();
      /* Heller Kern */
      form(.45, .62);
      ctx.fillStyle = 'rgba(255,250,225,' + (.9 * leben) + ')'; ctx.fill();
      ctx.restore();
      /* Ruß bei starkem Zug */
      if (Math.abs(neigung) > .45 && zufall() < dt * 8) russ.push({ x: spitzeX + (zufall() - .5) * 6, y: dochtY - fh, vx: (zufall() - .5) * 10 + neigung * 14, vy: -28 - zufall() * 18, a: .5, r: .8 + zufall() * 1.4 });
    }
    for (let i = russ.length - 1; i >= 0; i--) {
      const p = russ[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.a -= dt * .35; p.r += dt * .8;
      if (p.a <= 0) { russ.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(40,32,28,' + p.a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    /* Rauch nach dem Ausblasen: eine Kette weicher Punkte, die wandert */
    if (aus) {
      if (leben <= 0 && rauch.length < 40 && zufall() < dt * 14) rauch.push({ x: dochtX, y: oben - 8, t: 0, drift: (zufall() - .5) * 12 });
      for (let i = rauch.length - 1; i >= 0; i--) {
        const r = rauch[i]; r.t += dt; r.y -= dt * 22; r.x += Math.sin(r.t * 2.2 + i) * dt * 9 + r.drift * dt;
        const a = Math.max(0, .32 - r.t * .07);
        if (a <= 0) { rauch.splice(i, 1); continue; }
        ctx.fillStyle = 'rgba(120,110,100,' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(r.x, r.y, 2 + r.t * 3.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    /* Restzeit, klein unter dem Teller */
    const m = Math.ceil(rest() / 60000);
    ctx.fillStyle = 'rgba(120,100,70,.85)';
    ctx.font = '11px ui-rounded, -apple-system, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(leben > 0 ? (m > 1 ? 'noch ' + m + ' Min' : 'gleich') : 'ausgebrannt', CX, FUSS + 28);
  }

  function schleife(jetzt) {
    if (fertig) return;
    /* 30 Bilder je Sekunde genügen für Feuer — und schonen den Akku. */
    if (jetzt - bild >= 32) { bild = jetzt; try { zeichne(jetzt); } catch (e) {} }
    if (!aus && rest() <= 0) { ausblasen(false); }
    if (leben > 0 || rauch.length || russ.length) requestAnimationFrame(schleife);
    else fertig = true;
  }

  function ausblasen(vonHand) {
    if (aus) return;
    aus = true;
    const t0 = performance.now();
    const verglimmen = () => {
      leben = Math.max(0, 1 - (performance.now() - t0) / (vonHand ? 260 : 900));
      if (leben > 0) requestAnimationFrame(verglimmen);
      else if (!vonHand && beiEnde) { try { beiEnde(); } catch (e) {} }
    };
    verglimmen();
    zug += vonHand ? 1.6 : .3;
    /* Rauch darf noch zwei, drei Sekunden stehen, dann geht das Element. */
    stopper = setTimeout(() => { fertig = true; canvas.remove(); }, vonHand ? 1800 : 4200);
  }

  canvas.addEventListener('click', () => { if (beiTipp) beiTipp(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { letzte = performance.now(); if (!fertig) requestAnimationFrame(schleife); } });
  requestAnimationFrame((t) => { letzte = t; schleife(t); });

  return {
    element: canvas,
    /* Jeder Anschlag ein kleiner Luftzug. Richtung wechselt, damit sie tanzt. */
    puste: (staerke = .25) => { zug += (zufall() < .5 ? -1 : 1) * staerke; },
    rest, anteil,
    brennt: () => !aus,
    ausblasen: () => ausblasen(true),
    entfernen: () => { fertig = true; clearTimeout(stopper); canvas.remove(); }
  };
}

/* ================================================================
   VANI — Cluster: Denken auf Brettern
   ================================================================ */

RENDER.cluster = function (haupt) {
  haupt.append(raumkopf('Cluster', null,
    el('button', {
      class: 'rundknopf voll', html: ik('plus'), title: 'Neues Cluster', onclick: async () => {
        const name = await eingabe({ titel: 'Ein neues Brett', platzhalter: 'Wofür ist es?' });
        if (!name) return;
        const b = neuDoc('board', { titel: name });
        location.hash = '#/brett/' + b.id;
      }
    })
  ));
  const inhalt = el('div', { class: 'inhalt' });
  const bretter = vomTyp('board');
  if (!bretter.length) {
    inhalt.append(el('div', { class: 'leer' }, 'Freier Raum zum Denken.',
      el('div', { class: 'klein' }, 'Blasen, Fäden dazwischen, keine Ordnung nötig.')));
  }
  const liste = el('div', { class: 'brettliste' });
  for (const b of bretter) {
    const blasen = kinder(b.id, 'blase').length;
    const karte = el('button', { class: 'karte brettkarte', onclick: () => { location.hash = '#/brett/' + b.id; } },
      el('div', { class: 'minis' }, el('i'), el('i'), el('i')),
      el('h3', {}, b.titel),
      el('div', { class: 'bzahl' }, blasen === 1 ? 'eine Blase' : blasen + ' Blasen')
    );
    langdruck(karte, async () => {
      const wahl = await menue([
        { text: 'Umbenennen', icon: 'stift', wert: 'name' },
        { text: 'Brett löschen', icon: 'muell', wert: 'weg', rot: true }
      ], b.titel);
      if (wahl === 'name') {
        const neu = await eingabe({ titel: 'Das Brett heißt jetzt …', wert: b.titel });
        if (neu) { b.titel = neu; speichere(b); zeichne(); }
      } else if (wahl === 'weg') {
        if (await frage('„' + b.titel + '" mit allen Blasen löschen?', { ja: 'Löschen', gefahr: true })) { await loesche(b.id); zeichne(); }
      }
    });
    liste.append(karte);
  }
  inhalt.append(liste);
  haupt.append(inhalt);
};

const BLASENFARBEN = ['', 'b-gelb', 'b-rot', 'b-gruen', 'b-blau'];

RENDER.brett = function (haupt, bid) {
  const brett = D.docs.get(bid);
  if (!brett) { location.hash = '#/cluster'; return; }
  const sicht = brett.sicht || { x: 60, y: 60, z: 1 };
  brett.sicht = sicht;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'brett-kanten');
  const flaeche = el('div', { class: 'brett-flaeche' });
  flaeche.append(svg);
  const raum = el('div', { class: 'brett-raum' }, flaeche);

  let verbinden = false;
  let verbindeVon = null;

  const kopfleiste = el('div', { class: 'schwebeleiste', style: 'left:16px;transform:none' },
    el('button', { class: 'rundknopf zart', html: ik('zurueck'), title: 'Zurück zu den Clustern', onclick: () => { speichereStill(brett); location.hash = '#/cluster'; } }),
    el('span', { style: 'align-self:center;font-family:ui-serif,Georgia,serif;font-weight:600;padding:0 6px' }, brett.titel),
    el('button', { class: 'rundknopf zart', html: ik('teilen'), title: 'Brett als Bild hinausgeben', onclick: () => brettAlsBild(brett) })
  );

  const verbindenKnopf = el('button', {
    class: 'rundknopf', html: ik('verbinden'), title: 'Verbinden', onclick: () => {
      verbinden = !verbinden;
      verbindeVon = null;
      verbindenKnopf.classList.toggle('an', verbinden);
      $$('.denkblase.gewaehlt', flaeche).forEach((x) => x.classList.remove('gewaehlt'));
      toast(verbinden ? 'Zwei Blasen antippen — dann spannt sich ein Faden.' : 'Faden-Modus aus.');
    }
  });
  const zoomAnzeige = el('button', {
    class: 'knopf zart', style: 'min-width:52px;justify-content:center', onclick: () => { sicht.z = 1; sicht.x = 60; sicht.y = 60; wende(); }
  }, '100%');
  const werkzeuge = el('div', { class: 'brett-werkzeuge' },
    el('button', {
      class: 'rundknopf', html: ik('plus'), title: 'Neue Blase', onclick: () => {
        const mitte = weltPunkt(raum.clientWidth / 2, raum.clientHeight / 2);
        neuDoc('blase', { parent: brett.id, text: '', farbe: '', pos: { x: mitte.x - 110 + Math.random() * 40, y: mitte.y - 40 + Math.random() * 40 } });
        baueBlasen();
      }
    }),
    el('button', {
      class: 'rundknopf', html: ik('kamera'), title: 'Bild aufs Brett', onclick: async () => {
        const bild = await waehleBild();
        if (!bild) return;
        const mitte = weltPunkt(raum.clientWidth / 2, raum.clientHeight / 2);
        const breite = 260;
        neuDoc('brettbild', { parent: brett.id, bild: bild.id,
          pos: { x: mitte.x - breite / 2, y: mitte.y - 90, rot: -2 + Math.random() * 4, w: breite } });
        baueBlasen();
      }
    }),
    el('button', {
      class: 'rundknopf', html: ik('rahmen'), title: 'Gruppe um etwas legen', onclick: async () => {
        const name = await eingabe({ titel: 'Wie heißt diese Gruppe?', platzhalter: 'z. B. Erster Teil' });
        if (name === null) return;
        const mitte = weltPunkt(raum.clientWidth / 2, raum.clientHeight / 2);
        neuDoc('gruppe', { parent: brett.id, titel: name || 'Gruppe', farbe: '',
          pos: { x: mitte.x - 220, y: mitte.y - 150, w: 440, h: 300 } });
        baueBlasen();
      }
    }),
    verbindenKnopf,
    el('button', { class: 'rundknopf', html: ik('suche'), style: 'transform:scaleX(-1)', title: 'Kleiner', onclick: () => { zoomeUm(1 / 1.25, raum.clientWidth / 2, raum.clientHeight / 2); } }),
    zoomAnzeige,
    el('button', { class: 'rundknopf', html: ik('suche'), title: 'Größer', onclick: () => { zoomeUm(1.25, raum.clientWidth / 2, raum.clientHeight / 2); } })
  );

  haupt.append(raum, kopfleiste, werkzeuge);

  function wende() {
    flaeche.style.transform = 'translate(' + sicht.x + 'px,' + sicht.y + 'px) scale(' + sicht.z + ')';
    zoomAnzeige.textContent = Math.round(sicht.z * 100) + '%';
  }
  function weltPunkt(cx, cy) { return { x: (cx - sicht.x) / sicht.z, y: (cy - sicht.y) / sicht.z }; }
  function zoomeUm(f, cx, cy) {
    const alt = sicht.z;
    sicht.z = Math.max(.3, Math.min(2.2, sicht.z * f));
    const echt = sicht.z / alt;
    sicht.x = cx - (cx - sicht.x) * echt;
    sicht.y = cy - (cy - sicht.y) * echt;
    wende();
    speichereStill(brett);
  }

  /* Kanten zeichnen */
  function mittelpunkt(b) {
    const elem = flaeche.querySelector('[data-id="' + b.id + '"]');
    const w = elem ? elem.offsetWidth : 220;
    const h = elem ? elem.offsetHeight : 60;
    return { x: b.pos.x + w / 2, y: b.pos.y + h / 2 };
  }
  function baueKanten() {
    svg.innerHTML = '';
    for (const k of kinder(brett.id, 'kante')) {
      const von = D.docs.get(k.von), zu = D.docs.get(k.zu);
      if (!von || !zu) continue;
      const a = mittelpunkt(von), b = mittelpunkt(zu);
      const linie = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      linie.setAttribute('x1', a.x + 20000); linie.setAttribute('y1', a.y + 20000);
      linie.setAttribute('x2', b.x + 20000); linie.setAttribute('y2', b.y + 20000);
      svg.append(linie);
      const griff = linie.cloneNode();
      griff.setAttribute('class', 'klickbar');
      griff.addEventListener('click', async () => {
        const wahl = await menue([
          { text: k.label ? 'Beschriftung ändern' : 'Faden beschriften', icon: 'stift', wert: 'label' },
          { text: 'Faden lösen', icon: 'muell', wert: 'weg', rot: true }
        ]);
        if (wahl === 'label') {
          const neu = await eingabe({ titel: 'Was verbindet die beiden?', wert: k.label || '' });
          if (neu !== null) { k.label = neu; speichereStill(k); baueKanten(); }
        } else if (wahl === 'weg') { await loesche(k.id); baueKanten(); }
      });
      svg.append(griff);
      if (k.label) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', (a.x + b.x) / 2 + 20000);
        text.setAttribute('y', (a.y + b.y) / 2 + 20000 - 6);
        text.setAttribute('text-anchor', 'middle');
        text.textContent = k.label;
        svg.append(text);
      }
    }
  }

  /* Blasen bauen */
  function baueBlasen() {
    $$('.denkblase, .brettgruppe, .brettbild', flaeche).forEach((x) => x.remove());
    /* Gruppen zuerst: sie liegen als Rahmen unter allem anderen. */
    for (const g of kinder(brett.id, 'gruppe')) flaeche.append(baueGruppe(g));
    for (const bi of kinder(brett.id, 'brettbild')) flaeche.append(baueBrettbild(bi));
    for (const b of kinder(brett.id, 'blase')) flaeche.append(baueBlase(b));
    baueKanten();
  }

  /* Ein Rahmen, der mitnimmt, was in ihm liegt. */
  function baueGruppe(g) {
    const kasten = el('div', { class: 'brettgruppe ' + (g.farbe || ''), 'data-id': g.id });
    kasten.style.left = g.pos.x + 'px'; kasten.style.top = g.pos.y + 'px';
    kasten.style.width = Math.max(120, g.pos.w || 440) + 'px';
    kasten.style.height = Math.max(90, g.pos.h || 300) + 'px';
    const titel = el('div', { class: 'gruppentitel' }, g.titel || 'Gruppe');
    const griff = el('div', { class: 'gruppengriff', title: 'Größe ändern' });
    kasten.append(titel, griff);

    const innen = () => {
      const x1 = g.pos.x, y1 = g.pos.y, x2 = x1 + (g.pos.w || 440), y2 = y1 + (g.pos.h || 300);
      return kinder(brett.id, 'blase').concat(kinder(brett.id, 'brettbild'))
        .filter((b) => b.pos && b.pos.x >= x1 - 8 && b.pos.y >= y1 - 8 && b.pos.x <= x2 && b.pos.y <= y2);
    };

    let zug = null;
    titel.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      zug = { sx: e.clientX, sy: e.clientY, px: g.pos.x, py: g.pos.y, mit: innen().map((b) => ({ b, x: b.pos.x, y: b.pos.y })), bewegt: false };
      try { titel.setPointerCapture(e.pointerId); } catch (x) {}
    });
    titel.addEventListener('pointermove', (e) => {
      if (!zug) return;
      const dx = (e.clientX - zug.sx) / sicht.z, dy = (e.clientY - zug.sy) / sicht.z;
      if (!zug.bewegt && Math.hypot(dx, dy) < 5) return;
      zug.bewegt = true; kasten._zieht = true;
      g.pos.x = zug.px + dx; g.pos.y = zug.py + dy;
      kasten.style.left = g.pos.x + 'px'; kasten.style.top = g.pos.y + 'px';
      for (const m of zug.mit) {
        m.b.pos.x = m.x + dx; m.b.pos.y = m.y + dy;
        const el2 = flaeche.querySelector('[data-id="' + m.b.id + '"]');
        if (el2) { el2.style.left = m.b.pos.x + 'px'; el2.style.top = m.b.pos.y + 'px'; }
      }
      baueKanten();
    });
    const endeZug = () => {
      if (!zug) return;
      if (zug.bewegt) { speichereStill(g); for (const m of zug.mit) speichereStill(m.b); }
      zug = null; setTimeout(() => { kasten._zieht = false; }, 0);
    };
    titel.addEventListener('pointerup', endeZug);
    titel.addEventListener('pointercancel', endeZug);

    let groesse = null;
    griff.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      groesse = { sx: e.clientX, sy: e.clientY, w: g.pos.w || 440, h: g.pos.h || 300 };
      try { griff.setPointerCapture(e.pointerId); } catch (x) {}
    });
    griff.addEventListener('pointermove', (e) => {
      if (!groesse) return;
      g.pos.w = Math.max(120, groesse.w + (e.clientX - groesse.sx) / sicht.z);
      g.pos.h = Math.max(90, groesse.h + (e.clientY - groesse.sy) / sicht.z);
      kasten.style.width = g.pos.w + 'px'; kasten.style.height = g.pos.h + 'px';
    });
    const endeGroesse = () => { if (groesse) { speichereStill(g); groesse = null; } };
    griff.addEventListener('pointerup', endeGroesse);
    griff.addEventListener('pointercancel', endeGroesse);

    langdruck(titel, async () => {
      const wahl = await menue([
        { text: 'Umbenennen', icon: 'stift', wert: 'name' },
        { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' },
        { text: 'Eng um den Inhalt legen', icon: 'wandel', wert: 'eng' },
        { text: 'Gruppe auflösen (Inhalt bleibt)', icon: 'kreuz', wert: 'los', rot: true }
      ], g.titel || 'Gruppe');
      if (wahl === 'name') {
        const n = await eingabe({ titel: 'Die Gruppe heißt jetzt …', wert: g.titel });
        if (n !== null) { g.titel = n || 'Gruppe'; speichereStill(g); baueBlasen(); }
      } else if (wahl === 'farbe') {
        g.farbe = BLASENFARBEN[(BLASENFARBEN.indexOf(g.farbe || '') + 1) % BLASENFARBEN.length];
        speichereStill(g); baueBlasen();
      } else if (wahl === 'eng') {
        const drin = innen();
        if (!drin.length) { toast('In dieser Gruppe liegt noch nichts.'); return; }
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const b of drin) {
          const e2 = flaeche.querySelector('[data-id="' + b.id + '"]');
          const bw = e2 ? e2.offsetWidth : 220, bh = e2 ? e2.offsetHeight : 70;
          x1 = Math.min(x1, b.pos.x); y1 = Math.min(y1, b.pos.y);
          x2 = Math.max(x2, b.pos.x + bw); y2 = Math.max(y2, b.pos.y + bh);
        }
        g.pos = { x: x1 - 26, y: y1 - 40, w: (x2 - x1) + 52, h: (y2 - y1) + 66 };
        speichereStill(g); baueBlasen();
      } else if (wahl === 'los') {
        await loesche(g.id, true); baueBlasen();
      }
    });
    return kasten;
  }

  /* Ein Bild auf dem Brett: verschieben, Größe ändern, drehen. */
  function baueBrettbild(bi) {
    const kasten = el('div', { class: 'brettbild', 'data-id': bi.id });
    kasten.style.left = bi.pos.x + 'px'; kasten.style.top = bi.pos.y + 'px';
    kasten.style.width = Math.max(60, bi.pos.w || 260) + 'px';
    kasten.style.transform = 'rotate(' + (bi.pos.rot || 0) + 'deg)';
    const img = el('img', { alt: bi.titel || '' });
    setzeBild(img, bi.bild);
    const griff = el('div', { class: 'brettbildgriff', title: 'Größe ändern' });
    kasten.append(img, griff);
    if (bi.titel) kasten.append(el('div', { class: 'brettbildtitel' }, bi.titel));

    let zug = null;
    kasten.addEventListener('pointerdown', (e) => {
      if (e.target === griff) return;
      zug = { sx: e.clientX, sy: e.clientY, px: bi.pos.x, py: bi.pos.y, bewegt: false };
      try { kasten.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    });
    kasten.addEventListener('pointermove', (e) => {
      if (!zug) return;
      const dx = (e.clientX - zug.sx) / sicht.z, dy = (e.clientY - zug.sy) / sicht.z;
      if (!zug.bewegt && Math.hypot(dx, dy) < 5) return;
      zug.bewegt = true; kasten._zieht = true;
      bi.pos.x = zug.px + dx; bi.pos.y = zug.py + dy;
      kasten.style.left = bi.pos.x + 'px'; kasten.style.top = bi.pos.y + 'px';
    });
    const ende = () => { if (zug) { if (zug.bewegt) speichereStill(bi); zug = null; setTimeout(() => { kasten._zieht = false; }, 0); } };
    kasten.addEventListener('pointerup', ende);
    kasten.addEventListener('pointercancel', ende);

    let groesse = null;
    griff.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      groesse = { sx: e.clientX, w: bi.pos.w || 260 };
      try { griff.setPointerCapture(e.pointerId); } catch (x) {}
    });
    griff.addEventListener('pointermove', (e) => {
      if (!groesse) return;
      bi.pos.w = Math.max(60, Math.min(1400, groesse.w + (e.clientX - groesse.sx) / sicht.z));
      kasten.style.width = bi.pos.w + 'px';
    });
    const endeG = () => { if (groesse) { speichereStill(bi); groesse = null; } };
    griff.addEventListener('pointerup', endeG);
    griff.addEventListener('pointercancel', endeG);

    langdruck(kasten, async () => {
      const wahl = await menue([
        { text: bi.titel ? 'Beschriftung ändern' : 'Beschriften', icon: 'stift', wert: 'titel' },
        { text: 'Etwas drehen', icon: 'drehen', wert: 'drehen' },
        { text: 'Gerade rücken', icon: 'ausBlock', wert: 'gerade' },
        { text: 'Vom Brett nehmen', icon: 'muell', wert: 'weg', rot: true }
      ]);
      if (wahl === 'titel') {
        const n = await eingabe({ titel: 'Was steht auf dem Bild?', wert: bi.titel || '' });
        if (n !== null) { bi.titel = n; speichereStill(bi); baueBlasen(); }
      } else if (wahl === 'drehen') {
        bi.pos.rot = ((bi.pos.rot || 0) + 5); if (bi.pos.rot > 12) bi.pos.rot = -10;
        speichereStill(bi); kasten.style.transform = 'rotate(' + bi.pos.rot + 'deg)';
      } else if (wahl === 'gerade') {
        bi.pos.rot = 0; speichereStill(bi); kasten.style.transform = 'rotate(0deg)';
      } else if (wahl === 'weg' && await frage('Das Bild vom Brett nehmen?', { ja: 'Wegnehmen', gefahr: true })) {
        await loesche(bi.id); baueBlasen();
      }
    });
    return kasten;
  }
  function baueBlase(b) {
    const blase = el('div', { class: 'denkblase ' + (b.farbe || ''), 'data-id': b.id });
    blase.style.left = b.pos.x + 'px';
    blase.style.top = b.pos.y + 'px';
    const ta = el('textarea', { rows: 1, placeholder: '…', readonly: 'readonly' });
    ta.value = b.text || '';
    autogrow(ta);
    ta.addEventListener('input', entprellt(() => { b.text = ta.value; speichereStill(b); }, 400));
    ta.addEventListener('blur', () => ta.setAttribute('readonly', 'readonly'));
    blase.append(ta);
    const quelle = b.quelle && D.docs.get(b.quelle);
    if (quelle) blase.append(el('button', {
      class: 'blasenquelle', onpointerdown: (e) => e.stopPropagation(), onclick: (e) => { e.stopPropagation(); speichereStill(brett); oeffneDoc(quelle); }
    }, el('span', { html: ik(docIcon(quelle)) }), docName(quelle)));

    let zieht = null;
    blase.addEventListener('pointerdown', (e) => {
      if (!ta.hasAttribute('readonly') && e.target === ta) return;
      zieht = { sx: e.clientX, sy: e.clientY, px: b.pos.x, py: b.pos.y, bewegt: false };
      try { blase.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    });
    blase.addEventListener('pointermove', (e) => {
      if (!zieht) return;
      const dx = (e.clientX - zieht.sx) / sicht.z, dy = (e.clientY - zieht.sy) / sicht.z;
      if (!zieht.bewegt && Math.hypot(dx, dy) < 5) return;
      zieht.bewegt = true;
      blase._zieht = true;
      b.pos.x = zieht.px + dx; b.pos.y = zieht.py + dy;
      blase.style.left = b.pos.x + 'px';
      blase.style.top = b.pos.y + 'px';
      baueKanten();
    });
    blase.addEventListener('pointerup', () => {
      if (!zieht) return;
      const bewegt = zieht.bewegt;
      zieht = null;
      setTimeout(() => { blase._zieht = false; }, 0);
      if (bewegt) { speichereStill(b); return; }
      /* Tippen */
      if (verbinden) {
        if (!verbindeVon) { verbindeVon = b; blase.classList.add('gewaehlt'); return; }
        if (verbindeVon.id === b.id) { verbindeVon = null; blase.classList.remove('gewaehlt'); return; }
        const bestehend = kinder(brett.id, 'kante').find((k) =>
          (k.von === verbindeVon.id && k.zu === b.id) || (k.von === b.id && k.zu === verbindeVon.id));
        if (bestehend) { loesche(bestehend.id).then(baueKanten); }
        else { neuDoc('kante', { parent: brett.id, von: verbindeVon.id, zu: b.id, label: '' }); baueKanten(); }
        $$('.denkblase.gewaehlt', flaeche).forEach((x) => x.classList.remove('gewaehlt'));
        verbindeVon = null;
        return;
      }
      ta.removeAttribute('readonly');
      ta.focus();
    });
    blase.addEventListener('pointercancel', () => { zieht = null; });

    langdruck(blase, async () => {
      const wahl = await menue([
        { text: 'Andere Farbe', icon: 'farbe', wert: 'farbe' },
        { text: 'Im Schreibraum öffnen', icon: 'stift', wert: 'sr' },
        { text: 'Verbindungen ansehen', icon: 'verbinden', wert: 'bezug' },
        { text: 'Blase zerplatzen', icon: 'muell', wert: 'weg', rot: true }
      ]);
      if (wahl === 'farbe') {
        b.farbe = BLASENFARBEN[(BLASENFARBEN.indexOf(b.farbe || '') + 1) % BLASENFARBEN.length];
        speichereStill(b);
        blase.className = 'denkblase ' + (b.farbe || '');
      } else if (wahl === 'sr') {
        speichereStill(brett);
        oeffneSchreibraum(b.id);
      } else if (wahl === 'bezug') {
        zeigeBeziehungen(b);
      } else if (wahl === 'weg') {
        await loesche(b.id); baueBlasen();
      }
    });
    return blase;
  }

  /* Schieben & Kneifen & Doppeltipp */
  const zeiger = new Map();
  let pan = null, kneifen = null, letzterTipp = { t: 0, x: 0, y: 0 };
  raum.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.denkblase') || e.target.closest('.schwebeleiste') || e.target.closest('.brett-werkzeuge')) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (zeiger.size === 1) {
      pan = { sx: e.clientX, sy: e.clientY, px: sicht.x, py: sicht.y };
    } else if (zeiger.size === 2) {
      pan = null;
      const [a, b] = [...zeiger.values()];
      kneifen = { abstand: Math.hypot(a.x - b.x, a.y - b.y), z: sicht.z };
    }
  });
  raum.addEventListener('pointermove', (e) => {
    if (!zeiger.has(e.pointerId)) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (kneifen && zeiger.size === 2) {
      const [a, b] = [...zeiger.values()];
      const abstand = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const f = (kneifen.z * abstand / kneifen.abstand) / sicht.z;
      zoomeUm(f, mx, my);
    } else if (pan) {
      sicht.x = pan.px + (e.clientX - pan.sx);
      sicht.y = pan.py + (e.clientY - pan.sy);
      wende();
    }
  });
  const zeigerWeg = (e) => {
    if (pan && zeiger.has(e.pointerId)) {
      const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
      if (Math.hypot(dx, dy) < 8 && !e.target.closest('.denkblase')) {
        const jetzt = Date.now();
        if (jetzt - letzterTipp.t < 340 && Math.hypot(e.clientX - letzterTipp.x, e.clientY - letzterTipp.y) < 40) {
          const p = weltPunkt(e.clientX, e.clientY);
          neuDoc('blase', { parent: brett.id, text: '', farbe: '', pos: { x: p.x - 110, y: p.y - 30 } });
          baueBlasen();
          letzterTipp = { t: 0, x: 0, y: 0 };
        } else {
          letzterTipp = { t: jetzt, x: e.clientX, y: e.clientY };
        }
      }
      speichereStill(brett);
    }
    zeiger.delete(e.pointerId);
    if (zeiger.size < 2) kneifen = null;
    if (zeiger.size === 0) pan = null;
  };
  raum.addEventListener('pointerup', zeigerWeg);
  raum.addEventListener('pointercancel', zeigerWeg);

  wende();
  baueBlasen();
  if (!kinder(brett.id, 'blase').length) {
    toast('Doppelt tippen — da, wo ein Gedanke hin soll.');
  }
};


/* ----- Ein Brett als Bild -----
   Alles, was auf dem Brett liegt, wird auf eine Leinwand gemalt: Gruppen als
   Rahmen, Fäden als Linien, Bilder als Bilder, Blasen als beschriftete Karten.
   Herauskommt ein PNG, das man verschicken oder ausdrucken kann. */
async function brettAlsBild(brett) {
  const blasen = kinder(brett.id, 'blase');
  const bilder = kinder(brett.id, 'brettbild');
  const gruppen = kinder(brett.id, 'gruppe');
  const kanten = kinder(brett.id, 'kante');
  if (!blasen.length && !bilder.length && !gruppen.length) { toast('Auf diesem Brett liegt noch nichts.'); return; }
  toast('Male das Brett …');

  /* Vorhandene Maße aus der Anzeige holen, sonst schätzen. */
  const masse = new Map();
  for (const b of blasen) {
    const e = document.querySelector('.denkblase[data-id="' + b.id + '"]');
    masse.set(b.id, { w: e ? e.offsetWidth : 220, h: e ? e.offsetHeight : 64 });
  }

  /* Bilder vorher laden, damit sie beim Malen fertig sind. */
  const geladen = new Map();
  for (const bi of bilder) {
    const url = await bildURL(bi.bild);
    if (!url) continue;
    const img = new Image();
    await new Promise((r) => { img.onload = r; img.onerror = r; img.src = url; });
    if (img.naturalWidth) geladen.set(bi.id, img);
  }

  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const merke = (x, y, w, h) => { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x + w); y2 = Math.max(y2, y + h); };
  for (const g of gruppen) merke(g.pos.x, g.pos.y - 24, g.pos.w || 440, (g.pos.h || 300) + 24);
  for (const b of blasen) { const m = masse.get(b.id); merke(b.pos.x, b.pos.y, m.w, m.h); }
  for (const bi of bilder) {
    const img = geladen.get(bi.id);
    const w = bi.pos.w || 260;
    merke(bi.pos.x, bi.pos.y, w, img ? w * (img.naturalHeight / img.naturalWidth) + 26 : 180);
  }
  if (!Number.isFinite(x1)) { toast('Auf diesem Brett liegt noch nichts.'); return; }

  const rand = 60;
  const breite = Math.min(6000, Math.round(x2 - x1 + rand * 2));
  const hoehe = Math.min(6000, Math.round(y2 - y1 + rand * 2 + 54));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = document.createElement('canvas');
  c.width = Math.round(breite * dpr); c.height = Math.round(hoehe * dpr);
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const stil = getComputedStyle(document.documentElement);
  const farbe = (n, ersatz) => (stil.getPropertyValue(n) || '').trim() || ersatz;
  const hg = farbe('--hg', '#ece3d1'), papier = farbe('--papier', '#f8f3e7');
  const tinte = farbe('--tinte', '#2c251c'), linie = farbe('--linie', 'rgba(90,74,52,.3)');
  const blass = farbe('--blass', '#82755f'), akzent = farbe('--akzent', '#b0552f');

  g.fillStyle = hg; g.fillRect(0, 0, breite, hoehe);
  const vx = (x) => x - x1 + rand, vy = (y) => y - y1 + rand + 40;

  /* Kopfzeile */
  g.fillStyle = tinte; g.font = '600 22px ui-serif, Georgia, serif';
  g.fillText(brett.titel || 'Brett', rand, 34);
  g.fillStyle = blass; g.font = '13px ui-rounded, system-ui, sans-serif';
  g.fillText(blasen.length + (blasen.length === 1 ? ' Blase' : ' Blasen') + ' · ' + fmtDatum(Date.now()), rand, 54);

  const rundesRechteck = (x, y, w, h, r) => {
    const rr = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr, y); g.lineTo(x + w - rr, y); g.quadraticCurveTo(x + w, y, x + w, y + rr);
    g.lineTo(x + w, y + h - rr); g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    g.lineTo(x + rr, y + h); g.quadraticCurveTo(x, y + h, x, y + h - rr);
    g.lineTo(x, y + rr); g.quadraticCurveTo(x, y, x + rr, y); g.closePath();
  };

  /* Gruppen */
  for (const gr of gruppen) {
    g.save();
    g.strokeStyle = linie; g.setLineDash([7, 6]); g.lineWidth = 1.5;
    rundesRechteck(vx(gr.pos.x), vy(gr.pos.y), gr.pos.w || 440, gr.pos.h || 300, 16);
    g.stroke(); g.setLineDash([]);
    g.fillStyle = blass; g.font = '600 13px ui-rounded, system-ui, sans-serif';
    g.fillText((gr.titel || 'Gruppe').slice(0, 60), vx(gr.pos.x) + 6, vy(gr.pos.y) - 8);
    g.restore();
  }

  /* Fäden */
  const mitte = (b) => {
    if (masse.has(b.id)) { const m = masse.get(b.id); return { x: vx(b.pos.x) + m.w / 2, y: vy(b.pos.y) + m.h / 2 }; }
    const w = b.pos.w || 260;
    const img = geladen.get(b.id);
    return { x: vx(b.pos.x) + w / 2, y: vy(b.pos.y) + (img ? w * (img.naturalHeight / img.naturalWidth) : 160) / 2 };
  };
  g.strokeStyle = linie; g.lineWidth = 1.6;
  g.font = '11px ui-rounded, system-ui, sans-serif';
  for (const k of kanten) {
    const von = D.docs.get(k.von), zu = D.docs.get(k.zu);
    if (!von || !zu || !von.pos || !zu.pos) continue;
    const a = mitte(von), b = mitte(zu);
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    if (k.label) {
      g.fillStyle = blass;
      g.textAlign = 'center';
      g.fillText(String(k.label).slice(0, 40), (a.x + b.x) / 2, (a.y + b.y) / 2 - 6);
      g.textAlign = 'left';
    }
  }

  /* Bilder */
  for (const bi of bilder) {
    const img = geladen.get(bi.id);
    const w = bi.pos.w || 260;
    const h = img ? w * (img.naturalHeight / img.naturalWidth) : 160;
    g.save();
    g.translate(vx(bi.pos.x) + w / 2, vy(bi.pos.y) + h / 2);
    g.rotate((bi.pos.rot || 0) * Math.PI / 180);
    g.fillStyle = '#fdfcf7';
    g.shadowColor = 'rgba(0,0,0,.22)'; g.shadowBlur = 12; g.shadowOffsetY = 4;
    g.fillRect(-w / 2 - 8, -h / 2 - 8, w + 16, h + (bi.titel ? 40 : 16));
    g.shadowColor = 'transparent';
    if (img) g.drawImage(img, -w / 2, -h / 2, w, h);
    if (bi.titel) {
      g.fillStyle = '#3a3325'; g.font = '12px ui-rounded, system-ui, sans-serif'; g.textAlign = 'center';
      g.fillText(String(bi.titel).slice(0, 44), 0, h / 2 + 22); g.textAlign = 'left';
    }
    g.restore();
  }

  /* Blasen */
  const FARBEN = { 'b-gelb': '#f6e9a8', 'b-rot': '#f3cfd3', 'b-gruen': '#d3e3bd', 'b-blau': '#cadfea' };
  for (const b of blasen) {
    const m = masse.get(b.id);
    const x = vx(b.pos.x), y = vy(b.pos.y);
    g.save();
    g.shadowColor = 'rgba(0,0,0,.14)'; g.shadowBlur = 9; g.shadowOffsetY = 3;
    g.fillStyle = FARBEN[b.farbe] || papier;
    rundesRechteck(x, y, m.w, m.h, 14); g.fill();
    g.shadowColor = 'transparent';
    g.strokeStyle = linie; g.lineWidth = 1; g.stroke();
    g.fillStyle = tinte; g.font = '14px ui-rounded, system-ui, sans-serif';
    const worte = String(b.text || '').split(/\s+/).filter(Boolean);
    let zeile = '', zy = y + 22;
    for (const w of worte) {
      const probe = zeile ? zeile + ' ' + w : w;
      if (g.measureText(probe).width > m.w - 26 && zeile) {
        g.fillText(zeile, x + 13, zy); zeile = w; zy += 19;
        if (zy > y + m.h - 6) { zeile = ''; break; }
      } else zeile = probe;
    }
    if (zeile) g.fillText(zeile, x + 13, zy);
    if (b.quelle && D.docs.get(b.quelle)) {
      g.fillStyle = akzent; g.font = '10px ui-rounded, system-ui, sans-serif';
      g.fillText(docName(D.docs.get(b.quelle)).slice(0, 28), x + 13, y + m.h - 7);
    }
    g.restore();
  }

  const name = (brett.titel || 'Brett').replace(/[^\wäöüÄÖÜß -]/g, '').trim().slice(0, 50) || 'Brett';
  c.toBlob(async (blob) => {
    if (!blob) { toast('Das Bild wollte nicht.'); return; }
    const datei = new File([blob], name + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      try { await navigator.share({ files: [datei] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name + '.png', style: 'display:none' });
    document.body.append(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
    toast('Das Brett liegt als Bild bereit — schau in „Dateien".', 4200);
  }, 'image/png');
}

/* ================================================================
   VANI — Wörter: eigene Kisten, Wortschatz & Funken
   ================================================================ */

const WORTKISTEN_FARBEN = ['#8f6a55', '#a9785f', '#8c7853', '#70806f', '#637984', '#746b87', '#8c6675', '#766c60'];

function wortkisten() {
  return vomTyp('wortkiste').slice(0, 5000).sort((a, b) =>
    String(a.titel || '').localeCompare(String(b.titel || ''), 'de', { sensitivity: 'base', numeric: true }) ||
    (a.angelegt || 0) - (b.angelegt || 0));
}

function wortZufallsgriff(liste, anzahl = 3, zufallsquelle = Math.random) {
  if (!Array.isArray(liste) || typeof zufallsquelle !== 'function') return [];
  const kopie = liste.slice(0, 100000);
  const n = Math.min(kopie.length, Math.max(0, Math.round(Number(anzahl) || 0)));
  for (let i = 0; i < n; i++) {
    const roh = Number(zufallsquelle());
    const z = Number.isFinite(roh) ? Math.max(0, Math.min(.999999999999, roh)) : 0;
    const j = i + Math.floor(z * (kopie.length - i));
    [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
  }
  return kopie.slice(0, n);
}

function wortkisteGueltig(id) {
  if (id == null || id === 'lose') return null;
  const kiste = D.docs.get(String(id));
  return kiste && kiste.typ === 'wortkiste' ? kiste : false;
}

function wortlisteAusText(roherText) {
  if (typeof roherText !== 'string') return [];
  const gesehen = new Set();
  const ergebnis = [];
  /* Zeilen, Semikola und Kommata dürfen als schnelle Mehrfachzugabe dienen.
     Gedankenstriche und Leerzeichen bleiben Teil eines Ausdrucks. */
  for (const teil of roherText.slice(0, 200000).split(/[\n\r;,]+/)) {
    const wort = teil.replace(/\s+/g, ' ').trim().slice(0, 160);
    const schluessel = normalisiere(wort);
    if (!wort || !schluessel || gesehen.has(schluessel)) continue;
    gesehen.add(schluessel);
    ergebnis.push(wort);
    if (ergebnis.length >= 500) break;
  }
  return ergebnis;
}

function woerterInKiste(kistenId = 'alle', suche = '', sortierung = 'az') {
  const q = normalisiere(String(suche || '').slice(0, 500));
  const kiste = wortkisteGueltig(kistenId);
  const bekannteKisten = new Set(wortkisten().map((d) => d.id));
  const ergebnis = vomTyp('wort').filter((w) => {
    const passtKiste = kistenId === 'alle' ? true
      : (kistenId === 'lose' || kistenId == null) ? !bekannteKisten.has(w.parent)
        : !!kiste && w.parent === kiste.id;
    return passtKiste && (!q || normalisiere([w.text, w.notiz].filter(Boolean).join(' ')).includes(q));
  });
  const zeit = (d) => Number.isFinite(d.geaendert) ? d.geaendert : (d.angelegt || 0);
  ergebnis.sort((a, b) => Number(!!b.favorit) - Number(!!a.favorit) || (
    sortierung === 'zuletzt' ? zeit(b) - zeit(a) :
      sortierung === 'aeltest' ? zeit(a) - zeit(b) :
        String(a.text || '').localeCompare(String(b.text || ''), 'de', { sensitivity: 'base', numeric: true })
  ) || String(a.id).localeCompare(String(b.id)));
  return ergebnis;
}

function fuegeWoerterHinzu(kistenId, roherText) {
  const kiste = wortkisteGueltig(kistenId);
  if (kistenId !== 'lose' && kistenId != null && !kiste) return { hinzu: [], uebersprungen: 0 };
  const parent = kiste ? kiste.id : null;
  const vorhanden = new Set(woerterInKiste(parent || 'lose').map((w) => normalisiere(w.text || '')));
  const hinzu = [], liste = wortlisteAusText(roherText);
  let uebersprungen = 0;
  for (const text of liste) {
    const schluessel = normalisiere(text);
    if (vorhanden.has(schluessel)) { uebersprungen++; continue; }
    vorhanden.add(schluessel);
    const felder = { text };
    if (parent) felder.parent = parent;
    hinzu.push(neuDoc('wort', felder));
  }
  return { hinzu, uebersprungen };
}

function wortInKiste(wort, kistenId, kopieren = false) {
  if (!wort || wort.typ !== 'wort' || !D.docs.has(wort.id)) return null;
  const kiste = wortkisteGueltig(kistenId);
  if (kistenId !== 'lose' && kistenId != null && !kiste) return null;
  const parent = kiste ? kiste.id : null;
  const doppelt = woerterInKiste(parent || 'lose').find((d) => d.id !== wort.id && normalisiere(d.text || '') === normalisiere(wort.text || ''));
  if (doppelt) return doppelt;
  if (!kopieren && (wort.parent || null) === parent) return wort;
  if (kopieren) {
    const felder = { text: wort.text || '' };
    if (wort.notiz) felder.notiz = wort.notiz;
    if (wort.favorit) felder.favorit = true;
    if (parent) felder.parent = parent;
    return neuDoc('wort', felder);
  }
  if (parent) wort.parent = parent; else delete wort.parent;
  speichere(wort);
  return wort;
}

async function loescheWortkiste(kistenId, samtInhalt = false, still = false) {
  const kiste = wortkisteGueltig(kistenId);
  if (!kiste) return false;
  await loesche(kiste.id, still, !samtInhalt);
  return true;
}

function wortkistenFormular(kiste) {
  return new Promise((resolve) => {
    const titel = el('input', { type: 'text', maxlength: '120', value: kiste ? kiste.titel || '' : '', placeholder: 'z. B. Synonyme' });
    const notiz = el('textarea', { rows: 3, maxlength: '600', placeholder: 'Wofür ist diese Kiste? (freiwillig)' });
    notiz.value = kiste ? kiste.notiz || '' : '';
    const farbe = el('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(kiste && kiste.farbe || '') ? kiste.farbe : WORTKISTEN_FARBEN[wortkisten().length % WORTKISTEN_FARBEN.length] });
    const meldung = el('div', { class: 'wortkisten-meldung', role: 'status' });
    let erledigt = false;
    const fertig = () => {
      const t = titel.value.replace(/\s+/g, ' ').trim();
      if (!t) { meldung.textContent = 'Die Kiste braucht einen Namen.'; titel.focus(); return; }
      if (wortkisten().some((d) => d.id !== (kiste && kiste.id) && normalisiere(d.titel || '') === normalisiere(t))) {
        meldung.textContent = 'Eine Kiste mit diesem Namen gibt es schon.'; titel.focus(); return;
      }
      erledigt = true; zu(); resolve({ titel: t.slice(0, 120), notiz: notiz.value.trim().slice(0, 600), farbe: farbe.value });
    };
    const kasten = el('div', { class: 'modal wortkisten-modal' },
      el('div', { class: 'kartenkopf' }, el('span', { html: ik('woerter') }), kiste ? 'KISTE GESTALTEN' : 'NEUE WORTKISTE'),
      el('label', {}, el('span', {}, 'Name'), titel),
      el('label', {}, el('span', {}, 'Kleine Notiz'), notiz),
      el('label', { class: 'wortkisten-farbzeile' }, el('span', {}, 'Farbe'), farbe),
      meldung,
      el('div', { class: 'reihe' },
        el('button', { class: 'knopf zart', onclick: () => { zu(); } }, 'Abbrechen'),
        el('button', { class: 'knopf voll', onclick: fertig }, kiste ? 'Übernehmen' : 'Kiste bauen'))
    );
    const zu = zeigeDeck(kasten, () => { if (!erledigt) resolve(null); });
    titel.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); fertig(); } });
    setTimeout(() => titel.focus(), 60);
  });
}

function wortFormular(wort) {
  return new Promise((resolve) => {
    const text = el('input', { type: 'text', maxlength: '160', value: wort.text || '', placeholder: 'Wort oder Ausdruck' });
    const notiz = el('textarea', { rows: 4, maxlength: '1000', placeholder: 'Bedeutung, Synonyme, ein Beispielsatz …' });
    notiz.value = wort.notiz || '';
    const favorit = el('input', { type: 'checkbox', checked: !!wort.favorit });
    const meldung = el('div', { class: 'wortkisten-meldung', role: 'status' });
    let erledigt = false;
    const fertig = () => {
      const t = text.value.replace(/\s+/g, ' ').trim();
      if (!t) { meldung.textContent = 'Ganz ohne Wort geht es nicht.'; text.focus(); return; }
      erledigt = true; zu(); resolve({ text: t.slice(0, 160), notiz: notiz.value.trim().slice(0, 1000), favorit: favorit.checked });
    };
    const kasten = el('div', { class: 'modal wortkisten-modal' },
      el('div', { class: 'kartenkopf' }, el('span', { html: ik('stift') }), 'WORTZETTEL'),
      el('label', {}, el('span', {}, 'Wort oder Ausdruck'), text),
      el('label', {}, el('span', {}, 'Notiz'), notiz),
      el('label', { class: 'wort-favorit' }, favorit, el('span', {}, 'Oben anheften')),
      meldung,
      el('div', { class: 'reihe' },
        el('button', { class: 'knopf zart', onclick: () => zu() }, 'Abbrechen'),
        el('button', { class: 'knopf voll', onclick: fertig }, 'Übernehmen'))
    );
    const zu = zeigeDeck(kasten, () => { if (!erledigt) resolve(null); });
    setTimeout(() => text.focus(), 60);
  });
}

RENDER.woerter = function (haupt) {
  haupt.append(raumkopf('Wörter'));
  const inhalt = el('div', { class: 'inhalt woerter-raum' });
  let aktiveKiste = 'alle';
  let suche = '';
  let sortierung = 'az';
  let griff = [];

  const kopf = el('div', { class: 'karte wortkisten-kopf' },
    el('div', { class: 'kartenkopf' }, el('span', { html: ik('woerter') }), 'DEINE WORTKISTEN'),
    el('p', {}, 'Baue dir kleine Sammlungen: Synonyme, Lieblingsverben, Figurenwörter, Wörter für einen Vibe — oder etwas, das nur du verstehst.'),
    el('div', { class: 'fussreihe' },
      el('button', { class: 'knopf voll', onclick: async () => {
        if (wortkisten().length >= 200) { toast('Zweihundert Kisten sind genug für einen sehr großen Schrank.'); return; }
        const daten = await wortkistenFormular(null);
        if (!daten) return;
        const kiste = neuDoc('wortkiste', daten);
        aktiveKiste = kiste.id; baueAlles(); toast('Die neue Kiste steht bereit.');
      } }, '＋ Neue Kiste'))
  );

  const schrank = el('div', { class: 'wortkisten-schrank', 'aria-label': 'Wortkisten' });
  const arbeitskarte = el('div', { class: 'karte wortkisten-arbeit' });

  function kistenName(id) {
    if (id === 'alle') return 'Alle Wörter';
    if (id === 'lose') return 'Lose Wörter';
    const k = wortkisteGueltig(id);
    return k ? k.titel || 'Wortkiste' : 'Alle Wörter';
  }

  async function kistenMenue(kiste) {
    const wahl = await menue([
      { text: 'Name, Notiz & Farbe ändern', icon: 'stift', wert: 'edit' },
      { text: 'Nur Kiste löschen · Wörter bleiben lose', icon: 'drehen', wert: 'loese', rot: true },
      { text: 'Kiste und ihre Wörter löschen', icon: 'muell', wert: 'alles', rot: true }
    ], kiste.titel || 'Wortkiste');
    if (wahl === 'edit') {
      const daten = await wortkistenFormular(kiste);
      if (daten) { Object.assign(kiste, daten); speichere(kiste); baueAlles(); }
    } else if (wahl === 'loese') {
      if (await frage('Die Kiste verschwindet. Ihre Wörter landen sicher bei „Lose Wörter“. Fortfahren?', { ja: 'Kiste lösen', gefahr: true })) {
        await loescheWortkiste(kiste.id, false); aktiveKiste = 'lose'; baueAlles();
      }
    } else if (wahl === 'alles') {
      const anzahl = woerterInKiste(kiste.id).length;
      if (await frage('Diese Kiste und ' + (anzahl === 1 ? 'ihr Wort' : anzahl + ' Wörter') + ' wandern gemeinsam in den Papierkorb.', { ja: 'In den Papierkorb', gefahr: true })) {
        await loescheWortkiste(kiste.id, true); aktiveKiste = 'alle'; baueAlles();
      }
    }
  }

  function baueSchrank() {
    schrank.innerHTML = '';
    const kistenListe = wortkisten();
    const zaehler = new Map(kistenListe.map((d) => [d.id, 0]));
    let loseZahl = 0;
    const alleWoerter = vomTyp('wort');
    for (const wort of alleWoerter) {
      if (zaehler.has(wort.parent)) zaehler.set(wort.parent, zaehler.get(wort.parent) + 1);
      else loseZahl++;
    }
    const baueKnopf = (id, titel, anzahl, farbe, notiz, kiste) => {
      const waehlen = el('button', {
        class: 'wortkiste-waehlen',
        'aria-pressed': aktiveKiste === id ? 'true' : 'false',
        onclick: () => { aktiveKiste = id; griff = []; baueAlles(); }
      },
      el('span', { class: 'wortkiste-ruecken' }),
      el('span', { class: 'wortkiste-mini-inhalt' },
        el('strong', {}, titel),
        el('small', {}, anzahl + (anzahl === 1 ? ' Wort' : ' Wörter')),
        notiz ? el('em', {}, notiz) : null));
      const umschlag = el('div', {
        class: 'wortkiste-mini' + (aktiveKiste === id ? ' an' : ''),
        style: '--kistenfarbe:' + (farbe || '#857361')
      }, waehlen);
      if (kiste) umschlag.append(el('button', {
        class: 'wortkiste-menue', title: 'Kiste bearbeiten', 'aria-label': titel + ' bearbeiten',
        onclick: () => kistenMenue(kiste)
      }, '•••'));

    };
    baueKnopf('alle', 'Alle Wörter', alleWoerter.length, '#6f6357', 'Der ganze Schrank');
    baueKnopf('lose', 'Lose Wörter', loseZahl, '#9a8d7d', 'Noch ohne eigene Kiste');
    for (const kiste of kistenListe) baueKnopf(kiste.id, kiste.titel || 'Wortkiste', zaehler.get(kiste.id) || 0, kiste.farbe, kiste.notiz, kiste);
  }

  async function waehleZiel(wort, kopieren) {
    const ziele = [
      { text: 'Lose Wörter', icon: 'woerter', wert: 'lose' },
      ...wortkisten().slice(0, 200).map((k) => ({ text: k.titel || 'Wortkiste', icon: 'woerter', wert: k.id }))
    ];
    const ziel = await menue(ziele, kopieren ? 'Kopieren nach …' : 'Verschieben nach …');
    if (!ziel) return;
    const vorher = wort.parent || null;
    const vorherZahl = woerterInKiste(ziel).length;
    const ergebnis = wortInKiste(wort, ziel, kopieren);
    if (!ergebnis) { toast('Das Ziel gibt es nicht mehr.'); return; }
    const dazu = woerterInKiste(ziel).length > vorherZahl;
    const umgezogen = !kopieren && (ziel === 'lose' ? vorher !== null && !wort.parent : vorher !== ziel && wort.parent === ziel);
    if (dazu) toast(kopieren ? 'Eine Kopie liegt jetzt dort.' : 'Der Wortzettel ist umgezogen.');
    else if (umgezogen) toast('Der Wortzettel ist umgezogen.');
    else toast('Dieses Wort liegt dort schon.');
    baueAlles();
  }

  async function wortAktion(wort) {
    const wahl = await menue([
      { text: 'Damit schreiben', icon: 'stift', wert: 'schreiben' },
      { text: 'Wort kopieren', icon: 'teilen', wert: 'kopieren-wort' },
      { text: 'Wortzettel bearbeiten', icon: 'drehen', wert: 'edit' },
      { text: wort.favorit ? 'Oben lösen' : 'Oben anheften', icon: 'pin', wert: 'favorit' },
      wortkisten().length ? { text: 'In eine andere Kiste verschieben', icon: 'woerter', wert: 'verschieben' } : null,
      wortkisten().length ? { text: 'In eine Kiste kopieren', icon: 'plus', wert: 'kopieren' } : null,
      { text: 'Aus der Sammlung nehmen', icon: 'muell', wert: 'weg', rot: true }
    ], wort.text || 'Wort');
    if (wahl === 'kopieren-wort') {
      try { await navigator.clipboard.writeText(wort.text || ''); toast('Kopiert.'); }
      catch (e) { teileText(wort.text || ''); }
    } else if (wahl === 'schreiben') {
      const seite = blattAusText('', (wort.text || '') + ' —\n\n'); oeffneSchreibraum(seite.id);
    } else if (wahl === 'edit') {
      const daten = await wortFormular(wort);
      if (daten) { Object.assign(wort, daten); speichere(wort); baueAlles(); }
    } else if (wahl === 'favorit') {
      wort.favorit = !wort.favorit; speichere(wort); baueAlles();
    } else if (wahl === 'verschieben') await waehleZiel(wort, false);
    else if (wahl === 'kopieren') await waehleZiel(wort, true);
    else if (wahl === 'weg') { await loesche(wort.id); baueAlles(); }
  }

  function baueArbeitskarte() {
    arbeitskarte.innerHTML = '';
    if (aktiveKiste !== 'alle' && aktiveKiste !== 'lose' && !wortkisteGueltig(aktiveKiste)) aktiveKiste = 'alle';
    const kiste = wortkisteGueltig(aktiveKiste);
    const titel = kistenName(aktiveKiste);
    const beschreibung = kiste && kiste.notiz ? kiste.notiz : aktiveKiste === 'alle'
      ? 'Suche, schüttle oder greife quer durch alle Kisten.' : aktiveKiste === 'lose'
        ? 'Hier warten die Wörter, denen du noch keine eigene Kiste gegeben hast.' : '';
    const suchfeld = el('input', { type: 'search', value: suche, placeholder: 'In den Wörtern und Notizen suchen …', 'aria-label': 'Wörter suchen' });
    const sort = el('select', { class: 'wort-sortierung', 'aria-label': 'Wörter sortieren' },
      el('option', { value: 'az' }, 'A–Z'), el('option', { value: 'zuletzt' }, 'Zuletzt geändert'), el('option', { value: 'aeltest' }, 'Älteste zuerst'));
    sort.value = sortierung;
    const gitter = el('div', { class: 'wortgitter' });
    const zugabefeld = el('textarea', { rows: 2, placeholder: aktiveKiste === 'alle' ? 'Neue Wörter landen bei „Lose Wörter“ …' : 'Ein Wort oder mehrere — mit Komma oder neuer Zeile …' });
    const zielId = aktiveKiste === 'alle' ? 'lose' : aktiveKiste;

    const baueWoerter = () => {
      gitter.innerHTML = '';
      const alle = woerterInKiste(aktiveKiste, suche, sortierung);
      if (!alle.length) gitter.append(el('div', { class: 'wortkisten-leer' }, suche ? 'Hier passt gerade kein Wort zur Suche.' : 'Eine leere Kiste wartet auf schöne Wörter.'));
      for (const wort of alle) {
        let h = 0; for (const c of wort.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        const karte = el('button', { class: 'wortkarte' + (wort.favorit ? ' favorit' : ''), style: '--dreh:' + ((h % 7) - 3) + 'deg', onclick: () => wortAktion(wort) },
          wort.favorit ? el('span', { class: 'wortstern', 'aria-label': 'Oben angeheftet' }, '✦') : null,
          el('span', {}, wort.text || ''),
          wort.notiz ? el('small', {}, wort.notiz) : null);
        gitter.append(karte);
      }
    };
    const hinzu = () => {
      const paket = fuegeWoerterHinzu(zielId, zugabefeld.value);
      if (!paket.hinzu.length) { if (zugabefeld.value.trim()) toast(paket.uebersprungen ? 'Diese Wörter liegen schon in der Kiste.' : 'Da war noch kein Wort drin.'); return; }
      zugabefeld.value = ''; baueAlles();
      toast(paket.hinzu.length === 1 ? 'Ein Wort liegt jetzt in der Kiste.' : paket.hinzu.length + ' Wörter sind einsortiert.');
    };
    suchfeld.addEventListener('input', () => { suche = suchfeld.value; baueWoerter(); });
    sort.addEventListener('change', () => { sortierung = sort.value; baueWoerter(); });
    zugabefeld.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); hinzu(); } });
    arbeitskarte.append(
      el('div', { class: 'wortkisten-titelzeile' },
        el('div', {}, el('h2', {}, titel), beschreibung ? el('p', {}, beschreibung) : null),
        kiste ? el('button', { class: 'rundknopf zart', html: ik('mehr'), title: 'Kiste bearbeiten', onclick: () => kistenMenue(kiste) }) : null),
      el('div', { class: 'wortkisten-filter' }, el('span', { html: ik('suche') }), suchfeld, sort),
      gitter,
      el('div', { class: 'wortzugabe wortzugabe-mehrfach' }, zugabefeld,
        el('button', { class: 'rundknopf voll', html: ik('plus'), title: 'Wörter hinzufügen', onclick: hinzu })),
      el('small', { class: 'wortkisten-hinweis' }, 'Tipp: Mehrere Wörter lassen sich mit Komma, Semikolon oder je einer neuen Zeile auf einmal einfüllen. Strg/⌘ + Enter legt sie ab.')
    );
    baueWoerter();
  }

  const klangkarte = el('div', { class: 'karte wortkisten-schuetteln' });
  function baueSchuetteln() {
    klangkarte.innerHTML = '';
    const buehne = el('div', { class: 'dreiklang' },
      el('span', { style: 'color:var(--blass);font-size:16px' }, 'Drei Wörter fallen aus „' + kistenName(aktiveKiste) + '“ — und wollen zusammen etwas werden.'));
    const schreibknopf = el('button', { class: 'knopf voll', onclick: () => {
      if (!griff.length) { toast('Erst schütteln.'); return; }

    } }, 'Damit schreiben');
    klangkarte.append(el('div', { class: 'kartenkopf' }, el('span', { html: ik('wuerfel') }), 'KISTE SCHÜTTELN'), buehne,
      el('div', { class: 'fussreihe' }, el('button', { class: 'knopf', onclick: () => {
        const alle = woerterInKiste(aktiveKiste);
        if (alle.length < 3) { toast('Dafür braucht diese Auswahl mindestens drei Wörter.'); return; }
        griff = wortZufallsgriff(alle, 3); buehne.innerHTML = '';
        griff.forEach((w, i) => buehne.append(el('span', { style: '--dreh:' + ((i * 5) - 5) + 'deg' }, w.text)));
      } }, 'Schütteln'), schreibknopf));
  }

  function baueAlles() { baueSchrank(); baueArbeitskarte(); baueSchuetteln(); }
  baueAlles();
  inhalt.append(kopf, schrank, arbeitskarte, klangkarte);

  /* Funken */
  let funke = neuerFunke(false);
  let funkeArt = 'szene';
  const funkeText = el('div', { class: 'funke-text', style: 'min-height:54px' }, funke);
  const arten = el('div', { class: 'funke-arten' });
  const ziehe = () => { funke = funkeArt === 'kombi' ? neuerFunke(true) : neuerFunke(false, funkeArt); funkeText.textContent = funke; };
  for (const [id, name] of FUNKE_ARTEN) arten.append(el('button', {
    class: id === funkeArt ? 'an' : '', onclick: (e) => { funkeArt = id; $$('button', arten).forEach((b) => b.classList.toggle('an', b === e.currentTarget)); ziehe(); }
  }, name));
  inhalt.append(el('div', { class: 'karte wortkisten-funken' },
    el('div', { class: 'kartenkopf' }, el('span', { html: ik('feuer') }), 'FUNKEN'),
    arten, funkeText,
    el('div', { class: 'fussreihe' },
      el('button', { class: 'knopf', onclick: ziehe }, 'Neuer Funke'),
      el('button', { class: 'knopf zart', onclick: () => { neuDoc('funkeln', { text: funke, quelle: 'funke' }); toast('Dieser Funke taucht wieder auf.'); } }, 'Merken'),
      el('button', { class: 'knopf voll', onclick: () => { const seite = blattAusText('', funke + '\n\n'); oeffneSchreibraum(seite.id); } }, 'Dem nachgehen'))
  ));

  haupt.append(inhalt);
};

/* ================================================================
   VANI — Suche: ein Feld, alles. Mit Filtern und Nachsicht
   bei Tippfehlern.
   ================================================================ */

const SUCH_GRUPPEN = [
  ['schnipsel', 'Schnipsel', 'schnipsel'],
  ['blatt', 'Blätter', 'blatt'],
  ['seite', 'Heftseiten', 'hefte'],
  ['szene', 'Szenen', 'projekte'],
  ['figur', 'Figuren & Orte', 'projekte'],
  ['heft', 'Hefte', 'hefte'],
  ['projekt', 'Projekte', 'projekte'],
  ['blase', 'Blasen', 'cluster'],
  ['zettel', 'Zettel', 'pin'],
  ['wortkiste', 'Wortkisten', 'woerter'],
  ['wort', 'Wörter', 'woerter'],
  ['faden', 'Faden', 'faden'],
  ['funkeln', 'Funken', 'woerter'],
  ['mischung', 'Klang-Szenen', 'klang'],
  ['klangbild', 'Klangbilder', 'klang'],
  ['klang', 'Eigene Klänge', 'klang']
];

/* Ein kaputter Eintrag im Browser-Speicher darf die Suche nicht lahmlegen. */
function leseLetzteSuchen() {
  try {
    const roh = JSON.parse(localStorage.getItem('vani-suchen') || '[]');
    return Array.isArray(roh) ? roh.filter((x) => typeof x === 'string').slice(0, 8) : [];
  } catch (e) { return []; }
}

function oeffneSuche() {
  const feld = el('input', { type: 'text', placeholder: 'Wonach suchst du?' });
  const treffer = el('div', { class: 'suchtreffer' });
  let filter = null;

  const chips = el('div', { class: 'suchchips' });
  const baueChips = () => {
    chips.innerHTML = '';
    for (const [typ, name] of SUCH_GRUPPEN) {
      if (typ === 'faden' && !vomTyp('faden').length) continue;
      chips.append(el('button', {
        class: 'suchchip' + (filter === typ ? ' an' : ''),
        onclick: () => { filter = filter === typ ? null : typ; baueChips(); suche(); }
      }, name));
    }
  };
  baueChips();

  const kasten = el('div', { class: 'suchkasten' },
    el('div', { class: 'suchzeile' },
      el('span', { html: ik('suche'), style: 'display:flex;color:var(--blass)' }),
      feld,
      el('button', { class: 'rundknopf zart', style: 'width:32px;height:32px', html: ik('kreuz'), title: 'Suche schließen', onclick: () => zu() })
    ),
    chips,
    treffer
  );
  const bogen = el('div', { class: 'suchbogen' }, kasten);
  bogen.addEventListener('pointerdown', (e) => { if (e.target === bogen) zu(); });
  document.body.append(bogen);
  const zu = () => bogen.remove();
  setTimeout(() => feld.focus(), 60);

  function eintrag(d, umfeldHtml) {
    return el('button', { onclick: () => { zu(); merkeSuche(feld.value); oeffneDoc(d); } },
      el('span', { class: 'ttitel' }, d.titel || ((d.text || '').split('\n')[0] || 'Ohne Titel').slice(0, 50)),
      umfeldHtml ? el('span', { class: 'tprobe', html: umfeldHtml }) : null
    );
  }

  function leererZustand() {
    treffer.innerHTML = '';
    const letzte = leseLetzteSuchen();
    if (letzte.length) {
      treffer.append(el('div', { class: 'gruppe' }, 'ZULETZT GESUCHT'));
      for (const q of letzte.slice(0, 5)) {
        treffer.append(el('button', { onclick: () => { feld.value = q; suche(); } },
          el('span', { class: 'ttitel', style: 'font-weight:400' }, q)));
      }
    }
    const frisch = [...D.docs.values()]
      .filter((d) => ['blatt', 'szene', 'seite', 'schnipsel'].includes(d.typ) && (d.text || '').trim())
      .sort((a, b) => b.geaendert - a.geaendert).slice(0, 5);
    if (frisch.length) {
      treffer.append(el('div', { class: 'gruppe' }, 'ZULETZT ANGEFASST'));
      for (const d of frisch) treffer.append(eintrag(d, esc((d.text || '').replace(/\s+/g, ' ').slice(0, 70))));
    }
    /* Schlagworte: alles, was irgendwo mit # markiert wurde — ein Tipp sucht danach. */
    const worte = schlagwortIndex([...D.docs.values()], 30);
    if (worte.length) {
      treffer.append(el('div', { class: 'gruppe' }, 'SCHLAGWORTE'));
      const wolke = el('div', { class: 'schlagwortwolke' });
      for (const { wort, anzahl } of worte) wolke.append(el('button', { class: 'schlagwortchip', onclick: () => { feld.value = '#' + wort; suche(); } }, '#' + wort, el('small', {}, String(anzahl))));
      treffer.append(wolke);
    }
    if (!letzte.length && !frisch.length && !worte.length) {
      treffer.append(el('div', { style: 'padding:22px;text-align:center;color:var(--blass);font-style:italic;font-family:ui-serif,Georgia,serif' },
        'Alles, was du je geschrieben hast, liegt hier drin.'));
    }
  }

  function merkeSuche(q) {
    if (!q || q.length < 2) return;
    const letzte = leseLetzteSuchen().filter((x) => x !== q);
    letzte.unshift(q);
    try { localStorage.setItem('vani-suchen', JSON.stringify(letzte.slice(0, 8))); } catch (e) {}
  }

  function suche() {
    const roh = feld.value.trim();
    if (roh.length < 2) { leererZustand(); return; }
    treffer.innerHTML = '';
    const q = normalisiere(roh);
    let gesamt = 0;
    for (const [typ, name] of SUCH_GRUPPEN) {
      if (filter && typ !== filter) continue;
      const funde = [];
      for (const d of D.docs.values()) {
        if (d.typ !== typ) continue;
        const titelN = normalisiere(d.titel || '');
        const suchText = [d.text, d.notiz].filter(Boolean).join('\n');
        const textN = normalisiere(suchText);
        let stelle = titelN.indexOf(q);
        let woText = -1;
        if (stelle === -1) { woText = textN.indexOf(q); }
        let unscharf = false;
        if (stelle === -1 && woText === -1 && q.length >= 5) {
          if (fastGleich(titelN, q) || fastGleich(textN, q)) unscharf = true;
          else continue;
        } else if (stelle === -1 && woText === -1) continue;
        funde.push({ d, woText, unscharf, suchText });
      }
      funde.sort((a, b) => b.d.geaendert - a.d.geaendert);
      if (!funde.length) continue;
      treffer.append(el('div', { class: 'gruppe' }, name.toUpperCase()));
      for (const { d, woText, unscharf, suchText } of funde.slice(0, filter ? 40 : 6)) {
        gesamt++;
        let umfeld = '';
        const text = suchText || '';
        if (woText >= 0) {
          const von = Math.max(0, woText - 28);
          const stueck = text.slice(von, woText + q.length + 50).replace(/\n/g, ' ');
          const rel = woText - von;
          umfeld = (von > 0 ? '… ' : '') + esc(stueck.slice(0, rel)) + '<mark>' + esc(stueck.slice(rel, rel + q.length)) + '</mark>' + esc(stueck.slice(rel + q.length)) + ' …';
        } else {
          umfeld = esc(text.replace(/\s+/g, ' ').slice(0, 78)) + (unscharf ? ' <i style="opacity:.6">(ähnlich)</i>' : '');
        }
        treffer.append(eintrag(d, umfeld.trim() || null));
      }
    }
    if (!gesamt) {
      treffer.append(el('div', { style: 'padding:22px;text-align:center;color:var(--blass);font-style:italic;font-family:ui-serif,Georgia,serif' },

function syncStatusWorte(status) {
  const art = status && status.art;
  if (art === 'synchron') return ['synchron', 'Alles ist auf dem gleichen Stand.'];
  if (art === 'verbindet') return ['arbeitet', 'VANI verbindet die Geräte …'];
  if (art === 'offline') return ['offline', 'Änderungen bleiben sicher hier und gehen später weiter.'];
  if (art === 'schluessel') return ['Achtung', 'Der Bereichsschlüssel passt nicht oder wurde zurückgezogen.'];
  if (art === 'fehler') return ['Achtung', 'Etwas ist noch nicht fertig synchronisiert.'];
  return ['nur hier', 'Dieser Bestand ist noch mit keinem privaten Bereich verbunden.'];
}

async function neuerSyncBereich() {
  const name = await eingabe({ titel: 'Wie soll dein privater Bereich heißen?', wert: 'Mein VANI', platzhalter: 'z. B. Kevins VANI', ok: 'Weiter' });
  if (!name) return;
  const standard = await syncStandardServer();
  const server = await eingabe({ titel: 'Adresse des VANI-Sync-Dienstes', wert: standard, platzhalter: 'https://…', ok: 'Bereich anlegen' });
  if (!server) return;
  toast('Lege deinen verschlüsselten Bereich an …', 5000);
  try { await syncErstelleBereich(name, server); toast('Dein privater Bereich ist bereit.', 4000); zeichne(); }
  catch (e) { toast((e && e.message) || 'Der Bereich ließ sich noch nicht anlegen.', 5000); }
}

async function vorhandenenSyncBereichKoppeln(codeVorgabe) {
  const code = codeVorgabe || await eingabe({ titel: 'Kopplungscode vom anderen Gerät', platzhalter: 'VANI1-…', mehrzeilig: true, ok: 'Prüfen und verbinden' });
  if (!code) return;
  let modus = 'ersetzen';
  if (D.docs.size) {
    modus = await menue([
      { text: 'Beides zusammenlegen (nichts löschen)', icon: 'plus', wert: 'dazu' },
      { text: 'Diesen Gerätebestand ersetzen', icon: 'wandel', wert: 'ersetzen', rot: true }
    ], 'Was soll mit dem jetzigen Bestand auf diesem Gerät geschehen?');
    if (!modus) return;
    if (modus === 'ersetzen' && !await frage('Wirklich den jetzigen Bestand auf diesem Gerät durch den gekoppelten Bereich ersetzen? Eine Sicherung vorher ist die sicherste Wahl.', { ja: 'Ersetzen', gefahr: true })) return;
  }
  toast('Prüfe den geheimen Bereich …', 5000);
  try { await syncVerbindeBereich(code, modus); toast('Verbunden. Ab jetzt halten sich die Geräte gegenseitig aktuell.', 5000); zeichne(); }
  catch (e) { toast((e && e.message) || 'Der Kopplungscode ließ sich nicht verbinden.', 5000); }
}

async function kopiereVaniAdresse() {
  try { await navigator.clipboard.writeText(VANI_HAUPTADRESSE); toast('Die einzige VANI-Adresse ist kopiert.'); }
  catch (e) { await teileText(VANI_HAUPTADRESSE); }
}

async function kopiereSyncKopplungscode() {
  if (!syncIstVerbunden()) return false;
  if (!await frage('Der Kopplungscode öffnet deinen ganzen privaten Bereich. Nur auf einem eigenen oder wirklich vertrauten Gerät verwenden.', { ja: 'Code kopieren' })) return false;
  const code = syncKopplungscode();
  try { await navigator.clipboard.writeText(code); toast('Kopplungscode kopiert.'); }
  catch (e) { await teileText(code); }
  return true;
}

/* ----- Sicherung ----- */
function blobZuDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function dataURLZuBlob(durl) {
  if (typeof durl !== 'string' || durl.length > 360 * 1024 * 1024) throw new Error('Ungültige Mediendatei');
  const treffer = durl.match(/^data:([^;,]{1,120});base64,([A-Za-z0-9+/=\r\n]+)$/);
  if (!treffer) throw new Error('Ungültige Mediendatei');
  const mime = treffer[1] || 'application/octet-stream';
  if (!/^[a-z0-9.+-]+\/[a-z0-9.+-]+$/i.test(mime)) throw new Error('Ungültiger Dateityp');
  const daten = treffer[2].replace(/[\r\n]/g, '');
  if (!daten.length || daten.length % 4 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(daten)) throw new Error('Ungültige Mediendatei');
  const bin = atob(daten);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
